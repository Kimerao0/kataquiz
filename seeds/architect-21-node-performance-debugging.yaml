version: 1
title: "Architect Roadmap 21: Node.js performance and debugging"
description: Reasoning from symptom to cause in Node.js services, event-loop lag, latency percentiles, CPU profiles and flame graphs, memory leaks and heap snapshots, and how V8 hidden classes, deopts and the garbage collector affect performance.
language: en
tags: [architect-roadmap, nodejs, performance, profiling, memory, v8]
run:
  questionsPerRun: 10
  maxErrors: 3
  timePerQuestionSec: 90
questions:
  - type: single
    prompt: "Every endpoint of a Node.js API, including the trivial `/health`, becomes slow at the same moments, and the process sits at 100% of one CPU core during those moments. What is the most likely cause, and what do you capture first?"
    explanation: "When even a handler that does no work is slow, the shared resource is the event loop, and one core pinned at 100% says JavaScript is running synchronously and blocking it. A sampled CPU profile taken during the slow window shows which function is burning the time. A slow database or a small connection pool would make the DB-backed routes slow, not `/health`, and would show low CPU."
    theoryUrl: https://nodejs.org/en/learn/asynchronous-work/dont-block-the-event-loop
    options:
      - {
          text: "The database is slow; capture slow-query logs from the database server",
          correct: false,
        }
      - {
          text: "Synchronous CPU work is blocking the event loop; capture a CPU profile in the slow window",
          correct: true,
        }
      - {
          text: "The HTTP keep-alive pool is too small for the traffic; raise the agent's maxSockets and compare response times",
          correct: false,
        }
      - {
          text: "The heap is too small; take a heap snapshot and raise the old-space limit",
          correct: false,
        }
  - type: single
    prompt: "A Node.js service has p95 latency of 2 seconds, but its CPU usage stays around 5% and the event-loop delay is a few milliseconds. Where should you look first?"
    explanation: "Low CPU and a healthy event loop mean the process is mostly waiting, not computing. The time goes into something the request awaits: a downstream call, a database query, or waiting for a free connection in a pool. Distributed tracing or timing around each awaited call shows which. A CPU profile would show an idle process, and adding instances does not help if they all wait on the same bottleneck."
    theoryUrl: https://nodejs.org/en/learn/diagnostics/poor-performance
    options:
      - {
          text: "At what the requests are waiting on: downstream calls, queries and connection-pool wait time",
          correct: true,
        }
      - {
          text: "At a CPU flame graph, because slow requests always mean a hot function somewhere in the JavaScript code",
          correct: false,
        }
      - {
          text: "At the garbage collector, since low CPU usage means GC is starving the main thread",
          correct: false,
        }
      - {
          text: "At the instance count, since more replicas will divide the latency between them",
          correct: false,
        }
  - type: single
    prompt: "You want one metric on your dashboard that tells you when a Node.js process is too busy to respond promptly. Why is event-loop delay (for example from `perf_hooks.monitorEventLoopDelay()`) a better signal than CPU percentage?"
    explanation: "Event-loop delay measures how late the loop gets to scheduled work, which is exactly the delay every callback and request experiences. CPU percentage can be high while the loop is still responsive (work spread in small chunks, or in other threads), and it can look moderate while a single long synchronous task freezes the loop. Event-loop delay is not a memory metric and it does not replace request latency, it explains part of it."
    theoryUrl: https://nodejs.org/api/perf_hooks.html#perf_hooksmonitoreventloopdelayoptions
    options:
      - {
          text: "It measures directly how late the loop runs scheduled work, which every request then feels",
          correct: true,
        }
      - {
          text: "It includes the time spent waiting for database responses, so it covers I/O as well",
          correct: false,
        }
      - {
          text: "It counts the bytes held by pending callbacks, so it reveals memory pressure as well as CPU pressure",
          correct: false,
        }
      - {
          text: "It is the only metric that stays correct when the process uses worker threads",
          correct: false,
        }
  - type: single
    prompt: "You open a CPU flame graph of a slow service. The function `renderReport` is a very wide box at the top of its stack, with nothing above it. What does that tell you?"
    explanation: "In a flame graph the width of a box is the share of samples in which that frame was on the stack, and a wide box with nothing above it means the samples were in that function's own code (self time). That makes it a prime optimisation target. Height is only call depth, the x-axis is not a timeline, and a CPU profile says nothing about memory."
    theoryUrl: https://www.brendangregg.com/flamegraphs.html
    options:
      - {
          text: "It ran first, because the x-axis of a flame graph is a timeline from left to right",
          correct: false,
        }
      - {
          text: "It is called from many places, which is why it appears at the very top of the graph",
          correct: false,
        }
      - {
          text: "Its own code takes a large share of the CPU samples, so optimising it pays off most",
          correct: true,
        }
      - {
          text: "It allocated the most memory in the profile, so it is the likely source of a leak",
          correct: false,
        }
  - type: single
    prompt: "p99 latency of a production service doubles for ten minutes every afternoon. You need a CPU profile from the live process during that window, with minimal overhead and no code changes. Which approach fits best?"
    explanation: "A sampling profiler, such as the V8 profiler started via the inspector or `--cpu-prof`, records the stack at intervals, so its overhead is low enough for production and it shows real behaviour. Wrapping every function in timing code changes what you measure and needs a redeploy. A heap snapshot answers memory questions and pauses the process, and replaying traffic on a laptop rarely reproduces production conditions."
    theoryUrl: https://nodejs.org/en/learn/getting-started/profiling
    options:
      - {
          text: "Wrap every function in timing code and redeploy with the extra logging enabled",
          correct: false,
        }
      - {
          text: "Take a heap snapshot during the slow window and compare retained sizes",
          correct: false,
        }
      - {
          text: "Capture a sampled CPU profile from the running process during the slow window",
          correct: true,
        }
      - {
          text: "Replay the afternoon traffic on a laptop and compare the average response times",
          correct: false,
        }
  - type: single
    prompt: "A flame graph of a busy JSON API shows a large share of the samples in garbage-collection frames rather than in your own functions. What is the most useful conclusion?"
    explanation: "Time spent in GC is driven by how much the code allocates (and how much stays alive). The fix is to find the allocation hot spots, for example with a sampling heap profile (`--heap-prof`), and reduce them: fewer intermediate arrays and strings, no needless copies or re-serialisation. Disabling or tuning the GC away is not an option in Node, and more cores do not speed up the main thread's allocation rate."
    theoryUrl: https://nodejs.org/en/learn/diagnostics/memory/using-heap-profiler
    options:
      - {
          text: "The code allocates too much; profile allocations and cut the temporary objects on the hot path",
          correct: true,
        }
      - {
          text: "The GC is misconfigured; turn it off for request handlers and let it run at night",
          correct: false,
        }
      - {
          text: "The machine has too few cores; moving to a larger instance will let the collector run on the spare cores and remove the cost",
          correct: false,
        }
      - {
          text: "The profiler is wrong, since GC time never shows up in CPU profiles of real apps",
          correct: false,
        }
  - type: single
    prompt: "A service's p50 latency is a steady 20 ms, but its p99 jumps to 900 ms every few minutes, in short bursts, with no change in traffic. Which hypothesis is most worth checking first, and how?"
    explanation: "Periodic tail spikes with an unchanged median point to something that stops the event loop for a moment: a long GC pause or a periodic synchronous job (a timer that rebuilds a cache, compresses logs, and so on). Correlating the spikes with GC events (`--trace-gc` or `PerformanceObserver` with `gc` entries) and with event-loop delay confirms or rules this out. Slow clients affect their own requests, not everyone's at fixed intervals."
    theoryUrl: https://nodejs.org/api/perf_hooks.html#class-performanceobserver
    options:
      - {
          text: "A few clients have slow networks; check the client IP addresses of the slow requests and block them",
          correct: false,
        }
      - {
          text: "A periodic pause of the loop (GC or a timer job); correlate the spikes with GC events and loop delay",
          correct: true,
        }
      - {
          text: "The median is wrong; switch the dashboard to the average latency, which smooths out the spikes",
          correct: false,
        }
      - {
          text: "The database index is missing; add one, since tail latency is always caused by queries",
          correct: false,
        }
  - type: single
    prompt: "A teammate benchmarks two implementations of a parser by running each once on a small input and timing it. The 'faster' one turns out slower in production. What is the most likely flaw in the benchmark?"
    explanation: "V8 starts by interpreting code and only optimises functions that become hot, so the first runs measure warm-up, not steady state. A single small run also hides GC effects and is noisy. Benchmarks should warm up, run many iterations on realistic data, and report a distribution. Node does not compile all code ahead of time, and timers are precise enough for this purpose."
    theoryUrl: https://v8.dev/blog/maglev
    options:
      - {
          text: "It measured cold code before V8 optimised it, on one small run that hides GC and noise",
          correct: true,
        }
      - {
          text: "Node compiles every function ahead of time, so the first run is always the fastest",
          correct: false,
        }
      - {
          text: "`Date.now()` cannot measure durations under one second, so all short timings are zero",
          correct: false,
        }
      - {
          text: "Benchmarks are only valid when run under the inspector with the debugger attached",
          correct: false,
        }
  - type: single
    prompt: "A Node.js process is restarted by its orchestrator every few days. Its memory graph shows a sawtooth (GC frees memory regularly), but the low point after each collection keeps rising. What does that indicate?"
    explanation: "Each low point is what survives a full collection, so a rising floor means live objects accumulate: something keeps references it no longer needs. A sawtooth with a flat floor would be healthy churn. The next step is heap snapshots over time to find what grows. Raising the heap limit only delays the crash."
    theoryUrl: https://nodejs.org/en/learn/diagnostics/memory
    options:
      - {
          text: "Normal behaviour: V8 always grows the heap up to the limit before collecting it",
          correct: false,
        }
      - {
          text: "A leak: objects survive collections and accumulate, so find what keeps them alive",
          correct: true,
        }
      - {
          text: "Too frequent GC: the collector frees memory too eagerly and should be slowed down",
          correct: false,
        }
      - {
          text: "A CPU problem: the rising line is the event loop falling behind the incoming traffic",
          correct: false,
        }
  - type: boolean
    prompt: "A memory graph that rises during a traffic burst and falls back to the same baseline afterwards is a sign of a memory leak."
    explanation: "False. Memory that returns to the same baseline after load is released when it is no longer needed, which is the opposite of a leak. A leak shows as a baseline that keeps rising across GC cycles and traffic cycles. High peak usage can still be a problem (for limits and GC time), but it is not a leak."
    theoryUrl: https://nodejs.org/en/learn/diagnostics/memory
    answer: false
  - type: single
    prompt: "The RSS of a service grows by several hundred MB a day, but `heapUsed` from `process.memoryUsage()` stays flat. Where is the growth most likely to be?"
    explanation: "RSS covers everything the process holds, while `heapUsed` only covers the JavaScript heap. If RSS grows and the heap does not, the memory is outside it: Buffers and ArrayBuffers (reported as `external` and `arrayBuffers`), native addons, or allocator fragmentation. A heap snapshot of the JS heap would not show it, so you track `external`/`arrayBuffers` and look at buffer-heavy code paths."
    theoryUrl: https://nodejs.org/api/process.html#processmemoryusage
    options:
      - {
          text: "In the JavaScript heap, since `heapUsed` only counts the objects created in the last GC cycle",
          correct: false,
        }
      - {
          text: "In memory outside the JS heap, such as Buffers, ArrayBuffers or a native addon",
          correct: true,
        }
      - {
          text: "In the call stack, which grows with every request until the process is restarted",
          correct: false,
        }
      - {
          text: "Nowhere: RSS growth is an accounting error of the operating system and can be ignored",
          correct: false,
        }
  - type: single
    prompt: "To find a leak, you take heap snapshot A after warm-up, run the suspected workload, take B, run it again, and take C. What do you look for?"
    explanation: "Objects allocated between A and B that are still present in C survived a whole extra round of work, so they are the leak candidates. Comparing two snapshots alone mixes leaks with objects that are still legitimately in use, and the largest object type overall is often a cache or a pool that is fine. Snapshot size alone tells you there is growth, not what grows."
    theoryUrl: https://developer.chrome.com/docs/devtools/memory-problems/heap-snapshots
    options:
      - {
          text: "Objects allocated between A and B that are still alive in C, grouped by constructor",
          correct: true,
        }
      - {
          text: "The biggest object type in A, because the leak is usually there from the very start",
          correct: false,
        }
      - {
          text: "Only the total size of each file, since that is enough to identify the leaking object",
          correct: false,
        }
      - {
          text: "Objects present in A but missing from C, since those are the ones the collector failed to keep track of",
          correct: false,
        }
  - type: single
    prompt: "In a heap snapshot, a small `Map` object has a shallow size of 80 bytes but a retained size of 400 MB. What does that mean?"
    explanation: "Shallow size is the memory of the object itself; retained size is what would be freed if it were collected, including everything reachable only through it. A small Map holding 400 MB means its entries keep a lot alive, so it is a strong leak suspect. The snapshot is not wrong, and Maps are not stored outside the heap."
    theoryUrl: https://developer.chrome.com/docs/devtools/memory-problems/memory-101
    options:
      - {
          text: "The snapshot is corrupt, since an 80-byte object cannot be linked to 400 MB of memory",
          correct: false,
        }
      - {
          text: "Freeing the Map would free about 400 MB, because those objects are only reachable through it",
          correct: true,
        }
      - {
          text: "The Map has 400 MB of its own data stored off-heap in a native buffer",
          correct: false,
        }
      - {
          text: "The Map was allocated 400 MB ago, so it is old and will soon be collected",
          correct: false,
        }
  - type: single
    prompt: "You have found a leaked object in a heap snapshot. How do you find out why it is still alive?"
    explanation: "An object survives GC only if a chain of references leads to it from a GC root (globals, the stack, active handles). The retainers view shows that chain; the first link that should not exist (a module-level cache, a listener, a timer closure) is the bug. Forcing GC cannot free a reachable object, and the allocation stack shows where it was created, not who holds it."
    theoryUrl: https://developer.chrome.com/docs/devtools/memory-problems/memory-101
    options:
      - {
          text: "Follow its retainers path back to a GC root and find the reference that should be gone",
          correct: true,
        }
      - {
          text: "Call `global.gc()` repeatedly until the object disappears from the next snapshot",
          correct: false,
        }
      - {
          text: "Look at the line that allocated it, since the creator is always the one that keeps it alive",
          correct: false,
        }
      - {
          text: "Sort by shallow size, because the retaining object is always the largest one",
          correct: false,
        }
  - type: multi
    prompt: "Which of these are common causes of memory leaks in a long-running Node.js service? Select all that apply."
    explanation: "Unbounded caches, module-level collections that only grow, intervals that are never cleared (and the closures they keep), and listeners added per request to a long-lived emitter all keep references forever. Local variables in a function that has returned are not retained unless a closure or another object still references them, and using `async/await` itself does not leak."
    theoryUrl: https://nodejs.org/en/learn/diagnostics/memory
    options:
      - { text: "An in-memory cache with no size limit or expiry", correct: true }
      - {
          text: "`setInterval` callbacks that are never cleared and capture large objects",
          correct: true,
        }
      - {
          text: "Listeners added on a long-lived emitter in every request and never removed",
          correct: true,
        }
      - {
          text: "Local variables inside a function that has already returned and is not referenced",
          correct: false,
        }
      - { text: "Using `async/await` instead of callbacks for I/O", correct: false }
  - type: single
    prompt: "Heap usage of this Express service grows in step with the number of requests served. What is the problem and a sound fix?"
    code: |
      const inflight = new Map()

      app.use((req, res, next) => {
        inflight.set(req.id, { user: req.user, body: req.body, startedAt: Date.now() })
        next()
      })
    codeLanguage: javascript
    explanation: "Entries are added for every request and never removed, so the module-level Map keeps every request body alive. Remove the entry when the response finishes (`res.on('close', ...)`) or bound it with a TTL/LRU. A `WeakMap` does not work here because its keys must be objects, and `req.id` is a string; a `WeakMap` keyed by `req` would work, but then the Map is pointless for lookups by id."
    theoryUrl: https://nodejs.org/en/learn/diagnostics/memory
    options:
      - {
          text: "Entries are never deleted; remove them when the response closes or bound the map",
          correct: true,
        }
      - {
          text: "Swap the `Map` for a `WeakMap` keyed by `req.id`, so the collector can drop old entries",
          correct: false,
        }
      - {
          text: "Nothing is wrong: V8 evicts old `Map` entries automatically when memory runs low",
          correct: false,
        }
      - {
          text: "The `Date.now()` call allocates a timer for each request; replace it with `performance.now()` to fix the growth",
          correct: false,
        }
  - type: single
    prompt: "A service crashes with `JavaScript heap out of memory` after two days of uptime. A colleague proposes raising `--max-old-space-size` from 2 GB to 8 GB. What is the right reasoning?"
    explanation: "If memory grows without bound, a bigger heap only moves the crash to later, and longer full-GC pauses on a larger heap can hurt latency first. Raising the limit is fine when the steady-state working set genuinely needs it, but here the two-day pattern points to a leak, so capture heap snapshots (for example with `--heapsnapshot-near-heap-limit`) and fix the cause. Also keep the container's memory limit above the heap limit, or the kernel kills the process first."
    theoryUrl: https://nodejs.org/en/learn/diagnostics/memory/understanding-and-tuning-memory
    options:
      - {
          text: "It is the correct fix, because V8 will compact the heap better with more space available",
          correct: false,
        }
      - {
          text: "It only delays the crash if it is a leak; capture snapshots near the limit and fix the cause",
          correct: true,
        }
      - {
          text: "It cannot work, because Node ignores `--max-old-space-size` on 64-bit systems",
          correct: false,
        }
      - {
          text: "It removes the problem for good, since the collector releases memory sooner when the configured heap limit is larger",
          correct: false,
        }
  - type: boolean
    prompt: "Taking a heap snapshot of a production process with a large heap is not free: it blocks the event loop while it is written and can need extra memory of about the heap's size."
    explanation: "True. Writing a heap snapshot is synchronous, so the process stops serving requests for its duration, and the Node docs warn it needs memory about twice the heap size at that moment, which can itself trigger an out-of-memory kill. Take snapshots on an instance removed from the load balancer, or on a replica, and leave memory headroom."
    theoryUrl: https://nodejs.org/api/v8.html#v8writeheapsnapshotfilenameoptions
    answer: true
  - type: single
    prompt: "You need to debug a production instance with the inspector. Which way of enabling it is safe?"
    explanation: "The inspector gives full code execution to anyone who can connect, so it must only listen on localhost and be reached through an authenticated tunnel such as SSH or `kubectl port-forward`. Binding to `0.0.0.0` exposes remote code execution to the network, and obscurity of the port is not protection."
    theoryUrl: https://nodejs.org/en/learn/getting-started/debugging
    options:
      - {
          text: "Bind it to `0.0.0.0` on an unusual port so that the whole team can attach from their laptops",
          correct: false,
        }
      - {
          text: "Bind it to localhost and reach it through an SSH tunnel or a port-forward",
          correct: true,
        }
      - {
          text: "Bind it publicly, since the inspector only allows reading values and not running code",
          correct: false,
        }
      - {
          text: "Leave it enabled in every container all the time, so it is ready when an incident starts",
          correct: false,
        }
  - type: single
    prompt: "A signup endpoint validates emails with the regex below. One request with a 40-character crafted string freezes the whole service for many seconds, and the CPU profile shows all the time inside the RegExp engine. What is going on?"
    code: |
      const EMAIL = /^([a-zA-Z0-9]+)*@example\.com$/

      app.post('/signup', (req, res) => {
        if (!EMAIL.test(req.body.email)) return res.status(400).end()
        // ...
      })
    codeLanguage: javascript
    explanation: "The nested quantifier `([...]+)*` lets the engine split the input in exponentially many ways before failing, so a short input that almost matches causes catastrophic backtracking. The match runs synchronously on the main thread and blocks every other request (a ReDoS). Fix the pattern so it has no ambiguous nested repetition, cap the input length, or use a linear-time engine. Moving the regex to another file or making the route `async` does not change the work."
    theoryUrl: https://nodejs.org/en/learn/asynchronous-work/dont-block-the-event-loop
    options:
      - {
          text: "The regex is recompiled on every request; hoisting it out of the handler fixes the freeze",
          correct: false,
        }
      - {
          text: "Catastrophic backtracking in the nested quantifier blocks the event loop on a crafted input",
          correct: true,
        }
      - {
          text: "`req.body` parsing is slow for long strings; switch to a streaming JSON parser",
          correct: false,
        }
      - {
          text: "The handler is synchronous; declaring it `async` would let the regex run in the background thread pool",
          correct: false,
        }
  - type: single
    prompt: "A hot function `distance(p)` reads `p.x` and `p.y`, and profiling shows it is slower than expected. The points come from the factory below. What is the most likely reason, from V8's point of view?"
    code: |
      function makePoint(x, y, withLabel) {
        const p = {}
        if (withLabel) p.label = 'pt'
        p.x = x
        p.y = y
        return p
      }
    codeLanguage: javascript
    explanation: "V8 gives objects hidden classes (shapes) based on which properties were added and in which order. Points with and without a label get different shapes, so the property access sites in `distance` see several shapes, their inline caches become polymorphic and slower. Initialising every property in the same order (for example `label: undefined` always) keeps one shape. Object literals are not slower than classes per se, and numbers are not boxed into strings."
    theoryUrl: https://v8.dev/docs/hidden-classes
    options:
      - {
          text: "Object literals are always slower than class instances, regardless of their property order",
          correct: false,
        }
      - {
          text: "Points get different hidden classes, so the access sites in `distance` turn polymorphic",
          correct: true,
        }
      - {
          text: "Storing numbers in an object converts them to strings, which makes the arithmetic slow",
          correct: false,
        }
      - {
          text: "The `if` statement stops V8 from compiling `makePoint` at all, so every call is executed by the interpreter",
          correct: false,
        }
  - type: single
    prompt: "A numeric hot path is fast during a load test, then occasionally becomes several times slower in production. `--trace-deopt` shows the function being deoptimised. What is the typical cause?"
    explanation: "The optimising compiler specialises code on the types it has seen, for example small integers. When a different type arrives (a string, `undefined`, a double), the assumption fails, the optimised code is thrown away and execution falls back to slower tiers until it is re-optimised. Keeping inputs type-stable, for instance by validating and converting at the boundary, avoids it. Deopts are not caused by the size of the file or by logging."
    theoryUrl: https://v8.dev/blog/maglev
    options:
      - {
          text: "The function was optimised for certain types and production sends it different ones",
          correct: true,
        }
      - {
          text: "The source file got too long, so V8 refuses to keep its functions optimised",
          correct: false,
        }
      - {
          text: "Calling `console.log` anywhere in the process deoptimises every function permanently",
          correct: false,
        }
      - {
          text: "The function is called too often; V8 deoptimises any function that runs more than a fixed number of times",
          correct: false,
        }
  - type: single
    prompt: "Why is collecting V8's young generation (the 'scavenge') usually fast, even when the code allocates a lot?"
    explanation: "Most objects die young. The scavenger copies only the live objects out of the young space, so its cost is proportional to survivors, not to how much was allocated, and the dead objects are freed in bulk. Objects that survive a couple of scavenges are promoted to the old generation, which is collected with the more expensive mark-compact. Full GC does not run on every allocation."
    theoryUrl: https://v8.dev/blog/trash-talk
    options:
      - {
          text: "It only works on the old generation, where few objects are allocated",
          correct: false,
        }
      - {
          text: "Its cost tracks the number of survivors, and most young objects are already dead",
          correct: true,
        }
      - {
          text: "It never touches the main thread, so its cost is invisible to request latency",
          correct: false,
        }
      - {
          text: "It runs on every allocation, so each pass only has one object to inspect",
          correct: false,
        }
  - type: single
    prompt: "As a service's heap approaches its limit, latency degrades sharply and CPU climbs to 100% minutes before the process finally dies with an out-of-memory error. What explains the slowdown?"
    explanation: "Near the limit, each full mark-compact frees little, so V8 runs it again and again; the main thread spends most of its time in GC pauses instead of serving requests. That is why a leak often shows up as latency and CPU first and as a crash later. Alerting on heap usage against the limit gives warning before this phase."
    theoryUrl: https://v8.dev/blog/trash-talk
    options:
      - {
          text: "The OS starts swapping the heap to disk, which is the only reason Node slows down before an out-of-memory crash",
          correct: false,
        }
      - {
          text: "Full collections run repeatedly and free little, so GC crowds out request handling",
          correct: true,
        }
      - {
          text: "V8 disables the optimising compiler when memory is low, so all code runs interpreted",
          correct: false,
        }
      - {
          text: "The event loop switches to a slower polling mode to save memory near the limit",
          correct: false,
        }
  - type: single
    prompt: "Heap snapshots show that each call to `handler()` keeps a large array alive, even though the returned function never mentions `big`. Why?"
    code: |
      function handler() {
        const big = new Array(1_000_000).fill('x')
        const unused = () => big.length
        return () => 'ok'
      }

      const keep = []
