version: 1
title: "Architect Roadmap 35: SRE and observability"
description: SLIs, SLOs and SLAs, error budgets, RED and USE methods, logs, metrics and tracing, alerting, incident management and blameless postmortems.
language: en
tags: [architect-roadmap, infrastructure, sre, observability, slo]
run:
  questionsPerRun: 10
  maxErrors: 3
  timePerQuestionSec: 60
questions:
  - type: single
    prompt: "Which statement correctly relates SLI, SLO and SLA?"
    explanation: "An SLI is a measured indicator (for example the fraction of requests served successfully), an SLO is the target for that indicator over a window, and an SLA is the contractual promise with consequences, such as credits, if it is missed. The SLO is an internal goal; the SLA is a business and legal agreement."
    theoryUrl: https://sre.google/sre-book/service-level-objectives/
    options:
      - {
          text: "An SLO is the measurement, an SLI is the target and an SLA is the dashboard",
          correct: false,
        }
      - {
          text: "An SLI is the measurement, an SLO the target for it, an SLA the contract with consequences",
          correct: true,
        }
      - {
          text: "SLI, SLO and SLA are three names for the same availability percentage, used by different teams",
          correct: false,
        }
      - {
          text: "An SLA is the internal target; an SLO is the penalty paid to customers",
          correct: false,
        }
  - type: single
    prompt: "A provider's contract (SLA) promises 99.9% monthly availability. What should the internal SLO usually be, and why?"
    explanation: "The SLO should be stricter than the SLA, for example 99.95%, so that the team is alerted and reacts while there is still margin before a contractual breach. Setting them equal removes the safety margin, and an SLO looser than the SLA guarantees you pay penalties before anyone is paged."
    theoryUrl: https://sre.google/workbook/implementing-slos/
    options:
      - { text: "Equal to the SLA, so there is a single number to track", correct: false }
      - { text: "Looser than the SLA, to leave room for deployments", correct: false }
      - { text: "Stricter than the SLA, to leave a safety margin before penalties", correct: true }
      - { text: "Unrelated to the SLA, because the two measure different things", correct: false }
  - type: single
    prompt: "A service has a 99.9% availability SLO over a rolling 30-day window, measured by time. How much downtime does the error budget allow?"
    explanation: "30 days is 43,200 minutes; 0.1% of that is 43.2 minutes. 99.99% would give about 4.3 minutes and 99% about 7.2 hours, which is why each additional nine is so much more expensive to reach."
    theoryUrl: https://sre.google/workbook/implementing-slos/
    options:
      - { text: "About 4.3 minutes", correct: false }
      - { text: "About 43 minutes", correct: true }
      - { text: "About 7.2 hours", correct: false }
      - { text: "About 72 hours", correct: false }
  - type: single
    prompt: "An API handles about 10 million requests per month with a request-based SLO of 99.95% successful responses. Roughly how many failed requests does the monthly error budget allow?"
    explanation: "The budget is 0.05% of 10,000,000, which is 5,000 failed requests. Request-based budgets scale with traffic, which is why they are more meaningful than time-based ones for services with uneven load."
    theoryUrl: https://sre.google/workbook/implementing-slos/
    options:
      - { text: "500 requests", correct: false }
      - { text: "50,000 requests", correct: false }
      - { text: "5,000 requests", correct: true }
      - { text: "500,000 requests", correct: false }
  - type: single
    prompt: "The error budget for the quarter is exhausted on week 8 after two incidents. The product manager wants to ship a big launch next week. What does a sound error budget policy say?"
    explanation: "An agreed error budget policy trades velocity for reliability: when the budget is spent, risky changes pause and the team works on reliability until the service is back within SLO. Ignoring the budget makes the SLO meaningless, and 'raising the SLO retroactively' hides the problem."
    theoryUrl: https://sre.google/workbook/error-budget-policy/
    options:
      - {
          text: "Launch anyway, because product deadlines override reliability numbers once a launch is announced",
          correct: false,
        }
      - { text: "Raise the SLO target for the next quarter and continue shipping", correct: false }
      - {
          text: "Pause non-essential launches and prioritise reliability work until recovery",
          correct: true,
        }
      - { text: "Reset the error budget so the team starts fresh", correct: false }
  - type: single
    prompt: "You are defining the availability SLI for a user-facing REST API. Which definition is best?"
    explanation: "A good SLI is a ratio of good events to valid events measured as close to the user as practical, such as at the load balancer. Host CPU and process uptime say nothing about whether users got correct responses, and a synthetic ping from inside the cluster misses edge failures."
    theoryUrl: https://sre.google/workbook/implementing-slos/
    options:
      - { text: "Percentage of time the process is running on each host", correct: false }
      - { text: "Average CPU utilization across the application servers", correct: false }
      - {
          text: "Whether an in-cluster health endpoint answered successfully in the last minute, as seen by the orchestrator",
          correct: false,
        }
      - {
          text: "Proportion of valid requests answered without a server error, measured at the load balancer",
          correct: true,
        }
  - type: single
    prompt: 'A stakeholder asks for a 100% availability SLO "because users hate downtime". What is the best response?'
    explanation: "100% is neither achievable nor desirable: users cannot perceive it because their own network and devices are less reliable, and each extra nine costs disproportionately more and blocks all change. Pick the level users actually need and use the remainder as budget for velocity."
    theoryUrl: https://sre.google/sre-book/embracing-risk/
    options:
      - {
          text: "Accept it, and add replicas and regions in every zone until the number is reached",
          correct: false,
        }
      - { text: "Accept it, but measure it per month instead of per quarter", correct: false }
      - {
          text: "Explain that it blocks all change and exceeds what users can perceive",
          correct: true,
        }
      - { text: "Accept it, because an SLO is only a goal and never enforced", correct: false }
  - type: single
    prompt: "Your checkout service has a 99.9% SLO and calls three other services in series, each with its own 99.9% availability, all of which are hard dependencies. What is the approximate best availability you can offer, ignoring your own failures?"
    explanation: "Availabilities of hard serial dependencies multiply: 0.999 x 0.999 x 0.999 is about 0.997, so roughly 99.7%. Your SLO cannot exceed what your hard dependencies allow unless you add redundancy, caching or graceful degradation."
    theoryUrl: https://sre.google/sre-book/embracing-risk/
    options:
      - { text: "About 99.9%, the best single dependency", correct: false }
      - { text: "About 99.97%, because failures overlap and cancel out", correct: false }
      - { text: "About 99.7%, the product of the three dependencies", correct: true }
      - { text: "About 99.0%, the sum of the three failure rates times ten", correct: false }
  - type: single
    prompt: "Which pairing of method and target is correct?"
    explanation: "RED (Rate, Errors, Duration) describes request-driven services from the point of view of their users, while USE (Utilization, Saturation, Errors) describes the health of resources such as CPUs, disks and connection pools. They are complementary: RED tells you that users are hurt, USE helps find the constrained resource."
    theoryUrl: https://grafana.com/blog/2018/08/02/the-red-method-how-to-instrument-your-services/
    options:
      - {
          text: "RED for infrastructure resources, USE for request-driven services",
          correct: false,
        }
      - {
          text: "RED for request-driven services, USE for resources such as disks and pools",
          correct: true,
        }
      - {
          text: "Both are only meaningful for databases and other stateful storage systems",
          correct: false,
        }
      - { text: "RED is for logs and USE is for traces", correct: false }
  - type: single
    prompt: "A disk shows 45% utilization, yet requests to the service are slow and the I/O queue length is consistently high. Which USE dimension explains the problem?"
    explanation: "Saturation is the amount of queued work waiting for the resource. A resource can have moderate utilization on average and still be saturated by bursts, so queue length is the signal. Errors would show failed operations, and low utilization alone would suggest the disk is fine."
    theoryUrl: https://www.brendangregg.com/usemethod.html
    options:
      - { text: "Utilization, because 45% is already too high", correct: false }
      - { text: "Errors, because slow requests always mean failed I/O", correct: false }
      - { text: "Duration, because it is the time each request takes", correct: false }
      - { text: "Saturation, because work is queuing for the resource", correct: true }
  - type: single
    prompt: "Dashboards show an average latency of 120 ms and the team says things look fine, yet some customers complain about timeouts. What is the best first step?"
    explanation: "Averages hide the tail: a small percentage of very slow requests barely moves the mean. Look at latency percentiles (p95, p99) from histograms, because tail requests are often the ones that hit multiple slow dependencies or retries. Restarting servers or ignoring the complaints does not address the data gap."
    theoryUrl: https://prometheus.io/docs/practices/histograms/
    options:
      - { text: "Look at p95 and p99 latency from histograms, not only the average", correct: true }
      - { text: "Increase the average latency alert threshold to avoid noise", correct: false }
      - { text: "Restart all servers to clear accumulated state", correct: false }
      - { text: "Conclude the complaints come from client-side networks", correct: false }
  - type: boolean
    prompt: "To get the fleet-wide p99 latency, it is valid to compute the p99 on each instance and then average those values."
    answer: false
    explanation: "Percentiles cannot be averaged or summed. The correct way is to aggregate the underlying histogram buckets across instances and compute the quantile from the merged distribution."
    theoryUrl: https://prometheus.io/docs/practices/histograms/
  - type: single
    prompt: "To debug one customer's issue, a developer adds a `user_id` label to a request counter. The service has 2 million users. What will most likely happen in the metrics backend?"
    explanation: "Each distinct label value creates a new time series, so unbounded labels such as user IDs explode cardinality, increasing memory, storage and query cost, and can take the backend down. Per-user detail belongs in logs or traces, not in metric labels."
    theoryUrl: https://prometheus.io/docs/practices/instrumentation/#do-not-overuse-labels
    options:
      - { text: "Nothing special; metrics are aggregated before they are stored", correct: false }
      - {
          text: "A series per user explodes cardinality and strains memory and queries",
          correct: true,
        }
      - { text: "The counter becomes more accurate because it is split per user", correct: false }
      - { text: "The backend rejects the label because it is not a number", correct: false }
  - type: multi
    prompt: "Which practices make logs useful in a distributed system? Select all that apply."
    explanation: "Structured (JSON) logs are machine-queryable, and a trace or correlation ID lets you join one request's logs across services. Logging full request bodies with personal data creates privacy and compliance risk, and using only free text makes aggregation fragile."
    theoryUrl: https://opentelemetry.io/docs/concepts/signals/logs/
    options:
      - { text: "Emit structured logs with consistent field names", correct: true }
      - {
          text: "Include the trace or correlation ID in every log line of a request",
          correct: true,
        }
      - {
          text: "Log full request payloads, including personal data, for easier debugging",
          correct: false,
        }
      - { text: "Use log levels so verbose output can be reduced in production", correct: true }
  - type: single
    prompt: "In a distributed trace, how does a downstream service know it belongs to the same trace as the upstream caller?"
    explanation: "The caller propagates the trace context, typically through the W3C `traceparent` header on HTTP calls, and the callee continues the trace by creating child spans with the same trace ID. Matching by timestamps or IP addresses would be unreliable."
    theoryUrl: https://opentelemetry.io/docs/concepts/context-propagation/
    options:
      - {
          text: "The tracing backend matches spans by similar timestamps and service names after the fact",
          correct: false,
        }
      - { text: "Both services must run on the same host and share memory", correct: false }
      - {
          text: "The caller sends the trace context, such as a `traceparent` header, with the request",
          correct: true,
        }
      - { text: "The callee guesses the caller from the source IP address", correct: false }
  - type: single
    prompt: "A trace for a checkout request shows the API gateway and the order service, but the downstream payment call that goes through a message queue appears as a separate, unrelated trace. What is the likely cause?"
    explanation: "Context propagation was not carried across the queue: the producer did not inject the trace context into the message headers and the consumer did not extract it, so the consumer starts a new root trace. HTTP-only instrumentation does not cover asynchronous messaging by itself."
    theoryUrl: https://opentelemetry.io/docs/concepts/context-propagation/
    options:
      - { text: "The tracing backend limits each trace to two services", correct: false }
      - { text: "The payment service is too slow for the sampler to record", correct: false }
      - {
          text: "The queue encrypts messages, which breaks span timestamps and prevents trace correlation",
          correct: false,
        }
      - {
          text: "Trace context was not injected into and extracted from the message headers",
          correct: true,
        }
  - type: single
    prompt: "At 50,000 requests per second you can only afford to store a small fraction of traces, but you must always keep traces of failed or very slow requests. Which sampling approach fits?"
    explanation: "Tail-based sampling decides after the trace is complete, so it can keep all error and high-latency traces and sample the healthy ones. Head-based sampling decides at the start, before the outcome is known, so it will randomly drop many interesting traces."
    theoryUrl: https://opentelemetry.io/docs/concepts/sampling/
    options:
      - { text: "Head-based sampling at a fixed probability", correct: false }
      - { text: "Tail-based sampling with rules for errors and latency", correct: true }
      - {
          text: "Sampling every request but only for the first minute after deploy",
          correct: false,
        }
      - { text: "Disabling tracing and relying on average latency metrics", correct: false }
  - type: single
    prompt: "The on-call engineer is paged whenever any host exceeds 80% CPU, and most pages resolve themselves. Which change aligns alerting with SRE practice?"
    explanation: "Page on symptoms that matter to users, such as SLO burn rate or elevated error rates, and keep cause-level signals like CPU as dashboards or tickets. Cause-based pages are noisy and often not actionable. Raising the threshold to 95% only changes the noise level, not the principle."
    theoryUrl: https://sre.google/sre-book/monitoring-distributed-systems/
    options:
      - {
          text: "Page on user-visible symptoms such as SLO burn; keep CPU on dashboards",
          correct: true,
        }
      - {
          text: "Lower the CPU threshold to 60% so problems are caught earlier, before users notice",
          correct: false,
        }
      - { text: "Page every engineer on the team, so someone always reacts", correct: false }
      - { text: "Raise the CPU threshold to 95% and keep paging on it", correct: false }
  - type: single
    prompt: "This alert rule is based on a 99.9% SLO over 30 days. What does a burn rate of 14.4 sustained for one hour mean?"
    code: |
      - alert: HighErrorBudgetBurn
        expr: |
          (
            sum(rate(http_requests_total{code=~"5.."}[1h]))
            / sum(rate(http_requests_total[1h]))
          ) > (14.4 * 0.001)
          and
          (
            sum(rate(http_requests_total{code=~"5.."}[5m]))
            / sum(rate(http_requests_total[5m]))
          ) > (14.4 * 0.001)
        labels:
          severity: page
    codeLanguage: yaml
    explanation: "A burn rate of 14.4 means errors are consuming budget 14.4 times faster than the rate that would exactly exhaust it at the end of the window. In one hour that spends 14.4/720 = 2% of a 30-day budget, which is the classic page-worthy threshold. The short 5m window makes the alert reset quickly once the issue is fixed."
    theoryUrl: https://sre.google/workbook/alerting-on-slos/
    options:
      - { text: "The error rate is 14.4% of all requests", correct: false }
      - { text: "The service has 14.4 minutes of budget left", correct: false }
      - {
          text: "Budget is burning 14.4 times faster than sustainable, about 2% of the month's budget per hour",
          correct: true,
        }
      - {
          text: "The alert fires after 14.4 consecutive failed requests, which equals 14.4% of the monthly budget",
          correct: false,
        }
  - type: single
    prompt: "The on-call rotation gets about 40 pages a week, and most need no action. Which long-term response is right?"
    explanation: "Every page should be urgent, actionable and require a human; otherwise people learn to ignore them. Review each alert and delete, downgrade to ticket or dashboard, or fix the underlying cause. Adding people to the rota spreads the pain without reducing it, and muting alerts risks missing real incidents."
    theoryUrl: https://sre.google/sre-book/monitoring-distributed-systems/
    options:
      - { text: "Add more engineers to the rota so each gets fewer pages", correct: false }
      - { text: "Mute all alerts outside business hours", correct: false }
      - { text: "Have pages acknowledged automatically after five minutes", correct: false }
      - {
          text: "Audit alerts so each page is urgent and actionable; demote the rest to tickets",
          correct: true,
        }
  - type: single
    prompt: "During a major incident, the most senior engineer starts debugging in the code, while three others also debug, and nobody updates stakeholders. Which incident-management structure fixes this?"
    explanation: "Assign explicit roles: an incident commander who coordinates and decides, an operations lead who drives changes, and a communications lead who updates stakeholders. The commander should not be hands-on in the debugging, otherwise coordination collapses."
    theoryUrl: https://sre.google/sre-book/managing-incidents/
    options:
      - { text: "Let everyone work independently to maximise parallelism", correct: false }
      - {
          text: "Define an incident commander, an operations lead and a communications lead",
          correct: true,
        }
      - {
          text: "Make the most senior engineer both commander and primary debugger to keep decisions fast",
          correct: false,
        }
      - { text: "Pause all work until the root cause is documented", correct: false }
  - type: single
    prompt: "An error spike began right after a deploy. The team is split between finding the exact root cause and rolling back. What does incident response guidance recommend first?"
    explanation: "The priority during an incident is to stop the user impact, with a rollback, a flag flip or a failover, and to investigate root cause afterwards from preserved evidence. Deep diagnosis while users are still failing prolongs the incident."
    theoryUrl: https://sre.google/sre-book/emergency-response/
    options:
      - { text: "Find the root cause first, since rollback might hide it", correct: false }
      - {
          text: "Mitigate user impact first, for example by rolling back, then investigate",
          correct: true,
        }
      - {
          text: "Wait for customers to report so the scope is known precisely before touching anything",
          correct: false,
        }
      - { text: "Scale all services up and hope the errors dilute", correct: false }
  - type: single
    prompt: 'A postmortem concludes "engineer X ran the wrong command". What does a blameless postmortem culture do with this finding?'
    explanation: "Blameless does not mean nobody is accountable; it assumes people acted reasonably with the information they had and asks what in the system made the mistake easy or hard to detect: missing guardrails, confusing tooling, no confirmation step. Fixing the system prevents recurrence, whereas punishing individuals teaches people to hide mistakes."
    theoryUrl: https://sre.google/sre-book/postmortem-culture/
    options:
      - { text: "Ask what in the system made that mistake easy and add guardrails", correct: true }
      - { text: "Record the engineer's name and add a performance note", correct: false }
      - { text: "Remove the finding so the report does not feel accusatory", correct: false }
      - {
          text: "Require the engineer to be double-checked on every future command",
          correct: false,
        }
  - type: single
    prompt: "Which of these is the best action item from a postmortem about an outage caused by an expired TLS certificate?"
    explanation: "A good action item is specific, owned, time-bound and removes the class of problem, such as automated certificate renewal with expiry alerts. 'Be more careful' and 'add a reminder to someone's calendar' depend on human memory and will fail again."
    theoryUrl: https://sre.google/workbook/postmortem-culture/
    options:
      - { text: "Remind the team to be more careful with certificates", correct: false }
      - {
          text: "Add a yearly calendar reminder for the platform lead, plus a checklist item in the release runbook",
          correct: false,
        }
      - {
          text: "Automate renewal and alert 30 days before expiry, with a named owner and due date",
          correct: true,
        }
      - { text: "Write a longer runbook describing manual renewal", correct: false }
  - type: single
    prompt: "What distinguishes observability from traditional monitoring?"
    explanation: "Monitoring checks for known failure modes with predefined dashboards and alerts. Observability is the ability to ask new questions of a system from its telemetry (metrics, logs, traces and rich events) without shipping new code, which is what you need for unknown unknowns in distributed systems."
    theoryUrl: https://opentelemetry.io/docs/concepts/observability-primer/
    options:
      - { text: "Observability replaces the need for any alerting or SLOs", correct: false }
      - { text: "Monitoring covers production and observability covers staging", correct: false }
      - { text: "Observability only means collecting more logs", correct: false }
      - {
          text: "Observability lets you explore unknown failures from telemetry without new code",
          correct: true,
        }
