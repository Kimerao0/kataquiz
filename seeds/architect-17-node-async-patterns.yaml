version: 1
title: "Architect Roadmap 17: Node.js asynchronous patterns"
description: Callbacks and their conventions, Zalgo, promises and async/await, EventEmitter and async iterators, sequential, parallel and limited-concurrency execution, cancellation, and async error handling.
language: en
tags: [architect-roadmap, nodejs, async, promises, event-emitter]
run:
  questionsPerRun: 10
  maxErrors: 3
  timePerQuestionSec: 90
questions:
  - type: single
    prompt: "Which of these describes the Node.js error-first callback convention?"
    explanation: "The callback is the last argument, and its first parameter is an error (or `null`/`undefined` on success), followed by the result. That shape is what lets tools like `util.promisify` convert callback APIs generically. Throwing from inside the callback is not how errors are reported to the caller."
    theoryUrl: https://nodejs.org/en/learn/asynchronous-work/javascript-asynchronous-programming-and-callbacks
    options:
      - {
          text: "The callback is the first argument, and it receives the result followed by an optional error",
          correct: false,
        }
      - {
          text: "The callback is the last argument, and its first parameter is the error, or null on success",
          correct: true,
        }
      - {
          text: "Two callbacks are passed, one for success and one for failure, as with a promise's `then`",
          correct: false,
        }
      - {
          text: "The function throws errors synchronously and calls the callback only with results",
          correct: false,
        }

  - type: single
    prompt: "Deeply nested callbacks are often criticised for more than their indentation. What is the deeper design problem with passing your continuation as a callback?"
    explanation: "With callbacks you hand control of what happens next to someone else's code, which may call it twice, never, or synchronously, and error handling has to be repeated at every level. Promises fix this by giving back a value you own, which settles once. Performance and memory are not the main concern."
    theoryUrl: https://nodejs.org/en/learn/asynchronous-work/javascript-asynchronous-programming-and-callbacks
    options:
      - {
          text: "Inversion of control: other code decides if and when your continuation runs, maybe twice or never",
          correct: true,
        }
      - {
          text: "Each nested callback creates a new thread, so deep nesting quickly exhausts the libuv thread pool and stalls every request",
          correct: false,
        }
      - {
          text: "Callbacks are slower than promises because V8 cannot optimise functions passed as arguments",
          correct: false,
        }
      - {
          text: "Nested callbacks keep their parent's whole stack frame in memory, so they leak memory",
          correct: false,
        }

  - type: boolean
    prompt: "An API that calls its callback synchronously for cached data, and asynchronously for everything else, is harmless as long as both paths pass the same arguments."
    answer: false
    explanation: "The problem is timing, not arguments. Callers cannot know whether code after the call runs before or after the callback, so state they set up after the call may or may not be ready. That inconsistency is nicknamed Zalgo, and the rule is that an API is either always synchronous or always asynchronous."
    theoryUrl: https://nodejs.org/en/learn/asynchronous-work/javascript-asynchronous-programming-and-callbacks

  - type: single
    prompt: "A callback-based `getUser(id, cb)` answers from an in-memory cache synchronously and from the database asynchronously. How do you remove the inconsistency without losing the cache?"
    explanation: "Keep the cache, but deliver its result asynchronously too, for example with `process.nextTick` or `queueMicrotask`, so the callback never runs before `getUser` returns. Returning a promise solves it as well, since promise callbacks are always asynchronous. Dropping the cache or documenting the quirk leaves the problem or pays for it in speed."
    theoryUrl: https://nodejs.org/en/learn/asynchronous-work/understanding-processnexttick
    options:
      - {
          text: "Remove the cache so that every call goes to the database and is asynchronous",
          correct: false,
        }
      - {
          text: "Defer the cached result with `process.nextTick` or `queueMicrotask` so it is always async",
          correct: true,
        }
      - {
          text: "Document that callers must not rely on the order in which the callback is invoked",
          correct: false,
        }
      - {
          text: "Make the database path synchronous too, so that both paths behave the same way",
          correct: false,
        }

  - type: multi
    prompt: "Which guarantees do promises give that plain callbacks do not? Select all that apply."
    explanation: "A promise settles at most once, so a buggy producer cannot call you twice, and its `then` callbacks always run asynchronously, which rules out Zalgo. Rejections propagate along a chain to the first handler. Promises are not cancellable, and they do not make code run in parallel."
    theoryUrl: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Using_promises
    options:
      - {
          text: "It settles only once, so success or failure cannot be reported twice",
          correct: true,
        }
      - {
          text: "Its reaction callbacks always run asynchronously, never during the call that registers them",
          correct: true,
        }
      - { text: "A rejection propagates down the chain to the nearest handler", correct: true }
      - { text: "Calling `.cancel()` on it stops the underlying operation", correct: false }
      - { text: "Its work runs on a separate thread, in parallel with your code", correct: false }

  - type: single
    prompt: "What is the relationship between `async`/`await` and promises?"
    explanation: "An `async` function always returns a promise, and `await` pauses that function until a promise settles, giving back its value or throwing its rejection. It is syntax over promises, so the two mix freely. It does not create threads, and it does not block the event loop while waiting."
    theoryUrl: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/async_function
    options:
      - {
          text: "It is a separate concurrency model that runs functions on worker threads instead of promises",
          correct: false,
        }
      - {
          text: "It is syntax over promises: an async function returns a promise, and `await` waits for one",
          correct: true,
        }
      - {
          text: "It is a synchronous wrapper: `await` blocks the event loop until the promise settles",
          correct: false,
        }
      - {
          text: "It replaces promises entirely, so code using `await` cannot interoperate with `.then()` chains",
          correct: false,
        }

  - type: boolean
    prompt: "Calling an `async` function that throws before its first `await` throws the error synchronously at the call site, so a plain `try/catch` around the call without `await` catches it."
    answer: false
    explanation: "Any error thrown inside an `async` function, before or after an `await`, turns into a rejection of the promise it returns. A `try/catch` only sees it if you `await` the call, or you attach `.catch()`. Forgetting this is a common source of unhandled rejections."
    theoryUrl: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/async_function

  - type: single
    prompt: "This handler loads a dashboard from three independent services, each taking about 300 ms. It feels slow. What is the main improvement?"
    code: |
      async function loadDashboard(userId) {
        const profile = await getProfile(userId)
        const orders = await getOrders(userId)
        const alerts = await getAlerts(userId)
        return { profile, orders, alerts }
      }
    codeLanguage: javascript
    explanation: "The calls don't depend on each other, but each `await` waits for the previous one before starting the next. Starting all three and awaiting them together with `Promise.all` lets them overlap. Sequential awaits are right only when a step needs the result of the previous one or order matters."
    theoryUrl: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Promise/all
    options:
      - { text: "Start the three calls together and await them with `Promise.all`", correct: true }
      - { text: "Remove the `await` keywords so that the function returns faster", correct: false }
      - {
          text: "Move each call into its own worker thread so that the three of them can run in parallel",
          correct: false,
        }
      - {
          text: "Replace the `await`s with `.then()` chains, which V8 schedules more efficiently",
          correct: false,
        }

  - type: single
    prompt: "You must apply a list of database migrations, where each one assumes the previous one has completed. Which shape is right?"
    explanation: "When each step depends on the previous one, run them strictly in order: a `for...of` loop with `await` inside does exactly that and stops at the first failure. `Promise.all` and `forEach` with an async callback both start every migration at once, which breaks the dependency."
    theoryUrl: https://nodejs.org/en/learn/asynchronous-work/asynchronous-flow-control
    options:
      - {
          text: "`Promise.all(migrations.map(run))`, because the database will serialise them anyway",
          correct: false,
        }
      - {
          text: "A `for...of` loop that awaits each migration before starting the next",
          correct: true,
        }
      - {
          text: "`migrations.forEach(async (m) => await run(m))`, since each callback awaits its migration",
          correct: false,
        }
      - {
          text: "`Promise.race(migrations.map(run))`, so the first finished migration unlocks the next",
          correct: false,
        }

  - type: single
    prompt: "A home page shows five independent widgets, each loaded from a different service. If some services fail, the page should still show the widgets that loaded. Which combinator fits?"
    explanation: "`Promise.allSettled` waits for every promise and reports each outcome, so you can render successes and show placeholders for failures. `Promise.all` rejects as soon as one fails, `Promise.any` resolves with only the first success, and `Promise.race` settles with whichever finishes first."
    theoryUrl: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Promise/allSettled
    options:
      - { text: "`Promise.all`, catching the error and retrying the whole batch", correct: false }
      - { text: "`Promise.allSettled`, then render each fulfilled result", correct: true }
      - { text: "`Promise.any`, which collects every successful result", correct: false }
      - { text: "`Promise.race`, which returns each widget as it finishes", correct: false }

  - type: single
    prompt: "You fetch a price from three mirrors and want the first one that answers successfully, ignoring mirrors that fail. Which combinator expresses that?"
    explanation: "`Promise.any` fulfils with the first promise that fulfils and only rejects if all of them reject. `Promise.race` would settle with the first to finish even if that is a failure, and `Promise.all`/`allSettled` wait for everything."
    theoryUrl: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Promise/any
    options:
      - { text: "`Promise.race`, since it settles with the first result", correct: false }
      - { text: "`Promise.any`, since it takes the first success", correct: true }
      - { text: "`Promise.all`, since it returns the earliest value", correct: false }
      - { text: "`Promise.allSettled`, keeping the first fulfilled one", correct: false }

  - type: single
    prompt: "`Promise.all([a(), b(), c()])` rejects because `b()` failed. What happens to the work started by `a()` and `c()`?"
    explanation: "`Promise.all` rejects as soon as one input rejects, but it has no way to stop the others: they keep running and their results are simply ignored. If that work should stop, you need an explicit cancellation mechanism such as an `AbortSignal` passed to each operation."
    theoryUrl: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Promise/all
    options:
      - {
          text: "It is cancelled automatically, because `Promise.all` aborts the remaining promises",
          correct: false,
        }
      - {
          text: "It keeps running to completion; `Promise.all` just stops waiting for it",
          correct: true,
        }
      - {
          text: "It is rolled back, so any side effects of `a()` and `c()` are undone",
          correct: false,
        }
      - {
          text: "It is paused and resumes if you call `Promise.all` again with the same promises",
          correct: false,
        }

  - type: single
    prompt: "A script must call an external API for 20,000 records. It does `await Promise.all(records.map(callApi))`, and the run fails with timeouts, rate-limit errors and high memory. What is the right fix?"
    explanation: "Starting 20,000 requests at once floods sockets, the remote rate limit and memory. Limiting concurrency, so only a fixed number of calls (say 10) are in flight and a new one starts when one finishes, keeps throughput high and load bounded. Going fully sequential is safe but needlessly slow, and a bigger timeout treats the symptom."
    theoryUrl: https://nodejs.org/en/learn/asynchronous-work/asynchronous-flow-control
    options:
      - {
          text: "Process the records with a concurrency limit, so only a fixed number of calls are in flight",
          correct: true,
        }
      - {
          text: "Process them strictly one at a time, since any parallelism against an external API is unsafe",
          correct: false,
        }
      - {
          text: "Raise the HTTP client timeout so that slow requests have time to complete",
          correct: false,
        }
      - {
          text: "Replace `Promise.all` with `Promise.allSettled` so failed calls don't abort the batch",
          correct: false,
        }

  - type: single
    prompt: "What does this helper guarantee about how `task` runs over `items`?"
    code: |
      async function mapLimit(items, limit, task) {
        const results = []
        let next = 0
        async function worker() {
          while (next < items.length) {
            const i = next++
            results[i] = await task(items[i])
          }
        }
        await Promise.all(Array.from({ length: limit }, worker))
        return results
      }
    codeLanguage: javascript
    explanation: "`limit` workers pull the next index from a shared counter, so at most `limit` tasks are in flight, and each worker starts a new one as soon as its current task ends. Results are stored by index, so they keep the input order even though tasks finish in any order. Taking the index synchronously before `await` is what keeps two workers from grabbing the same item."
    theoryUrl: https://nodejs.org/en/learn/asynchronous-work/asynchronous-flow-control
    options:
      - {
          text: "Tasks run in batches of `limit`, and a new batch starts only after the whole previous batch ends",
          correct: false,
        }
      - {
          text: "At most `limit` tasks run at once, and results keep the order of `items`",
          correct: true,
        }
      - {
          text: "Tasks run one at a time, but `limit` of them are retried in parallel if they fail",
          correct: false,
        }
      - {
          text: "At most `limit` tasks run at once, but results come back in the order tasks finish",
          correct: false,
        }

  - type: single
    prompt: "What is wrong with this code if the goal is to save every item and only then report that the import is complete?"
    code: |
      async function importAll(items) {
        items.forEach(async (item) => {
          await save(item)
        })
        console.log('import complete')
      }
    codeLanguage: javascript
    explanation: "`forEach` ignores the promises its callback returns, so `importAll` does not wait for any save: it reports completion while saves are still pending, and a failed save becomes an unhandled rejection that the caller never sees. Use `for...of` with `await` for sequential saves, or `Promise.all(items.map(save))` for parallel ones."
    theoryUrl: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array/forEach
    options:
      - {
          text: "Nothing: `forEach` awaits each async callback before moving on to the next item",
          correct: false,
        }
      - {
          text: "`forEach` ignores the returned promises, so completion is reported early and save errors escape",
          correct: true,
        }
      - {
          text: "The saves run strictly one after another, which is slow but otherwise correct",
          correct: false,
        }
      - {
          text: "`await` is not allowed inside an arrow function, so the code fails to parse",
          correct: false,
        }

  - type: single
    prompt: "Inside a `try/catch`, a request handler calls `writeAuditLog(event)` (which returns a promise) without `await`, then responds. When the audit write fails, what happens?"
    explanation: "Without `await` the handler leaves the `try` block before the promise rejects, so the `catch` never sees the error. The rejection has no handler, and on current Node versions an unhandled rejection is treated like an uncaught exception and terminates the process by default. Fire-and-forget calls need their own `.catch()`."
    theoryUrl: https://nodejs.org/api/process.html#event-unhandledrejection
    options:
      - {
          text: "The surrounding `catch` block handles it, because it encloses the call",
          correct: false,
        }
      - {
          text: "The error is silently dropped, since the response has already been sent",
          correct: false,
        }
      - {
          text: "The rejection is unhandled, and by default current Node versions crash the process",
          correct: true,
        }
      - {
          text: "Node retries the promise once and logs a warning if it fails a second time",
          correct: false,
        }

  - type: single
    prompt: "A team adds `process.on('unhandledRejection', () => {})` to stop production crashes. What is the better design stance on unhandled rejections?"
    explanation: "An unhandled rejection means some error path was never designed, so the process may be in an unknown state. Swallowing it hides bugs. Handle errors where they occur, and treat anything that still escapes as a bug: log it with context and let the process exit so a supervisor restarts it cleanly."
    theoryUrl: https://nodejs.org/api/process.html#event-unhandledrejection
    options:
      - {
          text: "Keep the empty handler, since a crashed process is always worse than an ignored error",
          correct: false,
        }
      - {
          text: "Treat them as bugs: handle errors where they occur, and log and exit on any that escape",
          correct: true,
        }
      - {
          text: "Catch them globally and retry the original operation, since most rejections are transient",
          correct: false,
        }
      - {
          text: "Convert every rejection to a resolved `undefined` so that callers never need to handle errors",
          correct: false,
        }

  - type: single
    prompt: "Why should code reject promises (and pass callback errors) with `Error` objects rather than plain strings?"
    explanation: "An `Error` carries a stack trace showing where it was created, and it can carry a `cause`, a `code` and other fields that callers can check with `instanceof` or by property. A string has none of that, so debugging and selective handling get much harder. Performance and serialisation are not the reason."
    theoryUrl: https://nodejs.org/api/errors.html
    options:
      - {
          text: "Strings cannot be passed to `reject`, so the promise would stay pending forever",
          correct: false,
        }
      - {
          text: "`Error` objects carry a stack trace and fields like `code` or `cause` that callers can check",
          correct: true,
        }
      - {
          text: "Error objects are faster to create and to compare than strings, because V8 interns them and caches their stack traces",
          correct: false,
        }
      - {
          text: "Only `Error` objects can be logged by `console.error`; strings are dropped",
          correct: false,
        }

  - type: single
    prompt: "Your codebase uses `async`/`await`, but a legacy library only offers error-first callback APIs. What is the cleanest way to integrate it?"
    explanation: "Wrap the callback API once at the boundary, with `util.promisify` or a small hand-written promise wrapper, and use promises everywhere else. Mixing styles throughout the codebase spreads the callback problems around, and forking the library just to rename functions buys nothing."
    theoryUrl: https://nodejs.org/api/util.html#utilpromisifyoriginal
    options:
      - {
          text: "Call the callback API directly wherever needed, since `await` also works on callback functions",
          correct: false,
        }
      - {
          text: "Wrap it once at the boundary with `util.promisify` or a small promise wrapper",
          correct: true,
        }
      - {
          text: "Convert the rest of the codebase to callbacks so that the style is consistent",
          correct: false,
        }
      - {
          text: "Run the library in a worker thread so its callbacks turn into promises automatically",
          correct: false,
        }

  - type: single
    prompt: "When is an `EventEmitter` a better fit than a function that returns a promise?"
    explanation: "A promise models one result delivered once. An `EventEmitter` models a source that emits many events over time, possibly of several kinds, to any number of listeners, such as a connection reporting `data`, `error` and `close`. Concurrency and speed are not the deciding factors."
    theoryUrl: https://nodejs.org/en/learn/asynchronous-work/the-nodejs-event-emitter
    options:
      - {
          text: "When an operation produces a single result that the caller needs exactly once",
          correct: false,
        }
      - {
          text: "When a source emits many events over time and several listeners may react to them",
          correct: true,
        }
      - { text: "When the work is CPU-bound and has to run off the main thread", correct: false }
      - {
          text: "Whenever performance matters, since events are faster than promise resolution",
          correct: false,
        }

  - type: boolean
    prompt: "When you call `emitter.emit('order', order)`, the registered listeners run asynchronously, after `emit` has returned."
    answer: false
    explanation: "`EventEmitter` calls listeners synchronously, one after another in registration order, before `emit` returns. A slow listener therefore delays the emitter, and a throwing listener throws out of `emit`. A listener that needs to defer work can schedule it itself."
    theoryUrl: https://nodejs.org/api/events.html#asynchronous-vs-synchronous

  - type: single
    prompt: "A component emits `'error'` on an `EventEmitter`, and nobody has registered an `'error'` listener. What happens?"
    explanation: "`'error'` is special: if no listener is registered, `emit('error', err)` throws the error, which usually crashes the process. Any emitter that can fail should therefore always have an error listener, or be consumed through an API like `pipeline` that handles errors for you."
    theoryUrl: https://nodejs.org/api/events.html#error-events
    options:
      - { text: "The event is ignored like any other event that has no listeners", correct: false }
      - { text: "The error is thrown, which usually crashes the process", correct: true }
      - {
          text: "Node logs a warning and queues the error until a listener is added",
          correct: false,
        }
      - { text: "The emitter switches to a closed state and stops emitting events", correct: false }

  - type: single
    prompt: "A client library fetches a large result set page by page from an API. Which interface makes it easiest for callers to process items one at a time, without loading everything into memory?"
    explanation: "An async iterator (for example an `async function*` generator) lets callers write `for await (const item of results)`: the next page is fetched only when the loop asks for more, so memory stays bounded and backpressure comes for free. Returning one giant array defeats the memory goal, and an emitter pushes items regardless of whether the consumer is ready."
    theoryUrl: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/for-await...of
    options:
      - {
          text: "A function that returns a promise of one array holding every item from every page",
          correct: false,
        }
      - {
          text: "An async iterator, consumed with `for await...of`, that fetches the next page on demand",
          correct: true,
        }
      - {
          text: "An `EventEmitter` that emits an `item` event for every row as fast as the pages arrive",
          correct: false,
        }
      - {
          text: "A callback that is called once per page, with no way for the caller to signal it is busy",
          correct: false,
        }

  - type: single
    prompt: "A search endpoint receives an `AbortSignal` and calls `controller.abort()` when the client disconnects. The `fetch` calls stop, but a long CPU loop over the results keeps running. Why?"
    explanation: "Aborting only sets the signal's state and fires its `abort` event; it cannot stop code by force. APIs that accept a signal (such as `fetch`) listen for it and stop, but your own code must pass the signal along and check `signal.aborted` (or call `signal.throwIfAborted()`) between steps."
    theoryUrl: https://nodejs.org/api/globals.html#class-abortcontroller
    options:
      - {
          text: "`abort()` only works for network requests, and CPU loops can never be cancelled",
          correct: false,
        }
      - {
          text: "Cancellation is cooperative: the loop never checks the signal, so nothing tells it to stop",
          correct: true,
        }
      - {
          text: "The signal is delivered on the next event loop tick, after the loop has already finished",
          correct: false,
        }
      - {
          text: "`abort()` only cancels promises created after it is called, not ones already running",
          correct: false,
        }

  - type: multi
    prompt: "Which are sound practices when designing cancellable async operations in Node.js? Select all that apply."
    explanation: "Pass the `AbortSignal` down to every call that accepts one, check it between steps of long-running work, and release resources (timers, handles, temp files) when it fires. Racing against a timeout promise only stops you from waiting: the losing operation keeps running and consuming resources."
    theoryUrl: https://nodejs.org/api/globals.html#class-abortsignal
    options:
      - { text: "Pass the `AbortSignal` down to every call that accepts one", correct: true }
      - {
          text: "Check the signal between steps of long-running work and stop early",
          correct: true,
        }
      - { text: "Clean up timers, handles and partial work when the signal fires", correct: true }
      - {
          text: "Use `Promise.race` with a timeout, which also cancels the slower operation",
          correct: false,
        }
