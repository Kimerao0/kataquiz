version: 1
title: "Architect Roadmap 19: GoF design patterns in Node.js"
description: The problems behind factory, builder, revealing constructor, singleton, dependency injection, proxy, decorator, adapter, strategy, state, template method, iterator, middleware chains, observer and command, how Node idioms map to them, and when a pattern is overkill.
language: en
tags: [architect-roadmap, nodejs, design-patterns, gof, dependency-injection]
run:
  questionsPerRun: 10
  maxErrors: 3
  timePerQuestionSec: 60
questions:
  - type: single
    prompt: "A function `createStorage(config)` returns a `FileStorage`, `S3Storage` or `MemoryStorage` object depending on the config, all exposing `read` and `write`. What is the main benefit of this factory over calling `new S3Storage(...)` in each caller?"
    explanation: "The factory keeps the choice of concrete class in one place, so callers depend only on the shared `read`/`write` interface and a new backend means changing one function. It does not make objects faster or shared: each call can still return a fresh instance."
    theoryUrl: https://refactoring.guru/design-patterns/factory-method
    options:
      - {
          text: "Callers depend on the interface, and the choice of class lives in one place",
          correct: true,
        }
      - {
          text: "Every caller receives the same shared instance, which saves memory",
          correct: false,
        }
      - {
          text: "Objects built by a factory are faster, because V8 inlines the factory call",
          correct: false,
        }
      - {
          text: "It lets the three storage classes inherit from each other, so `read` and `write` are only written once",
          correct: false,
        }
  - type: single
    prompt: "A module exports this factory function instead of a `RateLimiter` class. What do callers gain from this style?"
    code: |
      export function createRateLimiter({ limit }) {
        const hits = new Map()
        return {
          allow(userId) {
            const count = (hits.get(userId) ?? 0) + 1
            hits.set(userId, count)
            return count <= limit
          },
        }
      }
    explanation: "`hits` lives in a closure, so it is truly private: no caller can read or reset it. `allow` does not rely on `this`, so it can be passed around as a callback without binding. Each call returns a new, independent limiter, so it is not a singleton, and closures are not inherently faster than classes."
    theoryUrl: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Closures
    options:
      - { text: "One limiter shared by every module that imports this function", correct: false }
      - {
          text: "Truly private state, and a method that works without binding `this`",
          correct: true,
        }
      - {
          text: "Better performance, because closures avoid the prototype chain lookup",
          correct: false,
        }
      - {
          text: "Automatic expiry of old entries, since the closure is garbage collected",
          correct: false,
        }
  - type: single
    prompt: "An `HttpRequest` has a dozen optional settings (headers, timeout, retries, auth, proxy...), it is assembled step by step in different parts of the code, and some combinations are invalid. Which pattern helps most?"
    explanation: "A builder collects settings step by step and validates the combination once, in a final `build()` step, so an invalid request is never created. A singleton or adapter solves different problems, and subclasses per combination explode in number."
    theoryUrl: https://refactoring.guru/design-patterns/builder
    options:
      - { text: "Builder, which collects settings and validates them in `build()`", correct: true }
      - { text: "Singleton, so every caller shares one configured request object", correct: false }
      - {
          text: "One subclass per valid combination of settings, such as `AuthRetryRequest`",
          correct: false,
        }
      - {
          text: "Adapter, which converts the settings to the format of the HTTP library",
          correct: false,
        }
  - type: single
    prompt: "A teammate adds a fluent `UserBuilder` with `.withName().withEmail().withRole().build()` for a plain object with three fields, all set in one place. What is the most reasonable review comment?"
    explanation: "In JavaScript an object literal or an options object with defaults already gives named, optional parameters, so a builder for three fields set together adds code without benefit. A builder pays off when construction is step-wise, spread out, or needs validation across fields."
    theoryUrl: https://refactoring.guru/design-patterns/builder
    options:
      - {
          text: "Fine as is: a builder is the standard way to create any object in Node.js",
          correct: false,
        }
      - {
          text: "An options object with defaults is simpler here; the builder is overkill",
          correct: true,
        }
      - {
          text: "Replace it with a singleton so the user object is only built once",
          correct: false,
        }
      - {
          text: "Make the builder an abstract class with one subclass per role, so roles are type-safe",
          correct: false,
        }
  - type: single
    prompt: "`new Promise((resolve, reject) => { ... })` gives `resolve` and `reject` only to the function you pass in. What problem does this revealing constructor design solve?"
    explanation: "Only the code that creates the promise can settle it; consumers receive an object they can observe (`then`) but not resolve. Exposing the capabilities only at construction time protects the object's invariants. It has nothing to do with speed or memory."
    theoryUrl: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Promise/Promise
    options:
      - {
          text: "It makes promises resolve faster, since no method lookup is needed",
          correct: false,
        }
      - {
          text: "It lets any consumer settle the promise, so results can come from anywhere",
          correct: false,
        }
      - {
          text: "Only the creator can settle it; consumers can only observe the result",
          correct: true,
        }
      - { text: "It frees memory by discarding the executor after it runs", correct: false }
  - type: single
    prompt: "Publishing a video takes five steps across subsystems: transcode it, upload the renditions to object storage, write a database record, purge the CDN and notify subscribers. A route handler, a CLI script and a cron job each repeat these steps, and the three copies have drifted apart. Which pattern fits?"
    explanation: "A facade gives the subsystems one simple entry point, such as `publishVideo(file)`, that runs the steps in the right order; the three callers use it and no longer know the details. An adapter translates one interface into another and would leave the five steps in every caller. Independent listeners on an event cannot guarantee that transcoding finishes before the upload."
    theoryUrl: https://refactoring.guru/design-patterns/facade
    options:
      - {
          text: "Facade: one `publishVideo()` call that hides the subsystems and their order",
          correct: true,
        }
      - {
          text: "Adapter: wrap each subsystem so it exposes the interface the route handler expects",
          correct: false,
        }
      - {
          text: "Observer: each caller emits `videoUploaded`, and every subsystem listens and runs its own step",
          correct: false,
        }
      - {
          text: "Decorator: wrap the route handler so the five steps run around it",
          correct: false,
        }
  - type: single
    prompt: "A team imports a module-level singleton database client directly in 40 files. What is the main long-term cost of that choice?"
    explanation: "Every file is hard-wired to one concrete instance, so swapping it for a fake in tests or a second database means mocking the module system or editing all 40 files. The singleton itself is not slow, and module caching guarantees there is one per process."
    theoryUrl: https://martinfowler.com/articles/injection.html
    options:
      - {
          text: "Tight coupling: replacing the client in tests or for a second database is hard",
          correct: true,
        }
      - {
          text: "Each import opens a new connection, so the pool is exhausted quickly",
          correct: false,
        }
      - { text: "Module-level objects are garbage collected between requests", correct: false }
      - {
          text: "Queries become slower, because every module must look the client up through the module cache",
          correct: false,
        }
  - type: boolean
    prompt: "With the Composite pattern, a single item and a group of items share one interface, so client code (for example, computing the total size of a folder tree) can treat both the same way without checking which one it has."
    answer: true
    explanation: "That is the point of Composite: a group implements the same interface as a leaf and delegates to its children, so a call like `size()` works on a file or on a whole tree. The cost is a more general interface, since operations that only make sense for groups (such as `add`) must be handled somehow on leaves."
    theoryUrl: https://refactoring.guru/design-patterns/composite
  - type: single
    prompt: "In a service with 30 classes using constructor injection, where should the concrete dependencies be created and wired together?"
    explanation: "A single composition root at the entry point (for example `main.js`) creates the concrete objects and passes them into the constructors. The rest of the code receives dependencies and never builds them, which is what makes it easy to replace them. Scattering `new` calls or a global lookup brings the coupling back."
    theoryUrl: https://martinfowler.com/articles/injection.html
    options:
      - { text: "Inside each class's constructor, so classes stay self-contained", correct: false }
      - { text: "In one composition root at the application's entry point", correct: true }
      - {
          text: "In a global registry that any class can query when it needs something",
          correct: false,
        }
      - {
          text: "In each route handler, building a fresh set of objects for each request",
          correct: false,
        }
  - type: multi
    prompt: "An `OrderService` receives its `paymentGateway` and `orderRepository` as constructor parameters instead of importing them. What does this give you? Select all that apply."
    explanation: "Passing dependencies in lets tests hand over fakes without module mocking, makes the service's needs visible in its signature, and lets you swap implementations (say, a different gateway) without editing the service. It does not change runtime speed or remove the need to create the real objects somewhere."
    theoryUrl: https://martinfowler.com/articles/injection.html
    options:
      - { text: "Tests can pass in fakes without mocking the module system", correct: true }
      - {
          text: "The service's dependencies are visible in its constructor signature",
          correct: true,
        }
      - {
          text: "Another payment gateway can be used without editing `OrderService`",
          correct: true,
        }
      - { text: "The real dependencies no longer need to be created anywhere", correct: false }
      - {
          text: "Calls through injected objects are faster than calls to imported ones",
          correct: false,
        }
  - type: single
    prompt: "A small Node API has about ten modules. A teammate proposes adding a DI container library with decorators and automatic resolution. What is the most sensible view?"
    explanation: "Dependency injection is a design idea, not a library: passing dependencies as constructor or function parameters, wired by hand in one composition root, is enough at this size. A container adds indirection and magic that pays off only when the object graph gets large. Dropping injection altogether loses testability."
    theoryUrl: https://martinfowler.com/articles/injection.html
    options:
      - {
          text: "A container is required, because Node.js cannot do dependency injection without one",
          correct: false,
        }
      - { text: "Manual injection in one composition root is enough at this size", correct: true }
      - {
          text: "Avoid injection and import concrete modules directly; it is simpler",
          correct: false,
        }
      - { text: "Use a container, but only for the modules that are never tested", correct: false }
  - type: single
    prompt: "Proxy, decorator and adapter all wrap another object. What distinguishes an adapter from the other two?"
    explanation: "An adapter changes the interface, translating calls from the shape the client expects to the shape the wrapped object offers. Proxy and decorator keep the same interface: a proxy controls access (lazy loading, caching, permissions), a decorator adds behaviour. All three can be stacked."
    theoryUrl: https://refactoring.guru/design-patterns/adapter
    options:
      - {
          text: "An adapter changes the interface; proxy and decorator keep it the same",
          correct: true,
        }
      - {
          text: "An adapter must use the ES `Proxy` object, the others use plain wrappers",
          correct: false,
        }
      - {
          text: "An adapter adds new behaviour, while proxy and decorator only forward calls",
          correct: false,
        }
      - {
          text: "An adapter can only wrap classes, while proxy and decorator can also wrap plain functions",
          correct: false,
        }
  - type: single
    prompt: "A client for a reporting service is expensive to set up (it loads a large schema and opens connections), but most requests never use it. You want callers to use it as if it were always there, while it is only created on first use. Which pattern fits?"
    explanation: "A virtual proxy has the same interface as the real object and creates the real one the first time a method is called. Callers do not change. A decorator adds behaviour rather than controlling creation, an adapter changes the interface, and creating it eagerly is what you wanted to avoid."
    theoryUrl: https://refactoring.guru/design-patterns/proxy
    options:
      - { text: "Adapter, which converts the service's API into a lighter one", correct: false }
      - {
          text: "Proxy, which has the same interface and creates the real client lazily",
          correct: true,
        }
      - {
          text: "Observer, which notifies callers once the client has finished loading",
          correct: false,
        }
      - {
          text: "Singleton, created at startup so every request reuses one instance",
          correct: false,
        }
  - type: single
    prompt: "This helper wraps data-access functions. Which pattern is it, and what is its main advantage?"
    code: |
      function withTiming(name, fn, metrics) {
        return async (...args) => {
          const start = performance.now()
          try {
            return await fn(...args)
          } finally {
            metrics.record(name, performance.now() - start)
          }
        }
      }

      const findUser = withTiming('findUser', findUserInDb, metrics)
    explanation: "It is a decorator: the wrapper has the same signature as the function it wraps and adds behaviour (timing) without changing the original. Wrappers compose, so retries or logging can be stacked the same way. An adapter would change the signature, and a strategy is chosen instead of something rather than wrapped around it."
    theoryUrl: https://refactoring.guru/design-patterns/decorator
    options:
      - { text: "Adapter: it converts `findUserInDb` into an async function", correct: false }
      - {
          text: "Decorator: it adds behaviour without changing the original, and wrappers compose",
          correct: true,
        }
      - { text: "Strategy: it picks which data-access function runs at runtime", correct: false }
      - { text: "Singleton: it guarantees `findUserInDb` is only called once", correct: false }
  - type: single
    prompt: "Your payment code calls the Stripe SDK in 25 places. Product asks to support a second provider whose SDK has a different API. What is the cleanest structural change?"
    explanation: "Define the payment interface your app needs, write one adapter per provider that translates it to that provider's SDK, and make the 25 call sites use the interface. Adding a third provider then means one new adapter. `if` branches at every call site spread the knowledge of every provider through the code."
    theoryUrl: https://refactoring.guru/design-patterns/adapter
    options:
      - {
          text: "Add an `if (provider === 'stripe')` branch at each of the 25 call sites",
          correct: false,
        }
      - {
          text: "Define your own payment interface and write one adapter per provider",
          correct: true,
        }
      - {
          text: "Subclass the Stripe SDK client and override its methods for the new provider",
          correct: false,
        }
      - {
          text: "Fork the second provider's SDK and rename its methods to match Stripe",
          correct: false,
        }
  - type: boolean
    prompt: "In JavaScript, the Strategy pattern often needs no class hierarchy: passing a function (for example a pricing rule) as a parameter is already a strategy."
    answer: true
    explanation: "Strategy means making an algorithm interchangeable behind a common contract. Functions are first-class values in JavaScript, so a function parameter fulfils that contract directly, as `array.sort(compareFn)` shows. Classes are still useful when a strategy carries state or several related methods."
    theoryUrl: https://refactoring.guru/design-patterns/strategy
  - type: single
    prompt: "Strategy and State have almost the same structure: a context delegating to an interchangeable object. How do they differ?"
    explanation: "With Strategy, the client picks the algorithm from outside and it usually stays fixed for that use. With State, the object changes its own behaviour as its internal state changes, and the states themselves often trigger the transitions. The structure is the same; the intent and who drives the change differ."
    theoryUrl: https://refactoring.guru/design-patterns/state
    options:
      - { text: "Strategy uses classes, State uses plain functions", correct: false }
      - {
          text: "The client chooses a strategy; the object changes state itself over time",
          correct: true,
        }
      - { text: "Strategy is for asynchronous code, State is for synchronous code", correct: false }
      - { text: "State may only hold data, while Strategy may only hold behaviour", correct: false }
  - type: single
    prompt: "An `Order` has statuses (draft, paid, shipped, cancelled), and `cancel()`, `ship()` and `refund()` each contain a growing `switch (this.status)` that decides what is allowed. Every new status means editing every method. Which pattern addresses this?"
    explanation: "With the State pattern, each status becomes an object that implements the allowed actions and the transitions to the next state, and the order delegates to its current state. Adding a status means adding one state object instead of editing every `switch`. Observers or singletons do not organise status-dependent behaviour."
    theoryUrl: https://refactoring.guru/design-patterns/state
    options:
      - { text: "Observer, emitting an event on every status change", correct: false }
      - {
          text: "State, one object per status that handles the actions and transitions",
          correct: true,
        }
      - { text: "Singleton, one shared `OrderStatus` object for the whole app", correct: false }
      - {
          text: "Builder, so that each order is assembled with its final status already set",
          correct: false,
        }
  - type: single
    prompt: "To write a custom Node.js Transform stream, you only provide the function that processes one chunk; the stream class owns buffering, backpressure and the overall flow. Which GoF pattern does this design follow?"
    explanation: "Template method: a base class defines the fixed skeleton of the algorithm and calls hooks that subclasses or callers fill in. Here the stream machinery is the skeleton and your chunk function is the hook. Nothing is wrapped (decorator) or translated (adapter)."
    theoryUrl: https://refactoring.guru/design-patterns/template-method
    options:
      - { text: "Template method: a fixed skeleton calls the step you provide", correct: true }
      - {
          text: "Adapter: your function converts chunks into the stream's own format",
          correct: false,
        }
      - { text: "Decorator: your function wraps the stream to add new behaviour", correct: false }
      - { text: "Command: each chunk is an object that can be queued and undone", correct: false }
  - type: single
    prompt: "In a checkout module, the cart, pricing, promotions, inventory and shipping objects call each other directly, so a change in one ripples through the others. You introduce a mediator that they all talk to instead of each other. What is the main cost to watch for?"
    explanation: "A mediator removes the many-to-many links, but all the coordination logic moves into it, and without care it grows into a god object that every change has to touch. The five objects become less coupled, not more, since they only know the mediator. A mediator is an in-process object and needs no broker, and the objects stay testable with a fake mediator."
    theoryUrl: https://refactoring.guru/design-patterns/mediator
    options:
      - {
          text: "The mediator can grow into a god object holding all the coordination logic",
          correct: true,
        }
      - {
          text: "The five objects become more coupled, since each must now know all the others through the mediator",
          correct: false,
        }
      - {
          text: "Every interaction needs a message broker, since a mediator must be asynchronous",
          correct: false,
        }
      - {
          text: "The objects can no longer be unit tested, because they all depend on the mediator",
          correct: false,
        }
  - type: single
    prompt: "An Express or Koa middleware stack passes a request through logging, authentication, rate limiting and finally the route handler; any middleware can respond and stop the chain. Which GoF pattern is this?"
    explanation: "Chain of responsibility: a request travels along a chain of handlers, and each can process it, pass it on, or stop it. Middleware adds a twist (handlers usually all run), but the structure is the same. It is not an observer, where every listener is notified and none can stop the others."
    theoryUrl: https://refactoring.guru/design-patterns/chain-of-responsibility
    options:
      - { text: "Observer, since every middleware listens for the request event", correct: false }
      - {
          text: "Chain of responsibility: each handler passes the request on or stops it",
          correct: true,
        }
      - {
          text: "Builder, since each middleware adds a piece of the final response",
          correct: false,
        }
      - {
          text: "Strategy, since one middleware is picked at random for each request",
          correct: false,
        }
  - type: single
    prompt: "In an Express app, the authentication middleware is registered after the route handlers instead of before them. What is the effect?"
    explanation: "Middleware runs in registration order. A route handler that matches responds and ends the chain, so the authentication middleware registered after it never runs for that route: protected routes are open. Express does not reorder middleware or warn about it."
    theoryUrl: https://expressjs.com/en/guide/using-middleware.html
    options:
      - { text: "No effect: Express always runs authentication middleware first", correct: false }
      - {
          text: "Protected routes respond before authentication runs, so they are open",
          correct: true,
        }
      - { text: "Express throws an error at startup about the middleware order", correct: false }
      - {
          text: "Authentication runs twice per request, once before and once after the handler",
          correct: false,
        }
  - type: multi
    prompt: "An order module emits `orderPlaced` on an `EventEmitter`, and email, analytics and stock modules subscribe to it (the observer pattern). What are the real trade-offs? Select all that apply."
    explanation: "The emitter does not know its subscribers, so new reactions are added without touching the order code. The price is indirection: the flow is harder to follow and test, and a missing or failing listener does not show up in the emitter's code. An in-process emitter gives no durability or retries; that takes a message broker."
    theoryUrl: https://refactoring.guru/design-patterns/observer
    options:
      - { text: "New reactions can be added without changing the order module", correct: true }
      - {
          text: "The control flow is harder to follow, since callers do not see the listeners",
          correct: true,
        }
      - { text: "Events survive a process crash and are redelivered to listeners", correct: false }
      - { text: "Listeners are guaranteed to run on separate threads, in parallel", correct: false }
  - type: single
    prompt: "A web app lets users queue bulk operations (resize images, send emails) that must survive a crash, be retried, and appear in a job list. Which pattern is the natural base for the job model?"
    explanation: "The command pattern turns a request into an object with its name and parameters, so it can be stored, queued, retried, logged and listed, then executed later by a worker. That is exactly what a persistent job needs. A direct function call cannot be stored, and an observer only notifies."
    theoryUrl: https://refactoring.guru/design-patterns/command
    options:
      - {
          text: "Command: each operation becomes a stored object that a worker can run or retry",
          correct: true,
        }
      - {
          text: "Observer: each operation is an event that listeners react to once",
          correct: false,
        }
      - { text: "Proxy: the job list controls access to the operations", correct: false }
      - { text: "Decorator: each retry wraps the previous attempt", correct: false }
  - type: single
    prompt: "A codebase has an `IUserRepository` interface, an abstract `UserRepositoryFactory`, a `UserRepositoryFactoryImpl` and one `PostgresUserRepository`. There has only ever been one implementation, and tests use a plain object fake. What is the fairest assessment?"
    explanation: "Layers of interfaces and factories for a single implementation add indirection without a payoff: a plain object fake already works in JavaScript because of duck typing. Patterns earn their cost when there is real variation to manage. Add the abstraction when a second implementation actually arrives."
    theoryUrl: https://refactoring.guru/design-patterns/abstract-factory
    options:
      - {
          text: "Good practice: every repository should have an abstract factory in case it changes",
          correct: false,
        }
      - {
          text: "Overkill: with one implementation, a plain module or class is enough",
          correct: true,
        }
      - { text: "Incomplete: it also needs a singleton so only one factory exists", correct: false }
      - {
          text: "Required by Node.js, since tests cannot replace a class without an interface",
          correct: false,
        }
