version: 1
title: "Architect Roadmap 19: GoF design patterns in Node.js"
description: Factory, builder, revealing constructor, singleton, dependency injection, proxy, decorator, adapter, strategy, state, template, iterator, middleware and command in Node.js.
language: en
tags: [architect-roadmap, nodejs, design-patterns, gof, dependency-injection]
run:
  questionsPerRun: 10
  maxErrors: 3
  timePerQuestionSec: 60
questions:
  - type: single
    prompt: "What does this script print?"
    code: |
      function createCounter() {
        let count = 0
        return {
          increment() { return ++count },
          get value() { return count },
        }
      }

      const a = createCounter()
      const b = createCounter()
      a.increment()
      a.increment()
      b.increment()
      console.log(a.value, b.value, a.count)
    codeLanguage: javascript
    explanation: "Each call to the factory creates a new closure with its own `count`, so `a` is at 2 and `b` at 1. `count` is not a property of the returned object, so `a.count` is `undefined`. This is the factory plus closure approach to encapsulation: private state without classes or `#private` fields."
    theoryUrl: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Closures
    options:
      - { text: "2 1 undefined", correct: true }
      - { text: "3 3 3", correct: false }
      - { text: "2 1 2", correct: false }
      - { text: "2 2 undefined", correct: false }
  - type: single
    prompt: "A function `createStorage(type)` returns a `FileStorage`, `S3Storage` or `MemoryStorage` object depending on the config, all exposing `read` and `write`. What is the main benefit of using a factory here instead of calling `new` in each caller?"
    explanation: "A factory decouples the callers from the concrete class: they depend on the shared interface, and the choice (or later changes, like adding a new backend) lives in one place. A factory does not make instances share state, and it is not about speed or about caching."
    theoryUrl: https://refactoring.guru/design-patterns/factory-method
    options:
      - {
          text: "Callers depend only on the interface, and the choice of class lives in one place",
          correct: true,
        }
      - {
          text: "All the instances share one state, so writes are visible across backends",
          correct: false,
        }
      - { text: "Object creation through a function is faster than `new` in V8", correct: false }
      - {
          text: "It guarantees that only one storage object exists for the whole process",
          correct: false,
        }
  - type: single
    prompt: "An `HttpRequest` needs 12 optional settings (headers, timeout, retries, auth, proxy, and so on), and some combinations are invalid. Which pattern helps most, and why?"
    explanation: "A builder collects the settings step by step through readable, chainable methods and validates the combination in `build()`, producing a ready, possibly immutable object. A 12-argument constructor is unreadable and error-prone, and a factory or singleton solves different problems (which class, how many instances)."
    theoryUrl: https://refactoring.guru/design-patterns/builder
    options:
      - {
          text: "Singleton, so that a single request configuration is reused everywhere",
          correct: false,
        }
      - {
          text: "Builder, which sets options fluently and validates them once in `build()`",
          correct: true,
        }
      - {
          text: "Factory, as a function with 12 positional parameters is easy to remember",
          correct: false,
        }
      - {
          text: "Observer, so that each option notifies the request when it changes",
          correct: false,
        }
  - type: single
    prompt: "What does this script print?"
    code: |
      class Resolver {
        constructor(executor) {
          const resolve = (v) => { this.value = v }
          executor(resolve)
        }
      }

      let leaked
      const r = new Resolver((resolve) => {
        leaked = resolve
        console.log('executor runs')
      })
      console.log('after construct', r.value)
      leaked(42)
      console.log('after resolve', r.value)
    codeLanguage: javascript
    explanation: "The revealing constructor pattern (used by `Promise`) runs the executor synchronously inside the constructor and passes it the private mutators. Here the executor stores `resolve` outside, so it can be called later, after construction: the state is `undefined` first and `42` afterwards. The point of the pattern is that only the code that creates the object can change it."
    theoryUrl: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Promise/Promise
    options:
      - { text: "after construct 42, after resolve 42", correct: false }
      - { text: "executor runs, after construct undefined, after resolve 42", correct: true }
      - { text: "after construct undefined, executor runs, after resolve 42", correct: false }
      - {
          text: "executor runs, after construct undefined, after resolve undefined",
          correct: false,
        }
  - type: single
    prompt: "Why does a read-only event source like `ReadonlyEmitter` use the revealing constructor pattern, passing `emit` only to an executor function?"
    explanation: "The consumers get an object they can listen to but cannot trigger or mutate, because the `emit` capability is only revealed to the code that constructs it. The pattern provides immutability by construction, not thread safety, and it does not stop the listeners from running."
    theoryUrl: https://nodejs.org/api/events.html
    options:
      - {
          text: "It makes `emit` run on a worker thread, so listeners cannot block the loop",
          correct: false,
        }
      - {
          text: "It prevents listeners from being garbage collected while the emitter lives",
          correct: false,
        }
      - {
          text: "Only the creator can fire events, so consumers hold a read-only object",
          correct: true,
        }
      - {
          text: "It makes events fire asynchronously, which avoids the Zalgo problem",
          correct: false,
        }
  - type: single
    prompt: "What does this script print?"
    code: |
      // s/db.js
      let created = 0
      class Db { constructor() { this.id = ++created } }
      module.exports = new Db()

      // main.js
      const a = require('./s/db')
      const b = require('./s/db')
      delete require.cache[require.resolve('./s/db')]
      const c = require('./s/db')
      console.log(a === b, a === c)
    codeLanguage: javascript
    explanation: "Modules are cached by resolved path, so the first two `require` calls return the same instance (`true`): that is the usual singleton in Node. Deleting the entry from `require.cache` forces the module to execute again and export a new object, so `a === c` is `false`. A duplicated package under another `node_modules` path would break the singleton the same way."
    theoryUrl: https://nodejs.org/api/modules.html#caching
    options:
      - { text: "true true", correct: false }
      - { text: "false false", correct: false }
      - { text: "true false", correct: true }
      - { text: "false true", correct: false }
  - type: single
    prompt: "A team uses a module-level singleton for the database client, imported directly in 40 files. What is the main long-term cost of that choice?"
    explanation: "Hard-wired imports of a singleton make the dependency implicit and global, so tests cannot easily replace it and the code is coupled to the concrete module. Passing the dependency in (dependency injection) keeps one instance in production but lets tests supply a fake. It is not a performance or memory problem."
    theoryUrl: https://martinfowler.com/articles/injection.html
    options:
      - {
          text: "Each import creates a separate connection pool, so connections run out",
          correct: false,
        }
      - { text: "Node reloads the module on every request, which is slow", correct: false }
      - {
          text: "The hidden global coupling makes isolation in tests and swapping implementations hard",
          correct: true,
        }
      - {
          text: "Singletons are not allowed in ES modules, so the code cannot be migrated",
          correct: false,
        }
  - type: single
    prompt: "What does this script print?"
    code: |
      class Mailer {
        constructor(transport) { this.transport = transport }
        send(m) { return this.transport.send(m) }
      }

      const fake = {
        sent: [],
        send(m) { this.sent.push(m); return 'ok' },
      }
      const mailer = new Mailer(fake)
      console.log(mailer.send('hi'), fake.sent)
    codeLanguage: javascript
    explanation: "With constructor injection, `Mailer` only knows the `send` contract, so a test can pass a fake and inspect it afterwards. `this.transport.send(m)` keeps `this` bound to `fake`, hence the push works and prints `ok [ 'hi' ]`. In production the same class receives an SMTP or API transport."
    theoryUrl: https://martinfowler.com/articles/injection.html
    options:
      - { text: "ok []", correct: false }
      - { text: "undefined [ 'hi' ]", correct: false }
      - { text: "ok [ 'hi' ]", correct: true }
      - { text: "It throws, because `this` is lost when `send` is called", correct: false }
  - type: single
    prompt: "In a service with 30 classes, where should the concrete dependencies be created and wired together?"
    explanation: "The composition root, a single place near the entry point (e.g. `main.ts`), builds the object graph and injects it; business classes only declare what they need. Letting each class create or look up its own dependencies (new inside, or a global service locator) hides the dependencies again and brings back the coupling that DI removes."
    theoryUrl: https://martinfowler.com/articles/injection.html
    options:
      - {
          text: "Inside each class constructor, with `new`, so that the class is self-contained",
          correct: false,
        }
      - {
          text: "In a global registry that every class queries when it needs something",
          correct: false,
        }
      - {
          text: "At the application entry point, then passed down through constructors",
          correct: true,
        }
      - {
          text: "Lazily at the first call of each method, to avoid unused instances",
          correct: false,
        }
  - type: single
    prompt: "Proxy, decorator and adapter all wrap another object. What distinguishes an adapter from the other two?"
    explanation: "An adapter changes the interface so incompatible code can work together (a callback API exposed as promises). Proxy and decorator keep the same interface: a proxy controls access (lazy loading, caching, validation), while a decorator adds behaviour (logging, retries). Intent is the real difference, as the code shape looks similar."
    theoryUrl: https://refactoring.guru/design-patterns/adapter
    options:
      - {
          text: "It exposes a different interface than the wrapped object, to make it compatible",
          correct: true,
        }
      - {
          text: "It must be created through `Proxy`, while the other two are written by hand",
          correct: false,
        }
      - {
          text: "It wraps the object's prototype, while the others wrap only plain instances",
          correct: false,
        }
      - {
          text: "It adds behaviour before and after each call, while the others only forward calls",
          correct: false,
        }
  - type: single
    prompt: "What does this script print?"
    code: |
      'use strict'

      const target = { age: 3 }
      const p = new Proxy(target, {
        set(t, key, value) { return false },
      })

      try { p.age = 4 } catch (e) { console.log(e.constructor.name) }
      console.log(target.age)
    codeLanguage: javascript
    explanation: "A `set` trap returning a falsy value signals that the assignment failed. In strict mode (modules, classes, or `'use strict'`) that makes the assignment throw a `TypeError`, while in sloppy mode it is silently ignored. The target is never touched, so it stays 3."
    theoryUrl: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Proxy/Proxy/set
    options:
      - { text: "TypeError, then 3", correct: true }
      - { text: "Nothing is thrown, then 4", correct: false }
      - { text: "TypeError, then 4", correct: false }
      - { text: "Nothing is thrown, then 3", correct: false }
  - type: multi
    prompt: "Which of these are good uses of an ES `Proxy` in a Node.js application? Select all that apply."
    explanation: "Proxies are well suited to validating assignments, lazy initialisation of expensive objects, and logging or access control around an existing object, all without changing its callers. They are not a free way to speed up code: every trapped operation adds overhead, so they do not belong in hot loops."
    theoryUrl: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Proxy
    options:
      - { text: "Validating values assigned to a configuration object", correct: true }
      - { text: "Making property access faster in a hot loop", correct: false }
      - { text: "Lazily creating an expensive object on first property access", correct: true }
      - {
          text: "Logging and enforcing access rules around an existing service object",
          correct: true,
        }
  - type: single
    prompt: "What does this script print?"
    code: |
      function withLogging(fn) {
        return function (...args) {
          console.log('call', fn.name, args)
          const r = fn.apply(this, args)
          console.log('return', r)
          return r
        }
      }

      const add = (a, b) => a + b
      const logged = withLogging(add)
      console.log(logged(2, 3))
      console.log(`[${logged.name}] [${add.name}]`)
    codeLanguage: javascript
    explanation: "The decorator calls the original and adds logging, so the first lines are `call add [ 2, 3 ]`, `return 5` and then the `5` from `console.log`. The wrapper is an anonymous function expression returned directly, so its `name` is an empty string, and the decorated function loses the original's metadata. Real decorators copy `name`/`length` or use a Proxy when this matters."
    theoryUrl: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Function/name
    options:
      - { text: "call add [ 2, 3 ], return 5, 5, then [add] [add]", correct: false }
      - { text: "call add [ 2, 3 ], return 5, 5, then [] [add]", correct: true }
      - { text: "call logged [ 2, 3 ], return 5, 5, then [logged] [add]", correct: false }
      - { text: "call add [ 2, 3 ], 5, return 5, then [] [add]", correct: false }
  - type: single
    prompt: "Your payment code calls `stripe.charges.create(...)` in 25 places. Product asks to support a second provider with a different SDK. What is the cleanest structural change?"
    explanation: "Define the interface your domain needs (`charge(amount, customer)`), write one adapter per provider, and let the rest of the code depend on the interface. The 25 call sites stay untouched when a provider is added. Copy-pasting the code or sprinkling `if (provider === ...)` multiplies the coupling instead."
    theoryUrl: https://refactoring.guru/design-patterns/adapter
    options:
      - {
          text: "Duplicate the 25 call sites for the new provider and switch with a config flag",
          correct: false,
        }
      - {
          text: "Define a `PaymentGateway` interface with an adapter per provider SDK",
          correct: true,
        }
      - {
          text: "Wrap the Stripe SDK in a `Proxy` that rewrites method names for the new SDK",
          correct: false,
        }
      - {
          text: "Add `if (provider === 'new')` branches inside each of the 25 call sites",
          correct: false,
        }
  - type: single
    prompt: "What does this script print?"
    code: |
      const strategies = {
        asc: (a, b) => a - b,
        desc: (a, b) => b - a,
      }

      const sorter = (strategy) => (arr) => [...arr].sort(strategies[strategy])

      const data = [3, 1, 2]
      console.log(sorter('asc')(data), sorter('desc')(data), data)
    codeLanguage: javascript
    explanation: "The strategy (the comparison function) is chosen by the caller and plugged into the same algorithm, so asc gives `[1, 2, 3]` and desc `[3, 2, 1]`. The spread copy `[...arr]` means `sort` does not mutate the input, which therefore stays `[3, 1, 2]`. Without the copy, `sort` would reorder `data` in place."
    theoryUrl: https://refactoring.guru/design-patterns/strategy
    options:
      - { text: "[ 1, 2, 3 ] [ 3, 2, 1 ] [ 3, 2, 1 ]", correct: false }
      - { text: "[ 1, 2, 3 ] [ 3, 2, 1 ] [ 1, 2, 3 ]", correct: false }
      - { text: "[ 1, 2, 3 ] [ 1, 2, 3 ] [ 3, 1, 2 ]", correct: false }
      - { text: "[ 1, 2, 3 ] [ 3, 2, 1 ] [ 3, 1, 2 ]", correct: true }
  - type: single
    prompt: "Strategy and State have almost the same structure: a context delegating to an interchangeable object. How do they differ?"
    explanation: "In Strategy the client picks the algorithm and it usually stays until changed by the client. In State the object swaps its own state when events happen, and the states often know about their successors. Same structure, different intent: who drives the change and why."
    theoryUrl: https://refactoring.guru/design-patterns/state
    options:
      - {
          text: "State is used only with classes, while Strategy is used only with functions",
          correct: false,
        }
      - {
          text: "Strategy objects are stateless, while State objects must store the whole history",
          correct: false,
        }
      - {
          text: "In State the context itself changes the delegate as it transitions, in Strategy the client chooses",
          correct: true,
        }
      - {
          text: "Strategy can change at runtime, but a State is fixed when the context is created",
          correct: false,
        }
  - type: single
    prompt: "What does this script print?"
    code: |
      class Door {
        constructor() { this.state = new Closed() }
        press() { this.state = this.state.next() }
      }
      class Closed { next() { console.log('opening'); return new Open() } }
      class Open { next() { console.log('closing'); return new Closed() } }

      const d = new Door()
      d.press(); d.press(); d.press()
      console.log(d.state.constructor.name)
    codeLanguage: javascript
    explanation: "Each `press()` delegates to the current state, which logs and returns the next one: Closed to Open (opening), Open to Closed (closing), Closed to Open (opening). The door ends up in `Open`. The context has no `if`/`switch` on a status flag, which is the main benefit of the State pattern."
    theoryUrl: https://refactoring.guru/design-patterns/state
    options:
      - { text: "opening, closing, opening, Closed", correct: false }
      - { text: "opening, closing, closing, Open", correct: false }
      - { text: "opening, closing, opening, Open", correct: true }
      - { text: "closing, opening, closing, Closed", correct: false }
  - type: single
    prompt: "What does this script print?"
    code: |
      class Report {
        generate() {
          console.log(this.header())
          console.log(this.body())
          console.log(this.footer())
        }
        header() { return 'H:base' }
        footer() { return 'F:base' }
        body() { throw new Error('not implemented') }
      }

      class Sales extends Report {
        body() { return 'B:sales' }
        footer() { return 'F:' + super.footer() }
      }

      new Sales().generate()
    codeLanguage: javascript
    explanation: "Template method: the base class fixes the algorithm (`generate`: header, body, footer) and subclasses override the steps. `this.header()` is not overridden so it returns `H:base`, `body` is the subclass one, and `footer` calls the parent through `super`, giving `F:F:base`."
    theoryUrl: https://refactoring.guru/design-patterns/template-method
    options:
      - { text: "H:base, B:sales, F:base", correct: false }
      - { text: "H:base, B:sales, F:F:base", correct: true }
      - { text: "H:base, then an Error 'not implemented'", correct: false }
      - { text: "B:sales, H:base, F:F:base", correct: false }
  - type: single
    prompt: "What does this script print?"
    code: |
      class Range {
        constructor(n) { this.n = n }
        *[Symbol.iterator]() {
          try {
            for (let i = 1; i <= this.n; i++) yield i
          } finally {
            console.log('cleanup')
          }
        }
      }

      for (const x of new Range(5)) {
        if (x === 2) break
        console.log(x)
      }
      console.log([...new Range(2)])
    codeLanguage: javascript
    explanation: "`for...of` gets an iterator from `[Symbol.iterator]`. Breaking early calls its `return()`, which runs the generator's `finally`, so `cleanup` prints right after `1`. The spread consumes the generator to the end, so `finally` runs again (cleanup) before the array `[ 1, 2 ]` is logged."
    theoryUrl: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Iteration_protocols
    options:
      - { text: "1, cleanup, cleanup, [ 1, 2 ]", correct: true }
      - { text: "1, 2, cleanup, [ 1, 2 ], cleanup", correct: false }
      - { text: "1, cleanup, [ 1, 2 ]", correct: false }
      - { text: "1, cleanup, [ 1, 2 ], cleanup", correct: false }
  - type: single
    prompt: "An API returns data in pages of 100 items through a `nextCursor` token, and a caller wants to loop over all items as if they were one list, fetching pages lazily. What is the idiomatic Node.js approach?"
    explanation: "An async generator (`async function*`) hides the pagination behind the async iterator protocol: callers use `for await (const item of listItems())`, and the next page is requested only when the loop needs it. Fetching everything up front wastes memory and time, and exposing cursors leaks the paging detail to every caller."
    theoryUrl: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/for-await...of
    options:
      - {
          text: "Return an array with all the pages, fetched in parallel with `Promise.all`",
          correct: false,
        }
      - {
          text: "Return the cursor to the caller, which must call the function again each time",
          correct: false,
        }
      - {
          text: "Expose an async generator that yields items and fetches the next page when needed",
          correct: true,
        }
      - {
          text: "Return an `EventEmitter` that emits one `page` event per request, in parallel",
          correct: false,
        }
  - type: single
    prompt: "What does this script print?"
    code: |
      const stack = []
      function use(fn) { stack.push(fn) }
      function run(ctx) {
        let i = 0
        async function next() {
          const fn = stack[i++]
          if (fn) await fn(ctx, next)
        }
        return next()
      }

      use(async (ctx, next) => { console.log('A before'); await next(); console.log('A after') })
      use(async (ctx, next) => { console.log('B before'); await next(); console.log('B after') })
      use(async () => { console.log('handler') })

      run({}).then(() => console.log('done'))
    codeLanguage: javascript
    explanation: "Middleware forms an onion: each function runs its code before `next()`, the chain goes inward to the handler, then control returns outward in reverse order. The result is A before, B before, handler, B after, A after, and `done` once the first `next()` promise resolves."
    theoryUrl: https://expressjs.com/en/guide/using-middleware.html
    options:
      - { text: "A before, A after, B before, B after, handler, done", correct: false }
      - { text: "A before, B before, handler, B after, A after, done", correct: true }
      - { text: "A before, B before, handler, A after, B after, done", correct: false }
      - { text: "handler, B before, A before, A after, B after, done", correct: false }
  - type: single
    prompt: "In an Express app, a logging middleware is registered after the route handlers instead of before them. What is the effect?"
    explanation: "Express runs middleware and routes in registration order. If a route handler already sends the response and does not call `next()`, the later logging middleware is never reached for that request. Order is part of the middleware contract, so cross-cutting logic goes before the handlers it must wrap."
    theoryUrl: https://expressjs.com/en/guide/writing-middleware.html
    options:
      - {
          text: "It still logs every request, as Express sorts middleware by type before running them",
          correct: false,
        }
      - {
          text: "It is skipped for requests that a route handler answers without calling `next()`",
          correct: true,
        }
      - {
          text: "Express throws at startup, because middleware must be registered first",
          correct: false,
        }
      - {
          text: "It runs twice for each request, once before and once after the route handler",
          correct: false,
        }
  - type: single
    prompt: "What does this script print?"
    code: |
      class Editor {
        text = ''
        history = []
        execute(cmd) { cmd.do(this); this.history.push(cmd) }
        undo() { this.history.pop()?.undo(this) }
      }

      const append = (s) => ({
        do(e) { e.text += s },
        undo(e) { e.text = e.text.slice(0, -s.length) },
      })

      const ed = new Editor()
      ed.execute(append('ab'))
      ed.execute(append('cd'))
      ed.undo()
      ed.execute(append('X'))
      console.log(ed.text, ed.history.length)
    codeLanguage: javascript
    explanation: "Each action is an object with `do` and `undo`, and the editor keeps them in a history stack. After `ab` and `cd` the text is `abcd`, `undo()` pops `cd` and restores `ab`, and the next command appends `X`, so `abX`. The history holds `append('ab')` and `append('X')`, hence length 2."
    theoryUrl: https://refactoring.guru/design-patterns/command
    options:
      - { text: "abcdX 3", correct: false }
      - { text: "abX 3", correct: false }
      - { text: "abX 2", correct: true }
      - { text: "abcdX 2", correct: false }
  - type: single
    prompt: "A web app lets users queue bulk operations (resize images, send emails) that may be retried after a crash and shown in a job list. Which pattern is the natural base for the job model?"
    explanation: "Command turns a request into an object holding everything needed to execute it, so it can be queued, persisted, retried, logged or undone. A singleton or strategy does not give you a serialisable unit of work, and a proxy only controls access to an existing object."
    theoryUrl: https://refactoring.guru/design-patterns/command
    options:
      - { text: "Proxy, since it intercepts calls and can store them for later", correct: false }
      - {
          text: "Command, a serialisable object that describes the operation and its parameters",
          correct: true,
        }
      - { text: "Singleton, since one global queue must exist for the process", correct: false }
      - {
          text: "Template method, so that every job inherits the same retry loop from a base class",
          correct: false,
        }
  - type: single
    prompt: "What does this script print?"
    code: |
      const legacy = {
        fetch(id, cb) { setImmediate(() => cb(null, { id, via: 'legacy' })) },
      }

      const adapter = {
        get(id) {
          return new Promise((res, rej) => legacy.fetch(id, (e, v) => e ? rej(e) : res(v)))
        },
      }

