version: 1
title: "Architect Roadmap 31: NoSQL and data modeling"
description: DynamoDB single-table design, partition keys and hot partitions, and choosing between document, key-value, wide-column and graph stores.
language: en
tags: [architect-roadmap, data, dynamodb, nosql, data-modeling]
run:
  questionsPerRun: 10
  maxErrors: 3
  timePerQuestionSec: 90
questions:
  - type: single
    prompt: "You are modelling an e-commerce app on DynamoDB. The access patterns are: get a customer, list a customer's orders by date, get one order with its line items. How should you start the design?"
    explanation: "DynamoDB modelling starts from the access patterns, because queries are only efficient on keys and indexes. You then design the keys (and GSIs) to satisfy them. Normalising first as in a relational database and joining later is not possible in DynamoDB."
    theoryUrl: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/data-modeling-foundations.html
    options:
      - {
          text: "Normalise into one table per entity and join them in the application layer after each query",
          correct: false,
        }
      - {
          text: "Enumerate the access patterns and design keys and indexes to serve them",
          correct: true,
        }
      - { text: "Create one item per attribute and use Scan to assemble the data", correct: false }
      - { text: "Store everything as one JSON blob per customer", correct: false }
  - type: single
    prompt: "In a single-table design, a customer and their orders use PK = `CUSTOMER#123` for all items, with SK = `PROFILE` for the profile and SK = `ORDER#2025-03-01#789` for orders. How do you fetch the customer's orders from March 2025?"
    explanation: "A Query on one partition key with a `begins_with` or range condition on the sort key reads just that item collection. Because the sort key embeds the date, orders are sorted and range-queryable. A Scan would read the entire table."
    theoryUrl: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Query.html
    options:
      - { text: "Scan the table with a filter on the date", correct: false }
      - { text: "Query PK = `CUSTOMER#123` with SK begins_with `ORDER#2025-03`", correct: true }
      - { text: "GetItem with PK only, which returns all items of the partition", correct: false }
      - { text: "Join the customer table to the orders table on PK", correct: false }
  - type: single
    prompt: "What is the main reason for single-table design in DynamoDB?"
    explanation: "Putting related entities in the same table under the same partition key lets one Query return them together, replacing joins and reducing round trips. It trades flexibility for performance, and it is not about reducing costs per table or avoiding indexes."
    theoryUrl: https://aws.amazon.com/blogs/database/single-table-vs-multi-table-design-in-amazon-dynamodb/
    options:
      - {
          text: "DynamoDB charges a flat monthly fee per table regardless of traffic, so fewer tables are cheaper",
          correct: false,
        }
      - {
          text: "Related items can be co-located and fetched in one Query without joins",
          correct: true,
        }
      - { text: "Secondary indexes are not supported on multiple tables", correct: false }
      - { text: "It makes schema changes easier than in any relational database", correct: false }
  - type: single
    prompt: "A DynamoDB table uses `status` (values: PENDING, SHIPPED, DELIVERED) as the partition key. Most writes go to PENDING. What problem will occur?"
    explanation: "A low-cardinality, skewed partition key concentrates traffic on few partitions, creating a hot partition that throttles even if total provisioned capacity is high. A good partition key has high cardinality and spreads requests evenly."
    theoryUrl: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/bp-partition-key-design.html
    options:
      - {
          text: "A hot partition with throttling, since few key values take most traffic",
          correct: true,
        }
      - {
          text: "Strongly consistent reads become unavailable on tables whose partition key has few distinct values",
          correct: false,
        }
      - { text: "The table cannot have a sort key", correct: false }
      - { text: "Items larger than 400 KB are rejected", correct: false }
  - type: single
    prompt: "A social app stores likes per post with PK = `POST#<id>`. A viral post receives 50,000 writes per second to its single counter item. What is the standard technique?"
    explanation: "Write sharding spreads one hot key over several keys, for example `POST#<id>#<random 0-N>`, and readers sum the shards (or an aggregate is built from a stream). Increasing the provisioned capacity cannot exceed per-partition limits."
    theoryUrl: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/bp-partition-key-sharding.html
    options:
      - {
          text: "Raise the table's provisioned write capacity until the throttling stops, since a single partition scales with it",
          correct: false,
        }
      - { text: "Switch the table to eventually consistent writes", correct: false }
      - {
          text: "Write sharding: spread the counter over suffixed keys and aggregate on read",
          correct: true,
        }
      - { text: "Move the counter into a Local Secondary Index", correct: false }
  - type: single
    prompt: "You need to look up orders by `order_id` (the table's PK) and also list all orders by `status` and `created_at` across all customers. What do you add?"
    explanation: "A Global Secondary Index with `status` as partition key and `created_at` as sort key supports the second access pattern on a different key. Note that low-cardinality GSI keys can be hot, so sharding the status key may be needed. A Scan, or LSI (which must share the table's partition key), does not fit."
    theoryUrl: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/GSI.html
    options:
      - { text: "A Local Secondary Index with a different partition key", correct: false }
      - { text: "Periodic Scans stored in a cache", correct: false }
      - { text: "A Global Secondary Index keyed by status and created_at", correct: true }
      - {
          text: "A second item per order containing every attribute as a string set",
          correct: false,
        }
  - type: single
    prompt: "Which statement about DynamoDB Local Secondary Indexes (LSI) is correct?"
    explanation: "An LSI shares the table's partition key and offers an alternate sort key, must be created with the table, and limits the item collection size to 10 GB per partition key value. A GSI can use a different partition key and be added later."
    theoryUrl: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/LSI.html
    options:
      - {
          text: "It can use a different partition key from the table and be added at any time",
          correct: false,
        }
      - { text: "It has no size limits because it is stored separately", correct: false }
      - {
          text: "It must be created with the table and shares the table's partition key",
          correct: true,
        }
      - { text: "It is eventually consistent only", correct: false }
  - type: single
    prompt: "A wallet app on DynamoDB debits one account item and credits another. Money must never be created or lost, even if the client crashes between the two writes. What do you rely on?"
    explanation: "A multi-item transaction commits both writes or neither, and a condition check on the balance rejects an overdraft inside the same transaction. Two conditional updates are each atomic on their own item, but a crash between them leaves the transfer half done. Batching groups requests for efficiency without making them all-or-nothing."
    theoryUrl: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/transactions.html
    options:
      - {
          text: "Two sequential conditional updates, since each is atomic on its own item and so the pair is atomic as well",
          correct: false,
        }
      - {
          text: "A multi-item transaction with a condition check on the debited balance",
          correct: true,
        }
      - {
          text: "A batch write, which sends both writes in one request and therefore applies them all-or-nothing",
          correct: false,
        }
      - { text: "Strongly consistent reads of both items before the two writes", correct: false }
  - type: single
    prompt: "Two clients read the same DynamoDB item (version 7), modify it and write it back. The second write overwrites the first's changes. What prevents this lost update?"
    explanation: "Optimistic locking with a conditional write: store a version attribute and write with `ConditionExpression: version = :expected`, so the stale writer fails and retries. Strongly consistent reads alone do not prevent the lost update."
    theoryUrl: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/DynamoDBMapper.OptimisticLocking.html
    options:
      - {
          text: "Use strongly consistent reads before every write, so the second client always sees version 8",
          correct: false,
        }
      - { text: "Enable TTL on the item", correct: false }
      - {
          text: "Add a version attribute and a conditional write expecting the version read",
          correct: true,
        }
      - { text: "Use a larger provisioned write capacity", correct: false }
  - type: single
    prompt: "Your DynamoDB data is read mostly by one access pattern, but a new report must run a query that filters on an attribute that is not a key. Which choice is the most sensible at 2 billion items?"
    explanation: "With 2 billion items a Scan with a filter reads (and bills for) everything, so it is only acceptable for rare offline jobs. A GSI on the attribute, or exporting to an analytics store such as S3 with Athena, serves the query properly."
    theoryUrl: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/bp-query-scan.html
    options:
      - {
          text: "Run a Scan with a filter expression every time the report is requested, since filters are applied before reading",
          correct: false,
        }
      - {
          text: "Add a GSI on the attribute, or export to S3 and query with Athena for reporting",
          correct: true,
        }
      - { text: "Increase the page size of the Scan to 1 MB", correct: false }
      - { text: "Change the partition key to the attribute and keep all queries", correct: false }
  - type: single
    prompt: "A product catalogue has varied attributes per product type (books, laptops, clothes), is read by product id, and is occasionally searched by category and price. Which store is the best starting point?"
    explanation: "A document database (MongoDB, DynamoDB documents, Firestore) fits heterogeneous product attributes and read-by-id, with secondary indexes for category and price. A graph store is not needed, and a strict relational schema would need many nullable columns or EAV tables."
    theoryUrl: https://www.mongodb.com/docs/manual/core/data-modeling-introduction/
    options:
      - { text: "A graph database, because products are connected", correct: false }
      - { text: "A wide-column store with a single column family and one row", correct: false }
      - { text: "A document database with secondary indexes", correct: true }
      - { text: "A key-value store with no secondary indexes", correct: false }
  - type: single
    prompt: "You need to store user sessions looked up by session token only, with expiry after 30 minutes and very high throughput. Which choice fits best?"
    explanation: "A key-value store such as Redis or DynamoDB (with TTL) matches a single-key lookup with expiry. A graph or relational store adds capabilities you do not use, and wide-column stores target large write-heavy time series and analytics."
    theoryUrl: https://redis.io/docs/latest/develop/use/keyspace/
    options:
      - { text: "A graph database", correct: false }
      - { text: "A relational database with joins to a users table", correct: false }
      - { text: "A key-value store with TTL", correct: true }
      - { text: "A search engine with full-text indexing", correct: false }
  - type: single
    prompt: "A telemetry platform ingests 2 million sensor readings per second, queried mostly by (device, time range), rarely updated, with retention of 90 days. Which model fits best?"
    explanation: "Wide-column stores (Cassandra, ScyllaDB, Bigtable) are built for high write throughput with partitioning by device and clustering by time, which gives efficient range reads. Document stores can work but are not optimised for this append-heavy pattern, and graphs fit relationships."
    theoryUrl: https://cassandra.apache.org/doc/latest/cassandra/developing/data-modeling/intro.html
    options:
      - { text: "A wide-column store partitioned by device and clustered by time", correct: true }
      - { text: "A graph database with a node for every reading", correct: false }
      - { text: "A single relational table with an index on every column", correct: false }
      - { text: "A key-value store with one key per reading and a Scan for ranges", correct: false }
  - type: single
    prompt: "A fraud team needs to find accounts that share devices, phone numbers or addresses up to 4 hops apart, in real time. Which store is the best fit?"
    explanation: "Multi-hop relationship traversal is the strength of graph databases, where traversing edges is a native operation. In relational or document stores, multi-level self-joins grow expensive quickly with depth."
    theoryUrl: https://neo4j.com/docs/getting-started/get-started-with-neo4j/graph-database/
    options:
      - {
          text: "A key-value store, with one key per account listing its neighbours",
          correct: false,
        }
      - { text: "A graph database", correct: true }
      - { text: "A wide-column store keyed by device", correct: false }
      - { text: "A relational table with four self-joins on every query", correct: false }
  - type: single
    prompt: "In a document database, an order has up to 5 line items that are always read with the order. Where do you put the line items?"
    explanation: "Embed small, bounded child data that is read and written together with the parent, so one read returns the whole order. Reference instead when the children are unbounded, shared or independently queried and updated."
    theoryUrl: https://www.mongodb.com/docs/manual/data-modeling/concepts/embedding-vs-references/
    options:
      - { text: "Embedded in the order document", correct: true }
      - {
          text: "In a separate collection with one document per line item, fetched by a second query",
          correct: false,
        }
      - { text: "In a separate database for isolation", correct: false }
      - { text: "As separate top-level documents linked by random ids", correct: false }
  - type: single
    prompt: "In a document database, a blog post has comments that can grow to hundreds of thousands per post. How should comments be modelled?"
    explanation: "Unbounded arrays inside one document cause growth beyond size limits (16 MB in MongoDB), larger rewrites and contention. Store comments as separate documents referencing the post, and paginate."
    theoryUrl: https://www.mongodb.com/docs/manual/data-modeling/concepts/embedding-vs-references/
    options:
      - { text: "Embed all comments in the post document", correct: false }
      - {
          text: "Store comments as separate documents that reference the post, and paginate",
          correct: true,
        }
      - {
          text: "Store them as one large comma separated string field inside the post document, to keep one read per post",
          correct: false,
        }
      - { text: "Duplicate the post in every comment document", correct: false }
  - type: single
    prompt: "During a flash sale, one product item in DynamoDB is read about 100,000 times per second and throttles, while writes to it are rare. What is the most fitting fix?"
    explanation: "The bottleneck is reads on one key, and the data barely changes, so an in-memory cache in front of the table absorbs them. Strongly consistent reads cost twice the read capacity and do nothing to relieve a hot key. More table capacity does not lift the per-partition limit, and splitting attributes under the same partition key keeps the traffic on the same partition."
    theoryUrl: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/DAX.html
    options:
      - {
          text: "Switch to strongly consistent reads, which are served by every replica at once and so spread the load",
          correct: false,
        }
      - { text: "Serve the hot item from an in-memory cache in front of the table", correct: true }
      - {
          text: "Raise the table's read capacity, since one item can use all of the capacity the table has",
          correct: false,
        }
      - {
          text: "Split the item's attributes into several items under the same partition key",
          correct: false,
        }
  - type: boolean
    prompt: "True or false: DynamoDB single-table design means you should never create a second table in the same application."
    explanation: "False. Single-table is a technique for co-locating items that are accessed together, not a rule. Separate tables are reasonable for unrelated domains, different lifecycles, or different capacity and backup needs. Misapplying it can make the design rigid and hard to evolve."
    theoryUrl: https://aws.amazon.com/blogs/database/single-table-vs-multi-table-design-in-amazon-dynamodb/
    answer: false
  - type: single
    prompt: "A year after launching a single-table DynamoDB design, product asks for 'all orders above 500 euros in a region, newest first'. No existing key or index serves it. What does supporting it typically involve?"
    explanation: "Single-table designs are tuned to the access patterns known up front, so a new pattern usually means a new GSI (or an overloaded one) plus a backfill that writes the new key attributes onto existing items. That is the flexibility cost of the approach. DynamoDB has no in-place key change and no efficient query on non-key attributes, and the design does not forbid new patterns."
    theoryUrl: https://aws.amazon.com/blogs/database/single-table-vs-multi-table-design-in-amazon-dynamodb/
    options:
      - {
          text: "Nothing: DynamoDB queries any attribute as efficiently as the keys once the table is single-table",
          correct: false,
        }
      - {
          text: "Changing the table's partition key in place, after which every old query keeps working as before",
          correct: false,
        }
      - {
          text: "Adding an index for the pattern and backfilling its keys on old items",
          correct: true,
        }
      - {
          text: "Migrating to another database, since a design cannot gain new patterns",
          correct: false,
        }
  - type: single
    prompt: "An ad-hoc analytics team wants flexible queries (group by arbitrary dimensions) over the same orders data stored in DynamoDB. What is the recommended architecture?"
    explanation: "Operational NoSQL stores are optimised for known access patterns. For flexible analytics, stream or export the data to an analytical store (S3 plus Athena, Redshift or similar) instead of adding ever more indexes. Scans on the production table compete with live traffic."
    theoryUrl: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/S3DataExport.HowItWorks.html
    options:
      - { text: "Give the analysts permission to Scan the production table", correct: false }
      - { text: "Create a GSI for every possible dimension", correct: false }
      - {
          text: "Switch the table to strongly consistent reads for all queries so analytical results are always exact and complete",
          correct: false,
        }
      - {
          text: "Export or stream the data to an analytics store and query it there",
          correct: true,
        }
  - type: single
    prompt: "A new feature needs to query a DynamoDB table by `email`. The existing items hold the email in an attribute, but not in a key. Which design is correct for a uniqueness lookup?"
    explanation: "A GSI keyed by email supports lookup, but GSIs do not enforce uniqueness. To guarantee unique emails use a transaction that writes a separate item with PK `EMAIL#<email>` with `attribute_not_exists`. A GSI alone would allow duplicates."
    theoryUrl: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/transaction-apis.html
    options:
      - {
          text: "A GSI on email, which also enforces uniqueness because a GSI key must be unique per item across the table",
          correct: false,
        }
      - {
          text: "A uniqueness item with PK `EMAIL#<email>` in a transaction with a not-exists condition",
          correct: true,
        }
      - { text: "A Scan before every insert to check for duplicates", correct: false }
      - { text: "A Local Secondary Index on email", correct: false }
  - type: single
    prompt: "Activity feeds are stored with PK = `USER#<id>` and SK = `ACTIVITY#<timestamp>`. A few power users write constantly, their partitions grow without bound and throttle, and the app only shows recent activity. How do you reshape the key?"
    explanation: "Adding a time bucket to the partition key (for example `USER#<id>#2025-03`) spreads one user's writes and data over many partitions, and the feed reads the newest bucket first, then older ones as needed. A random suffix also spreads writes but forces every feed read to query all shards and merge them. Capacity mode does not remove per-partition limits, and one growing list attribute runs into item size limits."
    theoryUrl: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/bp-time-series.html
    options:
      - {
          text: "Add a time bucket to the partition key and read the newest bucket first",
          correct: true,
        }
      - {
          text: "Add a random suffix to the partition key and query every suffix, merging the results, on each feed read",
          correct: false,
        }
      - {
          text: "Switch to on-demand capacity, which removes the throughput limits of a single partition",
          correct: false,
        }
      - {
          text: "Store all activity as one growing list attribute on the user item",
          correct: false,
        }
  - type: single
    prompt: "You must pick a database for a product with strict relational integrity, ad-hoc reporting joins and moderate scale (500 writes/sec). A teammate suggests DynamoDB 'because it scales'. What is the best advice?"
    explanation: "At moderate scale with relational integrity and ad-hoc joins, a relational database such as PostgreSQL is the better fit. DynamoDB's scalability is valuable when access patterns are known and scale demands it, but it makes flexible querying and integrity harder."
    theoryUrl: https://aws.amazon.com/nosql/
    options:
      - {
          text: "DynamoDB, because relational databases cannot handle 500 writes per second on a single node",
          correct: false,
        }
      - {
          text: "PostgreSQL: the workload needs joins and integrity and is well within its range",
          correct: true,
        }
      - { text: "A graph database, since integrity implies relationships", correct: false }
      - { text: "Both in an active-active setup to avoid choosing", correct: false }
  - type: multi
    prompt: "Which are good partition key properties in DynamoDB? Select all that apply."
    explanation: "A good partition key has high cardinality, spreads requests uniformly, and matches the access pattern so most queries address a single key. A timestamp as a pure partition key concentrates current writes on one partition."
    theoryUrl: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/bp-partition-key-design.html
    options:
      - { text: "High cardinality, with many distinct values", correct: true }
      - { text: "Requests spread uniformly across the key values", correct: true }
      - { text: "It is used in the most common queries so they target one key", correct: true }
      - { text: "It is the current date, so recent data is in one place", correct: false }
  - type: single
    prompt: "On Cassandra, a store needs 'orders of a customer, newest first' and 'orders containing a given product'. A developer designs one normalised `orders` table partitioned by order id. What is the idiomatic model?"
    explanation: "Wide-column stores are modelled query-first: one table per query, each partitioned by that query's lookup key and clustered by its sort order, with each order written to both tables. There are no joins, and filtering across all partitions turns every read into a cluster-wide scan. A single partition for everything creates one hot, unbounded partition."
    theoryUrl: https://cassandra.apache.org/doc/latest/cassandra/developing/data-modeling/intro.html
    options:
      - {
          text: "Keep the one table and filter by customer or product at query time across all partitions",
          correct: false,
        }
      - {
          text: "One table per query, each keyed by its lookup value, with every order written to both",
          correct: true,
        }
      - {
          text: "Join an orders table to customer and product tables at query time, as in a relational schema",
          correct: false,
        }
      - {
          text: "Store every order in a single partition so both queries are served by one node",
          correct: false,
        }
