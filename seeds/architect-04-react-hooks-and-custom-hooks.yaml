version: 1
title: "Architect Roadmap 04: Advanced hooks and custom hooks"
description: useRef, useMemo, useCallback, useReducer, useContext, the rules of hooks and designing custom hooks.
language: en
tags: [architect-roadmap, react, hooks, custom-hooks, useref, usereducer, context]
run:
  questionsPerRun: 10
  maxErrors: 3
  timePerQuestionSec: 60
questions:
  - type: single
    prompt: "The button is clicked twice. What does the console show?"
    code: |
      function C() {
        const ref = useRef(0)
        console.log('render', ref.current)

        return <button onClick={() => { ref.current++ }}>+</button>
      }
    codeLanguage: tsx
    explanation: "Changing `ref.current` does not schedule a render, since refs are not state. The component rendered once on mount, so the only log is `render 0`, even though the ref holds 2 afterwards. Use state when a changed value must update the UI."
    theoryUrl: https://react.dev/reference/react/useRef#caveats
    options:
      - { text: "`render 0`, `render 1`, `render 2`", correct: false }
      - { text: "`render 0`, `render 2`", correct: false }
      - { text: "`render 0`", correct: true }
      - { text: "`render 0`, `render 0`, `render 0`", correct: false }
  - type: multi
    prompt: Which of these are appropriate uses of `useRef`? Select all that apply.
    explanation: "Refs are for values that must survive renders without driving the UI: the id of a timer, or a handle to a DOM node for focus and measurement. The visible counter must be state, and a derived value should be computed in render. Neither belongs in a ref."
    theoryUrl: https://react.dev/learn/referencing-values-with-refs#when-to-use-refs
    options:
      - { text: "Holding the id returned by `setTimeout`, to clear it later", correct: true }
      - { text: "Calling `inputRef.current.focus()` after a click", correct: true }
      - { text: "Storing a counter that is displayed in the JSX", correct: false }
      - { text: "Caching a value computed from props, so you can skip `useMemo`", correct: false }
  - type: single
    prompt: Why does the React documentation advise against reading or writing `ref.current` during rendering?
    explanation: "Render must be pure, and a mutable ref read in render makes the output depend on something React does not track. In concurrent or double-invoked renders (StrictMode) the value may differ between passes. Read and write refs in event handlers and effects instead."
    theoryUrl: https://react.dev/reference/react/useRef#caveats
    options:
      - {
          text: "`ref.current` is `null` until the first effect, so reading it during render always throws",
          correct: false,
        }
      - { text: "Refs are frozen objects, so writes are silently ignored", correct: false }
      - {
          text: "Refs can only be read inside the same component that created them",
          correct: false,
        }
      - {
          text: "It breaks render purity: the output would depend on a value React does not track",
          correct: true,
        }
  - type: single
    prompt: "In React 19, how can a function component receive a `ref` from its parent and attach it to an inner `<input>`?"
    code: |
      function TextInput({ ref }: { ref?: React.Ref<HTMLInputElement> }) {
        return <input ref={ref} />
      }
    codeLanguage: tsx
    explanation: "Since React 19, function components receive `ref` as a regular prop, so you can pass it to the inner element directly. `forwardRef` is no longer needed for new code and will be deprecated in a future release."
    theoryUrl: https://react.dev/blog/2024/12/05/react-19#ref-as-a-prop
    options:
      - {
          text: "Only by wrapping the component in `forwardRef`, as in every React version",
          correct: false,
        }
      - { text: "As a normal prop named `ref`, as shown in the snippet", correct: true }
      - { text: "Through `useImperativeHandle`, which is mandatory for any ref", correct: false }
      - { text: "It is impossible; refs only work on DOM elements, not components", correct: false }
  - type: single
    prompt: "Which statement about `useMemo` is correct?"
    explanation: "`useMemo` is a performance hint: it caches the result for the same dependencies, but React may discard the cache (for example when memory is tight or for offscreen content). Your code must still be correct if the calculation runs again."
    theoryUrl: https://react.dev/reference/react/useMemo#caveats
    options:
      - { text: "It guarantees the callback runs once per dependency value", correct: false }
      - {
          text: "It makes the component skip a re-render when its dependencies are unchanged",
          correct: false,
        }
      - {
          text: "It is a cache hint: React may recompute, so correctness must not depend on it",
          correct: true,
        }
      - { text: "It runs the callback asynchronously, after the render commits", correct: false }
  - type: single
    prompt: 'A component filters a list of 20 items with a trivial predicate. A teammate wraps it in `useMemo` "for performance". What is the most accurate view?'
    explanation: "Memoisation has its own cost, comparing dependencies and holding the cache, and for a cheap computation it is a net loss. Measure first: the docs suggest `console.time` with throttled CPU, and memoise when the calculation takes noticeable time, for example 1ms or more."
    theoryUrl: https://react.dev/reference/react/useMemo#how-to-tell-if-a-calculation-is-expensive
    options:
      - { text: "It is a good habit, since `useMemo` is free and always helps", correct: false }
      - { text: "It is required for the list to keep its keys stable", correct: false }
      - { text: "It is mostly overhead here; measure before adding it", correct: true }
      - { text: "It is wrong because `useMemo` cannot be used with arrays", correct: false }
  - type: single
    prompt: "`Search` memoises the filtered results, but the profiler shows the calculation still runs on every parent render. What is the likely cause?"
    code: |
      function Search({ items, query }: Props) {
        const results = useMemo(
          () => items.filter((i) => i.name.includes(query)),
          [items, query]
        )
        return <List rows={results} />
      }
      // parent: <Search items={data.filter(Boolean)} query={q} />
    codeLanguage: tsx
    explanation: "`data.filter(Boolean)` creates a new array on every parent render, so `items` changes by reference every time and the memo is invalidated. Memoise the array in the parent, or pass stable data. The dependency comparison is `Object.is`, not deep equality."
    theoryUrl: https://react.dev/reference/react/useMemo#memoizing-a-dependency-of-another-hook
    options:
      - {
          text: "`useMemo` is ignored in components that receive an array prop, since React cannot compare arrays",
          correct: false,
        }
      - { text: "`query` is a string, and strings are always treated as changed", correct: false }
      - {
          text: "The parent passes a new `items` array every render, so the dependency changes",
          correct: true,
        }
      - { text: "The callback closes over `items`, which disables caching", correct: false }
  - type: single
    prompt: "What does `useCallback(fn, deps)` actually do?"
    explanation: "It returns the same function instance between renders while `deps` are unchanged. It does not stop the inline function from being created on each render, and it does not make the function run faster. It pays off when that identity matters, for example as a prop of a `memo` component or as an effect dependency."
    theoryUrl: https://react.dev/reference/react/useCallback
    options:
      - { text: "It caches the return value of `fn`, like `useMemo`", correct: false }
      - {
          text: "It returns the same function identity while the dependencies are unchanged",
          correct: true,
        }
      - {
          text: "It prevents the function from being created again on every render",
          correct: false,
        }
      - { text: "It runs `fn` once, and ignores later calls", correct: false }
  - type: single
    prompt: "`onSave` is wrapped in `useCallback` and passed to a child that is NOT wrapped in `memo`. What is the performance effect?"
    explanation: "A child without `memo` re-renders whenever its parent does, regardless of prop identity. The `useCallback` has no benefit here, only the cost of a dependency comparison. It becomes useful if the child is wrapped in `memo` or the function is an effect dependency."
    theoryUrl: https://react.dev/reference/react/useCallback#skipping-re-rendering-of-components
    options:
      - { text: "The child no longer re-renders when the parent does", correct: false }
      - { text: "The child re-renders only when `onSave` is actually called", correct: false }
      - { text: "None: the child re-renders anyway, since it is not memoised", correct: true }
      - {
          text: "It is slower than an inline function, so it should be removed everywhere",
          correct: false,
        }
  - type: single
    prompt: "The button is clicked twice. What does the component display after the second click?"
    code: |
      function C() {
        const [count, setCount] = useState(0)
        const inc = useCallback(() => setCount(count + 1), [])

        return <button onClick={() => { inc() }}>{count}</button>
      }
    codeLanguage: tsx
    explanation: "With an empty dependency array, `inc` keeps the closure of the first render, where `count` is 0. Every click calls `setCount(1)`, so the display is 1 after one or any number of clicks. Fix with `setCount(c => c + 1)`, or add `count` to the dependencies."
    theoryUrl: https://react.dev/reference/react/useCallback#updating-state-from-a-memoized-callback
    options:
      - { text: "2", correct: false }
      - { text: "0", correct: false }
      - { text: "1", correct: true }
      - { text: "NaN", correct: false }
  - type: single
    prompt: "A checkout form has `items`, `coupon`, `shipping`, and `status` state, and several transitions (add item, apply coupon, change shipping, submit, fail) that touch more than one field each. What is the best state tool?"
    explanation: "When multiple pieces of state change together and updates follow named transitions, `useReducer` centralises the logic in a pure function, makes it testable, and keeps handlers short. Many `useState` calls would scatter and duplicate the coordination."
    theoryUrl: https://react.dev/learn/extracting-state-logic-into-a-reducer
    options:
      - { text: "`useRef` for each field, to avoid re-renders", correct: false }
      - { text: "`useReducer`, with action types for each transition", correct: true }
      - { text: "A single `useState` holding a string that encodes everything", correct: false }
      - { text: "`useMemo` to combine the fields into one object", correct: false }
  - type: single
    prompt: 'In development with StrictMode, the user clicks "Add" once. What does the list length show with this reducer?'
    code: |
      function reducer(state: { items: number[] }, action: { type: 'add' }) {
        state.items.push(1)
        return { items: state.items }
      }

      function C() {
        const [state, dispatch] = useReducer(reducer, { items: [] })
        return <button onClick={() => dispatch({ type: 'add' })}>{state.items.length}</button>
      }
    codeLanguage: tsx
    explanation: "StrictMode calls reducers twice to expose impure code. This reducer mutates the existing array, so the second call pushes again: the length becomes 2 in development, but 1 in production, a bug that depends on the environment. Reducers must be pure and return new arrays."
    theoryUrl: https://react.dev/reference/react/useReducer#my-reducer-or-initializer-function-runs-twice
    options:
      - { text: "1, since there is a single dispatch", correct: false }
      - { text: "2, because the impure reducer runs twice on the same array", correct: true }
      - { text: "0, because React discards mutated state", correct: false }
      - { text: "It throws, as StrictMode forbids calling `push` in a reducer", correct: false }
  - type: single
    prompt: "What does the component render and how many renders happen after one click?"
    code: |
      function reducer(state: number, action: 'inc') {
        return state + 1
      }

      function C() {
        const [count, dispatch] = useReducer(reducer, 0)
        console.log('render', count)
        return <button onClick={() => { dispatch('inc'); dispatch('inc') }}>+</button>
      }
    codeLanguage: tsx
    explanation: "Both dispatches are queued and processed in one batch by the reducer, so the second one sees the result of the first. The click causes a single render with count 2: the logs are `render 0` then `render 2`."
    theoryUrl: https://react.dev/reference/react/useReducer#dispatch
    options:
      - { text: "`render 0`, `render 1`, `render 2`", correct: false }
      - { text: "`render 0`, `render 1`", correct: false }
      - { text: "`render 0`, `render 2`", correct: true }
      - { text: "`render 0` only, because `dispatch` is asynchronous", correct: false }
  - type: single
    prompt: "What do the three `Show` components log?"
    code: |
      const Ctx = createContext('default')

      function Show() {
        console.log(useContext(Ctx))
        return null
      }

      <>
        <Show />
        <Ctx.Provider value={undefined as any}><Show /></Ctx.Provider>
        <Ctx value="x"><Show /></Ctx>
      </>
    codeLanguage: tsx
    explanation: "The default value is used only when there is no provider above the component. A provider whose value is `undefined` does supply `undefined`, it does not fall back to the default. In React 19, `<Ctx value>` works as a provider, so the last one logs `x`."
    theoryUrl: https://react.dev/reference/react/createContext#createcontext
    options:
      - { text: "`default`, `default`, `x`", correct: false }
      - { text: "`default`, `undefined`, `x`", correct: true }
      - { text: "`undefined`, `undefined`, `x`", correct: false }
      - { text: "`default`, `undefined`, `default`", correct: false }
  - type: single
    prompt: "A memoised `Cons` reads a context whose value is a number in state, and a memoised `Other` does not read it. The provider's value changes. What re-renders?"
    explanation: "Context bypasses `memo`: every component that calls `useContext` on that context re-renders when its value changes, even if the parent skips. `Other` takes no props and does not consume the context, so `memo` keeps it from re-rendering."
    theoryUrl: https://react.dev/reference/react/useContext#updating-data-passed-via-context
    options:
      - { text: "Both, because the provider re-rendered", correct: false }
      - { text: "Only `Other`, because `Cons` is protected by `memo`", correct: false }
      - { text: "Neither, because `memo` blocks all updates", correct: false }
      - { text: "Only `Cons`, since consumers re-render despite `memo`", correct: true }
  - type: single
    prompt: "An `AuthProvider` re-renders often because it holds frequently changing state, and every consumer re-renders with it. It passes `value={{ user, login, logout }}`. What is the best improvement?"
    explanation: "An inline object is new on every provider render, so all consumers update even if `user` did not change. Memoise the value with `useMemo` (and stabilise the functions), and split rarely changing data from frequently changing data into separate contexts."
    theoryUrl: https://react.dev/reference/react/useContext#optimizing-re-renders-when-passing-objects-and-functions
    options:
      - {
          text: "Memoise the value object and split slow-changing data from fast-changing data",
          correct: true,
        }
      - {
          text: "Wrap every consumer in `memo`; consumers then ignore context changes",
          correct: false,
        }
      - { text: "Replace the object with a global variable read in render", correct: false }
      - { text: "Move the provider below the consumers so they stop updating", correct: false }
  - type: single
    prompt: "In React 19, what can `use(Context)` do that `useContext(Context)` cannot?"
    explanation: "`use` is not bound by the rules of hooks for conditions and loops: it may be called conditionally, or after an early return. It reads the same context value. It is not faster, and it does not work around Provider boundaries."
    theoryUrl: https://react.dev/reference/react/use#reading-context-with-use
    options:
      - {
          text: "Skip the provider lookup, and read only the context's default value, which makes it cheaper",
          correct: false,
        }
      - {
          text: "Be called conditionally, such as after an early `return` or inside an `if`",
          correct: true,
        }
      - { text: "Subscribe to context changes without re-rendering the component", correct: false }
      - { text: "Read the default value even when a provider exists above", correct: false }
  - type: multi
    prompt: Which of these violate the rules of hooks? Select all that apply.
    explanation: "Hooks must be called at the top level, in the same order on every render, and only from components or custom hooks. A hook inside an `if`, a loop, or an event handler breaks the order or the context. Calling a hook at the top of a custom hook is fine."
    theoryUrl: https://react.dev/reference/rules/rules-of-hooks
    options:
      - { text: "Calling `useState` inside an `if (isOpen)` block", correct: true }
      - {
          text: "Calling `useEffect` at the top level of a custom hook named `useOnline`",
          correct: false,
        }
      - { text: "Calling `useContext` inside an `onClick` handler", correct: true }
      - { text: "Calling `useRef` inside a `for` loop to create several refs", correct: true }
  - type: single
    prompt: "Why does React require hooks to be called in the same order on every render?"
    explanation: "Hooks are stored in a list on the component's fiber, and React matches each call to its slot by position, not by name. A conditional hook shifts the calls that follow, so they read another hook's state. That is why the rules forbid conditions and loops."
    theoryUrl: https://react.dev/reference/rules/rules-of-hooks#only-call-hooks-at-the-top-level
    options:
      - {
          text: "Because hook names are hashed at build time and compared at runtime",
          correct: false,
        }
      - {
          text: "Because React identifies each hook by its call position, not by a name",
          correct: true,
        }
      - {
          text: "Because hooks run in parallel, and order is the only synchronisation",
          correct: false,
        }
      - {
          text: "Because the linter rewrites the code and needs a predictable order",
          correct: false,
        }
  - type: single
    prompt: "A component returns early before a hook and `show` goes from `false` to `true`. What happens?"
    code: |
      function C({ show }: { show: boolean }) {
        if (!show) return null
        const [n] = useState(0)
        return <span>{n}</span>
      }
    codeLanguage: tsx
    explanation: "On the first render no hook ran, on the next one a hook runs, so the number of hooks differs between renders and React throws an error about rendering more hooks than during the previous render. Move all hooks above the early return."
    theoryUrl: https://react.dev/reference/rules/rules-of-hooks#only-call-hooks-at-the-top-level
    options:
      - { text: "React creates the state lazily, and renders `0`", correct: false }
      - {
          text: "It renders `null` forever, since the first render decides the shape of the hook list",
          correct: false,
        }
      - {
          text: "React throws an error, because the hook count changed between renders",
          correct: true,
        }
      - { text: "React silently ignores the hook and renders an empty span", correct: false }
  - type: boolean
    prompt: "If two components both call the same custom hook `useCounter()`, they share one counter value."
    answer: false
    explanation: "A custom hook shares logic, not state. Each call to the hook creates its own state, so every component gets an independent counter. To share state, lift it up or use context."
    theoryUrl: https://react.dev/learn/reusing-logic-with-custom-hooks#custom-hooks-let-you-share-stateful-logic-not-state-itself
  - type: single
    prompt: "Why must a custom hook's name start with `use`?"
    explanation: "The `use` prefix is the convention that lets the linter and the tooling know that the function may call hooks, so it can check the rules of hooks inside it and at its call sites. React runtime does not check the name."
    theoryUrl: https://react.dev/learn/reusing-logic-with-custom-hooks#hook-names-always-start-with-use
    options:
      - {
          text: "The React runtime refuses to run hooks inside functions without the prefix, throwing at call time",
          correct: false,
        }
      - { text: "It registers the function as a hook in a global table", correct: false }
      - {
          text: "The linter relies on it to know the rules of hooks apply to that function",
          correct: true,
        }
      - { text: "It makes the function memoised automatically", correct: false }
  - type: single
    prompt: "You write `useLocalStorage(key, initial)` for a Next.js app and initialise state with `localStorage.getItem(key) ?? initial` during render. The page throws on the server or shows a hydration mismatch. What is the right design?"
    explanation: "Render must be identical on the server and in the first client render, and `localStorage` exists only in the browser. Render with `initial` first, and read storage in an effect after hydration, or use `useSyncExternalStore` with a server snapshot. Reading it in render causes the crash or mismatch."
    theoryUrl: https://react.dev/reference/react/useSyncExternalStore#adding-support-for-server-rendering
    options:
      - {
          text: "Wrap the read in `try/catch` and return `undefined` on the server",
          correct: false,
        }
      - {
          text: "Use `useSyncExternalStore` with a server snapshot, or read storage in an effect",
          correct: true,
        }
      - {
          text: "Mark the component `'use client'`, which skips server rendering entirely",
          correct: false,
        }
      - {
          text: "Read `localStorage` in `useMemo`, since memoised code never runs on the server during render",
          correct: false,
        }
  - type: single
    prompt: "Which implementation of `useDebounce(value, delay)` is correct?"
    explanation: "The effect starts a timer for the latest value and the cleanup clears the previous one, so only a value that stayed stable for `delay` ms is committed. Without the cleanup, every timer fires. Calling `setTimeout` in render would run side effects during render."
    theoryUrl: https://react.dev/learn/reusing-logic-with-custom-hooks
    options:
      - {
          text: "`useEffect(() => { const t = setTimeout(() => setD(value), delay); return () => clearTimeout(t) }, [value, delay])`",
          correct: true,
        }
      - {
          text: "`useEffect(() => { setTimeout(() => setD(value), delay) }, [value, delay])`",
          correct: false,
        }
      - { text: "`useMemo(() => setTimeout(() => setD(value), delay), [value])`", correct: false }
      - { text: "`setTimeout(() => setD(value), delay)` directly in the hook body", correct: false }
  - type: single
    prompt: "A custom hook `useToggle()` returns `[value, toggle]`, and another, `useForm()`, returns `{ values, errors, handleChange, reset }`. What is the usual reasoning for tuple versus object?"
    explanation: "A tuple lets callers name the pieces freely, which suits hooks with two or three values and several uses on a page, like `useState`. An object keeps each field named, which scales better and lets callers pick only what they need, as in a form hook."
    theoryUrl: https://react.dev/learn/reusing-logic-with-custom-hooks
    options:
      - { text: "Objects are slower, so tuples are always preferred", correct: false }
      - {
          text: "React requires hooks that return more than two values to return objects, to keep ordering stable",
          correct: false,
        }
      - { text: "Tuples are required for any hook that uses state", correct: false }
      - {
          text: "Tuples suit a few values callers rename; objects scale better with many named values",
          correct: true,
        }
