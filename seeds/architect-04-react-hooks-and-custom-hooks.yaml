version: 1
title: "Architect Roadmap 04: Advanced hooks and custom hooks"
description: useRef, useMemo, useCallback, useReducer, useContext, the rules of hooks and designing custom hooks.
language: en
tags: [architect-roadmap, react, hooks, custom-hooks, useref, usereducer, context]
run:
  questionsPerRun: 10
  maxErrors: 3
  timePerQuestionSec: 60
questions:
  - type: single
    prompt: What is the key difference between a value stored in `useRef` and a value stored in `useState`?
    explanation: "Both survive re-renders, but only a state update schedules a new render. A ref is a mutable box that React does not watch, so changing `ref.current` leaves the screen as it was. Use state for anything the UI displays, a ref for values the UI does not depend on."
    theoryUrl: https://react.dev/learn/referencing-values-with-refs
    options:
      - {
          text: "Changing a ref's `current` does not trigger a re-render, while a state update does",
          correct: true,
        }
      - {
          text: "A ref is reset to its initial value on every render, while state is kept between renders",
          correct: false,
        }
      - {
          text: "A ref is shared by every instance of the component, while state is private to each instance",
          correct: false,
        }
      - {
          text: "A ref's value is updated synchronously and state is always updated asynchronously, which is the only difference",
          correct: false,
        }
  - type: multi
    prompt: Which of these are appropriate uses of `useRef`? Select all that apply.
    explanation: "Refs fit values that must survive renders without driving the UI: a timer id, or a handle to a DOM node for focus and measurement. A counter shown in the JSX must be state, and a value derived from props or state should simply be computed during render."
    theoryUrl: https://react.dev/learn/referencing-values-with-refs#when-to-use-refs
    options:
      - { text: "Holding the id returned by `setTimeout`, to clear it later", correct: true }
      - { text: "Calling `inputRef.current.focus()` after a click", correct: true }
      - { text: "Storing a counter that is displayed in the JSX", correct: false }
      - {
          text: "Caching a value computed from props so that it never has to be recalculated",
          correct: false,
        }
  - type: single
    prompt: Why does the React documentation advise against reading or writing `ref.current` during rendering?
    explanation: "Render must be a pure calculation of props, state and context. A mutable ref breaks that guarantee, so two renders with the same inputs can differ, and features like StrictMode double-rendering or concurrent rendering become unpredictable. Read and write refs in event handlers and effects."
    theoryUrl: https://react.dev/reference/react/useRef#caveats
    options:
      - {
          text: "Refs are not initialised until after the first render has finished",
          correct: false,
        }
      - {
          text: "It makes rendering impure, so the output no longer depends only on props, state and context",
          correct: true,
        }
      - {
          text: "Reading `ref.current` during render throws an error in development builds",
          correct: false,
        }
      - {
          text: "Any ref access during render forces an extra synchronous re-render of the component",
          correct: false,
        }
  - type: single
    prompt: "In React 19, how does a function component receive a `ref` from its parent so it can attach it to an inner `<input>`?"
    explanation: "In React 19, `ref` is a regular prop for function components, so the component destructures it and forwards it. `forwardRef` is no longer needed for new code. In React 18 and earlier, `ref` was reserved and had to go through `forwardRef`."
    theoryUrl: https://react.dev/reference/react/forwardRef
    options:
      - {
          text: "It must always be wrapped in `forwardRef`, because function components cannot read `ref` at all",
          correct: false,
        }
      - {
          text: "It is passed through the `useImperativeHandle` hook, which is the only supported way to expose a DOM node",
          correct: false,
        }
      - {
          text: "It arrives as an ordinary prop, so the component can pass it straight on to the inner `<input>`",
          correct: true,
        }
      - {
          text: "It is read from a context that React creates for every component that renders a host element",
          correct: false,
        }
  - type: single
    prompt: Which statement about `useMemo` is correct?
    explanation: "`useMemo` caches a calculated value between renders and recomputes it only when a dependency changes. It is a performance hint, not a semantic guarantee: React may discard the cache, so your code must stay correct if the calculation re-runs."
    theoryUrl: https://react.dev/reference/react/useMemo#caveats
    options:
      - {
          text: "It guarantees the callback runs exactly once per component instance, so it is safe for side effects",
          correct: false,
        }
      - {
          text: "It caches the result between renders and is a performance optimisation, not a semantic guarantee",
          correct: true,
        }
      - {
          text: "It prevents the component from re-rendering when its dependencies have not changed",
          correct: false,
        }
      - {
          text: "It runs the calculation asynchronously after render so that it never blocks painting",
          correct: false,
        }
  - type: single
    prompt: 'A component filters a list of 20 items with a trivial predicate. A teammate wraps it in `useMemo` "for performance". What is the most accurate view?'
    explanation: "Memoisation has its own cost: the cache, the dependency comparison and the extra code to read. For a cheap calculation that cost can exceed the saving. Measure first and reach for `useMemo` when the calculation is demonstrably slow or when you need a stable reference."
    theoryUrl: https://react.dev/reference/react/useMemo#should-you-add-usememo-everywhere
    options:
      - {
          text: "It is a best practice, because `useMemo` is free and should wrap every derived value",
          correct: false,
        }
      - {
          text: "It is probably unnecessary: the saving is negligible and the hook adds its own overhead",
          correct: true,
        }
      - {
          text: "It is harmful, because `useMemo` is only allowed for values that cross a component boundary",
          correct: false,
        }
      - {
          text: "It is required, otherwise React will recompute the filter on every keystroke anywhere in the app",
          correct: false,
        }
  - type: single
    prompt: "`Search` memoises its filtered results with `useMemo(..., [options])`, but the profiler shows the filter still runs on every parent render. What is the most likely cause?"
    explanation: "Dependencies are compared with `Object.is`. If the parent builds `options` as a new object or array literal on each render, the reference changes every time and the cache never hits. Stabilise the prop at the source, or depend on the primitive values inside it."
    theoryUrl: https://react.dev/reference/react/useMemo#skipping-re-rendering-of-components
    options:
      - {
          text: "`useMemo` only works inside components that are wrapped in `memo`",
          correct: false,
        }
      - {
          text: "`useMemo` is ignored in development builds, so profiling there is meaningless",
          correct: false,
        }
      - {
          text: "The parent passes a freshly created `options` object each render, so the dependency always looks changed",
          correct: true,
        }
      - {
          text: "The filter function is too fast, and React skips caching results that take under a millisecond",
          correct: false,
        }
  - type: single
    prompt: What does `useCallback(fn, deps)` actually do?
    explanation: "It returns the same function reference between renders as long as the dependencies are unchanged, which is equivalent to `useMemo(() => fn, deps)`. It does not make the function faster or stop it from being created; the benefit exists only where a stable reference matters."
    theoryUrl: https://react.dev/reference/react/useCallback
    options:
      - {
          text: "It caches the function's return value so that repeated calls with the same arguments are free",
          correct: false,
        }
      - {
          text: "It returns the same function reference across renders until one of its dependencies changes",
          correct: true,
        }
      - {
          text: "It delays running the function until the browser is idle, which reduces work during render",
          correct: false,
        }
      - {
          text: "It stops the function from being re-created at all, so no allocation happens during render",
          correct: false,
        }
  - type: single
    prompt: "`onSave` is wrapped in `useCallback` and passed to a child that is NOT wrapped in `memo`. What is the performance effect?"
    explanation: "A child that is not memoised re-renders whenever its parent does, regardless of whether its props changed. The stable reference is never consulted, so `useCallback` adds cost and no benefit. It pays off when the receiver is `memo`ised or uses the function as an effect dependency."
    theoryUrl: https://react.dev/reference/react/useCallback#skipping-re-rendering-of-components
    options:
      - {
          text: "None: the child re-renders whenever the parent does anyway, so the hook only adds work",
          correct: true,
        }
      - {
          text: "The child skips re-rendering, because React compares function props by reference in every component",
          correct: false,
        }
      - {
          text: "The child re-renders less often, because stable props let React batch its updates together",
          correct: false,
        }
      - {
          text: "The parent skips re-rendering, because `useCallback` marks its own subtree as unchanged",
          correct: false,
        }
  - type: single
    prompt: "A form component is rendered several times on one page and links each `<label htmlFor>` to its input. Which approach gives stable, unique ids that match between server and client rendering?"
    explanation: "`useId` generates an id that is unique per component instance and identical on the server and the client, which avoids hydration mismatches. A counter or `Math.random()` can differ between the two renders. It is meant for accessibility attributes, not for list keys."
    theoryUrl: https://react.dev/reference/react/useId
    options:
      - {
          text: "Call `useId` in the component and derive the input and label ids from the result",
          correct: true,
        }
      - {
          text: "Generate the id with `Math.random()` inside the component body on every render",
          correct: false,
        }
      - {
          text: "Use a module-level counter that increments each time the component renders",
          correct: false,
        }
      - {
          text: "Hard-code the same id in the component and rely on the browser to deduplicate it",
          correct: false,
        }
  - type: single
    prompt: "A checkout form has `items`, `coupon`, `shipping` and `status` state, and several transitions (add item, apply coupon, change shipping, submit, fail) that each touch more than one field. What is the best way to model the state?"
    explanation: "When many events update several related fields, `useReducer` puts every transition in one pure function, so invalid combinations are easier to prevent and the logic is testable without rendering. Separate `useState` calls scatter the rules across handlers."
    theoryUrl: https://react.dev/learn/extracting-state-logic-into-a-reducer
    options:
      - {
          text: "One `useReducer`, where actions describe events and the reducer owns the transitions",
          correct: true,
        }
      - {
          text: "Four independent `useState` calls, updated one after another inside each handler",
          correct: false,
        }
      - {
          text: "A single `useRef` object mutated by the handlers, with a counter state to force re-renders",
          correct: false,
        }
      - {
          text: "A context provider with no reducer, because context is what makes state updates atomic",
          correct: false,
        }
  - type: single
    prompt: "In development with StrictMode, React calls your reducer twice for the same action. What is this meant to expose?"
    explanation: "Reducers, like components and state updater functions, must be pure. Calling them twice and comparing the results surfaces hidden mutations or side effects, such as pushing into the existing array. It only happens in development."
    theoryUrl: https://react.dev/reference/react/StrictMode#fixing-bugs-found-by-double-rendering-in-development
    options:
      - {
          text: "A reducer that is too slow, since the double call doubles the timing so it is easier to measure",
          correct: false,
        }
      - {
          text: "A reducer that mutates state or has side effects, because the second call would see the first call's changes",
          correct: true,
        }
      - {
          text: "A missing `default` case in the `switch`, which only shows up when the same action arrives twice",
          correct: false,
        }
      - {
          text: "An action that is dispatched twice by mistake, which React deliberately repeats to help you find the duplicate",
          correct: false,
        }
  - type: single
    prompt: "A memoised `Cons` reads a context whose value is a number held in state, and a memoised `Other` does not read it. The provider's value changes. What re-renders?"
    explanation: "Context bypasses `memo`: every component that calls `useContext` for that context re-renders when the value changes, even if its props are identical. `Other` does not consume it, so `memo` keeps it out of the update."
    theoryUrl: https://react.dev/reference/react/useContext#updating-data-passed-via-context
    options:
      - {
          text: "Both, because a context change re-renders the whole subtree below the provider",
          correct: false,
        }
      - {
          text: "Neither, because `memo` blocks re-renders caused by anything other than props",
          correct: false,
        }
      - {
          text: "Only `Other`, because consumers of context are skipped when they are memoised",
          correct: false,
        }
      - {
          text: "Only `Cons`, since it is the one that reads the context; `memo` does not shield it from context updates",
          correct: true,
        }
  - type: single
    prompt: "A parent needs to call `focus()` on an input that lives inside a child component, but the child should not expose its whole DOM node. Which hook is designed for exposing a limited imperative API through a ref?"
    explanation: "`useImperativeHandle` lets a component customise what a parent receives through a ref, for example only `focus` and `scrollIntoView`. It is an escape hatch, so most cases are better served by props and state. Reach for it only when the parent truly must trigger an imperative action."
    theoryUrl: https://react.dev/reference/react/useImperativeHandle
    options:
      - {
          text: "`useImperativeHandle`, which defines the limited object the parent receives in `ref.current`",
          correct: true,
        }
      - {
          text: "`useLayoutEffect`, which copies the child DOM node into the parent before the browser paints",
          correct: false,
        }
      - {
          text: "`useSyncExternalStore`, which lets a parent read any value held in a child component",
          correct: false,
        }
      - {
          text: "`useDeferredValue`, which delays the child's ref until the parent has finished rendering",
          correct: false,
        }
  - type: single
    prompt: In React 19, what can `use(Context)` do that `useContext(Context)` cannot?
    explanation: "`use` is not a normal hook: it may be called inside conditions and loops, and after an early return. `useContext` must follow the rules of hooks. Both read the same context value and subscribe the component the same way."
    theoryUrl: https://react.dev/reference/react/use#reading-context-with-use
    options:
      - {
          text: "Read a context from outside any provider by falling back to the default value",
          correct: false,
        }
      - {
          text: "Be called conditionally or in a loop, for example after an early return",
          correct: true,
        }
      - {
          text: "Update the context value from the consumer without a setter in the provider",
          correct: false,
        }
      - {
          text: "Read the context without re-rendering when the value changes, since it is non-reactive",
          correct: false,
        }
  - type: multi
    prompt: Which of these violate the rules of hooks? Select all that apply.
    explanation: "Hooks must be called at the top level of a component or custom hook, on every render, in the same order. Calling them inside a condition or a loop breaks that. A hook inside a regular event handler is also invalid; a hook at the top of a custom hook is fine."
    theoryUrl: https://react.dev/reference/rules/rules-of-hooks
    options:
      - { text: "Calling `useState` inside an `if` block", correct: true }
      - { text: "Calling `useEffect` inside the callback passed to `onClick`", correct: true }
      - { text: "Calling `useRef` at the top of a custom hook named `useTimer`", correct: false }
      - {
          text: "Calling several hooks one after another at the top of a component",
          correct: false,
        }
  - type: single
    prompt: Why does React require hooks to be called in the same order on every render?
    explanation: "Hooks have no names: React stores each component's hook data as an ordered list and matches the nth call to the nth slot. If the order shifts, a call reads another hook's slot and state gets mixed up."
    theoryUrl: https://react.dev/reference/rules/rules-of-hooks#only-call-hooks-at-the-top-level
    options:
      - {
          text: "Because React identifies a hook by its position in the call sequence, not by a name",
          correct: true,
        }
      - {
          text: "Because hooks run on a background thread and must be queued in a fixed order",
          correct: false,
        }
      - {
          text: "Because the compiler hoists hooks to the top of the file and reorders anything that is out of sequence",
          correct: false,
        }
      - {
          text: "Because each hook registers a unique string id from its variable name that must match the previous render",
          correct: false,
        }
  - type: single
    prompt: "A component has `if (!user) return null` before a `useState` call. The first render has no user, and a later render has one. What happens?"
    explanation: 'The first render called fewer hooks than the second, so React''s slot list no longer matches and it throws "Rendered more hooks than during the previous render". Put all hooks before any early return, or split the part that needs the hooks into a child component.'
    theoryUrl: https://react.dev/reference/rules/rules-of-hooks#only-call-hooks-at-the-top-level
    options:
      - {
          text: "React throws an error, because more hooks ran than during the previous render",
          correct: true,
        }
      - {
          text: "The state is created late and works normally, since hooks are initialised lazily on first use",
          correct: false,
        }
      - {
          text: "The new hook silently takes the initial value of the first hook, so no error is shown",
          correct: false,
        }
      - {
          text: "React remounts the component to get a clean hook list, and the user sees only a brief flash",
          correct: false,
        }
  - type: boolean
    prompt: "If two components both call the same custom hook `useCounter()`, they share one counter value."
    explanation: "False. A custom hook shares logic, not state: each call creates its own state inside the calling component. To share one value between components you need to lift the state up, use context or an external store."
    theoryUrl: https://react.dev/learn/reusing-logic-with-custom-hooks#custom-hooks-let-you-share-stateful-logic-not-state-itself
    answer: false
  - type: single
    prompt: Why must a custom hook's name start with `use`?
    explanation: "The prefix is how the linter, and the humans reading the code, know the function calls hooks and must follow the rules of hooks. Without it the lint rules cannot check calls to it. React itself does not look at names at runtime."
    theoryUrl: https://react.dev/learn/reusing-logic-with-custom-hooks#hook-names-always-start-with-use
    options:
      - {
          text: "React inspects function names at runtime and only gives state to those that start with `use`",
          correct: false,
        }
      - {
          text: "It signals that the function calls hooks, so the linter can enforce the rules of hooks on it",
          correct: true,
        }
      - {
          text: "It makes React cache the result of the function between renders, the way `useMemo` does",
          correct: false,
        }
      - {
          text: "It is only a naming habit with no consequence, and tooling treats every function the same way",
          correct: false,
        }
  - type: single
    prompt: 'A shared `formatPrice(amount, locale)` helper calls no hooks. A teammate proposes renaming it `useFormatPrice` "to make it a proper hook". What is the best response?'
    explanation: "A function that calls no hooks should stay a plain function: it can be called anywhere, including conditions and handlers. Calling it `use...` would imply restrictions it does not have and force callers to follow the rules of hooks for no reason."
    theoryUrl: https://react.dev/learn/reusing-logic-with-custom-hooks#should-all-functions-called-during-rendering-start-with-use
    options:
      - {
          text: "Rename it, because every function used while rendering a component should start with `use`",
          correct: false,
        }
      - {
          text: "Rename it, because plain helpers are recomputed on every render and hooks are cached",
          correct: false,
        }
      - {
          text: "Keep it a plain function, since the `use` prefix is for functions that call hooks",
          correct: true,
        }
      - {
          text: "Keep it, but only because the rules of hooks are not enforced for names with a locale argument",
          correct: false,
        }
  - type: single
    prompt: "You write `useLocalStorage(key, initial)` for a Next.js app and initialise state with `localStorage.getItem(key) ?? initial` during render. The page throws on the server or shows a hydration mismatch. What is the sound fix?"
    explanation: "On the server there is no `localStorage`, and the client's first render must match the server's HTML. Start from `initial`, then read storage in an effect (or use `useSyncExternalStore` with a server snapshot) so the stored value arrives after hydration."
    theoryUrl: https://react.dev/reference/react/useSyncExternalStore#adding-support-for-server-rendering
    options:
      - {
          text: "Render the same initial value on server and first client render, then read storage after mount",
          correct: true,
        }
      - {
          text: "Wrap the `localStorage` call in a `try/catch`, which makes the server and client output identical",
          correct: false,
        }
      - {
          text: "Add `suppressHydrationWarning` to the root element so React keeps the client value everywhere",
          correct: false,
        }
      - {
          text: "Read `localStorage` inside `useMemo`, because memoised values are skipped during server rendering",
          correct: false,
        }
  - type: single
    prompt: "A `useDebounce(value, delay)` hook sets a timer inside `useEffect` whenever `value` changes. Why must the effect return a cleanup that clears the timer?"
    explanation: "Without cleanup, every change leaves its timer running, so each stale value is eventually applied and the hook fires once per keystroke, only later. Clearing the previous timer means only the last value within the delay survives. It also prevents a timer firing after unmount."
    theoryUrl: https://react.dev/learn/synchronizing-with-effects#how-to-handle-the-effect-firing-twice-in-development
    options:
      - {
          text: "So the timer is cancelled when the value changes again or on unmount, leaving only the latest value",
          correct: true,
        }
      - {
          text: "Because React refuses to schedule a new effect until the previous one has returned a cleanup function",
          correct: false,
        }
      - {
          text: "Because timers created in effects are cleared automatically only if the delay is shorter than a second",
          correct: false,
        }
      - {
          text: "To release the memory held by the effect closure, which is otherwise never collected after unmount",
          correct: false,
        }
  - type: single
    prompt: "Two components each repeat the same `useState` plus `useEffect` pair that subscribes to the browser online/offline events. What is the strongest reason to extract a custom hook?"
    explanation: "Both components need the same stateful logic, and a custom hook lets them reuse it while each call keeps its own state. A custom hook is a function that calls hooks, so it cannot be shared as a plain helper. It also does not make the components share one value or skip renders."
    theoryUrl: https://react.dev/learn/reusing-logic-with-custom-hooks#when-to-use-custom-hooks
    options:
      - {
          text: "It reuses the state and effect logic in one named place, and each component still gets its own state",
          correct: true,
        }
      - {
          text: "It makes both components share a single online status value, so React renders it only once",
          correct: false,
        }
      - {
          text: "It lets React skip the effect cleanup, because hooks defined outside components are never unmounted",
          correct: false,
        }
      - {
          text: "It is required, because `useEffect` may only be called from functions whose name starts with `use`",
          correct: false,
        }
  - type: single
    prompt: "`useToggle()` returns `[value, toggle]` while `useForm()` returns `{ values, errors, handleChange, reset }`. What is the usual reasoning for tuple versus object?"
    explanation: "A tuple lets the caller name the pieces freely, as with `useState`, which suits small hooks that may be used several times in one component. An object suits many return values, where names carry meaning and callers pick only what they need."
    theoryUrl: https://react.dev/learn/reusing-logic-with-custom-hooks
    options:
      - {
          text: "Tuples are faster for React to compare, so hooks should always return arrays when they can",
          correct: false,
        }
      - {
          text: "Objects cannot be returned from hooks that hold state, so a tuple is the only supported shape",
          correct: false,
        }
      - {
          text: "The shape does not matter, because destructuring always produces the same names for both",
          correct: false,
        }
      - {
          text: "Tuples suit a few values callers rename, while objects suit many values picked by name",
          correct: true,
        }
