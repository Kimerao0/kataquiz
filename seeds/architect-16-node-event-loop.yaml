version: 1
title: "Architect Roadmap 16: Node.js core concepts and the event loop"
description: Non-blocking architecture, libuv, event loop phases, nextTick vs setImmediate vs microtasks, CommonJS vs ESM and module resolution.
language: en
tags: [architect-roadmap, nodejs, event-loop, libuv, modules]
run:
  questionsPerRun: 10
  maxErrors: 3
  timePerQuestionSec: 90
questions:
  - type: single
    prompt: Node.js runs your JavaScript on a single thread, yet one process can serve thousands of concurrent connections. What makes that possible?
    explanation: "Network I/O is handed to the OS (epoll, kqueue, IOCP) through libuv, which notifies the event loop when a socket is ready. The JS thread never waits on the I/O itself, it only runs the callbacks. It is not one hidden thread per connection, and it is not that JS is fast enough to poll everything in a loop."
    theoryUrl: https://nodejs.org/en/learn/asynchronous-work/overview-of-blocking-vs-non-blocking
    options:
      - {
          text: Each connection is silently served by its own OS thread that runs your callback in parallel,
          correct: false,
        }
      - {
          text: "I/O is delegated to the OS and libuv, and the JS thread only runs callbacks when results are ready",
          correct: true,
        }
      - {
          text: V8 compiles handlers to native code that is fast enough to poll every socket in a tight loop,
          correct: false,
        }
      - {
          text: Node forks a child process per request and shares the results through shared memory,
          correct: false,
        }
  - type: multi
    prompt: "Which of these operations are executed on libuv's thread pool rather than through the OS's non-blocking socket notifications? Select all that apply."
    explanation: "`fs.readFile`, `zlib` and `crypto.pbkdf2` are offloaded to the thread pool (4 threads by default, `UV_THREADPOOL_SIZE`), and so is `dns.lookup`. Reading from a TCP socket uses the OS readiness mechanism (epoll/kqueue/IOCP), so it does not consume a pool thread."
    theoryUrl: https://nodejs.org/en/learn/asynchronous-work/dont-block-the-event-loop
    options:
      - { text: "`fs.readFile`", correct: true }
      - { text: "Reading data from an incoming TCP socket", correct: false }
      - { text: "`dns.lookup`", correct: true }
      - { text: "`zlib.gzip` with a callback", correct: true }
  - type: single
    prompt: Which is the correct order of the main phases of one Node.js event loop iteration?
    explanation: "One iteration goes timers, pending callbacks, idle/prepare, poll, check (`setImmediate`), close callbacks. That is why `setImmediate` fires right after the poll phase, while timers wait for the next iteration. Microtasks and `nextTick` are not a phase: they drain between callbacks."
    theoryUrl: https://nodejs.org/en/learn/asynchronous-work/event-loop-timers-and-nexttick
    options:
      - { text: "poll, timers, check, close callbacks", correct: false }
      - { text: "timers, check, poll, close callbacks", correct: false }
      - {
          text: "timers, pending callbacks, idle/prepare, poll, check, close callbacks",
          correct: true,
        }
      - { text: "check, timers, poll, pending callbacks, close callbacks", correct: false }
  - type: single
    prompt: "In what order are the lines printed when this CommonJS file is run with `node app.js`?"
    code: |
      console.log('A')
      setTimeout(() => console.log('B'), 0)
      Promise.resolve().then(() => console.log('C'))
      process.nextTick(() => console.log('D'))
      console.log('E')
    codeLanguage: javascript
    explanation: "Synchronous code runs first (A, E). When the main script ends, the `nextTick` queue is drained (D), then the promise microtask queue (C), and only then does the event loop reach the timers phase (B). A tempting mistake is to put C before D, but Node always empties the `nextTick` queue before promise microtasks."
    theoryUrl: https://nodejs.org/en/learn/asynchronous-work/understanding-processnexttick
    options:
      - { text: "A, E, C, D, B", correct: false }
      - { text: "A, B, C, D, E", correct: false }
      - { text: "A, E, B, D, C", correct: false }
      - { text: "A, E, D, C, B", correct: true }
  - type: single
    prompt: "What does this script print, and is the order guaranteed?"
    code: |
      const fs = require('node:fs')

      fs.readFile(__filename, () => {
        setTimeout(() => console.log('timeout'), 0)
        setImmediate(() => console.log('immediate'))
      })
    codeLanguage: javascript
    explanation: "Inside an I/O callback we are in the poll phase, so the next phase is check, which runs `setImmediate` callbacks before the loop wraps around to timers. It always prints `immediate` then `timeout`. The order is only non-deterministic when both are scheduled from the main module."
    theoryUrl: https://nodejs.org/en/learn/asynchronous-work/event-loop-timers-and-nexttick
    options:
      - { text: "timeout, then immediate, always", correct: false }
      - { text: "immediate, then timeout, always", correct: true }
      - { text: "Either order, it depends on process performance", correct: false }
      - { text: "Only immediate, since a 0 ms timeout is ignored in I/O callbacks", correct: false }
  - type: single
    prompt: "What is the output order of this script?"
    code: |
      async function a() {
        console.log(1)
        await b()
        console.log(2)
      }

      async function b() {
        console.log(3)
      }

      a()
      Promise.resolve().then(() => console.log(4))
      console.log(5)
    codeLanguage: javascript
    explanation: "An async function runs synchronously until its first `await`, so it prints 1 then 3 (the body of `b`). `a` is then suspended and its continuation is queued as a microtask before the `.then` callback was queued. After the sync `5`, the microtasks run in queue order: 2, then 4."
    theoryUrl: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/async_function
    options:
      - { text: "1, 3, 5, 4, 2", correct: false }
      - { text: "1, 3, 5, 2, 4", correct: true }
      - { text: "1, 5, 3, 2, 4", correct: false }
      - { text: "1, 3, 2, 5, 4", correct: false }
  - type: single
    prompt: "What is the output order of these callbacks in a CommonJS script?"
    code: |
      Promise.resolve().then(() => {
        console.log('p1')
        process.nextTick(() => console.log('tick inside promise'))
      })

      process.nextTick(() => {
        console.log('t1')
        Promise.resolve().then(() => console.log('promise inside tick'))
      })

      Promise.resolve().then(() => console.log('p2'))
    codeLanguage: javascript
    explanation: "After the main script, `nextTick` runs first (t1), which queues a new microtask at the end of the promise queue. Then the microtask queue drains in order: p1, p2, 'promise inside tick'. The `nextTick` scheduled from p1 only runs once that microtask queue is empty, so it comes last. Microtasks do not yield to the tick queue mid-drain."
    theoryUrl: https://nodejs.org/en/learn/asynchronous-work/understanding-processnexttick
    options:
      - { text: "t1, p1, p2, tick inside promise, promise inside tick", correct: false }
      - { text: "p1, p2, t1, promise inside tick, tick inside promise", correct: false }
      - { text: "t1, p1, tick inside promise, p2, promise inside tick", correct: false }
      - { text: "t1, p1, p2, promise inside tick, tick inside promise", correct: true }
  - type: single
    prompt: "What does this script print?"
    code: |
      const p = new Promise((resolve) => {
        console.log('executor')
        resolve('done')
        console.log('after resolve')
      })

      p.then((value) => console.log(value))
      console.log('sync end')
    codeLanguage: javascript
    explanation: "The promise executor runs synchronously, and `resolve` does not stop it, so both executor logs print first. The `.then` callback is always asynchronous (a microtask), even for an already-resolved promise, so `done` comes after `sync end`."
    theoryUrl: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Using_promises
    options:
      - { text: "executor, after resolve, done, sync end", correct: false }
      - { text: "executor, done, after resolve, sync end", correct: false }
      - { text: "executor, after resolve, sync end, done", correct: true }
      - { text: "sync end, executor, after resolve, done", correct: false }
  - type: single
    prompt: "A module schedules `setTimeout(fn, 0)` and `setImmediate(fn)` at its top level, not inside any I/O callback. What can you say about which fires first?"
    explanation: "From the main module the order depends on how fast the process reaches the loop: if 1 ms has already elapsed when the timers phase starts, the timeout fires first, otherwise `setImmediate` wins. So it is non-deterministic. It is deterministic only inside an I/O callback, where `setImmediate` always wins."
    theoryUrl: https://nodejs.org/en/learn/asynchronous-work/event-loop-timers-and-nexttick
    options:
      - {
          text: "`setTimeout` always fires first, since the timers phase comes first in the loop",
          correct: false,
        }
      - {
          text: "`setImmediate` always fires first, since it is the more specific API",
          correct: false,
        }
      - {
          text: "It is non-deterministic, as it depends on process performance when the loop starts",
          correct: true,
        }
      - {
          text: "They fire in the same tick, in registration order, as a single batch",
          correct: false,
        }
  - type: single
    prompt: "What is the output order of this CommonJS script?"
    code: |
      setTimeout(() => console.log('t'), 0)

      async function f() {
        console.log('f start')
        await null
        console.log('f after await')
      }

      f()
      process.nextTick(() => console.log('tick'))
      queueMicrotask(() => console.log('micro'))
      console.log('end')
    codeLanguage: javascript
    explanation: "Sync part: `f start`, `end`. Then the `nextTick` queue (tick), then microtasks in the order they were queued: the `await null` continuation was queued by `f()` before `queueMicrotask`, so `f after await` precedes `micro`. The timer fires last, in the timers phase."
    theoryUrl: https://nodejs.org/api/globals.html#queuemicrotaskcallback
    options:
      - { text: "f start, end, micro, f after await, tick, t", correct: false }
      - { text: "f start, end, tick, f after await, micro, t", correct: true }
      - { text: "f start, end, tick, micro, f after await, t", correct: false }
      - { text: "f start, tick, end, f after await, micro, t", correct: false }
  - type: single
    prompt: "An Express handler calls `JSON.parse` on a 60 MB request body and then runs a CPU-heavy aggregation, taking about 800 ms. Under load, unrelated endpoints show latency spikes of the same size. What is the best architectural fix?"
    explanation: "While the JS thread is busy, the event loop cannot run any other callback, so every request waits. Moving the CPU-bound work to a `worker_threads` pool (or a separate service) keeps the loop free. Adding `async` to the handler does not help since the work is still synchronous, and a bigger thread pool only affects libuv offloaded I/O."
    theoryUrl: https://nodejs.org/en/learn/asynchronous-work/dont-block-the-event-loop
    options:
      - {
          text: "Mark the handler `async` so that Node runs it concurrently with the others",
          correct: false,
        }
      - {
          text: "Raise `UV_THREADPOOL_SIZE` so that more threads can run the parsing",
          correct: false,
        }
      - {
          text: "Offload the parsing and aggregation to a worker thread pool or a separate service",
          correct: true,
        }
      - {
          text: "Wrap the aggregation in `setImmediate` so it runs after the response is sent",
          correct: false,
        }
  - type: single
    prompt: "What does this script print?"
    code: |
      setImmediate(() => {
        console.log('imm1')
        process.nextTick(() => console.log('tick'))
      })

      setImmediate(() => console.log('imm2'))
    codeLanguage: javascript
    explanation: "Since Node 11 the `nextTick` and microtask queues are drained between each individual `setImmediate`/timer callback, not only after the whole phase. So `tick` runs right after `imm1` and before `imm2`. In Node 10 and older, it would have printed imm1, imm2, tick."
    theoryUrl: https://nodejs.org/en/learn/asynchronous-work/understanding-setimmediate
    options:
      - { text: "imm1, imm2, tick", correct: false }
      - { text: "imm1, tick, imm2", correct: true }
      - { text: "tick, imm1, imm2", correct: false }
      - { text: "imm1, imm2, and tick never runs", correct: false }
  - type: boolean
    prompt: A function that recursively schedules itself with `process.nextTick` can starve I/O, because the event loop never gets to advance to the next phase.
    answer: true
    explanation: "The `nextTick` queue is drained completely before the loop continues, and callbacks added while draining are processed in the same drain. An endless chain of ticks therefore blocks timers and I/O. `setImmediate` does not have this problem because each recursion defers to the next loop iteration."
    theoryUrl: https://nodejs.org/en/learn/asynchronous-work/understanding-processnexttick
  - type: single
    prompt: "What guarantee does `setTimeout(fn, 100)` give in Node?"
    explanation: "The delay is a minimum: the callback becomes eligible after at least 100 ms, but it runs only when the loop reaches the timers phase and the JS thread is free. A long synchronous task or a busy poll phase delays it further. It is neither exact nor a hard upper bound."
    theoryUrl: https://nodejs.org/api/timers.html
    options:
      - {
          text: "It runs at exactly 100 ms, as the libuv timer wheel is precise to the millisecond",
          correct: false,
        }
      - {
          text: "It runs within 100 ms at most, otherwise Node throws a timeout error",
          correct: false,
        }
      - {
          text: "It runs on a separate thread, so it is not affected by what the main thread does",
          correct: false,
        }
      - { text: "It runs after at least 100 ms, and later if the loop is busy", correct: true }
  - type: single
    prompt: "What does this CommonJS module export?"
    code: |
      exports.a = 1
      module.exports = { b: 2 }
      exports.c = 3

      console.log(module.exports)
    codeLanguage: javascript
    explanation: "`exports` is just a variable that initially points to the same object as `module.exports`. Reassigning `module.exports` replaces the object that `require` returns, so the later `exports.c = 3` mutates the old, orphaned object. The printed value is `{ b: 2 }`."
    theoryUrl: https://nodejs.org/api/modules.html#exports-shortcut
    options:
      - { text: "{ a: 1, b: 2, c: 3 }", correct: false }
      - { text: "{ a: 1, c: 3 }", correct: false }
      - { text: "{ b: 2, c: 3 }", correct: false }
      - { text: "{ b: 2 }", correct: true }
  - type: single
    prompt: "`main.js` requires `a.js`, and `a.js` and `b.js` require each other. What does `node main.js` print?"
    code: |
      // a.js
      exports.loaded = false
      const b = require('./b')
      console.log('in a, b.loaded =', b.loaded)
      exports.loaded = true

      // b.js
      exports.loaded = false
      const a = require('./a')
      console.log('in b, a.loaded =', a.loaded)
      exports.loaded = true

      // main.js
      require('./a')
      console.log('main done')
    codeLanguage: javascript
    explanation: "When `b.js` requires `a.js`, `a` is already in the cache but only partially executed, so `b` receives its incomplete exports (`loaded` is still `false`). `b` then finishes, and `a` resumes and sees `b.loaded === true`. Node does not throw on cycles, it hands back the unfinished exports."
    theoryUrl: https://nodejs.org/api/modules.html#cycles
    options:
      - {
          text: "in a, b.loaded = true, then in b, a.loaded = true, then main done",
          correct: false,
        }
      - {
          text: "in b, a.loaded = false, then in a, b.loaded = true, then main done",
          correct: true,
        }
      - {
          text: "in b, a.loaded = true, then in a, b.loaded = true, then main done",
          correct: false,
        }
      - { text: "It throws a RangeError for the circular dependency", correct: false }
  - type: single
    prompt: "This file is saved as `check.mjs` and run with `node check.mjs`. What does it print?"
    code: |
      console.log(typeof require, typeof __dirname, typeof import.meta.url)
    codeLanguage: javascript
    explanation: "ES modules have no `require`, `module`, `exports`, `__filename` or `__dirname`. `typeof` on an undeclared identifier returns `'undefined'` instead of throwing. The ESM replacement for the location is `import.meta.url` (a string) or `import.meta.dirname` in recent Node."
    theoryUrl: https://nodejs.org/api/esm.html#no-require-exports-or-moduleexports
    options:
      - { text: "function string string", correct: false }
      - { text: "undefined undefined string", correct: true }
      - { text: "undefined undefined undefined", correct: false }
      - { text: "It throws a ReferenceError on `require`", correct: false }
  - type: multi
    prompt: "Which statements about ES modules compared to CommonJS in Node.js are true? Select all that apply."
    explanation: "ESM supports top-level `await`, exports are live bindings (an importer sees later updates), and `import` declarations are statically analysable, which enables tree shaking. CommonJS `require` is synchronous and returns a snapshot of `module.exports`, but that is a CJS trait, not an ESM one. ESM loading is asynchronous."
    theoryUrl: https://nodejs.org/api/esm.html
    options:
      - { text: "Top-level `await` is supported", correct: true }
      - {
          text: "An imported binding reflects later changes made by the exporting module",
          correct: true,
        }
      - {
          text: "Imports are resolved synchronously at the line where each `import` runs",
          correct: false,
        }
      - {
          text: "Import specifiers can be statically analysed, which enables tree shaking",
          correct: true,
        }
  - type: single
    prompt: "In a CommonJS file, `require('lodash')` is called from `/app/src/utils/index.js`. Which lookup does Node perform?"
    explanation: "A bare specifier is searched in `node_modules` directories, starting from the requiring file's folder and walking up through every parent (`/app/src/utils/node_modules`, `/app/src/node_modules`, `/app/node_modules`, `/node_modules`). It does not look at the current working directory, and it does not use a global registry."
    theoryUrl: https://nodejs.org/api/modules.html#loading-from-node_modules-folders
    options:
      - {
          text: "The `node_modules` folder in the current working directory, then the global npm folder",
          correct: false,
        }
      - {
          text: "Only the `node_modules` folder next to the project's `package.json`",
          correct: false,
        }
      - {
          text: "Each `node_modules` folder from the file's directory up to the filesystem root",
          correct: true,
        }
      - {
          text: "A central registry cache keyed by package name, regardless of the file location",
          correct: false,
        }
  - type: single
    prompt: 'In an ES module with `"type": "module"`, `import { helper } from ''./util''` fails even though `util.js` exists next to the file. Why?'
    explanation: "The ESM resolver does not do extension searching or directory index lookup: relative specifiers must be fully specified (`./util.js`). CommonJS `require('./util')` is the one that tries `.js`, `.json`, `.node` and `index.js`. Named exports are not the issue, and `.js` files are ESM here thanks to `type`."
    theoryUrl: https://nodejs.org/api/esm.html#mandatory-file-extensions
    options:
      - { text: "Named imports are not allowed from a `.js` file in ESM mode", correct: false }
      - {
          text: "ESM does not append file extensions, so the specifier needs `./util.js`",
          correct: true,
        }
      - { text: "ESM can only import from files that have the `.mjs` extension", correct: false }
      - {
          text: "Relative imports are disabled unless `util` is listed in `package.json` dependencies",
          correct: false,
        }
  - type: single
    prompt: "A module `config.js` is `require`d from ten different files, and it builds a database client at its top level. How many times does the top-level code run, and why?"
    explanation: "Node caches modules by their resolved filename in `require.cache`, so the module body runs once and every `require` returns the same `module.exports` object. This is why a module export works as a lightweight singleton. The caveat: a different resolved path (e.g. a duplicated package in nested `node_modules`) gives a separate instance."
    theoryUrl: https://nodejs.org/api/modules.html#caching
    options:
      - {
          text: "Ten times, since each `require` call re-executes the file for isolation",
          correct: false,
        }
      - {
          text: "Once per directory, since the cache is scoped to the requiring folder",
          correct: false,
        }
      - { text: "Once per process, since modules are cached by resolved filename", correct: true }
      - {
          text: "Once per event loop tick, since the cache is cleared between ticks",
          correct: false,
        }
  - type: boolean
    prompt: "In an ES module, `import config from './legacy.cjs'` gives you the value of `module.exports` of the CommonJS file as the default import."
    answer: true
    explanation: "When ESM imports a CommonJS module, the default export is always `module.exports`. Named imports work only when Node can statically detect them (cjs-module-lexer), so the safe habit is to import the default and destructure."
    theoryUrl: https://nodejs.org/api/esm.html#interoperability-with-commonjs
  - type: single
    prompt: "What does this CommonJS script print?"
    code: |
      Promise.reject(new Error('x'))
        .catch(() => console.log('caught'))
        .then(() => console.log('then'))
        .finally(() => console.log('finally'))

      process.nextTick(() => console.log('tick'))
    codeLanguage: javascript
    explanation: "`tick` runs first because the `nextTick` queue is drained before promise jobs. The rejection is handled by `catch`, which returns a fulfilled promise, so `then` and then `finally` run in sequence. Each link in the chain is a separate microtask."
    theoryUrl: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Promise/finally
    options:
      - { text: "caught, then, finally, tick", correct: false }
      - { text: "tick, caught, finally, then", correct: false }
      - { text: "tick, caught, then, finally", correct: true }
      - { text: "tick, then an unhandled rejection error", correct: false }
  - type: single
    prompt: "A service runs on Node with the default settings and starts 8 `crypto.pbkdf2` calls (async, callback form) at the same time. Each takes about 100 ms of CPU. What do you expect?"
    explanation: "`pbkdf2` runs on libuv's thread pool, which has 4 threads by default. Four jobs run in parallel and finish at about 100 ms, the other four wait for a free thread and finish at about 200 ms. Raising `UV_THREADPOOL_SIZE` (set before the pool is first used) changes that. They are not all parallel, and they do not block the main thread."
    theoryUrl: https://nodejs.org/api/cli.html#uv_threadpool_sizesize
    options:
      - {
          text: "All 8 finish at about 100 ms, since each call gets its own thread",
          correct: false,
        }
      - {
          text: "The calls run one after another, so the last finishes at about 800 ms",
          correct: false,
        }
      - {
          text: "The main thread is blocked for about 800 ms, as hashing is synchronous CPU work",
          correct: false,
        }
      - {
          text: "Four finish at about 100 ms and four at about 200 ms, due to the 4-thread pool",
          correct: true,
        }
  - type: single
    prompt: 'A project has a `package.json` with `"type": "module"`. A legacy script in it must still use `require()` and `module.exports`. What is the minimal change?'
    explanation: 'With `"type": "module"` every `.js` file is treated as ESM, but `.cjs` files are always CommonJS regardless of `type`. Renaming the legacy script to `.cjs` is the smallest change. Removing `type` would turn all the other files into CommonJS, and `--experimental-modules` is not needed.'
    theoryUrl: https://nodejs.org/api/packages.html#determining-module-system
    options:
      - { text: "Rename the script to `.cjs`, which is always loaded as CommonJS", correct: true }
      - {
          text: "Add a `// @commonjs` pragma comment on the first line of the file",
          correct: false,
        }
      - { text: "Run it with `node --experimental-modules` to re-enable `require`", correct: false }
      - {
          text: 'Remove `"type": "module"` from `package.json`, as it applies to one file',
          correct: false,
        }
