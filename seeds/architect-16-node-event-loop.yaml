version: 1
title: "Architect Roadmap 16: Node.js core concepts and the event loop"
description: The non-blocking I/O model, the role of V8 and libuv, the thread pool, event loop phases and microtasks, why blocking the loop hurts, offloading CPU work, and CommonJS vs ESM modules.
language: en
tags: [architect-roadmap, nodejs, event-loop, libuv, modules]
run:
  questionsPerRun: 10
  maxErrors: 3
  timePerQuestionSec: 90
questions:
  - type: single
    prompt: Node.js runs your JavaScript on a single thread, yet one process can serve thousands of concurrent connections. What makes that possible?
    explanation: "Network I/O is handed to the operating system through libuv, which tells the event loop when a socket has data. The JS thread never sits waiting for I/O; it only runs the short callbacks that react to it. There is no hidden thread or process per connection, and raw execution speed is not what makes it scale."
    theoryUrl: https://nodejs.org/en/learn/asynchronous-work/overview-of-blocking-vs-non-blocking
    options:
      - {
          text: "Each connection is quietly given its own OS thread, which runs your handler in parallel with the others",
          correct: false,
        }
      - {
          text: "I/O is delegated to the OS via libuv, and the JS thread only runs callbacks once results are ready",
          correct: true,
        }
      - {
          text: "V8 compiles the handlers to native code that is fast enough to check every socket in a tight loop",
          correct: false,
        }
      - {
          text: "Node forks a child process per request and merges the results back through shared memory",
          correct: false,
        }

  - type: single
    prompt: In one sentence, what is the job of the Node.js event loop?
    explanation: "The event loop waits for things to happen (I/O completing, timers expiring, sockets closing) and runs the matching callbacks on the JS thread, one at a time. It does not run code in parallel, and it is not a scheduler that time-slices your functions: a callback always runs to completion before the next one starts."
    theoryUrl: https://nodejs.org/en/learn/asynchronous-work/event-loop-timers-and-nexttick
    options:
      - {
          text: "To pre-empt long-running functions so that every request gets a fair slice of CPU time",
          correct: false,
        }
      - {
          text: "To wait for events such as finished I/O or expired timers and run their callbacks one at a time",
          correct: true,
        }
      - {
          text: "To spread JavaScript callbacks across all CPU cores so they execute in parallel",
          correct: false,
        }
      - {
          text: "To poll the database periodically and push fresh results into the application's memory",
          correct: false,
        }

  - type: single
    prompt: "Inside one Node.js process, which responsibilities belong to V8 and which to libuv?"
    explanation: "V8 parses, compiles and runs JavaScript and manages the JS heap and garbage collector. libuv is the C library that provides the event loop, asynchronous I/O over the OS mechanisms, timers and the worker thread pool. Node's own bindings glue the two together and expose modules like `fs` and `net`."
    theoryUrl: https://docs.libuv.org/en/v1.x/design.html
    options:
      - {
          text: "V8 provides the event loop and the thread pool; libuv compiles and runs JavaScript",
          correct: false,
        }
      - {
          text: "V8 runs JavaScript and manages its heap; libuv provides the event loop, async I/O and the thread pool",
          correct: true,
        }
      - {
          text: "V8 handles network sockets and file I/O; libuv takes care of garbage collection",
          correct: false,
        }
      - {
          text: "Both are interchangeable runtimes, and Node picks one at startup depending on the platform it runs on",
          correct: false,
        }

  - type: multi
    prompt: "Which kinds of work does libuv run on its thread pool, rather than through the OS's non-blocking socket notifications? Select all that apply."
    explanation: "Most asynchronous file system calls, async compression and CPU-heavy async crypto such as key derivation run on the thread pool, because there is no portable non-blocking OS API for them or because they are CPU work. Socket reads and writes use the OS readiness mechanisms (epoll, kqueue, IOCP), and timers are tracked by the loop itself, so neither occupies a pool thread."
    theoryUrl: https://nodejs.org/en/learn/asynchronous-work/dont-block-the-event-loop
    options:
      - { text: "Most asynchronous file system operations", correct: true }
      - { text: "Asynchronous compression and decompression with zlib", correct: true }
      - { text: "Async CPU-heavy crypto such as password key derivation", correct: true }
      - { text: "Reading and writing data on TCP sockets", correct: false }
      - { text: "Keeping track of pending timers", correct: false }

  - type: single
    prompt: Why does libuv use a thread pool for file system operations but not for network sockets?
    explanation: "Operating systems offer efficient readiness notification for sockets, so one thread can watch thousands of them. Regular files have no equally portable non-blocking API, so libuv runs the blocking file calls on pool threads and reports back to the loop. It has nothing to do with files being more important or sockets being slower."
    theoryUrl: https://docs.libuv.org/en/v1.x/design.html
    options:
      - {
          text: "File operations are rarer than network calls, so it is cheaper to give them dedicated threads",
          correct: false,
        }
      - {
          text: "Sockets have portable non-blocking readiness APIs in the OS, while regular files generally do not",
          correct: true,
        }
      - {
          text: "The thread pool exists so that file reads can run JavaScript callbacks in parallel with the main thread",
          correct: false,
        }
      - {
          text: "Network I/O must stay on the main thread because TLS encryption is not thread-safe",
          correct: false,
        }

  - type: boolean
    prompt: "When a file read finishes on a libuv pool thread, the JavaScript callback you passed still runs on the main thread."
    answer: true
    explanation: "Pool threads only do the blocking native work. When it completes, libuv queues the completion, and the event loop runs your callback on the single JS thread. That is why your JavaScript never needs locks, and also why a slow callback still blocks everything else."
    theoryUrl: https://nodejs.org/en/learn/asynchronous-work/dont-block-the-event-loop

  - type: single
    prompt: "A service makes heavy use of async file reads and async password hashing. Under load, simple file reads become slow even though the JS thread is mostly idle and event loop delay is low. What is the most likely explanation?"
    explanation: "Async fs and crypto share libuv's small, fixed-size thread pool. When it is saturated, new tasks wait in its queue even though the JS thread is free. The fix is to reduce or bound the concurrent pool work, or carefully size the pool; a garbage-collection problem or a blocked loop would show up as high event loop delay."
    theoryUrl: https://docs.libuv.org/en/v1.x/threadpool.html
    options:
      - {
          text: "The event loop is blocked by the hashing callbacks, which run synchronously on the main thread",
          correct: false,
        }
      - {
          text: "The thread pool is saturated, so file reads queue behind the hashing work",
          correct: true,
        }
      - {
          text: "The garbage collector pauses file I/O whenever hashing allocates large buffers",
          correct: false,
        }
      - {
          text: "The operating system limits each process to a few open files at once and makes the rest wait in line",
          correct: false,
        }

  - type: single
    prompt: "An endpoint that generates a large PDF report takes 2 seconds of pure CPU. While it runs, every other request to the service, even trivial health checks, stalls. Why?"
    explanation: "All JavaScript in the process runs on one thread. While the report code runs, the event loop cannot pick up any other callback, so every other request waits until it finishes. The network and the thread pool are fine; the bottleneck is that the only JS thread is busy."
    theoryUrl: https://nodejs.org/en/learn/asynchronous-work/dont-block-the-event-loop
    options:
      - {
          text: "The report fills the network buffers, so responses to other clients cannot be sent until it is delivered",
          correct: false,
        }
      - {
          text: "The report uses up every thread in the libuv pool, so other requests have nowhere to run",
          correct: false,
        }
      - {
          text: "Every request shares the one JS thread, and it cannot run other callbacks until the report code ends",
          correct: true,
        }
      - {
          text: "Node lowers the priority of all other requests while one of them is using a lot of CPU",
          correct: false,
        }

  - type: single
    prompt: "A teammate tries to stop the PDF endpoint from blocking other requests with the change below. What is the effect?"
    code: |
      app.get('/report', async (req, res) => {
        const pdf = await new Promise((resolve) => {
          resolve(buildPdf(req.query)) // ~2 s of synchronous CPU work
        })
        res.send(pdf)
      })
    codeLanguage: javascript
    explanation: "The promise executor runs synchronously, so `buildPdf` still occupies the main thread for the full 2 seconds. Promises and `async` change how results are delivered, not where the code runs. To unblock the loop, the CPU work has to move to another thread or process, or be split into small chunks."
    theoryUrl: https://nodejs.org/en/learn/asynchronous-work/dont-block-the-event-loop
    options:
      - {
          text: "It fixes the problem, because code inside a promise runs on the libuv thread pool",
          correct: false,
        }
      - {
          text: "Nothing improves: the executor runs synchronously, so the loop is still blocked",
          correct: true,
        }
      - {
          text: "It fixes the problem, because `await` yields to other requests while `buildPdf` is running",
          correct: false,
        }
      - {
          text: "It makes things worse, because the work now runs twice: once in the executor and once on `await`",
          correct: false,
        }

  - type: single
    prompt: "That same CPU-heavy report runs a few hundred times an hour and must not hurt the latency of other endpoints. Which approach fits best?"
    explanation: "A small pool of worker threads runs the CPU work in parallel with the main thread, which stays free to serve requests. Raising the libuv pool size does nothing for JavaScript code, and wrapping it in `setTimeout` only delays the block. Simply adding instances spreads the stalls around without removing them."
    theoryUrl: https://nodejs.org/api/worker_threads.html
    options:
      - {
          text: "Run the report generation in a small pool of worker threads and send the result back to the main thread",
          correct: true,
        }
      - {
          text: "Increase the libuv thread pool size so that the report code gets more threads to run on",
          correct: false,
        }
      - {
          text: "Wrap the call in `setTimeout(..., 0)` so the report starts on a later tick of the event loop",
          correct: false,
        }
      - {
          text: "Run more instances of the service so the chance of hitting a blocked one goes down",
          correct: false,
        }

  - type: single
    prompt: "A nightly cleanup inside your API server loops over 200,000 records with light per-item work. It doesn't justify a worker thread, but you don't want it to freeze requests. What does the code below do about it?"
    code: |
      function processAll(items, i = 0) {
        const end = Math.min(i + 1000, items.length)
        for (; i < end; i++) cleanup(items[i])
        if (i < items.length) setImmediate(() => processAll(items, i))
      }
    codeLanguage: javascript
    explanation: "This is partitioning: the work is cut into chunks, and `setImmediate` schedules the next chunk after the loop has had a chance to handle pending I/O. Total CPU time is the same; what improves is that no single callback holds the thread for long. It does not create any parallelism."
    theoryUrl: https://nodejs.org/en/learn/asynchronous-work/dont-block-the-event-loop
    options:
      - {
          text: "It runs each chunk of 1,000 items on a different thread so the total job finishes faster",
          correct: false,
        }
      - {
          text: "It splits the work into chunks and lets the loop handle other events between chunks",
          correct: true,
        }
      - {
          text: "It batches the records so that the database receives 1,000 writes per round trip",
          correct: false,
        }
      - {
          text: "It delays the whole job until the server is idle, then processes every record in one pass",
          correct: false,
        }

  - type: single
    prompt: "When breaking up a long task into chunks, why is `setImmediate` a better way to schedule the next chunk than `process.nextTick`?"
    explanation: "The `nextTick` queue is drained completely before the event loop moves on, so chunks scheduled that way run back to back and I/O still never gets a turn. `setImmediate` runs in the check phase of a later loop iteration, after pending I/O has been polled. The point is letting other work through, not raw speed."
    theoryUrl: https://nodejs.org/en/learn/asynchronous-work/understanding-setimmediate
    options:
      - {
          text: "`nextTick` callbacks run before the loop continues, so pending I/O would still be starved",
          correct: true,
        }
      - {
          text: "`nextTick` callbacks are executed on the thread pool, which can corrupt shared state",
          correct: false,
        }
      - {
          text: "`setImmediate` runs the chunk on another core, while `nextTick` keeps it on the main one",
          correct: false,
        }
      - {
          text: "`setImmediate` callbacks get a higher priority, so the OS scheduler runs them first",
          correct: false,
        }

  - type: single
    prompt: Conceptually, how do microtasks (such as promise reactions) relate to the macrotask-style callbacks the event loop runs, like timers and I/O callbacks?
    explanation: "After each callback finishes, Node drains the microtask queues before the event loop takes the next timer or I/O callback. So a resolved promise's `then` runs soon after the current code, ahead of any timer or I/O event. Microtasks are not a separate thread, and they are not deferred to the end of the whole loop iteration."
    theoryUrl: https://developer.mozilla.org/en-US/docs/Web/API/HTML_DOM_API/Microtask_guide
    options:
      - {
          text: "Microtasks run on a separate thread, alongside the main callbacks, so they never delay each other",
          correct: false,
        }
      - {
          text: "Microtasks wait until every timer and I/O callback of the current loop iteration has completed",
          correct: false,
        }
      - {
          text: "The microtask queue is drained after the current callback, before the loop moves to the next one",
          correct: true,
        }
      - {
          text: "Microtasks only run when the process is otherwise idle, like a low-priority background queue",
          correct: false,
        }

  - type: single
    prompt: A library schedules a new microtask from inside every microtask, forever. What happens to the server?
    explanation: "The microtask queue is drained to empty before the event loop continues, so a queue that keeps refilling itself never lets the loop move on. Timers, I/O and incoming requests are starved even though no single callback is slow. The same applies to recursive `process.nextTick`."
    theoryUrl: https://nodejs.org/en/learn/asynchronous-work/event-loop-timers-and-nexttick
    options:
      - {
          text: "Nothing serious: Node interleaves microtasks with I/O callbacks, so requests are still served",
          correct: false,
        }
      - {
          text: "Node detects the cycle after a fixed number of iterations and throws a RangeError",
          correct: false,
        }
      - {
          text: "The event loop never gets past the microtask queue, so I/O and timers are starved",
          correct: true,
        }
      - {
          text: "The microtasks are moved to the thread pool once the queue grows beyond a threshold",
          correct: false,
        }

  - type: single
    prompt: "An `async` handler reaches `await db.query(...)`, and the query takes 50 ms. What happens on the JS thread during those 50 ms?"
    explanation: "`await` suspends only that async function and returns control to the event loop, which keeps serving other callbacks. When the query's promise resolves, the rest of the function is queued as a microtask and resumes. Nothing spins or blocks, and no new thread is created for the function."
    theoryUrl: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/await
    options:
      - {
          text: "The thread waits on the query, but other requests are handled on additional threads Node spawns for them",
          correct: false,
        }
      - {
          text: "The function is suspended and the thread is free to run other callbacks until the result arrives",
          correct: true,
        }
      - {
          text: "The thread checks in a busy loop whether the query has finished, which costs CPU but not latency",
          correct: false,
        }
      - {
          text: "The whole process pauses, but the query is fast enough that nobody notices",
          correct: false,
        }

  - type: single
    prompt: "What is the role of the poll phase in the Node.js event loop?"
    explanation: "In the poll phase the loop collects new I/O events and runs their callbacks. When there is nothing else to do it waits there for I/O, bounded by the next timer due, which is why an idle Node process uses almost no CPU. Timers and `setImmediate` callbacks have their own phases."
    theoryUrl: https://nodejs.org/en/learn/asynchronous-work/event-loop-timers-and-nexttick
    options:
      - {
          text: "It runs the callbacks of expired `setTimeout` and `setInterval` timers",
          correct: false,
        }
      - {
          text: "It retrieves new I/O events, runs their callbacks, and waits for I/O when idle",
          correct: true,
        }
      - {
          text: "It checks every few milliseconds whether the garbage collector should run",
          correct: false,
        }
      - {
          text: "It runs all callbacks scheduled with `setImmediate`, then closes finished sockets",
          correct: false,
        }

  - type: single
    prompt: "What does `setTimeout(fn, 100)` actually guarantee?"
    explanation: "The delay is a minimum threshold: `fn` will not run before roughly 100 ms, but it can run later if the loop is busy with other callbacks or blocked by synchronous code. Timers cannot interrupt running code, and they give no upper bound."
    theoryUrl: https://nodejs.org/en/learn/asynchronous-work/event-loop-timers-and-nexttick
    options:
      - {
          text: "`fn` runs exactly 100 ms later, interrupting whatever code is running at that moment",
          correct: false,
        }
      - {
          text: "`fn` runs no earlier than about 100 ms later, and possibly later if the loop is busy",
          correct: true,
        }
      - {
          text: "`fn` runs within 100 ms, as soon as the loop is idle for the first time",
          correct: false,
        }
      - {
          text: "`fn` runs exactly 100 ms later on a timer thread, in parallel with the main code",
          correct: false,
        }

  - type: boolean
    prompt: "A Node.js script exits on its own once there are no pending timers, open sockets, servers or other active work left for the event loop."
    answer: true
    explanation: "The event loop keeps running only while something can still produce events. When nothing remains (no timers, no listening servers, no in-flight I/O), the loop ends and so does the process. That is why a script that only defines functions exits immediately, while a running HTTP server keeps the process alive."
    theoryUrl: https://nodejs.org/en/learn/asynchronous-work/event-loop-timers-and-nexttick

  - type: single
    prompt: "Which kind of workload is Node.js's single-threaded event loop model best suited to?"
    explanation: "Node shines when most of the time is spent waiting on I/O: APIs, gateways, real-time messaging. One thread can juggle many connections cheaply. Long CPU-bound jobs such as video encoding block the loop and need worker threads or another runtime, so they are the weak spot, not the sweet spot."
    theoryUrl: https://nodejs.org/en/learn/asynchronous-work/overview-of-blocking-vs-non-blocking
    options:
      - {
          text: "Many concurrent requests that each spend most of their time waiting on databases or networks",
          correct: true,
        }
      - {
          text: "Long CPU-bound jobs such as video encoding, since V8's JIT makes them run at native speed",
          correct: false,
        }
      - {
          text: "Heavy numerical computation, because the event loop spreads the work across all CPU cores",
          correct: false,
        }
      - {
          text: "Any workload, since an async API makes every kind of operation non-blocking automatically",
          correct: false,
        }

  - type: single
    prompt: "Your Node service must convert uploaded videos by running the existing `ffmpeg` command-line program. Which mechanism fits?"
    explanation: "Running an external program is exactly what child processes are for: it runs in its own OS process, outside your event loop, and you talk to it through stdio or exit codes. Worker threads run JavaScript inside the same process, and `cluster` forks copies of your own server to share a port; neither runs another executable."
    theoryUrl: https://nodejs.org/api/child_process.html
    options:
      - {
          text: "A worker thread, because it runs the program in parallel inside the same process",
          correct: false,
        }
      - {
          text: "A child process, because it runs a separate executable in its own OS process",
          correct: true,
        }
      - {
          text: "The `cluster` module, because it forks processes that can run any command",
          correct: false,
        }
      - {
          text: "An async function, because `await` moves the program's execution onto the thread pool",
          correct: false,
        }

  - type: single
    prompt: "This handler serves a small config file. Traffic grows to hundreds of requests per second and latency climbs for every endpoint. What is the problem?"
    code: |
      const fs = require('node:fs')

      app.get('/config', (req, res) => {
        const data = fs.readFileSync('./config.json', 'utf8')
        res.json(JSON.parse(data))
      })
    codeLanguage: javascript
    explanation: "`readFileSync` blocks the JS thread for the full duration of the disk read on every request, and nothing else can run meanwhile. Using `fs.promises.readFile`, or better reading the file once at startup and caching it, keeps the loop free. Sync APIs are fine at startup, not in a hot request path."
    theoryUrl: https://nodejs.org/en/learn/asynchronous-work/overview-of-blocking-vs-non-blocking
    options:
      - {
          text: "`JSON.parse` runs on the thread pool, which is too small for hundreds of parses per second",
          correct: false,
        }
      - {
          text: "Each request blocks the JS thread on a synchronous disk read, so all requests queue behind it",
          correct: true,
        }
      - {
          text: "`res.json` cannot stream the response, so large responses hold the socket open too long",
          correct: false,
        }
      - {
          text: "Reading the same file concurrently from many requests corrupts the OS file cache",
          correct: false,
        }

  - type: multi
    prompt: "Which statements about ES modules (ESM), compared with CommonJS, are true? Select all that apply."
    explanation: "ESM `import`/`export` declarations are static, so the module graph is known before any code runs, and ESM supports top-level `await`. Imported names are live bindings to the exporter's variables, not copies. Static `import` declarations must be at the top level; for conditional loading you use dynamic `import()`, which returns a promise."
    theoryUrl: https://nodejs.org/api/esm.html
    options:
      - {
          text: "Imports and exports are static, so the module graph is known before any code runs",
          correct: true,
        }
      - { text: "`await` can be used at the top level of a module", correct: true }
      - {
          text: "Imported names are copies of the exported values taken at import time",
          correct: false,
        }
      - {
          text: "A static `import` declaration can be placed inside an `if` block to load a module conditionally",
          correct: false,
        }

  - type: single
    prompt: "You are starting a new Node project and want all its `.js` files treated as ES modules. What is the clear, explicit way to do that?"
    explanation: 'Setting `"type": "module"` in the nearest `package.json` tells Node that `.js` files in that package are ESM; `.mjs` and `.cjs` extensions can override it file by file. Relying on Node to guess from the syntax is not explicit, and a `use module` directive or a CLI flag per file does not exist as a project setting.'
    theoryUrl: https://nodejs.org/api/packages.html#determining-module-system
    options:
      - { text: "Add a `'use module'` directive at the top of every file", correct: false }
      - { text: 'Set `"type": "module"` in the project''s `package.json`', correct: true }
      - { text: "Rely on Node's guess based on whether the code uses `import`", correct: false }
      - { text: "Always start the app with a flag that turns on ESM mode", correct: false }

  - type: single
    prompt: "Two different files in the same process both import `./db.js`, which creates a connection pool at module level. How many pools are created?"
    explanation: "Node caches a module after it is first loaded and evaluated (by resolved path), so every later import or require gets the same instance. Module-level state is therefore shared across the process, which is why modules often act as natural singletons. Each worker thread or child process, however, has its own module cache."
    theoryUrl: https://nodejs.org/api/modules.html#caching
    options:
      - {
          text: "Two, because each importing file gets its own fresh evaluation of the module",
          correct: false,
        }
      - {
          text: "One, because the module is evaluated once and then served from Node's module cache",
          correct: true,
        }
      - {
          text: "One per request, because modules are re-evaluated whenever the importing code runs",
          correct: false,
        }
      - {
          text: "None until the first query, because Node evaluates modules lazily at first use",
          correct: false,
        }

  - type: single
    prompt: "You publish an internal library and want consumers to import only its public entry points, not reach into files under `src/internal/`. Which `package.json` feature is designed for that?"
    explanation: "The `exports` field defines a package's public entry points; any subpath not listed cannot be imported by consumers, so internals stay private. The older `main` field only names a default entry and does not block deep imports. `files` controls what gets published to npm, not what can be imported."
    theoryUrl: https://nodejs.org/api/packages.html#package-entry-points
    options:
      - {
          text: "The `main` field, which forbids importing any file other than the one it names",
          correct: false,
        }
      - {
          text: "The `exports` field, which defines the entry points and blocks unlisted subpaths",
          correct: true,
        }
      - {
          text: "The `files` field, which hides every unlisted file from consumers at import time",
          correct: false,
        }
      - {
          text: "The `private` field, which marks a package's internal folders as non-importable",
          correct: false,
        }
