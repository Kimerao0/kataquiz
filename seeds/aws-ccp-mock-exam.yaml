version: 1
title: "AWS Cloud Practitioner: Mock exam (CLF-C02)"
description: "A full-length practice exam: 65 scenario questions in the CLF-C02 format, weighted like the real exam across Cloud Concepts, Security and Compliance, Technology and Services, and Billing, Pricing and Support."
language: en
tags: [aws, cloud-practitioner, exam]
run:
  questionsPerRun: 65
  maxErrors: 19
  timePerQuestionSec: 90
questions:
  - type: single
    prompt: "A startup wants to launch a new application but does not want to invest heavily in servers and data centers before it knows how much the application will be used. Which benefit of the AWS Cloud addresses this requirement?"
    explanation: "Trading fixed expense for variable expense lets the startup pay only for the resources it consumes instead of buying capacity up front. Massive economies of scale explains why AWS prices are low, but it does not remove the upfront investment."
    theoryUrl: https://docs.aws.amazon.com/whitepapers/latest/aws-overview/six-advantages-of-cloud-computing.html
    options:
      - { text: "Benefit from massive economies of scale", correct: false }
      - { text: "Trade fixed expense for variable expense", correct: true }
      - { text: "Go global in minutes", correct: false }
      - { text: "Stop spending money running and maintaining data centers", correct: false }
  - type: single
    prompt: "An online retailer used to buy enough servers to survive its holiday peak, leaving most of them idle for the rest of the year. In some years the estimate was too low and the site ran out of capacity. Which advantage of cloud computing removes this problem?"
    explanation: "Stop guessing capacity means you can scale up and down as needed instead of predicting demand in advance. Increasing speed and agility is about provisioning resources quickly for experimentation, not matching capacity to demand."
    theoryUrl: https://docs.aws.amazon.com/whitepapers/latest/aws-overview/six-advantages-of-cloud-computing.html
    options:
      - { text: "Go global in minutes", correct: false }
      - { text: "Increase speed and agility", correct: false }
      - { text: "Stop guessing capacity", correct: true }
      - { text: "Benefit from massive economies of scale", correct: false }
  - type: single
    prompt: "Over the years, AWS has been able to lower its pay-as-you-go prices for many services. Which cloud advantage BEST explains why AWS can offer a lower variable cost than a single company could achieve on its own?"
    explanation: "Usage from hundreds of thousands of customers is aggregated, which gives AWS massive economies of scale and translates into lower prices. Stopping capacity guessing helps customers match demand, but it is not the reason AWS can reduce unit prices."
    theoryUrl: https://docs.aws.amazon.com/whitepapers/latest/aws-overview/six-advantages-of-cloud-computing.html
    options:
      - { text: "Customers can scale capacity up and down within minutes", correct: false }
      - { text: "Customers no longer need to guess their capacity needs", correct: false }
      - {
          text: "AWS passes on the cost of running its own data centers to a single large customer",
          correct: false,
        }
      - {
          text: "Usage from a very large number of customers is aggregated, producing massive economies of scale",
          correct: true,
        }
  - type: single
    prompt: "A development team waits several weeks for the infrastructure group to provision test servers, which slows down experimentation. A company wants to cut this time to minutes and lower the cost of trying new ideas. Which cloud benefit does this describe?"
    explanation: "Increased speed and agility means IT resources are only a click away, reducing provisioning time from weeks to minutes. Going global in minutes is about deploying in multiple Regions for lower latency, not about how quickly resources become available."
    theoryUrl: https://docs.aws.amazon.com/whitepapers/latest/aws-overview/six-advantages-of-cloud-computing.html
    options:
      - { text: "Increase speed and agility", correct: true }
      - { text: "Trade fixed expense for variable expense", correct: false }
      - { text: "Go global in minutes", correct: false }
      - { text: "Benefit from massive economies of scale", correct: false }
  - type: single
    prompt: "A media company based in Europe wants to give customers in Asia a better experience with lower latency, at minimal cost and without building new data centers. Which AWS Cloud advantage does this scenario describe?"
    explanation: "Go global in minutes lets you deploy the application in multiple Regions around the world with a few clicks, bringing it closer to users. Stop guessing capacity concerns matching resources to demand, not proximity to customers."
    theoryUrl: https://docs.aws.amazon.com/whitepapers/latest/aws-overview/six-advantages-of-cloud-computing.html
    options:
      - { text: "Stop guessing capacity", correct: false }
      - { text: "Go global in minutes", correct: true }
      - { text: "Trade fixed expense for variable expense", correct: false }
      - { text: "Increase speed and agility", correct: false }
  - type: single
    prompt: "A company wants its engineers to spend their time building features that differentiate the business instead of racking, stacking, and powering servers. Which advantage of cloud computing supports this goal?"
    explanation: "Stop spending money running and maintaining data centers lets the company focus on its customers rather than on heavy lifting. Economies of scale only describes why AWS can offer lower prices."
    theoryUrl: https://docs.aws.amazon.com/whitepapers/latest/aws-overview/six-advantages-of-cloud-computing.html
    options:
      - { text: "Benefit from massive economies of scale", correct: false }
      - { text: "Increase speed and agility", correct: false }
      - { text: "Stop spending money running and maintaining data centers", correct: true }
      - { text: "Go global in minutes", correct: false }
  - type: single
    prompt: "Which statement BEST describes an AWS Availability Zone?"
    explanation: "An Availability Zone consists of one or more discrete data centers with redundant power, networking, and connectivity, housed in separate facilities. A geographic area that contains multiple Availability Zones is a Region, which is the most common confusion."
    theoryUrl: https://docs.aws.amazon.com/whitepapers/latest/aws-overview/global-infrastructure.html
    options:
      - { text: "A physical location in the world that contains multiple Regions", correct: false }
      - { text: "A site used only to cache content closer to end users", correct: false }
      - { text: "A geographic area that contains multiple Availability Zones", correct: false }
      - {
          text: "One or more discrete data centers with redundant power, networking, and connectivity, in separate facilities within a Region",
          correct: true,
        }
  - type: single
    prompt: "A company runs a production web application on Amazon EC2 and must keep it available if one data center location in the Region fails. Which approach meets this requirement?"
    explanation: "Launching instances in multiple Availability Zones lets instances in another zone handle requests if one location fails. Using a larger instance in a single Availability Zone adds capacity but keeps a single point of failure."
    theoryUrl: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/using-regions-availability-zones.html
    options:
      - { text: "Launch instances in multiple Availability Zones within the Region", correct: true }
      - { text: "Launch one larger instance in a single Availability Zone", correct: false }
      - {
          text: "Launch all instances in a single Availability Zone and rely on instance backups",
          correct: false,
        }
      - { text: "Launch the instances in an AWS Wavelength Zone", correct: false }
  - type: single
    prompt: "A company must keep its customer data in a specific country to satisfy legal requirements. The team launches resources in a Region located in that country. What should the company know about how AWS handles data across Regions?"
    explanation: "Regions are isolated from each other, and AWS does not automatically replicate resources across Regions, so the company controls where its data lives. Availability Zones replicate nothing automatically either; the isolation is a Region-level design."
    theoryUrl: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/using-regions-availability-zones.html
    options:
      - {
          text: "AWS automatically replicates all resources to every other Region for resilience",
          correct: false,
        }
      - {
          text: "AWS automatically replicates resources to the closest Region with a different legal jurisdiction",
          correct: false,
        }
      - {
          text: "Regions are isolated, and resources are not automatically replicated to other Regions",
          correct: true,
        }
      - {
          text: "Resources are visible and shared across all Regions in the console by default",
          correct: false,
        }
  - type: single
    prompt: "A company runs an e-commerce site that automatically adds servers when traffic increases and removes them when traffic drops, so it only pays for what it needs. Which cloud concept does this describe?"
    explanation: "Elasticity is the ability to acquire resources as you need them and release them when you no longer do. High availability is about staying operational during failures, which is a different goal even though both can use the same services."
    theoryUrl: https://docs.aws.amazon.com/whitepapers/latest/aws-overview/six-advantages-of-cloud-computing.html
    options:
      - { text: "High availability", correct: false }
      - { text: "Fault tolerance", correct: false }
      - { text: "Elasticity", correct: true }
      - { text: "Durability", correct: false }
  - type: single
    prompt: "A video game company needs to run latency-sensitive workloads in a large metropolitan area that is far from the nearest AWS Region, using the same AWS APIs and tools. Which AWS infrastructure offering should the company use?"
    explanation: "AWS Local Zones place compute and storage closer to end users as an extension of a Region. AWS Wavelength targets ultra-low latency for 5G mobile devices at carrier networks, which was not requested here."
    theoryUrl: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/using-regions-availability-zones.html
    options:
      - { text: "AWS Outposts", correct: false }
      - { text: "AWS Wavelength Zones", correct: false }
      - { text: "A second Availability Zone in the distant Region", correct: false }
      - { text: "AWS Local Zones", correct: true }
  - type: single
    prompt: "A manufacturer needs to process data on its factory floor with very low latency and wants to use the same AWS services, APIs, and operating model as in the cloud, but running in its own facility. Which AWS offering meets these requirements?"
    explanation: "AWS Outposts brings AWS infrastructure and services to customer premises, operated as part of an AWS Region. Local Zones are AWS-operated sites near cities, not equipment installed in the customer's own facility."
    theoryUrl: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/using-regions-availability-zones.html
    options:
      - { text: "AWS Outposts", correct: true }
      - { text: "AWS Local Zones", correct: false }
      - { text: "Amazon CloudFront edge locations", correct: false }
      - { text: "Additional Availability Zones in the nearest Region", correct: false }
  - type: single
    prompt: "A team ships small, incremental updates several times a day through an automated pipeline, can roll each change back quickly, and reviews every incident to improve its runbooks. Which Well-Architected Framework pillar does this approach MOST directly support?"
    explanation: "Making frequent, small, reversible changes, refining procedures, and learning from operational events are Operational Excellence design principles. Reliability also values automation, but its principles focus on recovering from failure and scaling, not on the operating model."
    theoryUrl: https://docs.aws.amazon.com/wellarchitected/latest/framework/oe-design-principles.html
    options:
      - { text: "Reliability", correct: false }
      - { text: "Operational Excellence", correct: true }
      - { text: "Performance Efficiency", correct: false }
      - { text: "Cost Optimization", correct: false }
  - type: single
    prompt: "A company centralizes identity management, enforces least privilege, and eliminates long-term static credentials for its workloads. Which Well-Architected Framework pillar do these actions belong to?"
    explanation: "Implementing a strong identity foundation, with least privilege and no reliance on long-term static credentials, is a Security pillar design principle. Operational Excellence covers how teams run and evolve workloads, not access control."
    theoryUrl: https://docs.aws.amazon.com/wellarchitected/latest/framework/sec-design.html
    options:
      - { text: "Operational Excellence", correct: false }
      - { text: "Reliability", correct: false }
      - { text: "Security", correct: true }
      - { text: "Sustainability", correct: false }
  - type: single
    prompt: "A company monitors business KPIs so automation can repair failures when a threshold is breached, replaces one large server with several smaller ones, and regularly tests its recovery procedures. Which Well-Architected Framework pillar does this describe?"
    explanation: "Automatically recovering from failure, testing recovery procedures, and scaling horizontally are Reliability design principles. Performance Efficiency also involves scaling, but its principles are about selecting and experimenting with the right technologies."
    theoryUrl: https://docs.aws.amazon.com/wellarchitected/latest/framework/rel-dp.html
    options:
      - { text: "Performance Efficiency", correct: false }
      - { text: "Operational Excellence", correct: false }
      - { text: "Security", correct: false }
      - { text: "Reliability", correct: true }
  - type: single
    prompt: "A team consumes managed machine learning and NoSQL database services instead of learning to run them, uses serverless architectures, and regularly compares different instance types and configurations. Which Well-Architected Framework pillar does this describe?"
    explanation: "Democratizing advanced technologies, using serverless architectures, and experimenting more often are Performance Efficiency design principles. Cost Optimization might be a side effect, but the stated behaviors target using the right technology and configuration."
    theoryUrl: https://docs.aws.amazon.com/wellarchitected/latest/framework/perf-dp.html
    options:
      - { text: "Performance Efficiency", correct: true }
      - { text: "Cost Optimization", correct: false }
      - { text: "Reliability", correct: false }
      - { text: "Operational Excellence", correct: false }
  - type: single
    prompt: "A company stops its development and test environments outside business hours and attributes cloud spend to individual workload owners so each owner can optimize it. Which Well-Architected Framework pillar do these practices support?"
    explanation: "Adopting a consumption model and analyzing and attributing expenditure are Cost Optimization design principles. Sustainability also rewards reducing idle resources, but attributing spend to workload owners is specifically a cost practice."
    theoryUrl: https://docs.aws.amazon.com/wellarchitected/latest/framework/cost-dp.html
    options:
      - { text: "Sustainability", correct: false }
      - { text: "Cost Optimization", correct: true }
      - { text: "Operational Excellence", correct: false }
      - { text: "Performance Efficiency", correct: false }
  - type: single
    prompt: "A company wants to measure the resources and emissions its cloud workload requires per unit of work and set long-term goals to reduce that impact. Which Well-Architected Framework pillar does this activity belong to?"
    explanation: "Understanding your impact and establishing sustainability goals are design principles of the Sustainability pillar. Cost Optimization measures business output versus cost, not environmental impact."
    theoryUrl: https://docs.aws.amazon.com/wellarchitected/latest/framework/sus-design-principles.html
    options:
      - { text: "Cost Optimization", correct: false }
      - { text: "Performance Efficiency", correct: false }
      - { text: "Sustainability", correct: true }
      - { text: "Operational Excellence", correct: false }
  - type: single
    prompt: "A company wants to review its workload against architectural best practices by answering structured questions, identify high-risk issues, and receive an improvement plan at no additional charge. Which AWS offering should the company use?"
    explanation: "The AWS Well-Architected Tool is a free console service that reviews workloads against the Framework pillars and produces an improvement plan. AWS Trusted Advisor inspects the resources in an account, but it does not run a structured architecture review."
    theoryUrl: https://docs.aws.amazon.com/whitepapers/latest/overview-aws-cloud-adoption-framework/welcome.html
    options:
      - { text: "AWS Trusted Advisor", correct: false }
      - { text: "AWS Pricing Calculator", correct: false }
      - { text: "AWS Cloud Adoption Framework", correct: false }
      - { text: "AWS Well-Architected Tool", correct: true }
  - type: single
    prompt: "Which of the following is NOT one of the six pillars of the AWS Well-Architected Framework?"
    explanation: "The six pillars are operational excellence, security, reliability, performance efficiency, cost optimization, and sustainability. Scalability is an important architectural property, but it is not a pillar by itself."
    theoryUrl: https://docs.aws.amazon.com/wellarchitected/latest/framework/the-pillars-of-the-framework.html
    options:
      - { text: "Scalability", correct: true }
      - { text: "Sustainability", correct: false }
      - { text: "Performance Efficiency", correct: false }
      - { text: "Operational Excellence", correct: false }
  - type: single
    prompt: "A company needs to move hundreds of on-premises servers to AWS quickly, with no changes to the applications and minimal disruption. Which migration strategy meets these requirements?"
    explanation: "Rehost, also called lift and shift, moves applications without any changes. Replatform introduces some optimizations, such as moving to a managed service, which adds work the company did not ask for."
    theoryUrl: https://docs.aws.amazon.com/prescriptive-guidance/latest/large-migration-guide/migration-strategies.html
    options:
      - { text: "Replatform", correct: false }
      - { text: "Rehost", correct: true }
      - { text: "Refactor", correct: false }
      - { text: "Repurchase", correct: false }
  - type: single
    prompt: "A company runs a self-managed Microsoft SQL Server database on premises. It wants to move to Amazon RDS for SQL Server to reduce administration, without rewriting the application. Which migration strategy is this?"
    explanation: "Replatform, sometimes called lift, tinker, and shift, moves the workload and adds some optimization such as using a managed database service. Rehost would move the database as-is to a self-managed server on Amazon EC2."
    theoryUrl: https://docs.aws.amazon.com/prescriptive-guidance/latest/large-migration-guide/migration-strategies.html
    options:
      - { text: "Rehost", correct: false }
      - { text: "Refactor", correct: false }
      - { text: "Replatform", correct: true }
      - { text: "Retain", correct: false }
  - type: single
    prompt: "A company decides to replace its aging on-premises customer relationship management application with a vendor-provided software as a service (SaaS) product. Which migration strategy does this represent?"
    explanation: "Repurchase, sometimes called drop and shop, replaces the application with a different product, such as moving from a traditional license to SaaS. Refactor would rebuild the existing application with a cloud-native architecture instead of buying a new one."
    theoryUrl: https://docs.aws.amazon.com/prescriptive-guidance/latest/large-migration-guide/migration-strategies.html
    options:
      - { text: "Refactor", correct: false }
      - { text: "Replatform", correct: false }
      - { text: "Retire", correct: false }
      - { text: "Repurchase", correct: true }
  - type: single
    prompt: "A company has a monolithic application that slows down product releases and cannot scale. The business wants to redesign it into cloud-native microservices to improve agility and scalability, accepting the extra effort. Which migration strategy should the company choose?"
    explanation: "Refactor, or re-architect, modifies the application architecture to take full advantage of cloud-native features, and is the most complex and costly strategy. Replatform only makes limited optimizations and would not remove the monolith."
    theoryUrl: https://docs.aws.amazon.com/prescriptive-guidance/latest/large-migration-guide/migration-strategies.html
    options:
      - { text: "Refactor", correct: true }
      - { text: "Rehost", correct: false }
      - { text: "Replatform", correct: false }
      - { text: "Relocate", correct: false }
  - type: single
    prompt: "During a portfolio assessment, a company finds an internal application that has no business value and no active users. The company wants to eliminate its hosting and maintenance cost. Which migration strategy applies?"
    explanation: "Retire decommissions applications that have no value so their servers can be shut down. Retain keeps an application in the source environment, so the company would still pay to host and maintain it."
    theoryUrl: https://docs.aws.amazon.com/prescriptive-guidance/latest/large-migration-guide/migration-strategies.html
    options:
      - { text: "Retain", correct: false }
      - { text: "Retire", correct: true }
      - { text: "Rehost", correct: false }
      - { text: "Repurchase", correct: false }
  - type: single
    prompt: "A factory application depends on specialized machinery that has no AWS equivalent, and the company is not ready to migrate it. Which migration strategy applies to this application for now?"
    explanation: "Retain keeps applications in the source environment, for example because of unresolved physical dependencies. Retire would decommission the application, which is wrong because it is still needed."
    theoryUrl: https://docs.aws.amazon.com/prescriptive-guidance/latest/large-migration-guide/migration-strategies.html
    options:
      - { text: "Retire", correct: false }
      - { text: "Replatform", correct: false }
      - { text: "Retain", correct: true }
      - { text: "Relocate", correct: false }
  - type: single
    prompt: "A company needs to move an Amazon RDS DB instance to a different AWS account and VPC without changing the application architecture or operations. Which migration strategy describes this activity?"
    explanation: "Relocate moves instances or objects to a different VPC, Region, or account without rewriting applications or changing operations. Replatform would change the underlying platform, such as switching database engines or services."
    theoryUrl: https://docs.aws.amazon.com/prescriptive-guidance/latest/large-migration-guide/migration-strategies.html
    options:
      - { text: "Replatform", correct: false }
      - { text: "Rehost", correct: false }
      - { text: "Refactor", correct: false }
      - { text: "Relocate", correct: true }
  - type: single
    prompt: "A company wants to migrate physical and virtual servers to AWS using continuous block-level replication, with a cutover window of only minutes and no application redesign. Which AWS service should the company use?"
    explanation: "AWS Application Migration Service (MGN) automates lift-and-shift migration of servers through continuous block-level replication. AWS DMS migrates databases, not whole servers."
    theoryUrl: https://docs.aws.amazon.com/mgn/latest/ug/what-is-application-migration-service.html
    options:
      - { text: "AWS Application Migration Service (AWS MGN)", correct: true }
      - { text: "AWS Database Migration Service (AWS DMS)", correct: false }
      - { text: "AWS DataSync", correct: false }
      - { text: "AWS Transfer Family", correct: false }
  - type: single
    prompt: "A company wants to migrate an on-premises Oracle database to Amazon Aurora. The source database must stay operational during the migration, and ongoing changes must be replicated until cutover. Which AWS service meets these requirements?"
    explanation: "AWS DMS can perform one-time migrations or replicate ongoing changes to keep source and target in sync, including heterogeneous migrations. AWS DataSync transfers file and object data, not database changes."
    theoryUrl: https://docs.aws.amazon.com/dms/latest/userguide/Welcome.html
    options:
      - { text: "AWS Application Migration Service (AWS MGN)", correct: false }
      - { text: "AWS Database Migration Service (AWS DMS)", correct: true }
      - { text: "AWS DataSync", correct: false }
      - { text: "Amazon S3 Transfer Acceleration", correct: false }
  - type: single
    prompt: "A company needs to automate and schedule the transfer of data from its on-premises NFS file servers to Amazon S3 over the network, with encryption and data integrity validation. Which AWS service should the company use?"
    explanation: "AWS DataSync moves file or object data between on-premises storage and AWS storage services with encryption and integrity validation. AWS DMS is designed for databases and would not copy file shares."
    theoryUrl: https://docs.aws.amazon.com/datasync/latest/userguide/what-is-datasync.html
    options:
      - { text: "AWS Database Migration Service (AWS DMS)", correct: false }
      - { text: "AWS Application Migration Service (AWS MGN)", correct: false }
      - { text: "AWS DataSync", correct: true }
      - { text: "AWS Well-Architected Tool", correct: false }
  - type: single
    prompt: "A company wants to make sure its cloud investments accelerate its digital transformation goals and business outcomes. The CEO and CFO are the main stakeholders. Which AWS Cloud Adoption Framework (AWS CAF) perspective focuses on this?"
    explanation: "The Business perspective ensures cloud investments accelerate digital transformation and business outcomes, with stakeholders such as the CEO, CFO, COO, CIO, and CTO. The Governance perspective orchestrates initiatives and manages risk and benefits, which is a narrower focus."
    theoryUrl: https://docs.aws.amazon.com/whitepapers/latest/overview-aws-cloud-adoption-framework/business-perspective.html
    options:
      - { text: "Platform", correct: false }
      - { text: "Operations", correct: false }
      - { text: "Governance", correct: false }
      - { text: "Business", correct: true }
  - type: single
    prompt: "A company wants to orchestrate its cloud initiatives while maximizing organizational benefits and minimizing transformation-related risks, including cloud financial management and benefits management. Which AWS CAF perspective covers these capabilities?"
    explanation: "The Governance perspective covers program and project management, benefits management, risk management, and cloud financial management. The Business perspective is about strategy and outcomes rather than control and oversight."
    theoryUrl: https://docs.aws.amazon.com/whitepapers/latest/overview-aws-cloud-adoption-framework/governance-perspective.html
    options:
      - { text: "Governance", correct: true }
      - { text: "Business", correct: false }
      - { text: "People", correct: false }
      - { text: "Security", correct: false }
  - type: single
    prompt: "A company following the AWS CAF has identified capability gaps across the six perspectives and wants to deliver pilot initiatives in production to demonstrate incremental business value. Which cloud transformation phase is this?"
    explanation: "The Launch phase delivers pilot initiatives in production and demonstrates incremental business value. The Scale phase comes afterwards and expands successful pilots to the desired scale."
    theoryUrl: https://docs.aws.amazon.com/whitepapers/latest/overview-aws-cloud-adoption-framework/your-cloud-transformation-journey.html
    options:
      - { text: "Envision", correct: false }
      - { text: "Launch", correct: true }
      - { text: "Scale", correct: false }
      - { text: "Align", correct: false }
  - type: single
    prompt: "Executives at a company want a structured way to identify transformation opportunities, evaluate their cloud readiness, and build an iterative transformation roadmap before migrating. Which AWS resource should they use?"
    explanation: "The AWS Cloud Adoption Framework uses AWS experience and best practices to identify opportunities, evaluate cloud readiness, and evolve a transformation roadmap. The Well-Architected Framework reviews how a specific workload is designed, not organizational readiness."
    theoryUrl: https://docs.aws.amazon.com/whitepapers/latest/overview-aws-cloud-adoption-framework/welcome.html
    options:
      - { text: "AWS Well-Architected Framework", correct: false }
      - { text: "AWS Pricing Calculator", correct: false }
      - { text: "AWS Cloud Adoption Framework (AWS CAF)", correct: true }
      - { text: "AWS Trusted Advisor", correct: false }
  - type: single
    prompt: "A company owns Microsoft SQL Server licenses and wants to reuse them on AWS to lower costs, instead of paying for licenses bundled in the price of the instance. Which licensing model is the company planning to use?"
    explanation: "Bring Your Own License (BYOL) lets you re-purpose existing license inventory for AWS resources. With the license-included model, the license cost is part of the AWS resource price, so existing licenses would not be reused."
    theoryUrl: https://docs.aws.amazon.com/license-manager/latest/userguide/license-manager.html
    options:
      - { text: "License-included", correct: false }
      - { text: "Pay-as-you-go per-second licensing", correct: false }
      - { text: "Spot licensing", correct: false }
      - { text: "Bring Your Own License (BYOL)", correct: true }
  - type: single
    prompt: "A company runs licensed software across several AWS accounts and on-premises servers. It wants to track license usage centrally and set hard or soft limits to avoid overages and compliance penalties. Which AWS service should the company use?"
    explanation: "AWS License Manager tracks licenses across accounts and Regions and enforces rule-based limits on consumption. AWS Organizations manages accounts and policies, but it does not track software license entitlements."
    theoryUrl: https://docs.aws.amazon.com/license-manager/latest/userguide/license-manager.html
    options:
      - { text: "AWS License Manager", correct: true }
      - { text: "AWS Organizations", correct: false }
      - { text: "AWS Config", correct: false }
      - { text: "AWS Marketplace", correct: false }
  - type: single
    prompt: "A company notices that most of its Amazon EC2 instances run at very low CPU utilization. Which approach will MOST cost-effectively reduce spend without affecting performance requirements?"
    explanation: "Rightsizing matches instance types and sizes to actual workload requirements, so paying for unused capacity stops. Purchasing larger instances increases cost and does not address idle capacity."
    theoryUrl: https://docs.aws.amazon.com/cost-management/latest/userguide/ce-rightsizing.html
    options:
      - { text: "Move the workloads to larger instance types", correct: false }
      - {
          text: "Rightsize the instances to smaller types that match actual utilization",
          correct: true,
        }
      - { text: "Move the workloads to Dedicated Hosts", correct: false }
      - { text: "Add more instances to the same workloads", correct: false }
  - type: single
