  - type: single
    prompt: "A company has several AWS accounts for different departments. It wants one bill for all accounts, and wants combined usage to qualify for volume pricing tiers, at no additional fee. What should the company use?"
    explanation: "Consolidated billing in AWS Organizations gives one bill, combines usage across accounts for volume discounts, and is free. AWS Billing Conductor is for custom showback or chargeback pricing and does not change what AWS actually bills."
    theoryUrl: https://docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/consolidated-billing.html
    options:
      - { text: "AWS Billing Conductor", correct: false }
      - { text: "AWS Budgets", correct: false }
      - { text: "AWS Organizations consolidated billing", correct: true }
      - { text: "AWS Marketplace", correct: false }
  - type: single
    prompt: "A company tags every resource with a 'Project' key and wants to see costs per project in AWS Cost Explorer and in the cost allocation report. What must the company do for the tag to appear in billing data?"
    explanation: "User-defined tags must be activated as cost allocation tags in the Billing and Cost Management console before they appear in Cost Explorer or cost allocation reports. Applying the tag to resources alone is not enough."
    theoryUrl: https://docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/cost-alloc-tags.html
    options:
      - {
          text: "Activate the tag as a cost allocation tag in the Billing and Cost Management console",
          correct: true,
        }
      - { text: "Subscribe to AWS Enterprise Support", correct: false }
      - { text: "Create an AWS Budgets cost budget for each tag", correct: false }
      - { text: "Use AWS Pricing Calculator to import the tags", correct: false }
  - type: single
    prompt: "An AWS Partner reselling AWS services needs to show each customer a custom version of its bill with its own markups and discounts, without changing the actual AWS invoice. Which AWS service meets this requirement?"
    explanation: "AWS Billing Conductor creates a second, pro forma version of cost data using custom pricing rules, which supports showback and chargeback. Consolidated billing combines accounts into one bill but cannot apply custom rates."
    theoryUrl: https://docs.aws.amazon.com/billingconductor/latest/userguide/what-is-billingconductor.html
    options:
      - { text: "AWS Cost Explorer", correct: false }
      - { text: "AWS Organizations consolidated billing", correct: false }
      - { text: "AWS Budgets", correct: false }
      - { text: "AWS Billing Conductor", correct: true }
  - type: single
    prompt: "A company runs mission-critical workloads and wants designated Domain Specialist Engineers, continuous workload monitoring, and a five-minute response for critical incidents. Which AWS Support plan meets these requirements?"
    explanation: "AWS Unified Operations provides designated specialists, 24/7 monitoring, and a five-minute context-aware response for critical incidents. Enterprise Support has a designated TAM and 15-minute response, but not the Domain Specialist Engineers or five-minute response."
    theoryUrl: https://docs.aws.amazon.com/awssupport/latest/user/unified-operations-intro.html
    options:
      - { text: "AWS Enterprise Support", correct: false }
      - { text: "AWS Unified Operations", correct: true }
      - { text: "AWS Business Support+", correct: false }
      - { text: "AWS Basic Support", correct: false }
  - type: single
    prompt: "A company wants access to the full set of AWS Trusted Advisor checks, the AWS Support API, and 24/7 phone, web, and chat access to Cloud Support Engineers. It does not need a designated Technical Account Manager. Which AWS Support plan meets these requirements MOST cost-effectively?"
    explanation: "Business Support+ includes all Trusted Advisor checks, the Support API, and 24/7 access to Cloud Support Engineers. Basic Support only gets selected Trusted Advisor checks, and Enterprise Support adds a TAM the company does not need."
    theoryUrl: https://docs.aws.amazon.com/awssupport/latest/user/trusted-advisor.html
    options:
      - { text: "AWS Basic Support", correct: false }
      - { text: "AWS Enterprise Support", correct: false }
      - { text: "AWS Business Support+", correct: true }
      - { text: "AWS Unified Operations", correct: false }
  - type: single
    prompt: "A company runs business-critical workloads and wants a designated Technical Account Manager, up to 15-minute response for production-critical cases, and AWS Countdown event support. It does not need specialized per-workload engineers. Which AWS Support plan meets these requirements MOST cost-effectively?"
    explanation: "Enterprise Support includes a designated TAM, up to 15-minute production-critical response, and Countdown access. Business Support+ has no designated TAM, and Unified Operations adds more than the company needs at a higher cost."
    theoryUrl: https://docs.aws.amazon.com/awssupport/latest/user/aws-support-plans.html
    options:
      - { text: "AWS Enterprise Support", correct: true }
      - { text: "AWS Business Support+", correct: false }
      - { text: "AWS Unified Operations", correct: false }
      - { text: "AWS Basic Support", correct: false }
  - type: single
    prompt: "A security engineer at a company notices that someone is using AWS resources to send spam and launch attacks against the company's website. Which AWS team should the engineer report this abuse to?"
    explanation: "Abuse of AWS resources is reported to the AWS Trust and Safety team. A Technical Account Manager helps with architecture and operations, not abuse handling, and Trusted Advisor only inspects your own account."
    theoryUrl: https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain4.html
    options:
      - { text: "AWS Professional Services", correct: false }
      - { text: "AWS Technical Account Manager", correct: false }
      - { text: "AWS Trusted Advisor", correct: false }
      - { text: "AWS Trust and Safety team", correct: true }
  - type: multi
    prompt: "A company is evaluating AWS Marketplace to buy third-party security software. Which statements about AWS Marketplace are correct? (Select TWO.)"
    explanation: "AWS Marketplace is a curated catalog of third-party software, data, and services, and charges appear on your AWS bill. Products are not all free, and they are not limited to AWS-built software."
    theoryUrl: https://docs.aws.amazon.com/marketplace/latest/buyerguide/what-is-marketplace.html
    options:
      - {
          text: "It is a curated catalog for finding, buying, and deploying third-party software, data, and services.",
          correct: true,
        }
      - { text: "All products listed in it are free of charge.", correct: false }
      - { text: "It only lists software developed by AWS.", correct: false }
      - { text: "Charges for subscribed products appear on the buyer's AWS bill.", correct: true }
      - {
          text: "Buyers must pay each independent software vendor separately by invoice.",
          correct: false,
        }
  - type: multi
    prompt: "A company with only the AWS Basic Support plan wants to know what it already gets. Which items are included with Basic Support? (Select TWO.)"
    explanation: "Basic Support includes 24/7 one-on-one help with account and billing questions, plus documentation, whitepapers, and support forums. A designated TAM and the Support API come with paid plans."
    theoryUrl: https://docs.aws.amazon.com/awssupport/latest/user/aws-support-plans.html
    options:
      - { text: "A designated Technical Account Manager", correct: false }
      - { text: "Access to the AWS Support API", correct: false }
      - { text: "One-on-one responses to account and billing questions", correct: true }
      - { text: "Unlimited technical support cases with Cloud Support Engineers", correct: false }
      - { text: "Documentation, technical papers, and support forums", correct: true }
  - type: multi
    prompt: "A company wants to find self-service guidance for migrating and modernizing its workloads, and a place to ask community questions, without opening a paid engagement. Which resources should it use? (Select TWO.)"
    explanation: "AWS Prescriptive Guidance offers guides and patterns for migration, modernization, and optimization, and AWS re:Post is the community Q&A site. AWS Professional Services is a consulting engagement, not self-service."
    theoryUrl: https://aws.amazon.com/prescriptive-guidance/
    options:
      - { text: "AWS Professional Services", correct: false }
      - { text: "AWS Prescriptive Guidance", correct: true }
      - { text: "AWS Pricing Calculator", correct: false }
      - { text: "AWS Cost Explorer", correct: false }
      - { text: "AWS re:Post", correct: true }
  - type: multi
    prompt: "A company's operations team wants to know how an AWS service event affects its own resources. Which statements about the AWS Health Dashboard are correct? (Select TWO.)"
    explanation: "The AWS Health Dashboard is available to all customers at no extra cost with no setup, and it reports events that affect your account. Using the Health API for integrations needs a paid plan such as Business Support+, not Basic."
    theoryUrl: https://docs.aws.amazon.com/health/latest/ug/what-is-aws-health.html
    options:
      - { text: "It requires an Enterprise Support plan to view.", correct: false }
      - { text: "It replaces Trusted Advisor for cost optimization checks.", correct: false }
      - {
          text: "It is available to all AWS customers at no additional cost, with no setup.",
          correct: true,
        }
      - { text: "It can be used with Basic Support to call the AWS Health API.", correct: false }
      - {
          text: "It shows AWS Health events that may affect the customer's own resources and applications.",
          correct: true,
        }
  - type: multi
    prompt: "A software company is joining the AWS Partner Network as an independent software vendor. Which benefits can partners expect? (Select TWO.)"
    explanation: "Partners get training and certification and access to partner events. AWS does not waive usage charges or provide free Enterprise Support to all partners."
    theoryUrl: https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain4.html
    options:
      - { text: "Waiver of all AWS usage charges", correct: false }
      - { text: "Partner training and certification", correct: true }
      - { text: "Free AWS Enterprise Support for every partner", correct: false }
      - { text: "Partner events", correct: true }
      - { text: "Exemption from the AWS Acceptable Use Policy", correct: false }
