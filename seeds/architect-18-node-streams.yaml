version: 1
title: "Architect Roadmap 18: Node.js streams"
description: Readable, writable, duplex and transform streams, backpressure, pipeline, flowing vs paused mode and stream composition.
language: en
tags: [architect-roadmap, nodejs, streams, backpressure, pipeline]
run:
  questionsPerRun: 10
  maxErrors: 3
  timePerQuestionSec: 90
questions:
  - type: single
    prompt: "Which pairing of stream type and example is correct?"
    explanation: "`net.Socket` is a Duplex (independent read and write sides), `zlib.createGzip()` is a Transform (output derived from input), `fs.createReadStream` is a Readable and `http.ServerResponse` is a Writable. The common mix-up is calling a socket a Transform: its two sides are not related to each other."
    theoryUrl: https://nodejs.org/api/stream.html#types-of-streams
    options:
      - {
          text: "`net.Socket` is a Transform, because it converts requests into responses",
          correct: false,
        }
      - {
          text: "`fs.createReadStream()` is a Duplex, because it reads and then closes the file",
          correct: false,
        }
      - {
          text: "`zlib.createGzip()` is a Transform, as its output is computed from its input",
          correct: true,
        }
      - {
          text: "`http.ServerResponse` is a Readable, because the client reads from it",
          correct: false,
        }
  - type: single
    prompt: "What is the difference between a Duplex stream and a Transform stream?"
    explanation: "A Duplex has two independent channels, so what you write has no required relation to what you read (a TCP socket). A Transform is a Duplex whose readable side is computed from what was written to the writable side (gzip, encryption, parsing). Both are bidirectional, and both support backpressure."
    theoryUrl: https://nodejs.org/api/stream.html#duplex-and-transform-streams
    options:
      - {
          text: "Transform is a Duplex whose output is derived from its input, while Duplex sides are independent",
          correct: true,
        }
      - {
          text: "Duplex is for binary data and Transform is only for strings or objects",
          correct: false,
        }
      - {
          text: "Duplex supports backpressure, but Transform does not, as it processes chunks in place",
          correct: false,
        }
      - {
          text: "A Transform can only be piped once, while a Duplex can be piped many times",
          correct: false,
        }
  - type: single
    prompt: "In Node.js streams, what does backpressure mean?"
    explanation: "Backpressure is the mechanism that slows down a fast producer when the consumer cannot keep up, so that the buffered data stays bounded. It is signalled by `write()` returning `false` and the `drain` event. It is not an error condition and not a compression technique."
    theoryUrl: https://nodejs.org/en/learn/modules/backpressuring-in-streams
    options:
      - {
          text: "An error raised when a stream receives data after it has been closed",
          correct: false,
        }
      - {
          text: "Compressing the data in the internal buffer when it grows past the limit",
          correct: false,
        }
      - {
          text: "A signal that makes a fast producer pause until a slow consumer catches up",
          correct: true,
        }
      - {
          text: "A retry policy that re-sends chunks the consumer failed to process",
          correct: false,
        }
  - type: single
    prompt: "What does this script print?"
    code: |
      const { Writable } = require('node:stream')

      const w = new Writable({
        highWaterMark: 3,
        write(chunk, enc, cb) { setTimeout(cb, 10) },
      })

      console.log(w.write('ab'))
      console.log(w.write('cd'))
      console.log(w.write('e'))
      w.on('drain', () => console.log('drain'))
    codeLanguage: javascript
    explanation: "`write()` returns `false` when the buffered bytes reach or exceed `highWaterMark`. 2 bytes is below 3 (true), 4 bytes is above (false), and 5 as well. The data is still accepted, `false` is just a request to stop writing. Once the buffer is flushed the `drain` event fires."
    theoryUrl: https://nodejs.org/api/stream.html#writablewritechunk-encoding-callback
    options:
      - { text: "true, true, false, then drain", correct: false }
      - { text: "false, false, false, then drain", correct: false }
      - { text: "true, false, false, then drain", correct: true }
      - { text: "true, false, false, and drain never fires", correct: false }
  - type: single
    prompt: "A producer loops `for (const row of rows) writable.write(row)` and ignores the return value. The writable is slow (it writes to a remote disk). What is the most likely consequence with a large `rows` list?"
    explanation: "`write()` never blocks or drops data: when the consumer is slow, the chunks pile up in the writable's internal buffer, so memory grows with the backlog. The right pattern is to stop when `write()` returns `false` and resume on `drain` (or use `pipeline`). The data is not dropped, and no error is raised automatically."
    theoryUrl: https://nodejs.org/en/learn/modules/backpressuring-in-streams
    options:
      - {
          text: "Excess chunks are silently dropped once the buffer reaches the high water mark",
          correct: false,
        }
      - {
          text: "Node throws `ERR_STREAM_WRITE_AFTER_END` as soon as the buffer is full",
          correct: false,
        }
      - {
          text: "The loop blocks inside `write()` until the remote disk has accepted each row",
          correct: false,
        }
      - {
          text: "Memory usage grows with the unflushed backlog, as nothing slows down the loop",
          correct: true,
        }
  - type: boolean
    prompt: "`highWaterMark` is a hard limit: a stream refuses to buffer more than that many bytes."
    answer: false
    explanation: "It is a threshold that triggers backpressure signals, not a cap. `write()` still accepts data above it and returns `false`, and a `Readable` may buffer slightly more than the mark. A producer that ignores the signal can exceed it arbitrarily."
    theoryUrl: https://nodejs.org/api/stream.html#buffering
  - type: single
    prompt: "What does this script print?"
    code: |
      const { Readable, Transform, Writable, pipeline } = require('node:stream')

      const upper = new Transform({
        transform(chunk, enc, cb) { cb(null, chunk.toString().toUpperCase()) },
        flush(cb) { this.push('!'); cb() },
      })

      const out = []
      pipeline(
        Readable.from(['a', 'b', 'c']),
        upper,
        new Writable({ write(c, e, cb) { out.push(c.toString()); cb() } }),
        (err) => console.log(err ? 'failed' : out.join('')),
      )
    codeLanguage: javascript
    explanation: "Each chunk is upper-cased by `transform`. `flush` runs once, after the writable side has ended and before the readable side ends, and lets the transform emit trailing data, here the `!`. The pipeline callback fires when everything is finished, so it prints `ABC!`."
    theoryUrl: https://nodejs.org/api/stream.html#transform_flushcallback
    options:
      - { text: "!ABC", correct: false }
      - { text: "ABC", correct: false }
      - { text: "ABC!", correct: true }
      - { text: "abc!", correct: false }
  - type: single
    prompt: "What does this script print?"
    code: |
      const { Readable, Writable, pipeline } = require('node:stream')

      const src = new Readable({ read() {} })
      const dst = new Writable({ write(c, e, cb) { cb() } })
      dst.on('close', () => console.log('dst closed'))

      pipeline(src, dst, (err) => console.log('pipeline cb:', err && err.message))
      src.destroy(new Error('source broke'))
    codeLanguage: javascript
    explanation: "`pipeline` forwards the failure to the final callback and destroys every other stream in the chain, so the destination is cleaned up (`close` is emitted) before the callback receives the error. This automatic cleanup is the main reason to prefer `pipeline` over `.pipe()`."
    theoryUrl: https://nodejs.org/api/stream.html#streampipelinesource-transforms-destination-callback
    options:
      - { text: "pipeline cb: source broke, and dst stays open", correct: false }
      - { text: "dst closed, then pipeline cb: source broke", correct: true }
      - {
          text: "pipeline cb: undefined, since the source was destroyed, not ended",
          correct: false,
        }
      - { text: "Nothing, as the error is unhandled and the process crashes", correct: false }
  - type: single
    prompt: "Same setup as a plain `src.pipe(dst)` (no `pipeline`), then `src.destroy(new Error('source broke'))` with an error listener on `src`. What happens to `dst`?"
    code: |
      const { Readable, Writable } = require('node:stream')

      const src = new Readable({ read() {} })
      const dst = new Writable({ write(c, e, cb) { cb() } })

      src.pipe(dst)
      src.on('error', (e) => console.log('src error:', e.message))
      src.destroy(new Error('source broke'))

      setTimeout(() => console.log('dst destroyed?', dst.destroyed), 50)
    codeLanguage: javascript
    explanation: "`.pipe()` handles backpressure but does not propagate errors or destroy the destination. After the source fails, `dst` is left open (a leaked file descriptor or socket in real code), and it prints `dst destroyed? false`. `pipeline` (or `stream/promises`) fixes that."
    theoryUrl: https://nodejs.org/api/stream.html#readablepipedestination-options
    options:
      - {
          text: "It is destroyed too, since pipe forwards errors to the destination",
          correct: false,
        }
      - { text: "It is ended cleanly, so `finish` is emitted", correct: false }
      - { text: "It is left open and not destroyed, so the app must clean it up", correct: true }
      - { text: "The process exits with an uncaught error from `dst`", correct: false }
  - type: single
    prompt: "What does this script print?"
    code: |
      const { Readable } = require('node:stream')

      const r = Readable.from(['a', 'b'])
      r.on('end', () => console.log('end'))
      console.log('flowing =', r.readableFlowing)
      r.on('data', (c) => console.log('data', c))
      console.log('flowing =', r.readableFlowing)
    codeLanguage: javascript
    explanation: "A new readable starts with `readableFlowing === null`: it is not flowing and not explicitly paused, and attaching only an `end` listener does not change that. Adding a `data` listener switches it to flowing mode, so the second log prints `true`. The chunks themselves arrive asynchronously, afterwards."
    theoryUrl: https://nodejs.org/api/stream.html#three-states
    options:
      - { text: "flowing = false, flowing = true, data a, data b, end", correct: false }
      - { text: "flowing = null, flowing = true, data a, data b, end", correct: true }
      - { text: "data a, data b, end, flowing = true, flowing = true", correct: false }
      - { text: "flowing = null, flowing = null, data a, data b, end", correct: false }
  - type: multi
    prompt: "Which actions switch a Readable into flowing mode? Select all that apply."
    explanation: "Attaching a `data` listener, calling `resume()` and calling `pipe()` all start flowing mode. Attaching a `readable` listener does the opposite: it switches to paused mode, where you pull chunks with `read()`. Listening to `end` alone has no effect on the mode."
    theoryUrl: https://nodejs.org/api/stream.html#two-reading-modes
    options:
      - { text: "Attaching a `data` event listener", correct: true }
      - { text: "Attaching a `readable` event listener", correct: false }
      - { text: "Calling `readable.resume()`", correct: true }
      - { text: "Calling `readable.pipe(destination)`", correct: true }
  - type: single
    prompt: "What does this script print?"
    code: |
      const { Readable } = require('node:stream')

      const r = new Readable({ read() {} })
      r.push('hello')
      r.push('world')
      r.push(null)

      r.on('readable', () => {
        let chunk
        while ((chunk = r.read()) !== null) console.log('read', chunk.toString())
      })
      r.on('end', () => console.log('end'))
    codeLanguage: javascript
    explanation: "In paused mode with no size argument, `read()` returns all the buffered data as one chunk, so the two pushes are concatenated: `read helloworld`. Chunk boundaries are not preserved for byte streams, which is why parsers must not rely on them. `end` fires after `read()` returns null and the stream is drained."
    theoryUrl: https://nodejs.org/api/stream.html#readablereadsize
    options:
      - { text: "read hello, read world, end", correct: false }
      - { text: "read helloworld, end", correct: true }
      - { text: "end, read helloworld", correct: false }
      - { text: "read hello, end", correct: false }
  - type: single
    prompt: "What does this script print?"
    code: |
      const { Readable } = require('node:stream')

      async function main() {
        const r = Readable.from(['a', 'b', 'c'])
        for await (const chunk of r) {
          console.log('chunk', chunk)
          if (chunk === 'b') break
        }
        console.log('destroyed:', r.destroyed)
      }
      main()
    codeLanguage: javascript
    explanation: "Readable streams are async iterables, and leaving a `for await` loop early with `break` destroys the stream, which releases its resources (file handles, sockets). So `c` is never read and the final line prints `destroyed: true`."
    theoryUrl: https://nodejs.org/api/stream.html#readable-symbolasynciterator
    options:
      - { text: "chunk a, chunk b, destroyed: false", correct: false }
      - { text: "chunk a, chunk b, chunk c, destroyed: true", correct: false }
      - { text: "chunk a, chunk b, destroyed: true", correct: true }
      - {
          text: "chunk a, chunk b, and an error, since a for-await cannot be interrupted",
          correct: false,
        }
  - type: single
    prompt: "What does this script print?"
    code: |
      const { Readable, Writable } = require('node:stream')

      const r = new Readable({ read() {} })
      const w = new Writable({ write(c, e, cb) { cb() } })

      r.on('end', () => console.log('readable: end'))
      w.on('finish', () => console.log('writable: finish'))

      r.pipe(w)
      r.push('x')
      r.push(null)
    codeLanguage: javascript
    explanation: "`end` belongs to the readable side: it is emitted once all data has been consumed. `pipe` then calls `w.end()` in response to that `end`, and the writable emits `finish` after flushing. So `finish` can only come after `end`. They are two different events on two different streams."
    theoryUrl: https://nodejs.org/api/stream.html#event-finish
    options:
      - { text: "writable: finish, then readable: end", correct: false }
      - { text: "readable: end, then writable: finish", correct: true }
      - { text: "Only readable: end, since `finish` is for Transform streams only", correct: false }
      - {
          text: "Only writable: finish, since `end` fires only on streams with no destination",
          correct: false,
        }
  - type: single
    prompt: "What does this script print?"
    code: |
      const { Readable } = require('node:stream')
      const { pipeline } = require('node:stream/promises')

      async function* double(source) {
        for await (const n of source) yield n * 2
      }

      async function main() {
        const out = []
        await pipeline(Readable.from([1, 2, 3]), double, async function (src) {
          for await (const n of src) out.push(n)
        })
        console.log(out)
      }
      main()
    codeLanguage: javascript
    explanation: "`pipeline` from `stream/promises` accepts async generator functions as transform stages and an async function as the final sink, and it returns a promise that resolves when the whole chain finishes. The generator doubles each number, so the sink collects `[2, 4, 6]`. Backpressure still applies between the stages."
    theoryUrl: https://nodejs.org/api/stream.html#streams-promises-api
    options:
      - { text: "[1, 2, 3]", correct: false }
      - { text: "[2, 4, 6]", correct: true }
      - { text: "[], since the promise resolves before the stages run", correct: false }
      - { text: "It throws, as generator functions are not valid pipeline stages", correct: false }
  - type: single
    prompt: "What does this script print?"
    code: |
      const { Writable } = require('node:stream')

      const w = new Writable({
        objectMode: true,
        highWaterMark: 2,
        write(obj, enc, cb) { setTimeout(cb, 5) },
      })

      const results = []
      for (const x of ['1', '2', '3']) results.push(w.write(x))
      console.log(results)
    codeLanguage: javascript
    explanation: "In `objectMode`, `highWaterMark` counts objects, not bytes. After the first write 1 object is buffered (below 2, true), after the second 2 are pending (reaching the mark, false), and the third is accepted but also returns false."
    theoryUrl: https://nodejs.org/api/stream.html#object-mode
    options:
      - { text: "[true, true, false]", correct: false }
      - { text: "[true, false, false]", correct: true }
      - { text: "[true, true, true]", correct: false }
      - { text: "[false, false, false]", correct: false }
  - type: single
    prompt: "A report job must compute statistics over a 4 GB log file on a server with 1 GB of RAM. Which approach is appropriate?"
    explanation: "Streaming processes the file in small chunks, so memory stays flat regardless of file size. `fs.createReadStream` with `readline` (or a line-splitting Transform) keeps only one line at a time. `readFile` would try to load 4 GB, and raising `--max-old-space-size` doesn't change that buffers are limited and the machine is out of RAM."
    theoryUrl: https://nodejs.org/api/readline.html
    options:
      - {
          text: "`fs.promises.readFile`, then split the content into lines in memory",
          correct: false,
        }
      - {
          text: "`fs.createReadStream` piped through a line parser, updating counters per line",
          correct: true,
        }
      - {
          text: "Read the file with `readFileSync` in a worker thread so it doesn't block",
          correct: false,
        }
      - {
          text: "Raise `--max-old-space-size` to 4 GB so that the whole file fits in memory",
          correct: false,
        }
  - type: single
    prompt: "An HTTP endpoint serves large video files from disk. Which implementation is the most robust and memory-friendly?"
    explanation: "`pipeline(fs.createReadStream(path), res, cb)` streams in chunks, applies backpressure to slow clients and destroys the file stream if the client disconnects, so no file descriptors leak. `readFile` buffers the whole video per request, and a manual `data`/`write` loop without `drain` handling ignores backpressure."
    theoryUrl: https://nodejs.org/en/learn/modules/backpressuring-in-streams
    options:
      - {
          text: "`res.end(await fs.promises.readFile(path))`, which is simple and fast enough",
          correct: false,
        }
      - {
          text: "`stream.on('data', (c) => res.write(c))`, which streams without any buffering",
          correct: false,
        }
      - {
          text: "`pipeline(fs.createReadStream(path), res, callback)`, so cleanup and backpressure are handled",
          correct: true,
        }
      - {
          text: "`fs.createReadStream(path).pipe(res)`, since pipe also destroys the file on client disconnect",
          correct: false,
        }
  - type: single
    prompt: "You must read a large file, gzip it and upload it to object storage, all with bounded memory. How do you compose this?"
    explanation: "A chain `source -> Transform -> destination` through `pipeline` lets each stage process chunks as they arrive, with backpressure between every pair and cleanup on error. Gzipping first with `zlib.gzipSync` or reading everything into a buffer would load the whole file in memory."
    theoryUrl: https://nodejs.org/api/zlib.html
    options:
      - {
          text: "`pipeline(createReadStream(f), zlib.createGzip(), uploadStream, cb)`",
          correct: true,
        }
      - {
          text: "`zlib.gzipSync(fs.readFileSync(f))`, then upload the resulting buffer",
          correct: false,
        }
      - {
          text: "Gzip each chunk in `data` handlers and upload them in parallel, without ordering",
          correct: false,
        }
      - {
          text: "Read it with `readFile`, then stream the buffer through `zlib.createGzip()`",
          correct: false,
        }
  - type: single
    prompt: "You are building a Transform that parses CSV lines into JavaScript objects, which a downstream stage then validates and inserts into a database. Which mode do you use?"
    explanation: "The readable side of the parser emits objects, so the stream must be created with `readableObjectMode: true` (or `objectMode: true`). Without it, only strings/Buffers are allowed and pushing an object throws. Plain `JSON.stringify` on each chunk would add a wasteful serialise/parse round trip."
    theoryUrl: https://nodejs.org/api/stream.html#object-mode
    options:
      - { text: "Default byte mode, pushing each parsed object as is", correct: false }
      - { text: "Object mode on the readable side, so each chunk is one row object", correct: true }
      - {
          text: "Byte mode, serialising every row with `JSON.stringify` and re-parsing it later",
          correct: false,
        }
      - {
          text: "A Duplex, because Transform streams cannot emit anything but Buffers",
          correct: false,
        }
  - type: single
    prompt: "A custom `Writable` inserts each incoming row into a database and calls the `write` callback immediately, without waiting for the insert to finish. The source is a fast file stream. What is the problem?"
    explanation: "The stream calls `write` again as soon as you call the callback. Calling it right away tells the stream you are always ready, so backpressure never triggers and unfinished inserts pile up in memory and in the DB pool. The callback must be invoked only when the insert has completed (or failed)."
    theoryUrl: https://nodejs.org/api/stream.html#writable_writechunk-encoding-callback
    options:
      - {
          text: "Nothing, since the stream waits for the next tick before calling `write` again",
          correct: false,
        }
      - {
          text: "Backpressure is defeated, so pending inserts accumulate without any limit",
          correct: true,
        }
      - {
          text: "Node reorders the rows, so the database receives them in a random order",
          correct: false,
        }
      - {
          text: "The stream closes itself after the first row, because the callback was synchronous",
          correct: false,
        }
  - type: boolean
    prompt: "In a custom Transform, if `transform(chunk, enc, cb)` never calls `cb`, the stream stalls and no further chunks are processed."
    answer: true
    explanation: "The callback signals that the chunk has been handled; until it is called the Transform does not accept the next chunk, so the pipeline hangs without any error. Always call `cb`, with an error argument on failure."
    theoryUrl: https://nodejs.org/api/stream.html#transform_transformchunk-encoding-callback
  - type: boolean
    prompt: "`Readable.from(iterable)` can turn an array or an async generator into a stream."
    answer: true
    explanation: "`Readable.from` accepts any iterable or async iterable and produces a Readable (in object mode by default). It is a convenient way to feed generators and in-memory data into a `pipeline`, and the stream respects backpressure by pulling from the iterator."
    theoryUrl: https://nodejs.org/api/stream.html#streamreadablefromiterable-options
  - type: single
    prompt: "Why is `a.pipe(b).pipe(c).pipe(d)` considered a fragile way of composing a chain of streams?"
    explanation: "Each `.pipe()` only wires data and backpressure. An error in any stage does not destroy the others, so file handles and sockets stay open, and there is no single place to observe completion or failure. `pipeline(a, b, c, d, cb)` gives one callback and destroys all streams on the first error."
    theoryUrl: https://nodejs.org/api/stream.html#streampipelinesource-transforms-destination-callback
    options:
      - { text: "`pipe` disables backpressure after the second stage in the chain", correct: false }
      - {
          text: "`pipe` copies each chunk, so memory use doubles for every extra stage",
          correct: false,
        }
      - {
          text: "Errors are not propagated or cleaned up across stages, so streams can leak",
          correct: true,
        }
      - {
          text: "Chained `pipe` calls reorder chunks when one stage is slower than the others",
          correct: false,
        }
  - type: single
    prompt: "For a stream created with `objectMode: true` and no explicit `highWaterMark`, what does the default threshold of 16 refer to?"
    explanation: "In object mode the high water mark counts buffered objects (16 by default), regardless of their size, while in byte mode it counts bytes. A consequence is that 16 huge objects can still use a lot of memory, so size the mark to the weight of your objects."
    theoryUrl: https://nodejs.org/api/stream.html#object-mode
    options:
      - { text: "16 kilobytes of serialised data, as in byte mode", correct: false }
      - { text: "16 objects buffered, whatever their individual size", correct: true }
      - { text: "16 chunks per second before the stream starts throttling", correct: false }
      - {
          text: "16 concurrent write callbacks that may be pending at the same time",
          correct: false,
        }
