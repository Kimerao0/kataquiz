version: 1
title: "Architect Roadmap 18: Node.js streams"
description: Why streams exist, readable, writable, duplex and transform streams, backpressure, pipeline versus manual piping, object mode, push and pull consumption and streaming scenarios.
language: en
tags: [architect-roadmap, nodejs, streams, backpressure, pipeline]
run:
  questionsPerRun: 10
  maxErrors: 3
  timePerQuestionSec: 60
questions:
  - type: single
    prompt: "A service must compute a checksum of 3 GB backup files on a machine with 1 GB of free RAM. Why is a stream the right tool here?"
    explanation: "A stream hands you the file in small chunks, so the checksum can be updated chunk by chunk while memory stays at roughly the size of a few chunks, whatever the file size. Reading the whole file into one buffer needs the full 3 GB at once. Streams do not make the disk faster or skip work: every byte is still read and hashed."
    theoryUrl: https://nodejs.org/en/learn/modules/how-to-use-streams
    options:
      - { text: "Peak memory stays bounded by chunk size rather than file size", correct: true }
      - {
          text: "Streams read the disk faster because they bypass the OS page cache",
          correct: false,
        }
      - {
          text: "The checksum is only computed over a sample of the chunks, so far less data has to be read",
          correct: false,
        }
      - { text: "Streams compress data in memory, so 3 GB fits into 1 GB", correct: false }
  - type: single
    prompt: "An endpoint builds a 200 MB CSV report from database rows. Today it builds the whole string and then sends it, and users stare at a blank download for 40 seconds. What does switching to a streamed response improve most directly?"
    explanation: "With streaming, the first rows go out as soon as they are produced, so the download starts almost immediately (better time to first byte) and the server never holds the full report in memory. The total time to generate every row stays roughly the same: the work is overlapped with sending, not removed."
    theoryUrl: https://nodejs.org/en/learn/modules/how-to-use-streams
    options:
      - {
          text: "The total time to generate all rows drops, because streaming makes the database queries cheaper",
          correct: false,
        }
      - { text: "Time to first byte, plus lower peak memory on the server", correct: true }
      - {
          text: "The report gets smaller, because streams deduplicate repeated rows",
          correct: false,
        }
      - {
          text: "Only the client's memory, since the server still has to build the whole report before sending",
          correct: false,
        }
  - type: multi
    prompt: "In which of these situations are streams a good fit? Select all that apply."
    explanation: "Streams pay off when data is large, unbounded or arrives over time: big files, proxying a response you do not want to buffer, and continuous sources like a growing log. A 2 KB config file is read once and fits in memory trivially, so `readFile` plus `JSON.parse` is simpler and just as good."
    theoryUrl: https://nodejs.org/en/learn/modules/how-to-use-streams
    options:
      - { text: "Gzipping 10 GB of nightly log archives", correct: true }
      - { text: "Proxying a large upstream HTTP response to the client", correct: true }
      - { text: "Following a log file that keeps growing and forwarding new lines", correct: true }
      - { text: "Loading a 2 KB JSON config file once at startup", correct: false }
  - type: boolean
    prompt: "Processing a file as a stream usually needs less total CPU work than reading it into memory first and processing it in one go."
    answer: false
    explanation: "Streams change when and in what size pieces the work happens, not how much work there is: every byte is still read and processed. The gains are bounded memory and earlier output. Chunking even adds a little overhead per chunk."
    theoryUrl: https://nodejs.org/en/learn/modules/how-to-use-streams
  - type: single
    prompt: "You are wrapping a TCP connection to a custom protocol server: you send commands and, independently, receive notifications that are not replies to what you sent. Which stream type fits?"
    explanation: "A Duplex has a readable and a writable side that are independent, which is exactly a network connection where incoming data is not computed from outgoing data. A Transform is for output derived from input, like gzip. A Readable or Writable alone covers only one direction."
    theoryUrl: https://nodejs.org/api/stream.html#types-of-streams
    options:
      - { text: "Duplex", correct: true }
      - { text: "Transform, because data flows both ways through the socket", correct: false }
      - { text: "Readable, with commands sent by a separate HTTP call", correct: false }
      - { text: "Writable, because commands are written to the server", correct: false }
  - type: single
    prompt: "You need a stage that receives raw CSV text and emits one parsed record object per line, to sit between a file reader and a database writer. Which stream type do you implement?"
    explanation: "Output computed from input is the definition of a Transform: CSV text goes in, records come out. A plain Duplex would force you to connect the two sides yourself. A Writable would consume the text but give the next stage nothing to read, and a Readable would have no input side."
    theoryUrl: https://nodejs.org/api/stream.html#implementing-a-transform-stream
    options:
      - {
          text: "A Writable that parses each line and keeps the records in an array",
          correct: false,
        }
      - {
          text: "A Transform, as its output records are derived from the input text",
          correct: true,
        }
      - { text: "A Readable that reads the file itself and parses it inside", correct: false }
      - { text: "A Duplex with unrelated sides, wired to each other by hand", correct: false }
  - type: single
    prompt: "The last stage of an import job receives record objects and inserts them into a database. Nothing reads from this stage afterwards. Which stream type is it?"
    explanation: "A stage that only consumes data and produces nothing for a further stage is a Writable, the end of the chain. Its write function should finish the insert before signalling it is ready for more, so the database's pace propagates back up the pipeline."
    theoryUrl: https://nodejs.org/api/stream.html#implementing-a-writable-stream
    options:
      - { text: "A Readable, since it reads records from the previous stage", correct: false }
      - {
          text: "A Transform that emits the inserted ids, even if nobody reads them",
          correct: false,
        }
      - { text: "A Writable, as it is the sink at the end of the chain", correct: true }
      - { text: "A Duplex, because the database also sends acknowledgements back", correct: false }
  - type: single
    prompt: "In Node.js streams, what is backpressure?"
    explanation: "Backpressure is the feedback that lets a slow consumer tell a fast producer to stop sending until it catches up, so buffers stay bounded. It is not an error or a speed limit: it is flow control between stages. Without it, the gap between producer and consumer speed accumulates in memory."
    theoryUrl: https://nodejs.org/en/learn/modules/backpressuring-in-streams
    options:
      - {
          text: "An error raised when a stream receives more data than its buffer size allows",
          correct: false,
        }
      - {
          text: "A slow consumer signalling the producer to pause until it catches up",
          correct: true,
        }
      - {
          text: "A fixed throughput cap configured on each stream in bytes per second",
          correct: false,
        }
      - {
          text: "The delay the OS adds to disk writes when the page cache is full and must flush",
          correct: false,
        }
  - type: single
    prompt: "A script reads 50 million rows from a fast local file and writes them to a slow remote API stream, calling `write()` for every row and ignoring what it returns. What typically happens?"
    explanation: "When the consumer is slower, every unsent row waits in the writable's internal buffer. Ignoring the signal to slow down means that buffer grows with the speed difference, so memory climbs until the process slows to a crawl in GC or crashes. Nothing drops data or blocks the loop for you."
    theoryUrl: https://nodejs.org/en/learn/modules/backpressuring-in-streams
    options:
      - { text: "Excess rows are silently dropped once the buffer is full", correct: false }
      - {
          text: "`write()` blocks the event loop until the remote side has caught up",
          correct: false,
        }
      - {
          text: "Memory grows with the backlog until the process struggles or crashes",
          correct: true,
        }
      - {
          text: "Node automatically throttles the file read to match the API's speed",
          correct: false,
        }
  - type: single
    prompt: "You write a producer by hand that pushes data into a writable stream. The writable signals that its buffer is above its threshold. What should a well-behaved producer do?"
    explanation: "The contract is cooperative: stop producing and resume when the writable reports its buffer has drained. Ending the stream loses the rest of the data, and retrying or shrinking chunks does not reduce the backlog. Using `pipeline` gives you this behaviour without writing it yourself."
    theoryUrl: https://nodejs.org/api/stream.html#event-drain
    options:
      - { text: "Stop writing and resume once the writable reports it has drained", correct: true }
      - {
          text: "End the writable and open a new one to start with an empty buffer",
          correct: false,
        }
      - {
          text: "Keep writing, but split the data into smaller chunks so each one fits under the threshold",
          correct: false,
        }
      - { text: "Write the same chunk again until the writable accepts it", correct: false }
  - type: single
    prompt: "This code copies a fast local file to a slow network upload. What is the main problem with it?"
    code: |
      source.on('data', (chunk) => {
        upload.write(chunk)
      })
      source.on('end', () => upload.end())
    explanation: "The `data` handler keeps writing regardless of whether the upload can keep up, so backpressure is ignored and unsent data piles up in memory. It also has no error handling: if either stream fails, the other is not closed. `pipeline(source, upload)` handles both. Chunk order is preserved and `end` does fire, so those are not the issue."
    theoryUrl: https://nodejs.org/en/learn/modules/backpressuring-in-streams
    options:
      - {
          text: "Chunks can arrive at the upload out of order, because each `write` runs on its own thread",
          correct: false,
        }
      - { text: "It ignores backpressure and has no error handling or cleanup", correct: true }
      - { text: "The `end` event never fires while a `data` listener is attached", correct: false }
      - {
          text: "It reads the whole file into memory before the first `write` call",
          correct: false,
        }
  - type: single
    prompt: "Why is `pipeline(a, b, c, callback)` preferred over chaining `a.pipe(b).pipe(c)` in production code?"
    explanation: "Both respect backpressure. The difference is failure handling: with `.pipe()`, an error in one stream does not close the others, so you can leak file handles or sockets and must attach error handlers to each stream. `pipeline` forwards any error to one place and destroys every stream in the chain."
    theoryUrl: https://nodejs.org/api/stream.html#streampipelinesource-transforms-destination-callback
    options:
      - { text: "Only `pipeline` respects backpressure; `.pipe()` ignores it", correct: false }
      - {
          text: "`pipeline` runs each stage in a separate worker thread, so a slow transform no longer blocks the others",
          correct: false,
        }
      - {
          text: "It reports any stage's error in one place and tears down every stream",
          correct: true,
        }
      - {
          text: "`.pipe()` is deprecated and prints a warning on current Node versions",
          correct: false,
        }
  - type: multi
    prompt: "What does `pipeline` give you compared with wiring streams together by hand? Select all that apply."
    explanation: "`pipeline` connects the stages with backpressure, routes an error from any stage to a single callback or rejected promise, and destroys all streams when one fails so handles are released. It does not retry failed chunks or move work off the main thread: a CPU-heavy transform still blocks the event loop."
    theoryUrl: https://nodejs.org/api/stream.html#streampipelinesource-transforms-destination-callback
    options:
      - { text: "Backpressure handled between every pair of stages", correct: true }
      - { text: "One place where an error from any stage is reported", correct: true }
      - {
          text: "Every stream destroyed and its resources released when one stage fails",
          correct: true,
        }
      - { text: "Automatic retry of a chunk that a stage failed to process", correct: false }
      - { text: "CPU-heavy transform stages moved to a worker thread", correct: false }
  - type: single
    prompt: "A download endpoint streams a 2 GB file from disk to the HTTP response with chained `.pipe()` calls. Users often cancel downloads halfway, and the server slowly runs out of file descriptors. What is the most likely cause and fix?"
    explanation: "When the client disconnects, the response is destroyed, but `.pipe()` does not destroy the source, so the file stream stays open and its descriptor leaks. `pipeline` destroys every stream in the chain when any one closes early or fails. Timeouts or a larger descriptor limit only delay the leak."
    theoryUrl: https://nodejs.org/api/stream.html#streampipelinesource-transforms-destination-callback
    options:
      - {
          text: "The file streams stay open after the client leaves; use `pipeline` so they are destroyed",
          correct: true,
        }
      - {
          text: "The OS limit is too low; raise the file-descriptor limit for the process",
          correct: false,
        }
      - {
          text: "Disk reads are too slow; read each file fully into memory before sending it",
          correct: false,
        }
      - { text: "Keep-alive holds sockets open; disable keep-alive on the server", correct: false }
  - type: single
    prompt: "What does object mode mean for a Node.js stream?"
    explanation: "By default streams carry bytes (Buffers or strings). In object mode each chunk can be any JavaScript value, such as a parsed record, and buffering thresholds count objects instead of bytes. It is how you build pipelines of records, for example parse, validate, insert."
    theoryUrl: https://nodejs.org/api/stream.html#object-mode
    options:
      - {
          text: "Chunks are arbitrary JavaScript values, and buffering counts objects",
          correct: true,
        }
      - {
          text: "Chunks are serialised to JSON so they can be sent across processes",
          correct: false,
        }
      - {
          text: "The stream exposes an object-oriented class API instead of the event-based one",
          correct: false,
        }
      - {
          text: "Backpressure is turned off, since objects have no byte size to measure",
          correct: false,
        }
  - type: single
    prompt: "Users upload files of up to 5 GB through your Node API, and you store them in S3. Instances have 512 MB of RAM. Which design works?"
    explanation: "Streaming the request body into an S3 multipart upload sends the file in parts as it arrives, so memory stays at a few parts per upload regardless of file size. Buffering the body or writing it all to memory first cannot fit 5 GB in 512 MB, and a local temp file doubles the disk I/O and needs scratch space for every concurrent upload."
    theoryUrl: https://docs.aws.amazon.com/AmazonS3/latest/userguide/mpuoverview.html
    options:
      - {
          text: "Read the whole body into a Buffer, then send it in one `PutObject` call",
          correct: false,
        }
      - {
          text: "Stream the request body into a multipart upload, sending parts as they arrive",
          correct: true,
        }
      - {
          text: "Raise the instance memory limit and the body-size limit of the JSON body parser to 5 GB",
          correct: false,
        }
      - { text: "Base64-encode the file on the client and send it as a JSON field", correct: false }
  - type: single
    prompt: "A nightly job must count error lines per service in a 40 GB log file. How should it read the file?"
    explanation: "Reading line by line from a stream and updating counters keeps memory proportional to the number of services, not the file size. `readFile` would try to load 40 GB into memory. Splitting the file first adds work without solving anything, and loading into a database is far heavier than the task requires."
    theoryUrl: https://nodejs.org/api/readline.html#example-read-file-stream-line-by-line
    options:
      - { text: "`fs.readFile` the whole file, then `split('\\n')` and count", correct: false }
      - { text: "Stream it line by line and update a small map of counters", correct: true }
      - {
          text: "Split the file into 40 smaller files on disk first, then `readFile` each of them in turn",
          correct: false,
        }
      - {
          text: "Import the whole file into a database table, then run a `GROUP BY`",
          correct: false,
        }
  - type: single
    prompt: "An admin endpoint exports 2 million orders as CSV. The current code loads all rows with one query, maps them to strings and sends the result. It crashes with out-of-memory errors. What is the best redesign?"
    explanation: "Reading rows through a database cursor as a stream, converting each to a CSV line in a transform and piping into the response keeps only a small window of rows in memory, with backpressure from a slow client reaching back to the database read. Larger heaps or pagination by the client only move the problem."
    theoryUrl: https://nodejs.org/en/learn/modules/how-to-use-streams
    options:
      - { text: "Raise `--max-old-space-size` so the full result fits in the heap", correct: false }
      - {
          text: "Stream rows from a database cursor through a CSV transform into the response",
          correct: true,
        }
      - {
          text: "Build the CSV in a worker thread, so the main thread's heap is not used",
          correct: false,
        }
      - {
          text: "Ask the client to call the endpoint 2,000 times with an offset and stitch the pages together",
          correct: false,
        }
  - type: single
    prompt: "This ES module uppercases a text file and gzips it. Why does the async generator stage not need any backpressure code of its own?"
    code: |
      import { createReadStream, createWriteStream } from 'node:fs'
      import { createGzip } from 'node:zlib'
      import { pipeline } from 'node:stream/promises'

      async function* upperCase(source) {
        for await (const chunk of source) {
          yield chunk.toUpperCase()
        }
      }

      await pipeline(
        createReadStream('in.txt', { encoding: 'utf8' }),
        upperCase,
        createGzip(),
        createWriteStream('out.txt.gz'),
      )
    explanation: "Async iteration is pull based: the generator asks for the next chunk only after its previous `yield` has been taken by the next stage, and `pipeline` only takes it when downstream has room. A slow destination therefore slows the reading automatically. Nothing here buffers the whole file or runs in another thread."
    theoryUrl: https://nodejs.org/api/stream.html#streams-compatibility-with-async-generators-and-async-iterators
    options:
      - {
          text: "Each chunk is pulled only when downstream has taken the previous one",
          correct: true,
        }
      - {
          text: "The generator reads the whole file first, so there is nothing to pace",
          correct: false,
        }
      - {
          text: "Async generators run in a separate worker thread, so they never slow the main loop",
          correct: false,
        }
      - { text: "gzip is faster than disk, so a slow destination can never happen", correct: false }
  - type: single
    prompt: "A custom Writable inserts each row into a database. Its write function starts the insert and immediately signals that it is ready for the next row, without waiting for the insert to finish. The source is a fast file stream. What is the problem?"
    explanation: "Signalling readiness early tells the pipeline the database has already caught up, so backpressure never reaches the file reader. Thousands of inserts pile up in flight, exhausting the connection pool and memory, and a failed insert can no longer stop the stream. Signal readiness when the insert finishes, or pass its error."
    theoryUrl: https://nodejs.org/api/stream.html#implementing-a-writable-stream
    options:
      - {
          text: "Rows are inserted in random order, because the inserts run in parallel",
          correct: false,
        }
      - {
          text: "Backpressure is lost, so unbounded inserts pile up and errors cannot stop the stream",
          correct: true,
        }
      - {
          text: "The stream stalls after the first row, waiting for a signal that never comes",
          correct: false,
        }
      - {
          text: "Nothing, because the database driver queues the inserts internally",
          correct: false,
        }
  - type: single
    prompt: "An import pipeline reads a CSV file, parses each line in a Transform and inserts records into a database. One line out of a million is malformed and the parser throws on it. With `pipeline`, what happens, and how do you keep going past bad lines?"
    explanation: "An error in any stage fails the whole pipeline: every stream is destroyed and the error reaches the single callback or rejected promise. If bad lines should be skipped, the parser must handle them itself, for example by logging the line and not emitting a record. `pipeline` has no built-in skip or retry."
    theoryUrl: https://nodejs.org/api/stream.html#streampipelinesource-transforms-destination-callback
    options:
      - {
          text: "The whole pipeline fails; to skip bad lines, catch them inside the parser",
          correct: true,
        }
      - { text: "`pipeline` drops the bad line and carries on with the next chunk", correct: false }
      - {
          text: "Only the parser stops; the reader and the database writer keep running and wait for it",
          correct: false,
        }
      - {
          text: "`pipeline` retries the failing chunk three times before giving up",
          correct: false,
        }
  - type: boolean
    prompt: "A Transform stream that does heavy synchronous CPU work on every chunk still blocks the event loop while it processes each chunk, even though it is part of a stream."
    answer: true
    explanation: "Streams split work into chunks, but each chunk's processing runs on the main thread like any other JavaScript. Heavy synchronous work per chunk delays every other request while it runs. Move it to a worker thread, or use a native implementation that works off the main thread, as zlib does."
    theoryUrl: https://nodejs.org/en/learn/asynchronous-work/dont-block-the-event-loop
  - type: single
    prompt: "A pipeline downloads a report, decompresses it and writes it to `report.csv`. Halfway through, the download fails. Another job reads `report.csv` later and processes a truncated file without noticing. What is the cleanest way to prevent this?"
    explanation: "Write to a temporary file and rename it to the final name only after the pipeline completes successfully. The rename is atomic on the same file system, so readers see either the old complete file or the new complete one, never a half-written one. Retries or size checks narrow the window but do not close it."
    theoryUrl: https://nodejs.org/api/fs.html#fspromisesrenameoldpath-newpath
    options:
      - {
          text: "Write to a temp file and rename it to `report.csv` only when the pipeline succeeds",
          correct: true,
        }
      - {
          text: "Retry the download on failure, so the job almost always finishes writing",
          correct: false,
        }
      - { text: "Have the reader check that the file size is larger than zero", correct: false }
      - { text: "Increase the highWaterMark so the download completes faster", correct: false }
  - type: single
    prompt: "A Readable can be consumed in a push style, where data is delivered to you as it arrives, or in a pull style, where you ask for the next chunk when you are ready. Why does Node offer the pull style at all?"
    explanation: "In pull style the consumer controls the pace: it takes data only when it can process it, which makes flow control natural and is what `for await` over a stream does. Push style is convenient but easy to misuse, because data keeps arriving whether or not you can handle it. Both styles read the same data at the same speed when the consumer keeps up."
    theoryUrl: https://nodejs.org/api/stream.html#two-reading-modes
    options:
      - {
          text: "Pull mode is the only one that works with files; push is for sockets",
          correct: false,
        }
      - {
          text: "The consumer sets the pace, so slow processing naturally limits reading",
          correct: true,
        }
      - { text: "Pull mode reads data in larger chunks, so it is always faster", correct: false }
      - { text: "Push mode does not emit errors, so pull is needed to detect them", correct: false }
  - type: single
    prompt: "A team writes a parsing library that must run in Node.js, browsers and edge runtimes. Why might it accept and return WHATWG web streams (`ReadableStream`) rather than Node.js streams?"
    explanation: "Web streams are a cross-platform standard implemented by browsers, Node, Deno and edge runtimes, so one API works everywhere; `fetch` bodies are web streams too. Node streams exist only in Node (or via polyfills). Node offers adapters between the two, so Node users are not locked out."
    theoryUrl: https://nodejs.org/api/webstreams.html
    options:
      - {
          text: "Web streams are the only kind of stream that supports backpressure",
          correct: false,
        }
      - { text: "They are a standard API available in all of those runtimes", correct: true }
      - {
          text: "Node streams are deprecated and will be removed in the next major version",
          correct: false,
        }
      - {
          text: "Web streams always move data between threads, so parsing never blocks the main thread",
          correct: false,
        }
