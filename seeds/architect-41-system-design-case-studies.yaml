version: 1
title: "Architect Roadmap 41: System design case studies"
description: Trade-offs in six case studies (URL shortener, social feed, real-time chat, notification system, rate limiter, payments) covering storage, caching, messaging, scalability, consistency and cost.
language: en
tags: [architect-roadmap, system-design, case-studies, trade-offs, distributed-systems]
run:
  questionsPerRun: 10
  maxErrors: 3
  timePerQuestionSec: 90
questions:
  - type: single
    prompt: "A URL shortener derives each code from the first 7 characters of a hash of the long URL. What must this design handle that a counter-based design avoids by construction?"
    explanation: "Truncating a hash to a few characters makes collisions between different URLs likely as the number of links grows (the birthday problem), so the write path must detect a clash and resolve it, for example by re-hashing with a salt. A counter gives each link a unique number, so it cannot collide. Determinism (same URL, same code) is a feature of hashing, and code length stays fixed."
    theoryUrl: https://en.wikipedia.org/wiki/Birthday_problem
    options:
      - { text: "Two different long URLs can map to the same code", correct: true }
      - {
          text: "The same long URL always produces the same code, which must be prevented",
          correct: false,
        }
      - { text: "Codes grow longer as more links are stored", correct: false }
      - {
          text: "Hash functions are too slow to run on every write, so codes must be precomputed in batches",
          correct: false,
        }
  - type: single
    prompt: "A shortener issues codes from a sequential counter. Some customers shorten private document links, and a researcher shows that anyone can walk the code space and find them. Which change addresses this best?"
    explanation: "Sequential codes are predictable, so neighbouring codes are easy to guess. Non-sequential codes (random with a collision check, or a counter passed through a reversible permutation) in a sparse code space make enumeration impractical, and truly private links also need access control. Rate limiting only slows the walk, and a random starting value leaves the codes sequential."
    theoryUrl: https://cheatsheetseries.owasp.org/cheatsheets/Insecure_Direct_Object_Reference_Prevention_Cheat_Sheet.html
    options:
      - {
          text: "Issue non-sequential codes in a sparse code space, and protect private links",
          correct: true,
        }
      - { text: "Start the counter at a large random number instead of 1", correct: false }
      - {
          text: "Rate-limit redirects per IP address so that walking the space takes a little longer",
          correct: false,
        }
      - {
          text: "Switch the redirect from 302 to 301 so the codes are cached by browsers",
          correct: false,
        }
  - type: single
    prompt: "A shortener expects about 100 million new links per month, each record about 500 bytes, kept for five years, with 100 redirects per link created. What does a rough estimate say about where the design effort should go?"
    explanation: "Five years is about 6 billion records, roughly 3 TB, which a modest replicated or lightly sharded store holds. Writes average around 40 per second while redirects average thousands per second, with viral peaks far above that, so the read path is where the design work pays off. Petabyte tiering and many write shards solve problems these numbers do not have, and a rough estimate is exactly the tool for deciding this before building."
    theoryUrl: https://github.com/donnemartin/system-design-primer
    options:
      - {
          text: "Storage stays in the low terabytes, so the read path deserves most of the effort",
          correct: true,
        }
      - {
          text: "Storage reaches petabytes, so tiering old links to object storage is the first problem to solve",
          correct: false,
        }
      - {
          text: "The write rate needs dozens of database shards from the first day",
          correct: false,
        }
      - {
          text: "The figures are too uncertain to use, so measure production traffic before choosing anything",
          correct: false,
        }
  - type: single
    prompt: "A shortener has a 100:1 read-to-write ratio, a small set of viral links takes most of the traffic, and every lookup is by key. Which design is the best fit?"
    explanation: "Key-value lookups with a heavy skew fit a key-value store with a cache-aside layer in front: hot keys stay in memory and the store handles the long tail. Relational joins, full-text search or per-request computation add cost without any benefit for this access pattern."
    theoryUrl: https://learn.microsoft.com/en-us/azure/architecture/patterns/cache-aside
    options:
      - {
          text: "A relational schema with joins, queried directly on every redirect",
          correct: false,
        }
      - { text: "A key-value store with a cache-aside layer in front of it", correct: true }
      - { text: "A search engine index, so users can query by partial code", correct: false }
      - { text: "A message queue that stores each code until it is consumed", correct: false }
  - type: single
    prompt: "A shortener runs 20 stateless API servers behind a load balancer. How do you generate unique counter-based codes without a database round trip on every write and without collisions?"
    explanation: "Each server leases a block of IDs (say 10,000) from a coordinator and hands them out locally, so the coordinator is touched rarely and no two servers share a range. Random codes need collision checks, and a global lock per write recreates the bottleneck. A lost block only wastes unused numbers."
    theoryUrl: https://en.wikipedia.org/wiki/Snowflake_ID
    options:
      - {
          text: "Each server leases a block of counter values and issues them locally",
          correct: true,
        }
      - {
          text: "Every server increments the same row under a global lock for each write",
          correct: false,
        }
      - {
          text: "Every server picks a random 6-character code and never checks for duplicates",
          correct: false,
        }
      - { text: "Use the server's system clock in milliseconds as the code", correct: false }
  - type: single
    prompt: "A social app has users with 200 followers on average and a few celebrities with 50 million. Feed reads are 100x more frequent than posts. Which feed strategy fits?"
    explanation: "Fan-out on write (push the post id into followers' precomputed timelines) makes reads cheap for normal users, but would create 50 million writes per celebrity post. The hybrid approach pushes for normal users and pulls celebrity posts at read time and merges them. Pure pull makes the common read path expensive."
    theoryUrl: https://martinfowler.com/bliki/CQRS.html
    options:
      - {
          text: "Pure fan-out on read for every user, computed with a join across all followees per request",
          correct: false,
        }
      - { text: "Pure fan-out on write for every user, including celebrities", correct: false }
      - {
          text: "Hybrid: push for normal users, pull celebrity posts at read time and merge",
          correct: true,
        }
      - { text: "Store one global timeline and filter it in the client", correct: false }
  - type: single
    prompt: "For precomputed timelines you need a structure that supports fast insertion by time, trimming to the latest N items and range reads. Which choice fits best?"
    explanation: "A Redis sorted set (score = timestamp or post id) holding post ids supports inserts, range reads and trimming in logarithmic time, and the post bodies are hydrated from a separate cache or store. Storing full posts per follower multiplies storage, and a relational table with sorting per read is slower."
    theoryUrl: https://redis.io/docs/latest/develop/data-types/sorted-sets/
    options:
      - {
          text: "A sorted set per user holding post ids, with posts hydrated separately",
          correct: true,
        }
      - { text: "A full copy of each post stored per follower", correct: false }
      - { text: "A relational table sorted by ORDER BY on every read", correct: false }
      - {
          text: "An object-storage file per user, rewritten on every new post and trimmed by a nightly job",
          correct: false,
        }
  - type: single
    prompt: "A social app precomputes timelines with fan-out on write. It has 300 million accounts, but only about a third open the app in a given month, so most timeline writes are never read. What is the usual fix?"
    explanation: "Precomputed timelines only pay off for users who read them. Fanning out to recently active users and rebuilding a timeline on demand (by pulling from followees) when an inactive user returns removes most of the wasted writes and memory. Compressing wasted work keeps it, pure pull makes every active user's read expensive, and deleting accounts is a product decision, not a fix."
    theoryUrl: https://www.infoq.com/presentations/Twitter-Timeline-Scalability/
    options:
      - {
          text: "Fan out only to active users; rebuild a timeline on demand when one returns",
          correct: true,
        }
      - {
          text: "Keep fanning out to every follower, but compress the stored timelines so the waste costs less memory",
          correct: false,
        }
      - {
          text: "Switch every user to fan-out on read, so no timeline is ever precomputed",
          correct: false,
        }
      - { text: "Delete accounts that have not opened the app for a month", correct: false }
  - type: single
    prompt: "A user publishes a post, refreshes the feed, and does not see it. The feed is read from an asynchronously replicated replica. Which fix gives the best consistency for that user without making the whole system strongly consistent?"
    explanation: "Read-your-writes consistency is needed only for the author: route their reads to the primary for a short time (or merge their recent posts client-side). Making all reads synchronous raises latency and cost for everyone, and telling users to wait is a product workaround."
    theoryUrl: https://jepsen.io/consistency/models/read-your-writes
    options:
      - { text: "Make all replication synchronous for every read and write", correct: false }
      - {
          text: "Show an error and ask the user to refresh again after a minute, once replication catches up",
          correct: false,
        }
      - { text: "Remove replicas and serve everything from one primary", correct: false }
      - {
          text: "Serve the author's recent posts from the primary or merge client-side",
          correct: true,
        }
  - type: multi
    prompt: "Which of the following reduce the latency of reading a feed? Select all that apply."
    explanation: "Precomputed timelines avoid joins at read time, a cache for hydrated post objects avoids repeated store reads, and a CDN serves images and video close to the user. Re-joining normalised tables on every request does the opposite."
    theoryUrl: https://martinfowler.com/bliki/CQRS.html
    options:
      - { text: "Precomputed timelines (materialised views) per user", correct: true }
      - { text: "Joining users, follows and posts tables on every request", correct: false }
      - { text: "A CDN in front of images and video", correct: true }
      - { text: "A cache for hydrated post objects", correct: true }
  - type: single
    prompt: "A chat app needs messages delivered in well under a second in both directions, with typing indicators. Which transport fits best?"
    explanation: "A WebSocket keeps one persistent bidirectional connection, so the server can push messages and clients can send without a new HTTP request each time. Short polling wastes requests and adds latency, and server-sent events are server-to-client only."
    theoryUrl: https://developer.mozilla.org/en-US/docs/Web/API/WebSockets_API
    options:
      - { text: "Short polling every 5 seconds", correct: false }
      - { text: "WebSocket connections held by gateway servers", correct: true }
      - { text: "Server-sent events for both sending and receiving", correct: false }
      - { text: "Email notifications for each message", correct: false }
  - type: single
    prompt: "Messages in a conversation must appear in the same order for all participants. Two senders write at nearly the same instant from different servers. What is the most reliable approach?"
    explanation: "Wall-clock timestamps from different machines suffer from clock skew. Routing all messages of a conversation to one owner (a partition keyed by conversation id) lets it assign a monotonically increasing sequence number that defines the order. Client clocks and random UUIDs do not give ordering."
    theoryUrl: https://kafka.apache.org/documentation/#intro_concepts_and_terms
    options:
      - { text: "Order by the sender's device timestamp", correct: false }
      - {
          text: "Partition by conversation id and let its owner assign a sequence number",
          correct: true,
        }
      - { text: "Order by UUID, since UUIDs are unique and sortable", correct: false }
      - {
          text: "Order by arrival time at whichever gateway received it, synchronised with NTP across gateways",
          correct: false,
        }
  - type: single
    prompt: "User A is connected to gateway 1, and user B to gateway 7. A sends B a message. How should the message reach B in real time?"
    explanation: "Gateways are stateful because they hold connections, so the system keeps a registry of which gateway holds which user and routes through a pub/sub or messaging backplane to that gateway. Asking B to poll defeats real time, and replicating all connections to every gateway does not scale."
    theoryUrl: https://redis.io/docs/latest/develop/interact/pubsub/
    options:
      - { text: "Make B's client poll every gateway until the message appears", correct: false }
      - {
          text: "Open a direct connection from A's gateway to every other gateway, then broadcast the message",
          correct: false,
        }
      - { text: "Replicate all WebSocket connections on all gateways", correct: false }
      - {
          text: "Look up B's gateway in a session registry and forward via a pub/sub backplane",
          correct: true,
        }
  - type: single
    prompt: "User B is offline for two hours while several conversations receive messages. When B reconnects, how should the client reliably get everything it missed?"
    explanation: "Messages are persisted as they arrive, and the client remembers the last sequence number it has seen per conversation; on reconnect it asks storage for everything after that point. Push notifications are only a hint to wake the app, since they can be dropped or collapsed. A gateway's memory or a fire-and-forget pub/sub channel is not durable storage for an offline user."
    theoryUrl: https://redis.io/docs/latest/develop/interact/pubsub/
    options:
      - {
          text: "Fetch from storage everything after the last sequence number it saw",
          correct: true,
        }
      - {
          text: "Rely on the push notifications, since each one carries a missed message",
          correct: false,
        }
      - {
          text: "Ask the gateway, which buffers undelivered messages in memory until the user returns",
          correct: false,
        }
      - {
          text: "Replay the pub/sub channel, which keeps every message published while B was away",
          correct: false,
        }
  - type: single
    prompt: "A chat service stores billions of messages. The main access pattern is: append to a conversation, and read the latest N messages of one conversation. Which storage design fits?"
    explanation: "The workload is write-heavy and always scoped by conversation, so a wide-column or LSM-based store partitioned by conversation id and clustered by time gives sequential reads of the newest rows. General joins are not needed, and a single relational primary becomes the write bottleneck."
    theoryUrl: https://discord.com/blog/how-discord-stores-trillions-of-messages
    options:
      - { text: "One relational table on a single primary, indexed by timestamp", correct: false }
      - { text: "A store partitioned by conversation id and clustered by time", correct: true }
      - { text: "Files in object storage, one per message, listed by prefix", correct: false }
      - { text: "An in-memory cache only, since old messages are rarely read", correct: false }
  - type: single
    prompt: "A notification service sends push, email and SMS. The SMS provider becomes slow, and push notifications also start arriving late. Which design change fixes the coupling?"
    explanation: "A shared worker pool or queue lets the slowest channel block everyone. Separate queues (and consumers) per channel isolate the failure so push keeps flowing while SMS backs up. Larger timeouts or one big pool keep the shared bottleneck."
    theoryUrl: https://microservices.io/patterns/communication-style/messaging.html
    options:
      - { text: "Increase the SMS client timeout to 60 seconds", correct: false }
      - { text: "Use a single, larger worker pool for all channels", correct: false }
      - { text: "Separate queues and consumers per channel", correct: true }
      - { text: "Send all channels synchronously from the API request", correct: false }
  - type: single
    prompt: "Twelve product services each call the email and push providers directly. Users complain that turning off marketing emails stops some of them but not others, and that quiet hours are ignored by half the features. Which design fixes this?"
    explanation: "Preferences are enforced in twelve places, so they drift. Making notifications one capability, a service that every producer calls and that owns preferences and checks them at send time, gives one place where opt-outs and quiet hours are applied. A shared library still has twelve deployed versions, nightly copies go stale, and an email provider's unsubscribe list does not cover push."
    theoryUrl: https://microservices.io/patterns/decomposition/decompose-by-business-capability.html
    options:
      - {
          text: "Route every notification through one service that checks preferences at send time",
          correct: true,
        }
      - {
          text: "Publish a shared library with the preference rules and ask every team to upgrade to it",
          correct: false,
        }
      - {
          text: "Copy each user's preferences into every product service's database every night",
          correct: false,
        }
      - {
          text: "Rely on the email provider's unsubscribe list for opt-outs on every channel",
          correct: false,
        }
  - type: single
    prompt: "A marketing blast to 20 million users saturates the queue. Meanwhile, login one-time passcodes arrive after 15 minutes. What is the best fix?"
    explanation: "Transactional, time-sensitive messages need isolation from bulk traffic: separate queues (or priority lanes) with dedicated capacity, and rate-limit the bulk lane to the provider's quota. Scaling everything equally or sending OTPs after the blast keeps the head-of-line blocking."
    theoryUrl: https://microservices.io/patterns/communication-style/messaging.html
    options:
      - {
          text: "Dedicated high-priority queue and capacity for OTPs, with the bulk lane rate-limited",
          correct: true,
        }
      - { text: "Process all messages in strict arrival order", correct: false }
      - {
          text: "Send the marketing blast only during the OTP quiet hours, without any queue change",
          correct: false,
        }
      - { text: "Double the consumers of the single queue", correct: false }
  - type: single
    prompt: "A photo app sends a push for every like. A popular post collects 40 likes in an hour, and its author turns off notifications for the app altogether. What is the best design change?"
    explanation: "Each like is a valid event, but a push per event turns into noise and costs you the channel. Buffering events per recipient and collapsing them into one notification per time window (\"Ana and 39 others liked your photo\") keeps the information and the user's attention. Restricting hours or moving to SMS keeps the volume, and dropping the excess loses information arbitrarily."
    theoryUrl: https://developer.apple.com/design/human-interface-guidelines/managing-notifications
    options:
      - {
          text: "Collapse likes per recipient into one notification per time window",
          correct: true,
        }
      - {
          text: "Keep one push per like, but send them only between 9 am and 9 pm in the user's time zone",
          correct: false,
        }
      - {
          text: "Rate-limit pushes per user and drop the likes that go over the limit",
          correct: false,
        }
      - { text: "Move like notifications from push to SMS, which users read more carefully", correct: false }
  - type: single
    prompt: "Support cannot answer 'did this customer receive the SMS?' The notification service only logs that the provider accepted each request. What should the design add?"
    explanation: "Acceptance only means the provider queued the message; whether it reached the handset is reported later, through delivery callbacks keyed by the provider's message id. Storing a status per notification (queued, sent, delivered, failed) and updating it from those callbacks answers support and lets you alert or fall back on failures. Sending twice creates duplicates, and logging bodies with phone numbers adds a privacy risk without saying anything about delivery."
    theoryUrl: https://www.twilio.com/docs/messaging/guides/track-outbound-message-status
    options:
      - {
          text: "A status per notification, updated from the provider's delivery callbacks",
          correct: true,
        }
      - {
          text: "Nothing, since provider acceptance can be treated as delivery for SMS",
          correct: false,
        }
      - {
          text: "Send every SMS twice, so that at least one copy is very likely delivered",
          correct: false,
        }
      - {
          text: "Log each message body with the phone number, so support can search the logs for it",
          correct: false,
        }
  - type: single
    prompt: "A rate limiter keeps a log of every request timestamp per client to enforce '10,000 requests per hour' as a precise sliding window. Memory use grows huge with millions of clients. Which alternative keeps the sliding behaviour at a fraction of the cost?"
    explanation: "A sliding window counter stores only the counts of the current and previous fixed windows and weights the previous one by how much of it still overlaps the sliding window. It needs constant memory per client and avoids most of the fixed window's boundary burst, at the price of a small approximation. A plain fixed window is cheap but reintroduces the boundary burst, and moving or sampling the log does not fix the cost model."
    theoryUrl: https://blog.cloudflare.com/counting-things-a-lot-of-different-things/
    options:
      - {
          text: "Keep two counters per client, current and previous window, and weight the previous one",
          correct: true,
        }
      - {
          text: "Keep the log but move it from Redis to a relational table indexed by client and timestamp",
          correct: false,
        }
      - {
          text: "Switch to a fixed window counter, which has the same behaviour with less memory",
          correct: false,
        }
      - {
          text: "Sample one request in a hundred into the log and multiply the count by 100",
          correct: false,
        }
  - type: single
    prompt: "An API should let clients burst briefly, for example 20 requests at once, but average no more than 5 requests per second. Which algorithm models this directly?"
    explanation: "A token bucket refills at a steady rate (the average) and has a capacity (the allowed burst). A leaky bucket smooths output to a constant rate, and a fixed window has boundary bursts without control. A concurrency limit caps in-flight requests, not rate."
    theoryUrl: https://stripe.com/blog/rate-limiters
    options:
      - { text: "Fixed window counter", correct: false }
      - { text: "Token bucket with capacity 20 and refill 5 per second", correct: true }
      - { text: "Leaky bucket that emits exactly one request every 200 ms", correct: false }
      - { text: "A concurrency limit of 5 in-flight requests", correct: false }
  - type: single
    prompt: "Ten API gateway nodes enforce a per-user limit using a shared Redis counter. The code reads the count, checks it, then writes count + 1. Under load, users exceed their limit. Why, and what is the fix?"
    explanation: "Read-check-write across the network is a race: several nodes read the same value before any writes it. Use an atomic operation (INCR with expiry, or a Lua script that does the check and update in one step) so the decision is serialised in Redis."
    theoryUrl: https://redis.io/docs/latest/commands/incr/
    options:
      - {
          text: "Redis is eventually consistent, so switch to a relational database",
          correct: false,
        }
      - { text: "Race on read-check-write, use an atomic INCR or a Lua script", correct: true }
      - { text: "The counter expires too early, raise the TTL to one hour", correct: false }
      - { text: "Network latency is too high, move Redis to every node", correct: false }
  - type: single
    prompt: "An API runs in three regions, and its rate limiter uses one central Redis in the US. European requests now pay a transatlantic round trip on every call just for the limit check. What is the usual trade-off to make?"
    explanation: "Keep counters in each region (splitting the client's budget across regions, or syncing counts asynchronously) and accept that the global limit is enforced approximately. A limit that is off by a few percent for a short time is usually acceptable, while adding cross-region latency to every request is not. Synchronous replication brings the latency back, and dropping the limit removes the protection."
    theoryUrl: https://cloud.google.com/architecture/rate-limiting-strategies-techniques
    options:
      - {
          text: "Use regional counters and accept approximate enforcement of the global limit",
          correct: true,
        }
      - {
          text: "Keep the central Redis and run the limit check in parallel with the request, rejecting it afterwards",
          correct: false,
        }
      - { text: "Remove the rate limiter for European traffic", correct: false }
      - {
          text: "Replicate the US Redis synchronously into every region before each check",
          correct: false,
        }
  - type: single
    prompt: "An API limits each client to 100 requests per second. One endpoint, a large report export, costs about a thousand times more than a normal call, and a few clients overload the database with exports while staying under their limit. What fits best?"
    explanation: "A flat request count treats every call as equal, so it cannot protect against expensive ones. Weighting requests by cost (an export consumes many tokens) or giving the expensive endpoint its own, much lower limit aligns the limit with the load it actually creates. Lowering everyone's limit punishes cheap traffic, caching does not help when each export is different, and moving the endpoint only hides it from the limiter."
    theoryUrl: https://cloud.google.com/architecture/rate-limiting-strategies-techniques
    options:
      - {
          text: "Weight requests by cost, or give the export endpoint its own lower limit",
          correct: true,
        }
      - {
          text: "Lower the global limit to 10 requests per second for every client and endpoint",
          correct: false,
        }
      - {
          text: "Cache the export responses at the CDN so the database is protected",
          correct: false,
        }
      - {
          text: "Move the export endpoint to a separate domain so the limiter does not see it",
          correct: false,
        }
  - type: single
    prompt: "A payments service stores amounts as JavaScript numbers in euros, such as 19.99. Reconciliation keeps finding totals that differ by a cent. What is the standard fix?"
    explanation: "Binary floating point cannot represent most decimal fractions exactly, so sums and conversions drift by fractions of a cent. Money is stored as integers in the smallest currency unit (cents) or as a decimal type, with the currency alongside, and rounding happens explicitly at defined points. Rounding only for display or using a wider float hides the error without removing it."
    theoryUrl: https://martinfowler.com/eaaCatalog/money.html
    options:
      - { text: "Store integer minor units, such as cents, with the currency", correct: true }
      - { text: "Round every amount to two decimals only when it is displayed", correct: false }
      - {
          text: "Use a wider floating-point type so the rounding error becomes negligible",
          correct: false,
        }
      - {
          text: "Run reconciliation less often so the small differences are averaged out",
          correct: false,
        }
  - type: single
    prompt: "A ledger must always be able to explain where each cent went and support audits. Which data model fits?"
    explanation: "A double-entry, append-only ledger records each movement as balanced debit and credit entries that are never updated or deleted; corrections are new compensating entries. Balances are derived or cached from entries. A single mutable balance column loses the history."
    theoryUrl: https://stripe.com/blog/ledger-stripe-system-for-tracking-and-validating-money-movement
    options:
      - { text: "A single mutable balance column updated in place", correct: false }
      - {
          text: "An append-only double-entry ledger, corrected with compensating entries",
          correct: true,
        }
      - {
          text: "A document per order that is overwritten with the latest status and a change timestamp",
          correct: false,
        }
      - { text: "A cache of balances rebuilt from logs only when someone asks", correct: false }
  - type: single
    prompt: "A shop wants to accept card payments while keeping its security and compliance (PCI DSS) scope as small as possible. Which architecture fits?"
    explanation: "With the provider's hosted payment page or embedded fields, card numbers go straight from the browser to the provider, and your systems only see a token. That keeps raw card data out of your servers, logs and databases, which shrinks the compliance scope. Passing card numbers through your API, even without storing them, or storing them encrypted keeps those systems in scope."
    theoryUrl: https://docs.stripe.com/security/guide
    options:
      - {
          text: "Card data goes straight to the provider's hosted fields; you keep only a token",
          correct: true,
        }
      - {
          text: "Your API receives card numbers and encrypts them before storing them in the database",
          correct: false,
        }
      - {
          text: "Your API forwards card numbers to the provider without storing them",
          correct: false,
        }
      - {
          text: "Card numbers are stored in a separate, firewalled database only the payments team can access",
          correct: false,
        }
  - type: single
    prompt: "After paying on the provider's hosted page, the customer is redirected back to your success URL, and your app marks the order paid when that page loads. Some paid orders are never fulfilled, and some unpaid ones are. What is the right design?"
    explanation: "The redirect depends on the customer's browser: they can close the tab before it loads, or open the success URL without paying. Fulfil orders from a server-side signal, a signed webhook or a status query to the provider, and use the redirect only to show a status. A hard-to-guess URL or asking the customer to wait still trusts the client."
    theoryUrl: https://docs.stripe.com/payments/checkout/fulfill-orders
