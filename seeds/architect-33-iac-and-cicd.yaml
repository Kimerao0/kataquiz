version: 1
title: "Architect Roadmap 33: Infrastructure as Code and CI/CD"
description: Terraform versus CDK, state management, delivery pipelines, blue/green and canary releases, feature flags and rollback strategies.
language: en
tags: [architect-roadmap, infrastructure, iac, terraform, cicd]
run:
  questionsPerRun: 10
  maxErrors: 3
  timePerQuestionSec: 60
questions:
  - type: single
    prompt: "A product team writes only TypeScript, runs exclusively on AWS and wants real loops, classes and unit-testable abstractions for its infrastructure. Which tool fits best?"
    explanation: "AWS CDK lets you define infrastructure in a general-purpose language and synthesizes it to CloudFormation, so it fits an AWS-only TypeScript team. Terraform is a fine tool but its HCL has limited abstraction compared with real code. Pulumi is also valid, but CloudFormation YAML by hand is the one that gives up the abstractions the team asked for."
    theoryUrl: https://docs.aws.amazon.com/cdk/v2/guide/home.html
    options:
      - { text: "Hand-written CloudFormation YAML templates", correct: false }
      - { text: "AWS CDK, synthesizing to CloudFormation", correct: true }
      - { text: "Terraform, because HCL is more expressive than TypeScript", correct: false }
      - { text: "Shell scripts calling the AWS CLI", correct: false }
  - type: single
    prompt: "Production was built by a shell script that runs cloud CLI create commands in order. Re-running it after a partial failure errors on resources that already exist, and nobody can tell how production now differs from the script. What does moving to a declarative IaC tool change?"
    explanation: "A declarative tool takes the desired end state, compares it with what actually exists and applies only the difference, so re-running after a failure finishes the job and an unchanged configuration is a no-op. It does not replay a log of commands, and cloud APIs offer no transaction across resources, so a failed run can still leave partial changes; the next run converges them."
    theoryUrl: https://developer.hashicorp.com/terraform/intro
    options:
      - {
          text: "You describe the end state, and the tool compares it with what exists and applies only the difference",
          correct: true,
        }
      - {
          text: "The tool records every command it runs, so a failed run can be replayed from the step where it stopped",
          correct: false,
        }
      - {
          text: "The tool wraps all creates in one transaction, so a partial failure rolls the environment back automatically",
          correct: false,
        }
      - {
          text: "The tool runs the same create commands as the script but in parallel, so a failure cannot leave production half-built",
          correct: false,
        }
  - type: single
    prompt: "Your platform has to manage AWS accounts, Cloudflare DNS, Datadog monitors and a GitHub organisation from a single workflow. What is the strongest reason to choose Terraform here?"
    explanation: "Terraform's provider ecosystem covers almost any API with one plan/apply workflow and one state model. CDK for CloudFormation is bound to resources CloudFormation can manage, which excludes most third-party SaaS. The language being more concise is irrelevant to the constraint."
    theoryUrl: https://developer.hashicorp.com/terraform/language/providers
    options:
      - {
          text: "One provider-based workflow can manage resources across many vendors",
          correct: true,
        }
      - { text: "HCL compiles to CloudFormation, which supports every vendor", correct: false }
      - { text: "Terraform needs no state when several providers are used", correct: false }
      - {
          text: "Terraform is the only infrastructure tool that has providers for both Cloudflare and Datadog",
          correct: false,
        }
  - type: single
    prompt: "What is the main job of the Terraform state file?"
    explanation: "State maps each resource block in your configuration to the real object it created (its ID and attributes), so Terraform can compute a diff and know what to update or destroy. It is not a log of past runs, not a copy of your source code, and not a lock by itself."
    theoryUrl: https://developer.hashicorp.com/terraform/language/state
    options:
      - { text: "A history of every apply, used to replay changes in order", correct: false }
      - { text: "A cached copy of the configuration used to skip parsing", correct: false }
      - {
          text: "A mapping between declared resources and the real objects they manage",
          correct: true,
        }
      - {
          text: "A mutex that prevents two engineers from running plan and apply together on the same workspace",
          correct: false,
        }
  - type: multi
    prompt: "Why is committing `terraform.tfstate` to a Git repository a bad idea? Select all that apply."
    explanation: "State can contain secrets in plaintext, Git offers no locking so two people can apply against the same state, and a merged or stale copy can make Terraform believe resources don't exist and recreate them. State size is not the issue, and Git can store the file fine."
    theoryUrl: https://developer.hashicorp.com/terraform/language/state/remote
    options:
      - {
          text: "It can expose secrets such as database passwords in plaintext history",
          correct: true,
        }
      - { text: "Git cannot store JSON files larger than a few kilobytes", correct: false }
      - {
          text: "Git provides no state locking, so concurrent applies can corrupt it",
          correct: true,
        }
      - {
          text: "A stale or conflicting merge can make Terraform recreate or orphan resources",
          correct: true,
        }
  - type: single
    prompt: "Two CI jobs run `terraform apply` against the same S3-backed state at the same moment. What protects the state from being corrupted?"
    explanation: "State locking (for the S3 backend, a lock via DynamoDB or the S3 native lock file depending on the version) makes the second run fail or wait until the first releases the lock. Versioning helps recovery but does not prevent concurrent writes, and encryption concerns confidentiality, not concurrency."
    theoryUrl: https://developer.hashicorp.com/terraform/language/state/locking
    options:
      - { text: "S3 bucket versioning, which merges both writes automatically", correct: false }
      - { text: "Server-side encryption of the state object", correct: false }
      - { text: "The `-parallelism` flag, which serialises runs across machines", correct: false }
      - { text: "The backend's state lock, which makes one run wait or fail", correct: true }
  - type: single
    prompt: "A refactor moves 30 resources into a new module without changing any of their settings. The plan shows 30 destroys and 30 creates, including the production database. What should the team conclude before applying?"
    explanation: "Terraform identifies each object by its address in the code, so a resource at a new address looks like a new resource and the old address looks like one to delete. The plan is real: applying it would destroy and recreate the database. Recording the old-to-new address mapping in the code or the state first makes the refactor a no-op, while re-running apply or scheduling downtime only accepts the damage."
    theoryUrl: https://developer.hashicorp.com/terraform/language/modules/develop/refactoring
    options:
      - {
          text: "The plan is cosmetic; apply will see that the real objects are identical and skip them",
          correct: false,
        }
      - {
          text: "New addresses look like new resources, so map old addresses to new ones before applying",
          correct: true,
        }
      - {
          text: "Moving resources into a module always recreates them once, so apply it in a maintenance window",
          correct: false,
        }
      - {
          text: "Apply twice, since the second run adopts the recreated objects back under their old addresses",
          correct: false,
        }
  - type: single
    prompt: "Someone widened a security group in the AWS console by hand. Your Terraform code still declares the narrow rule. What does the next `terraform plan` do?"
    explanation: "Plan refreshes real infrastructure, sees the drift against the configuration, and proposes changing the resource back to what the code declares. It does not adopt the console change into the code, and it does not ignore it. Pulling the manual change into code is a deliberate edit you make yourself."
    theoryUrl: https://developer.hashicorp.com/terraform/cli/commands/plan
    options:
      - { text: "It silently updates the code to match the console", correct: false }
      - {
          text: "It ignores the change, because state still has the old rule and the cloud object is never re-read",
          correct: false,
        }
      - { text: "It fails until you run `terraform import` on the group", correct: false }
      - {
          text: "It detects the drift and proposes reverting the group to the declared rule",
          correct: true,
        }
  - type: single
    prompt: "Security requires that the production database password never appears in Terraform state or in CI logs. Which approach meets that requirement?"
    explanation: "Any value Terraform reads into a resource ends up in state, wherever it came from, so the only password that stays out is one Terraform never sees. Letting a secrets manager generate and rotate it, and giving Terraform only the secret's identifier, achieves that. An encrypted backend protects the state but the password is still inside it, and a CI variable or an ignored variables file still passes through Terraform."
    theoryUrl: https://developer.hashicorp.com/terraform/language/manage-sensitive-data
    options:
      - {
          text: "Pass the password as a CI environment variable, so it never appears in the repository",
          correct: false,
        }
      - {
          text: "Keep the password in a variables file that is excluded from Git and copied onto the CI runner",
          correct: false,
        }
      - {
          text: "Let a secrets manager generate it and give Terraform only the secret's identifier",
          correct: true,
        }
      - {
          text: "Store the state in an encrypted bucket, so the password inside it is protected",
          correct: false,
        }
  - type: single
    prompt: "You need strong isolation between staging and production: different credentials, different blast radius, and the ability for staging engineers to never touch prod state. Which layout is the better fit?"
    explanation: "Separate root modules or directories with their own backends and credentials give real isolation. Workspaces share the same backend and configuration, so a mistaken workspace selection or shared credentials can hit prod. Workspaces are fine for ephemeral copies of the same environment, not for a security boundary."
    theoryUrl: https://developer.hashicorp.com/terraform/language/state/workspaces
    options:
      - { text: "One workspace per environment in a single shared backend", correct: false }
      - {
          text: "A single state file with `count` toggled by an environment variable",
          correct: false,
        }
      - { text: "Separate root modules, each with its own backend and credentials", correct: true }
      - {
          text: "One workspace, with environments distinguished by resource name prefixes",
          correct: false,
        }
  - type: single
    prompt: "A team builds a Docker image separately in the staging pipeline and again in the production pipeline from the same commit. Production then behaves differently from staging. What principle was violated?"
    explanation: "Build once and promote the same immutable artifact through environments, changing only configuration. Rebuilding can pull different dependency versions or base images, so what you tested is not what you shipped. Running more tests or adding approvals does not fix that."
    theoryUrl: https://martinfowler.com/bliki/DeploymentPipeline.html
    options:
      - { text: "Pipelines should have manual approval before every stage", correct: false }
      - {
          text: "Build once and promote the same artifact through every environment",
          correct: true,
        }
      - {
          text: "Production should be built from a different branch than staging, so each environment has its own code",
          correct: false,
        }
      - { text: "Images should be rebuilt per environment to bake in secrets", correct: false }
  - type: single
    prompt: "A deploy pipeline authenticates to the cloud with a long-lived access key stored as a CI secret. Security asks you to switch to OIDC federation. What is the main gain?"
    explanation: "With federation the CI provider issues a signed identity token per job, and the cloud exchanges it for short-lived credentials scoped to a role that trusts only that repository or branch. There is no standing key to leak, rotate or forget in a log. It does not remove the need for least-privilege roles, and it does not make the pipeline faster."
    theoryUrl: https://docs.github.com/en/actions/concepts/security/openid-connect
    options:
      - {
          text: "Each job gets short-lived credentials, so there is no standing key to leak",
          correct: true,
        }
      - {
          text: "The pipeline gets administrator rights automatically, so no role or permission set has to be maintained",
          correct: false,
        }
      - {
          text: "The access key is encrypted at rest in the CI secret store, which a plain secret is not",
          correct: false,
        }
      - { text: "Deploys run faster because authentication is skipped", correct: false }
  - type: single
    prompt: "Your pipeline runs `terraform plan` on pull requests and `terraform apply` after merge. A reviewer approved a plan, but the apply after merge changed different resources. Which practice closes this gap?"
    explanation: "Save the reviewed plan with `-out` and apply exactly that file, or re-plan and require approval of the new diff before apply. Otherwise the world (or main) can change between review and apply. Running apply with `-auto-approve` makes the gap worse, and locking only prevents concurrent runs."
    theoryUrl: https://developer.hashicorp.com/terraform/cli/commands/plan
    options:
      - { text: "Add `-auto-approve` so the apply cannot wait on a stale review", correct: false }
      - { text: "Apply the saved plan file produced by the approved run", correct: true }
      - { text: "Increase the state lock timeout so applies queue longer", correct: false }
      - { text: "Run `terraform refresh` before every merge", correct: false }
  - type: single
    prompt: "You use blue/green deployment and the new release includes a database migration that drops a column the old version still reads. What goes wrong, and what is the standard remedy?"
    explanation: "Both versions share the database, so a destructive migration breaks the old environment and removes your instant rollback. Use expand/contract (parallel change): add new schema compatibly first, ship code, and drop old columns only in a later release. Having two databases would break data consistency."
    theoryUrl: https://martinfowler.com/bliki/ParallelChange.html
    options:
      - {
          text: "Nothing, because blue and green environments always have separate databases that migrate independently",
          correct: false,
        }
      - {
          text: "The old version breaks; use backwards-compatible expand/contract migrations",
          correct: true,
        }
      - { text: "The load balancer fails; add a second load balancer", correct: false }
      - { text: "Only DNS caching is affected; lower the TTL before the switch", correct: false }
  - type: single
    prompt: "After switching all traffic to green, error rates spike. Why is rollback typically fastest in a blue/green setup?"
    explanation: "The previous (blue) environment is still running and untouched, so rollback is just pointing the router back at it, with no rebuild or redeploy. The cost is running two full environments for a while. It is not faster because of fewer users affected; that describes a canary."
    theoryUrl: https://martinfowler.com/bliki/BlueGreenDeployment.html
    options:
      - { text: "Only a small slice of users saw green, so it can be dropped", correct: false }
      - {
          text: "Green automatically reverts itself when error rates exceed a threshold",
          correct: false,
        }
      - {
          text: "The old environment is still running, so you only switch traffic back",
          correct: true,
        }
      - { text: "The previous build is recompiled from Git in a few seconds", correct: false }
  - type: single
    prompt: "A payments API serves 2,000 requests per second. You want to ship a risky change with the smallest possible user impact and automatic abort. Which strategy fits?"
    explanation: "A canary exposes the new version to a small percentage of traffic and compares health metrics to the baseline, aborting automatically on regression. Blue/green flips everyone at once, so impact is total if the signal is late. A big-bang rolling update without analysis offers no early abort."
    theoryUrl: https://martinfowler.com/bliki/CanaryRelease.html
    options:
      - { text: "Blue/green with an instant switch of 100% of traffic", correct: false }
      - { text: "Recreate strategy: stop the old version, then start the new one", correct: false }
      - { text: "Canary at 1-5% with automated analysis against baseline metrics", correct: true }
      - { text: "Deploy to all instances at once and watch dashboards manually", correct: false }
  - type: single
    prompt: "An internal service receives about 10 requests per minute. You configure a 1% canary and promote automatically after 5 minutes with no errors. What is the flaw?"
    explanation: "At that volume a 1% canary may see zero requests in 5 minutes, so the absence of errors proves nothing. For low-traffic services use synthetic traffic, larger percentages, or longer bake times. The other options describe problems that do not follow from the numbers."
    theoryUrl: https://sre.google/workbook/canarying-releases/
    options:
      - { text: "Canaries cannot be used on internal services", correct: false }
      - {
          text: "Zero errors is impossible at that volume, so the promotion will never happen automatically",
          correct: false,
        }
      - { text: "Percentages below 5% are rejected by every load balancer", correct: false }
      - {
          text: "The canary receives too little traffic to produce a meaningful signal",
          correct: true,
        }
  - type: multi
    prompt: "Which of these are real benefits of putting a new feature behind a feature flag? Select all that apply."
    explanation: "Flags decouple deployment from release, allow gradual or targeted rollout, and give a kill switch without redeploying. They do not remove the need to test both code paths, and they do not make the code simpler; each flag adds branches."
    theoryUrl: https://martinfowler.com/articles/feature-toggles.html
    options:
      - { text: "Code can be deployed dark and released later by flipping the flag", correct: true }
      - { text: "Only one code path ever needs to be tested", correct: false }
      - { text: "A misbehaving feature can be turned off without a redeploy", correct: true }
      - { text: "Rollout can be limited to a percentage or segment of users", correct: true }
  - type: single
    prompt: "A release toggle for a feature that has been 100% on for eight months is still in the code, and nobody remembers what happens if it is turned off. What is the architectural problem?"
    explanation: "Release toggles are meant to be short-lived; leftover flags multiply the combinations to test, hide dead code and can cause incidents when someone flips them. The fix is to remove the flag and the dead branch once the rollout is done. Flags are not inherently a security risk, and the name of the flag is not the issue."
    theoryUrl: https://martinfowler.com/articles/feature-toggles.html
    options:
      - { text: "Flags are evaluated on the client, so they leak the feature", correct: false }
      - {
          text: "Flag state should be stored in the database rather than in a service",
          correct: false,
        }
      - { text: "Long-lived release toggles add untested paths and technical debt", correct: true }
      - { text: "The flag should have been implemented as an environment variable", correct: false }
  - type: single
    prompt: 'The team says the kill switch for `newCheckout` "doesn''t work": flipping it in the flag dashboard changes nothing until the next deploy. What is the most likely cause?'
    code: |
      import { flags } from './flag-client'

      // evaluated once when the module is first loaded
      const useNewCheckout = flags.isEnabled('newCheckout')

      export function checkout(cart: Cart) {
        return useNewCheckout ? newCheckout(cart) : legacyCheckout(cart)
      }
    codeLanguage: typescript
    explanation: "The flag is read once at module load, so the value is frozen for the lifetime of the process. A kill switch must be evaluated per request (or on a short refresh) inside the handler. The ternary itself and the import are fine."
    theoryUrl: https://martinfowler.com/articles/feature-toggles.html
    options:
      - { text: "The flag is evaluated at module load time and never re-read", correct: true }
      - { text: "The ternary operator cannot branch on a boolean constant", correct: false }
      - { text: "The legacy path must be deleted before the flag can work", correct: false }
      - { text: "Flag clients only work inside React components", correct: false }
  - type: single
    prompt: "A faulty release ran for 20 minutes and sent duplicate invoice emails and double-charged some customers. The team rolled back to the previous version and new requests are fine. What is still left to do?"
    explanation: "A rollback restores the code, not the effects the bad version already had on data and on external systems. The double charges need refunds or compensating actions, and customers who got wrong emails need a correction. Re-running the old version against those orders does not undo anything, and a second rollback has nothing left to revert."
    theoryUrl: https://sre.google/workbook/postmortem-culture/
    options:
      - {
          text: "Nothing, since the rollback reverted every change the faulty version made to data and external systems",
          correct: false,
        }
      - {
          text: "Repair the side effects: refund the double charges and correct the affected customers",
          correct: true,
        }
      - {
          text: "Roll back once more to the version before the previous one, to be sure the effects are undone",
          correct: false,
        }
      - {
          text: "Replay the affected orders through the old version to overwrite them",
          correct: false,
        }
  - type: single
    prompt: "A bad change is in production and the fix is a one-line revert, but the full pipeline takes 40 minutes. The previous artifact is available. What is the usual first move?"
    explanation: "Restore service first: redeploy or re-point to the last known-good artifact (or flip a flag), then fix forward with calm. Waiting 40 minutes for the revert pipeline extends the outage. Rolling forward is right only when the fix is fast and safe, and skipping tests in the pipeline is the riskier habit."
    theoryUrl: https://sre.google/sre-book/effective-troubleshooting/
    options:
      - { text: "Push the revert commit and wait for the full pipeline", correct: false }
      - { text: "Disable the test stage permanently to speed up future fixes", correct: false }
      - { text: "Redeploy the last known-good artifact now, then fix forward", correct: true }
      - { text: "Keep the faulty version until the root cause is fully understood", correct: false }
  - type: single
    prompt: "A pull request changes an attribute that forces Terraform to replace the production database. The plan said so, but the line was buried in a 300-line diff and the reviewer approved it. Which pipeline practice prevents a repeat?"
    explanation: "An automated policy check on the plan can fail the pipeline, or demand an explicit extra approval, whenever a protected resource would be destroyed or replaced. That makes the dangerous change impossible to miss instead of relying on a human scanning the diff. State locking only serialises runs, and the state file holds metadata, not the database's data."
    theoryUrl: https://developer.hashicorp.com/terraform/tutorials/policy/policy-quickstart
    options:
      - {
          text: "Rely on the state lock, which refuses any apply that would destroy a resource it is tracking",
          correct: false,
        }
      - {
          text: "A policy check that blocks plans destroying or replacing protected resources",
          correct: true,
        }
      - {
          text: "Enable versioning on the state bucket, so the database's data can be restored from an older state",
          correct: false,
        }
      - { text: "Apply with auto-approve so problems surface sooner", correct: false }
  - type: boolean
    prompt: 'Building staging and production from the same IaC modules, with only variables such as size and count differing, reduces the "worked in staging, broke in production" surprises.'
    answer: true
    explanation: "When both environments come from the same code, the only differences are the ones you declared on purpose, so staging tests the real topology. Hand-built or separately maintained environments drift apart in ways nobody notices until a release breaks. Sizes can still differ; the shape should not."
    theoryUrl: https://12factor.net/dev-prod-parity
  - type: single
    prompt: "A CDK app looks up the newest machine image through an API call while it synthesizes, and uses the result in a launch template. Why do CDK's own guidelines warn against this kind of lookup during synthesis?"
    explanation: "Synthesis should be deterministic: the same commit should always produce the same template. A lookup that returns something new each time means a deploy can replace instances although nobody changed the code, and the change is hard to trace. CDK addresses this by caching lookup results in a file you commit; synthesis runs locally or in CI, not inside CloudFormation, and speed is not the main concern."
    theoryUrl: https://docs.aws.amazon.com/cdk/v2/guide/best-practices.html
    options:
      - {
          text: "The same commit can synthesize different templates, so deploys change resources nobody edited",
          correct: true,
        }
      - {
          text: "CloudFormation rejects templates that were generated by code making network calls",
          correct: false,
        }
      - {
          text: "Synthesis runs inside CloudFormation, which has no internet access to reach the image API",
          correct: false,
        }
      - {
          text: "API calls slow synthesis down, and a fast synth is the main reason CDK exists",
          correct: false,
        }
