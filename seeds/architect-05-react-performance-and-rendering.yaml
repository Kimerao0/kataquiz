version: 1
title: "Architect Roadmap 05: React performance and rendering"
description: What triggers a re-render, counting renders, memo, useMemo and useCallback effectiveness, React Compiler, reconciliation and keys, and practical optimisation strategies.
language: en
tags: [architect-roadmap, react, performance, rendering, memo, react-compiler, reconciliation]
run:
  questionsPerRun: 10
  maxErrors: 3
  timePerQuestionSec: 90
questions:
  - type: single
    prompt: "No memoisation and no React Compiler. The button is clicked twice. How many times in total does `Child` render, counting the first mount?"
    code: |
      function Child() {
        console.log('Child')
        return null
      }

      function P() {
        const [n, setN] = useState(0)
        return (
          <>
            <button onClick={() => setN(n + 1)}>+</button>
            <Child />
          </>
        )
      }
    codeLanguage: tsx
    explanation: "When a component re-renders, React re-renders all of its children by default, even if their props did not change. `P` renders three times (mount plus two clicks) and `Child` follows each time, so it logs three times."
    theoryUrl: https://react.dev/learn/render-and-commit
    options:
      - { text: "1", correct: false }
      - { text: "2", correct: false }
      - { text: "3", correct: true }
      - { text: "6", correct: false }
  - type: single
    prompt: "No React Compiler. The button is clicked once. How many times does `MC` render in total, counting the mount?"
    code: |
      const MC = memo(function MC({ o }: { o: { a: number } }) {
        console.log('MC')
        return null
      })

      function P() {
        const [n, setN] = useState(0)
        return (
          <>
            <button onClick={() => setN(n + 1)}>+</button>
            <MC o={{ a: 1 }} />
          </>
        )
      }
    codeLanguage: tsx
    explanation: "`memo` compares props with `Object.is`. The inline `{ a: 1 }` is a new object on each render of `P`, so the shallow comparison fails and `MC` re-renders anyway. It logs on mount and again after the click: 2."
    theoryUrl: https://react.dev/reference/react/memo#minimizing-props-changes
    options:
      - { text: "1, because the object has the same content", correct: false }
      - { text: "2, because the prop is a new object each time", correct: true }
      - { text: "0, because `memo` components never render on their own", correct: false }
      - { text: "3, one for the mount and one for each state setter call", correct: false }
  - type: single
    prompt: "No React Compiler. Same setup, but the prop is created with `useMemo`. The button is clicked once. How many times does `MC` render in total?"
    code: |
      function P() {
        const [n, setN] = useState(0)
        const o = useMemo(() => ({ a: 1 }), [])

        return (
          <>
            <button onClick={() => setN(n + 1)}>+</button>
            <MC o={o} />   {/* MC is wrapped in memo() */}
          </>
        )
      }
    codeLanguage: tsx
    explanation: "`useMemo` with an empty array returns the same object on each render, so the memoised child sees equal props with `Object.is` and skips. `MC` renders only on mount: once."
    theoryUrl: https://react.dev/reference/react/memo
    options:
      - { text: "1", correct: true }
      - { text: "2", correct: false }
      - { text: "0", correct: false }
      - { text: "It depends on the content of the object", correct: false }
  - type: single
    prompt: "No React Compiler. The button inside `Wrap` is clicked once. How many times does `Child` render in total (including mount)?"
    code: |
      function Wrap({ children }: { children: React.ReactNode }) {
        const [n, setN] = useState(0)
        return (
          <div>
            <button onClick={() => setN(n + 1)}>{n}</button>
            {children}
          </div>
        )
      }

      function P() {
        return <Wrap><Child /></Wrap>
      }
    codeLanguage: tsx
    explanation: "The `<Child />` element is created by `P`, which does not re-render. `Wrap` receives the same element reference as `children`, so React sees an identical element and skips rendering it. `Child` renders once, while `Wrap` renders twice."
    theoryUrl: https://react.dev/learn/render-and-commit
    options:
      - { text: "2, because it is rendered inside `Wrap`", correct: false }
      - { text: "1, since `children` keeps the same element reference", correct: true }
      - { text: "0, because `children` is never rendered by `Wrap`", correct: false }
      - { text: "3, one per state change and one for the initial render", correct: false }
  - type: single
    prompt: "How many renders of `P5` happen in total after one click (counting the mount)?"
    code: |
      function P5() {
        const [a, setA] = useState(0)
        const [b, setB] = useState(0)
        console.log('P5')

        return (
          <button onClick={() => {
            setA(a + 1)
            setB(b + 1)
            setA((x) => x + 1)
          }}>go</button>
        )
      }
    codeLanguage: tsx
    explanation: "React batches all state updates in the same event handler into one re-render. Three `set` calls, on two different state variables, still result in a single extra render, so `P5` logs twice: the mount and the click."
    theoryUrl: https://react.dev/learn/queueing-a-series-of-state-updates#react-batches-state-updates
    options:
      - { text: "4: the mount plus three updates", correct: false }
      - { text: "3: the mount plus one per state variable", correct: false }
      - { text: "2: the mount plus a single batched render", correct: true }
      - { text: "1: updates in handlers do not render until the next event", correct: false }
  - type: single
    prompt: "The state update runs after an `await`, in an async handler. How many renders of `P` happen after one click (counting the mount)?"
    code: |
      function P() {
        const [a, setA] = useState(0)
        const [b, setB] = useState(0)
        console.log('P')

        return (
          <button onClick={async () => {
            await Promise.resolve()
            setA(1)
            setB(1)
          }}>go</button>
        )
      }
    codeLanguage: tsx
    explanation: "Since React 18, updates are batched automatically everywhere: in timeouts, promises and native handlers too, not only in React event handlers. The two setters run in the same tick, so there is one extra render and two logs in total."
    theoryUrl: https://react.dev/blog/2022/03/29/react-v18#new-feature-automatic-batching
    options:
      - { text: "2: mount plus one batched render", correct: true }
      - { text: "3: mount plus one render per setter after the `await`", correct: false }
      - { text: "1: updates after `await` never render", correct: false }
      - { text: "4: each setter renders twice after an async call", correct: false }
  - type: single
    prompt: "How many times does `P` render in total after two clicks (counting the mount)?"
    code: |
      function P() {
        const [a, setA] = useState(0)
        console.log('P', a)
        return <button onClick={() => setA(0)}>same</button>
      }
    codeLanguage: tsx
    explanation: "Setting state to a value equal to the current one, with `Object.is`, makes React bail out: it does not re-render the component or its children. Only the mount logs `P 0`."
    theoryUrl: https://react.dev/reference/react/useState#setstate-caveats
    options:
      - { text: "3", correct: false }
      - { text: "2", correct: false }
      - { text: "1", correct: true }
      - { text: "0", correct: false }
  - type: single
    prompt: "No React Compiler. The button is clicked once. How many times does `M` render in total?"
    code: |
      const M = memo(function M({ children }: { children: React.ReactNode }) {
        console.log('M')
        return <>{children}</>
      })

      function P() {
        const [n, setN] = useState(0)
        return (
          <>
            <button onClick={() => setN(n + 1)}>+</button>
            <M><span>hi</span></M>
          </>
        )
      }
    codeLanguage: tsx
    explanation: "`children` is a JSX element created inline by `P` on each render, so it is a new object every time. The shallow comparison of `memo` sees a changed `children` prop, and `M` renders again: 2 times in total. Memoising `M` helps only if its props, children included, are stable."
    theoryUrl: https://react.dev/reference/react/memo#minimizing-props-changes
    options:
      - { text: "1, because `memo` ignores the `children` prop", correct: false }
      - { text: "2, because inline JSX children are a new element each render", correct: true }
      - { text: "0, because `M` renders only inside `P`'s commit", correct: false }
      - {
          text: "3, because both `M` and `span` count as separate renders on every click",
          correct: false,
        }
  - type: single
    prompt: "The component runs in `StrictMode` in development. How many `P8` logs appear after mount plus one click?"
    code: |
      function P8() {
        const [n, setN] = useState(0)
        console.log('P8', n)
        return <button onClick={() => setN(n + 1)}>{n}</button>
      }
    codeLanguage: tsx
    explanation: "In development, StrictMode renders every component twice to expose impure rendering (React DevTools may dim the second log, but a plain console shows both). The mount logs twice and the click re-render logs twice: 4 logs. Production renders once each."
    theoryUrl: https://react.dev/reference/react/StrictMode#fixing-bugs-found-by-double-rendering-in-development
    options:
      - { text: "2", correct: false }
      - { text: "3", correct: false }
      - { text: "4", correct: true }
      - { text: "1", correct: false }
  - type: single
    prompt: "The button changes `id` from `'a'` to `'b'`. What is logged after the click, depending on whether `Inp` has `key={id}` or not?"
    code: |
      function Inp({ id }: { id: string }) {
        const [t] = useState(() => { console.log('init state', id); return id })
        console.log('Inp', id)
        return null
      }

      // variant 1: <Inp key={id} id={id} />
      // variant 2: <Inp id={id} />
    codeLanguage: tsx
    explanation: "With `key={id}` the key changes, so React unmounts the old instance and mounts a new one: its initializer runs again (`init state b`, then `Inp b`). Without the key it is the same instance with a new prop: only `Inp b` is logged and the state `t` stays `'a'`."
    theoryUrl: https://react.dev/learn/preserving-and-resetting-state#option-2-resetting-state-with-a-key
    options:
      - {
          text: "Variant 1 logs `Inp b` only; variant 2 logs `init state b`, `Inp b`",
          correct: false,
        }
      - { text: "Both variants log `init state b` and `Inp b`", correct: false }
      - { text: "Both variants log `Inp b` only", correct: false }
      - {
          text: "Variant 1 logs `init state b`, `Inp b`; variant 2 logs `Inp b` only",
          correct: true,
        }
  - type: single
    prompt: "No React Compiler. `MB` is wrapped in `memo`. The button is clicked once. In which variant does `MB` render a second time?"
    code: |
      // variant 1
      const cb = useCallback(() => {}, [])
      // variant 2
      const cb = useCallback(() => { console.log(n) }, [n])

      return <>
        <button onClick={() => setN(n + 1)}>+</button>
        <MB onClick={cb} />
      </>
    codeLanguage: tsx
    explanation: "In variant 1 the callback keeps its identity, so the memoised child is skipped. In variant 2 the callback depends on `n`, which changed, so a new function is created and the child's prop changes, so `MB` re-renders. A `useCallback` with changing dependencies gives no benefit."
    theoryUrl: https://react.dev/reference/react/useCallback#skipping-re-rendering-of-components
    options:
      - { text: "Only variant 1", correct: false }
      - { text: "Only variant 2", correct: true }
      - { text: "Both variants", correct: false }
      - { text: "Neither variant", correct: false }
  - type: single
    prompt: "Parent `P12` renders `<Counter />` and `<Child />` as siblings. `Counter` holds its own state. After one click inside `Counter`, how many times in total have `P12`, `Counter` and `Child` rendered?"
    code: |
      function Counter() {
        const [n, setN] = useState(0)
        console.log('Counter')
        return <button onClick={() => setN(n + 1)}>{n}</button>
      }
      function P12() {
        console.log('P12')
        return <><Counter /><Child /></>
      }
    codeLanguage: tsx
    explanation: "State changes re-render the component that owns the state and its subtree. The parent and the sibling are not part of it. `P12` and `Child` render once, `Counter` twice. Moving state down into a small component is a cheap way to narrow re-renders."
    theoryUrl: https://react.dev/learn/render-and-commit
    options:
      - { text: "`P12`: 2, `Counter`: 2, `Child`: 2", correct: false }
      - { text: "`P12`: 1, `Counter`: 2, `Child`: 1", correct: true }
      - { text: "`P12`: 1, `Counter`: 2, `Child`: 2", correct: false }
      - { text: "`P12`: 2, `Counter`: 2, `Child`: 1", correct: false }
  - type: single
    prompt: "The button is clicked once. How many times does `P13` render in total?"
    code: |
      function P13() {
        const [o, setO] = useState({ n: 0 })
        console.log('P13', o.n)

        return (
          <button onClick={() => {
            o.n++
            setO(o)
          }}>go</button>
        )
      }
    codeLanguage: tsx
    explanation: "The object is mutated and the same reference is set, so `Object.is` says nothing changed and React bails out without re-rendering. Only the mount logged. The mutated `o.n` is 1, but the screen is stale until some other render happens."
    theoryUrl: https://react.dev/learn/updating-objects-in-state
    options:
      - { text: "2, logging `P13 1` on the second", correct: false }
      - { text: "1, because mutating and re-setting the same object bails out", correct: true }
      - { text: "2, logging `P13 0` on the second", correct: false }
      - { text: "0, because mutated state cancels the first render too", correct: false }
  - type: multi
    prompt: Which of these cause a React function component to re-render? Select all that apply.
    explanation: "A component renders when its own state changes, when its parent renders (unless it is memoised and its props are unchanged), and when a context it consumes changes. Mutating a plain variable or a ref does not schedule a render."
    theoryUrl: https://react.dev/learn/render-and-commit#step-1-trigger-a-render
    options:
      - { text: "Its own state is set to a new value", correct: true }
      - { text: "Its parent re-renders and it is not memoised", correct: true }
      - { text: "A context value it reads with `useContext` changes", correct: true }
      - { text: "`ref.current` is assigned a new value inside an event handler", correct: false }
  - type: single
    prompt: "A component re-renders but returns exactly the same JSX as before. What does React do with the real DOM?"
    explanation: "Rendering calls your component and compares the new element tree with the previous one. DOM changes happen in the commit phase, and only for differences. With identical output React touches nothing in the DOM. A render is not a repaint."
    theoryUrl: https://react.dev/learn/render-and-commit#step-3-react-commits-changes-to-the-dom
    options:
      - { text: "It rebuilds the DOM subtree, to be safe", correct: false }
      - {
          text: "It replaces the root DOM node of the component, but not its children",
          correct: false,
        }
      - { text: "It re-applies every attribute, but does not recreate nodes", correct: false }
      - { text: "It leaves the DOM untouched, because nothing differs", correct: true }
  - type: single
    prompt: "How does `memo` decide whether to skip a re-render?"
    explanation: "It compares each prop of the new and the previous render with `Object.is`, a shallow check. Primitives with equal values match; objects, arrays and functions match only if they are the same reference. You can pass a custom comparison as a second argument, but it is rarely a good idea."
    theoryUrl: https://react.dev/reference/react/memo#usage
    options:
      - {
          text: "It deep-compares all props and state, using a structural equality check",
          correct: false,
        }
      - { text: "It compares each prop shallowly with `Object.is`", correct: true }
      - {
          text: "It compares the rendered output, and skips the commit when it is equal",
          correct: false,
        }
      - { text: "It skips whenever the parent did not call `setState` itself", correct: false }
  - type: single
    prompt: "What does the React Compiler do?"
    explanation: "It is a build-time tool that analyses components and hooks and inserts memoisation automatically, equivalent to `useMemo`, `useCallback` and `memo` at fine granularity. It assumes the code follows the Rules of React. It does not change runtime semantics or make a bad algorithm faster."
    theoryUrl: https://react.dev/learn/react-compiler
    options:
      - {
          text: "It compiles JSX to native code, so the virtual DOM is not needed and updates skip reconciliation",
          correct: false,
        }
      - {
          text: "At build time it memoises components and values, assuming the Rules of React",
          correct: true,
        }
      - { text: "At runtime it detects slow components and caches them", correct: false }
      - { text: "It removes `useEffect` calls that it considers unnecessary", correct: false }
  - type: single
    prompt: "Your team enables the React Compiler on a mature codebase full of `useMemo` and `useCallback`. What does the React team recommend?"
    explanation: "Leave existing manual memoisation in place, since removing it can change compiled output, and rely on the compiler for new code. `useMemo` and `useCallback` remain useful as an escape hatch, for example to control an effect's dependencies precisely."
    theoryUrl: https://react.dev/learn/react-compiler
    options:
      - {
          text: "Delete every manual `useMemo` and `useCallback` right away; they are now harmful",
          correct: false,
        }
      - {
          text: "Keep existing memoisation, rely on the compiler for new code, and use manual memo as an escape hatch",
          correct: true,
        }
      - { text: "Disable the compiler for any file that imports a hook", correct: false }
      - { text: "Wrap the whole app in a single `memo` so the compiler can start", correct: false }
  - type: single
    prompt: "After enabling the React Compiler, one component behaves wrongly because it mutates a prop object during render. What should you do?"
    explanation: 'The compiler''s assumptions rely on the Rules of React, and mutating props during render violates them. The right fix is to make the render pure. As a temporary escape you can opt a component out with the `"use no memo"` directive.'
    theoryUrl: https://react.dev/reference/react-compiler/directives/use-no-memo
    options:
      - {
          text: 'Fix the mutation; if urgent, opt the component out with `"use no memo"`',
          correct: true,
        }
      - { text: "Wrap the mutation in `useMemo`, which the compiler then skips", correct: false }
      - {
          text: "Switch the component to a class, since the compiler handles only functions",
          correct: false,
        }
      - { text: "Raise the compiler's optimisation level to include mutation", correct: false }
  - type: single
    prompt: "Which two assumptions let React's reconciliation diff two trees in linear time instead of the generic quadratic or worse algorithm?"
    explanation: "React assumes that elements of different types produce different trees (so it replaces the subtree), and that a stable `key` identifies the same child across renders. These heuristics trade perfect minimal diffs for speed and are why keys and component types matter."
    theoryUrl: https://react.dev/learn/preserving-and-resetting-state
    options:
      - { text: "Components are pure, and props are always immutable objects", correct: false }
      - {
          text: "Elements at a position keep their state, and updates always happen top-down",
          correct: false,
        }
      - {
          text: "Elements of different types give different trees, and keys identify children across renders",
          correct: true,
        }
      - {
          text: "Children are compared by content hash, and only the root is compared by type",
          correct: false,
        }
  - type: single
    prompt: "A list of 500 rows with local state is reordered by sorting. With `key={row.id}` versus `key={index}`, what changes?"
    explanation: "With stable ids, React matches each row to its existing instance and just moves it, keeping state and DOM. With index keys, the instance at each position stays and receives another row's props, so local state ends up attached to the wrong row, and rows update unnecessarily."
    theoryUrl: https://react.dev/learn/rendering-lists#why-does-react-need-keys
    options:
      - { text: "Nothing: keys only silence a warning", correct: false }
      - { text: "Index keys are faster, since they are cheaper to compute", correct: false }
      - {
          text: "Id keys remount all rows on every sort, while index keys move the existing instances to their new positions",
          correct: false,
        }
      - {
          text: "Id keys move instances with their state; index keys keep positions, and state sticks to the wrong rows",
          correct: true,
        }
  - type: single
    prompt: "A page has a text input and, as its sibling, a very heavy chart. Typing is laggy because the input's state lives in the page component, which re-renders the chart each keystroke. What is the best first fix?"
    explanation: "Moving state down is the cheapest, most robust fix: put the input and its state into its own component, so keystrokes re-render only it. Alternatives like `memo` on the chart also work but depend on stable props. A `useEffect` copy of the state does not reduce renders."
    theoryUrl: https://overreacted.io/before-you-memo/
    options:
      - {
          text: "Move the input state into a small component, so the chart is not re-rendered",
          correct: true,
        }
      - { text: "Add a `useEffect` that debounces the input's state updates", correct: false }
      - { text: "Replace the state with a ref, and force a render on blur", correct: false }
      - { text: "Wrap the input in `useMemo` so it does not re-render", correct: false }
  - type: single
    prompt: "A table must show 10,000 rows and scrolling is janky; profiling shows time spent mounting rows. Which approach addresses the cause?"
    explanation: "The cost is the number of mounted DOM nodes and components. Virtualisation (windowing) renders only the rows near the viewport. `memo` helps update cost, not initial mount of everything, and `useMemo` does not reduce the number of elements rendered."
    theoryUrl: https://web.dev/articles/virtualize-long-lists-react-window
    options:
      - { text: "Wrap each row in `memo`, so rows never render", correct: false }
      - { text: "Cache the array of rows with `useMemo`", correct: false }
      - {
          text: "Move the rows into context, so the table does not own them and rendering becomes cheaper",
          correct: false,
        }
      - { text: "Virtualise the list, rendering only the rows near the viewport", correct: true }
  - type: single
    prompt: "A search input filters a heavy list of results. Typing feels laggy because every keystroke renders the list. Which React API keeps the input responsive without debouncing?"
    explanation: "`useDeferredValue(query)` lets the input update immediately with the urgent value, while the list renders with the deferred value in a lower-priority render that can be interrupted by new typing. `useTransition` achieves similar results when you control the state setter."
    theoryUrl: https://react.dev/reference/react/useDeferredValue
    options:
      - {
          text: "`useDeferredValue` on the query, so the list renders at lower priority",
          correct: true,
        }
      - {
          text: "`useLayoutEffect`, so the list renders before the paint and keeps typing responsive",
          correct: false,
        }
      - { text: "`flushSync`, so each keystroke renders synchronously", correct: false }
      - { text: "`useRef`, to hold the query and skip renders entirely", correct: false }
  - type: single
    prompt: "An admin dashboard ships a 1.2 MB charting library that only 5% of users open, on a secondary tab. What is the most suitable improvement for load performance?"
    explanation: "`React.lazy` with a dynamic `import()`, inside `<Suspense>`, splits the code so the chart bundle downloads only when the tab renders. `memo` and `useMemo` reduce rendering work, not the bytes downloaded."
    theoryUrl: https://react.dev/reference/react/lazy
    options:
      - { text: "Wrap the chart component in `memo`", correct: false }
      - { text: "Load the chart with `React.lazy` and a `<Suspense>` fallback", correct: true }
      - { text: "Import it normally and compute its data with `useMemo`", correct: false }
      - { text: "Render the chart inside `StrictMode` to defer its work", correct: false }
