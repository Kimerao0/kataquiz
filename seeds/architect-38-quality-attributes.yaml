version: 1
title: "Architect Roadmap 38: Quality attributes"
description: Availability and how it is measured, RTO and RPO, multi-region disaster recovery, scalability, latency and throughput, security and portability trade-offs, maintainability, and how to balance them.
language: en
tags: [architect-roadmap, architecture, availability, disaster-recovery, scalability]
run:
  questionsPerRun: 10
  maxErrors: 3
  timePerQuestionSec: 90
questions:
  - type: single
    prompt: "Two managed queue vendors both advertise 99.9% availability. Vendor A measures per calendar month with a probe inside its own data centre and excludes announced maintenance. Vendor B counts every failed client request over a rolling 30 days, with no exclusions. What should you conclude?"
    explanation: "An availability figure means little without its definition: what counts as a failure, where it is measured, over which window and what is excluded. A probe inside the vendor's network can stay green while clients fail, and announced maintenance is still downtime for your users. Ask for the definitions and, where it matters, measure the dependency from your side."
    theoryUrl: https://sre.google/sre-book/service-level-objectives/
    options:
      - {
          text: "The two figures are not comparable until you know how each one is defined",
          correct: true,
        }
      - {
          text: "They are equivalent, because the percentage is the same and both windows cover about a month",
          correct: false,
        }
      - {
          text: "Vendor A is more reliable, because excluding maintenance shows its unplanned downtime is lower",
          correct: false,
        }
      - {
          text: "Vendor B is worse, because request-based measurement always yields lower numbers than probes",
          correct: false,
        }
  - type: single
    prompt: "An object store advertises far higher durability than availability. What is the difference between the two?"
    explanation: "Durability is the probability that stored data is not lost over time; availability is the probability that you can read or write it right now. A service can be briefly unreachable without losing anything, which is why durability targets are usually much higher. Neither is about latency, and the two are measured independently."
    theoryUrl: https://docs.aws.amazon.com/AmazonS3/latest/userguide/DataDurability.html
    options:
      - {
          text: "Durability is not losing stored data; availability is being able to access it now",
          correct: true,
        }
      - {
          text: "Durability measures write latency, availability measures read latency",
          correct: false,
        }
      - {
          text: "Durability is about the hardware, availability is about the network between regions",
          correct: false,
        }
      - { text: "They are the same metric, quoted over different time windows", correct: false }
  - type: single
    prompt: "A team must choose between automatic failover and human-confirmed failover for its primary database. What is the core trade-off?"
    explanation: "Automation shrinks detection and recovery time, which suits a tight RTO, but a health check cannot always tell a dead primary from a slow or cut-off one: failing over on a false alarm causes disruption and, without fencing the old primary, can leave two nodes accepting writes. A human confirmation avoids that at the cost of a longer RTO. Both options still need replication, and neither is better in every case."
    theoryUrl: https://en.wikipedia.org/wiki/Split-brain_(computing)
    options:
      - {
          text: "Automatic recovers faster but may fail over on a false alarm and split writes",
          correct: true,
        }
      - {
          text: "Human-confirmed failover always has the shorter RTO, because people check the state first",
          correct: false,
        }
      - {
          text: "Automatic failover removes the need to replicate data from the primary to the replica",
          correct: false,
        }
      - {
          text: "None: automatic failover is strictly better once health checks exist",
          correct: false,
        }
  - type: single
    prompt: "A team computes that two replicas at 99% each give 99.99% availability. In production they still see outages about as often as with one replica. What is the most likely flaw in the calculation?"
    explanation: "The formula assumes independent failures. Replicas that share an AZ, a deployment pipeline, a config store or a bad release fail together, so the real availability is capped by the shared component. Replica count, nines in the SLA and load balancer cost are not the cause."
    theoryUrl: https://aws.amazon.com/builders-library/static-stability-using-availability-zones/
    options:
      - {
          text: "Two replicas are not enough, redundancy only works from three replicas",
          correct: false,
        }
      - { text: "Availability percentages cannot be multiplied or combined at all", correct: false }
      - {
          text: "The failures are correlated through shared components such as the AZ, release or config",
          correct: true,
        }
      - {
          text: "The load balancer in front of the replicas adds its own fixed overhead to every request, cancelling the redundancy gain",
          correct: false,
        }
  - type: single
    prompt: "Which statement correctly defines RTO and RPO?"
    explanation: "RTO (Recovery Time Objective) is how long the service may be down. RPO (Recovery Point Objective) is how much data, measured as time, you can afford to lose. They are independent: a nightly backup gives an RPO of up to 24 hours even if restore takes minutes."
    theoryUrl: https://docs.aws.amazon.com/whitepapers/latest/disaster-recovery-workloads-on-aws/disaster-recovery-options-in-the-cloud.html
    options:
      - {
          text: "RTO is the maximum tolerable data loss, RPO is the maximum tolerable downtime",
          correct: false,
        }
      - {
          text: "RTO is the maximum tolerable downtime, RPO the maximum tolerable data loss in time",
          correct: true,
        }
      - {
          text: "RTO and RPO are two names for the time needed to fail over to another region and restore service",
          correct: false,
        }
      - {
          text: "RTO is measured in requests per second, RPO in the number of replicas required",
          correct: false,
        }
  - type: single
    prompt: "A payments ledger must have an RPO of zero across two regions that are 80 ms apart. What is the unavoidable trade-off?"
    explanation: "RPO zero means no acknowledged write may be lost, so the write must be committed in both regions before it is acknowledged (synchronous replication). That adds the cross-region round trip to every write and ties availability to the remote region. Asynchronous replication is faster but loses the in-flight tail."
    theoryUrl: https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/welcome.html
    options:
      - {
          text: "Asynchronous replication is enough as long as it uses a dedicated network link",
          correct: false,
        }
      - {
          text: "Synchronous cross-region commits add the round-trip latency to every write",
          correct: true,
        }
      - {
          text: "You must give up RTO, because zero data loss makes failover impossible",
          correct: false,
        }
      - {
          text: "Nightly snapshots shipped to the second region reach RPO zero if encrypted",
          correct: false,
        }
  - type: single
    prompt: "A team runs its database with a synchronous standby in a second AZ and argues that backups are no longer needed. Which failure shows they are wrong?"
    explanation: "Replication copies every change, including bad ones: a faulty migration or an accidental DELETE reaches the standby within milliseconds. Only point-in-time backups let you restore to a moment before the mistake. A lost AZ or a crashed primary are exactly what the standby protects against."
    theoryUrl: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_PIT.html
    options:
      - {
          text: "A faulty migration deletes rows, and the deletion is replicated at once",
          correct: true,
        }
      - { text: "The primary's AZ loses power for several hours", correct: false }
      - {
          text: "The primary instance crashes because of a hardware fault on its host machine",
          correct: false,
        }
      - { text: "A spike in reads saturates the primary's CPU during a sale", correct: false }
  - type: multi
    prompt: "A zone outage must not take your service down. Which measures help? Select all that apply."
    explanation: "Spreading instances and data across AZs, and pre-provisioning enough capacity so a zone loss needs no scale-up (static stability) both remove the dependency on control-plane actions during the failure. Buying a bigger instance in the same AZ does nothing for an AZ outage."
    theoryUrl: https://aws.amazon.com/builders-library/static-stability-using-availability-zones/
    options:
      - {
          text: "Run instances and the primary/standby database in at least two AZs",
          correct: true,
        }
      - { text: "Move to the largest instance size available in the current AZ", correct: false }
      - {
          text: "Keep enough spare capacity in the surviving AZs to absorb the load immediately",
          correct: true,
        }
      - { text: "Use health checks so traffic is routed away from the failed zone", correct: true }
  - type: single
    prompt: "A company wants active-active writes in two regions for an inventory system that needs strong consistency. What is the fundamental difficulty?"
    explanation: "Concurrent writes to the same record in two regions either need cross-region coordination (consensus or locks, paying the latency) or conflict resolution (accepting weaker consistency). Neither compute capacity nor DNS is the core problem, and the CAP trade-off does not go away with more replicas."
    theoryUrl: https://www.allthingsdistributed.com/2008/12/eventually_consistent.html
    options:
      - { text: "DNS cannot return two region endpoints for the same hostname", correct: false }
      - {
          text: "Writes in both regions need cross-region coordination or conflict resolution",
          correct: true,
        }
      - {
          text: "Two regions cannot hold more than one copy of the same database without a shared storage volume",
          correct: false,
        }
      - { text: "Compute capacity doubles, which breaks the autoscaling limits", correct: false }
  - type: boolean
    prompt: "Moving from 99.9% to 99.99% availability costs roughly the same as moving from 99% to 99.9%."
    answer: false
    explanation: "Each additional nine usually costs disproportionately more: tighter detection, automated failover, multi-AZ or multi-region, more testing and a larger on-call investment. That is why the target must come from business impact, not ambition."
    theoryUrl: https://sre.google/sre-book/embracing-risk/
  - type: single
    prompt: "A banking app asks for a second factor on every screen, and many users abandon it. Product now wants to remove the second factor entirely. Which design best balances security and usability?"
    explanation: "Step-up (risk-based) authentication puts friction where the risk is: viewing a balance needs only the normal session, while adding a payee or making a large transfer asks for a fresh second factor. That keeps strong protection on the actions attackers want without taxing every interaction. Forced frequent password changes push users toward weaker, predictable passwords, and opt-in MFA leaves most accounts unprotected."
    theoryUrl: https://pages.nist.gov/800-63-3/sp800-63b.html
    options:
      - {
          text: "Remove the second factor and require long passwords that users must change every 30 days",
          correct: false,
        }
      - {
          text: "Keep it on every screen, since security always outweighs usability",
          correct: false,
        }
      - {
          text: "Ask for a second factor only on risky actions, such as new payees or large transfers",
          correct: true,
        }
      - {
          text: "Make the second factor optional and off by default, so users choose their own risk",
          correct: false,
        }
  - type: single
    prompt: "An ingestion service writes each incoming event to the database in its own transaction, and throughput has become the bottleneck. Grouping events into batches of a few hundred would raise throughput several times. What does the team give up?"
    explanation: "Batching spreads the per-transaction overhead (round trips, commits) across many events, so throughput rises, but each event now waits for its batch to fill or for a flush timer, so per-event latency goes up. A maximum batch size plus a maximum wait bounds that delay. Batched writes are still committed durably and in order: the trade is latency for throughput."
    theoryUrl: https://kafka.apache.org/documentation/#maximizingefficiency
    options:
      - {
          text: "Per-event latency, since each event waits for its batch to fill or a timer to fire",
          correct: true,
        }
      - {
          text: "Durability, since batched writes stay in memory and are never persisted to disk",
          correct: false,
        }
      - {
          text: "Nothing, because batching always improves throughput and latency at the same time",
          correct: false,
        }
      - {
          text: "Ordering, since the database applies the events inside a batch in a random order",
          correct: false,
        }
  - type: single
    prompt: "A page sends 50 backend calls in parallel and waits for all of them. Each backend is fast at the median and only occasionally slow. Why is the page slow far more often than any single backend, and what helps?"
    explanation: "When a request waits for all of many parallel calls, its latency is that of the slowest one, so a backend that is slow on a small share of calls makes a large share of 50-way fan-outs hit at least one slow call. Hedged requests to another replica, a smaller fan-out, or returning partial results by a deadline cut the effect. Making the calls sequential would add their latencies together, and parallel latencies do not sum."
    theoryUrl: https://research.google/pubs/the-tail-at-scale/
    options:
      - {
          text: "The slowest call sets the page time; hedge requests or reduce the fan-out",
          correct: true,
        }
      - {
          text: "Parallel calls share one connection, so 50 of them are 50 times slower; make them sequential",
          correct: false,
        }
      - {
          text: "The 50 median latencies add up, so the page takes about 50 times as long as one call",
          correct: false,
        }
      - {
          text: "Backends throttle each other when called at once; add a random delay before each call",
          correct: false,
        }
  - type: single
    prompt: "A web app keeps login sessions in each server's memory, so you pin users to one server with sticky sessions. Scaling out causes logouts when instances are replaced. Which change best fixes the scalability problem?"
    explanation: "Stateless application servers can be added, removed or replaced freely. Moving the session to a shared store (Redis, database) or a signed token removes the affinity. A bigger server only delays the issue, and a longer sticky TTL makes replacement even more disruptive."
    theoryUrl: https://aws.amazon.com/builders-library/avoiding-fallback-in-distributed-systems/
    options:
      - {
          text: "Externalise the session to a shared store so any instance can serve any user",
          correct: true,
        }
      - { text: "Increase the sticky-session cookie lifetime to 24 hours", correct: false }
      - {
          text: "Scale vertically to a bigger instance and keep sessions in memory, so fewer replacements happen",
          correct: false,
        }
      - { text: "Replicate every session to all instances over a gossip protocol", correct: false }
  - type: single
    prompt: "An e-commerce database primary is at 90% CPU. The workload is 95% reads, mostly product lookups that tolerate a few seconds of staleness. What is the best first move?"
    explanation: "With a read-heavy workload that tolerates staleness, read replicas and a cache offload the primary at low cost. Sharding is far more complex and solves write scaling, which is not the bottleneck. Synchronous replicas for reads would add write latency without helping."
    theoryUrl: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_ReadRepl.html
    options:
      - { text: "Shard the database by customer id across eight primaries", correct: false }
      - { text: "Make all replicas synchronous so reads can be served anywhere", correct: false }
      - { text: "Add read replicas and a cache, accepting replication lag", correct: true }
      - { text: "Move the product catalog to a multi-region active-active store", correct: false }
  - type: single
    prompt: "A bad configuration push took down the service for every customer at once. Which architectural approach most directly limits how many customers one such failure can affect?"
    explanation: "A cell-based architecture splits the service into independent copies (cells), each serving a subset of customers, and changes roll out one cell at a time. A bad change or a poison request then hits only one cell. More replicas sharing one config, or bigger instances, still fail together."
    theoryUrl: https://docs.aws.amazon.com/wellarchitected/latest/reducing-scope-of-impact-with-cell-based-architecture/reducing-scope-of-impact-with-cell-based-architecture.html
    options:
      - {
          text: "Split the service into independent cells and roll changes out cell by cell",
          correct: true,
        }
      - {
          text: "Add more replicas behind the same load balancer, all reading the same config",
          correct: false,
        }
      - { text: "Move to larger instances so each one has more headroom", correct: false }
      - {
          text: "Store the configuration in a highly available, replicated key-value store shared by all instances",
          correct: false,
        }
  - type: multi
    prompt: "Which of the following are meaningful measurements of maintainability? Select all that apply."
    explanation: "Maintainability is about how cheaply and safely the system can change: lead time for changes, change failure rate and the number of dependency cycles all track that. Peak CPU and p99 latency are performance measures and say nothing about how hard the code is to evolve."
    theoryUrl: https://dora.dev/guides/dora-metrics-four-keys/
    options:
      - { text: "Lead time for a change to reach production", correct: true }
      - { text: "Peak CPU utilisation during the daily traffic spike", correct: false }
      - { text: "Number of cyclic dependencies between modules", correct: true }
      - { text: "Change failure rate of deployments", correct: true }
  - type: single
    prompt: "Security wants every request to pass an audit-logging step before it is answered. Product wants p99 latency under 200 ms. Which technique makes the trade-off explicit and comparable?"
    explanation: "Quality attribute scenarios (stimulus, environment, response, response measure) ranked in a utility tree, as done in ATAM, force each concern to be stated measurably and prioritised by business value. Voting, or maximising every attribute, does not resolve conflicts between attributes."
    theoryUrl: https://martinfowler.com/architecture/
    options:
      - {
          text: "Maximise every attribute and fix conflicts when they appear in production",
          correct: false,
        }
      - { text: "Let the loudest stakeholder decide, then document it", correct: false }
      - {
          text: "Write measurable quality attribute scenarios and rank them in a utility tree",
          correct: true,
        }
      - { text: "Pick the attribute that is easiest to test and ignore the others", correct: false }
  - type: single
    prompt: "Going from 8 to 16 instances raises a service's throughput by only 10%, and going to 32 actually lowers it. CPU on each instance is low. What is the most likely cause?"
    explanation: "Throughput that flattens and then falls as nodes are added is the signature of contention and coordination costs: instances wait on a shared resource such as a hot database row, a lock or a single-writer queue, and more instances mean more waiting. The Universal Scalability Law describes this. The fix is to remove or partition the shared bottleneck, not to add instances or bigger machines."
    theoryUrl: https://en.wikipedia.org/wiki/Neil_J._Gunther
    options:
      - {
          text: "The instances contend for a shared resource, such as a lock or a hot row",
          correct: true,
        }
      - {
          text: "The instances are too small; a larger instance type would make throughput scale linearly",
          correct: false,
        }
      - { text: "The load balancer uses round robin instead of least connections", correct: false }
      - { text: "Autoscaling is too slow to add instances", correct: false }
  - type: single
    prompt: "An internal admin endpoint is called a few times per minute and answers in 300 ms with clear, well-tested code. A developer proposes a hand-tuned rewrite that reaches 50 ms but is much harder to read and change. How should the architect judge it?"
    explanation: "Quality attributes are traded against each other according to business value. Here the latency gain buys nothing users need, while the loss of maintainability makes every future change slower and riskier, so the rewrite is not worth it. Faster is not automatically better, and keeping the same tests does not restore readability."
    theoryUrl: https://wiki.c2.com/?PrematureOptimization
    options:
      - {
          text: "Reject it: the speed-up has no business value and costs maintainability",
          correct: true,
        }
      - {
          text: "Accept it, because lower latency always improves the user experience",
          correct: false,
        }
      - {
          text: "Accept it, as long as the hand-tuned code is covered by the same tests as the old code",
          correct: false,
        }
      - { text: "Reject it, because fast code is always harder to test", correct: false }
  - type: single
    prompt: "Why does 'static stability' recommend pre-provisioning capacity for an AZ failure instead of relying on autoscaling to replace it?"
    explanation: "During a large failure many customers hit the control plane at the same time, and scaling actions may be slow or fail. A statically stable design keeps working using resources already in place, without needing any control-plane call at the moment of failure."
    theoryUrl: https://aws.amazon.com/builders-library/static-stability-using-availability-zones/
    options:
      - { text: "Autoscaling can never create instances in another AZ", correct: false }
      - {
          text: "Pre-provisioned capacity is always cheaper than autoscaled capacity because it avoids launch fees",
          correct: false,
        }
      - {
          text: "Autoscaling needs the control plane, which may be down exactly when you need it",
          correct: true,
        }
      - { text: "Instances launched during an outage are billed at a higher rate", correct: false }
  - type: single
    prompt: "A startup with one product team runs on a single cloud. An architect proposes wrapping every managed service (queues, storage, database) in in-house abstractions and avoiding provider-specific features, so the system could move to another cloud. What is the main trade-off to weigh?"
    explanation: "Portability is a quality attribute with a price: lowest-common-denominator abstractions take time to build and maintain, and they give up managed features that would save effort. For a small team with no concrete plan to switch, that cost buys an option it may never use; isolating only the few parts where a switch is likely is a cheaper hedge. Abstractions add no speed, and moving data out of a cloud is never free."
    theoryUrl: https://martinfowler.com/articles/oss-lockin.html
    options:
      - {
          text: "Portability that may never be used, paid for now in speed and lost features",
          correct: true,
        }
      - {
          text: "None: abstraction layers cost nothing to build and make the system portable for free",
          correct: false,
        }
      - {
          text: "None: lock-in is irrelevant, because providers guarantee a free migration of all data out",
          correct: false,
        }
      - {
          text: "Performance: abstractions make the system faster by removing calls to provider APIs",
          correct: false,
        }
  - type: single
    prompt: "A background worker pool processes a queue that gets huge spikes at random times. Autoscaling on average CPU reacts too late and messages wait for minutes. Which scaling signal fits best?"
    explanation: "For queue consumers, queue depth or the age of the oldest message (backlog per worker) leads the load, while CPU only rises after workers are already saturated. Memory and network metrics have the same lag problem."
    theoryUrl: https://docs.aws.amazon.com/autoscaling/ec2/userguide/as-using-sqs-queue.html
    options:
      - { text: "Memory utilisation of the worker hosts", correct: false }
      - { text: "Backlog per worker, from queue depth or oldest message age", correct: true }
      - { text: "Network throughput of the load balancer", correct: false }
      - { text: "A fixed schedule based on last month's busiest hour", correct: false }
  - type: single
    prompt: "A team cannot prevent every failure but wants better availability. Availability is MTBF / (MTBF + MTTR). Which investment is typically the most effective?"
    explanation: "Reducing MTTR (fast detection, automated rollback, runbooks, tested failover) improves availability even when failures keep happening, and it is far cheaper than making failures rarer. Longer MTBF alone does not help once a failure occurs and takes hours to fix."
    theoryUrl: https://sre.google/sre-book/introduction/
    options:
      - { text: "Add more features to reduce the user's reliance on one flow", correct: false }
      - {
          text: "Eliminate all bugs before every release with a longer QA phase and a stricter code freeze",
          correct: false,
        }
      - { text: "Hire more developers to increase the commit rate", correct: false }
      - {
          text: "Cut detection and recovery time with automated rollback and tested failover",
          correct: true,
        }
  - type: boolean
    prompt: "A nightly database backup that has never been restored can be counted when you claim your RTO and RPO."
    answer: false
    explanation: "An untested backup is an assumption: it may be corrupt, incomplete or take far longer to restore than planned. RTO and RPO are only credible when measured by regular restore and failover drills."
    theoryUrl: https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/welcome.html
