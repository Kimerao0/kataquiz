version: 1
title: "Architect Roadmap 22: APIs and data in Node.js services"
description: REST vs GraphQL vs gRPC, idempotency, pagination, Redis caching, connection pooling, and transactions and consistency across services.
language: en
tags: [architect-roadmap, nodejs, api-design, caching, databases, consistency]
run:
  questionsPerRun: 10
  maxErrors: 3
  timePerQuestionSec: 90
questions:
  - type: single
    prompt: "A mobile app has twelve screens, each needing a different slice of the same user, order and product data. With the current REST API, screens make 4 to 6 calls each and download many unused fields on slow networks. Which change fits best?"
    explanation: "This is the classic over-fetching and under-fetching case that GraphQL (or a backend-for-frontend aggregating endpoints) addresses: the client asks for exactly the fields it needs in one request. gRPC is not a good fit for mobile-to-API in most setups and does not change what gets fetched, and adding more fine-grained REST endpoints increases the round trips."
    theoryUrl: https://graphql.org/learn/
    options:
      - {
          text: "Expose a GraphQL layer or a BFF so each screen gets one tailored response",
          correct: true,
        }
      - {
          text: "Add one extra REST endpoint per screen and per field combination, and version each as the screens evolve",
          correct: false,
        }
      - { text: "Replace the REST API with gRPC so the payloads are smaller", correct: false }
      - {
          text: "Compress the responses with gzip so that unused fields cost nothing",
          correct: false,
        }
  - type: single
    prompt: "Forty internal services written in Go, Java and Node.js call each other thousands of times per second. You want strict typed contracts, code generation for every language, and server-side streaming for some calls. Which protocol do you choose between them?"
    explanation: "gRPC uses Protocol Buffers over HTTP/2, which gives compact binary messages, generated clients in many languages, deadlines and native streaming, a good fit for internal polyglot service-to-service traffic. REST with JSON can do the job but has no enforced contract or streaming model, and GraphQL is designed for flexible client queries, not for internal RPC."
    theoryUrl: https://grpc.io/docs/what-is-grpc/introduction/
    options:
      - {
          text: "GraphQL, since each service can then query exactly the fields it needs",
          correct: false,
        }
      - { text: "REST with JSON, because every language has an HTTP client", correct: false }
      - {
          text: "SOAP, because it has the strictest contract definition of the options",
          correct: false,
        }
      - {
          text: "gRPC with Protocol Buffers, since it gives typed contracts and streaming",
          correct: true,
        }
  - type: single
    prompt: "You are designing a public read-heavy API for third-party developers (catalog data that changes a few times a day). You want CDN and browser caching to absorb most of the traffic. Which style benefits most out of the box?"
    explanation: "REST over HTTP maps resources to URLs, and `GET` responses can be cached by browsers, proxies and CDNs using standard headers (`Cache-Control`, `ETag`). GraphQL typically sends queries as `POST` to a single endpoint, so HTTP caching does not apply without extra work (persisted queries, GET queries). gRPC is not cacheable by generic HTTP intermediaries."
    theoryUrl: https://developer.mozilla.org/en-US/docs/Web/HTTP/Caching
    options:
      - {
          text: "GraphQL, because the clients choose their fields and so every response is small",
          correct: false,
        }
      - { text: "gRPC, since binary messages are cached more efficiently by CDNs", correct: false }
      - {
          text: "REST with `GET` on resource URLs, using `Cache-Control` and `ETag`",
          correct: true,
        }
      - {
          text: "All three styles cache equally, as caching is independent of the protocol",
          correct: false,
        }
  - type: single
    prompt: "A GraphQL endpoint returns a list of 50 posts, each with its author. The database log shows 1 query for the posts and then 50 queries for authors, one per post. What is the standard fix?"
    explanation: "This is the N+1 problem: each `author` resolver runs its own query. A batching layer such as DataLoader collects all the author ids requested in the same tick and loads them with one query (`WHERE id IN (...)`), also caching per request. Raising the pool size or adding an HTTP cache does not remove the extra queries."
    theoryUrl: https://graphql.org/learn/execution/
    options:
      - {
          text: "Increase the connection pool size so the 50 queries run in parallel",
          correct: false,
        }
      - {
          text: "Batch the author lookups with DataLoader so that one query fetches all the ids",
          correct: true,
        }
      - {
          text: "Add `Cache-Control` headers to the GraphQL response so clients and CDNs stop asking the server for authors again",
          correct: false,
        }
      - {
          text: "Return at most 5 posts per request so that the number of queries drops",
          correct: false,
        }
  - type: boolean
    prompt: "Because GraphQL clients select only the fields they need, a GraphQL API can remove or rename fields without breaking existing clients."
    answer: false
    explanation: "Field selection makes additions safe: a new field is invisible to clients that do not ask for it. But a client that still queries a removed or renamed field gets a validation error. GraphQL APIs usually evolve without version numbers by adding fields, marking old ones `@deprecated`, and removing them only once usage has dropped."
    theoryUrl: https://graphql.org/learn/best-practices/
  - type: multi
    prompt: "A public JSON REST API is used by many third-party integrations. Which of these changes are breaking for existing clients? Select all that apply."
    explanation: "Removing or renaming a response field breaks every client that reads it, and making an optional request field required rejects requests that were valid yesterday. Adding an optional response field or a new endpoint does not change anything existing clients rely on, as long as they ignore fields they do not know, which is why tolerant readers are part of the contract."
    theoryUrl: https://google.aip.dev/180
    options:
      - { text: "Removing a field from a response", correct: true }
      - { text: "Renaming a response field from `zip` to `postalCode`", correct: true }
      - { text: "Making a previously optional request field required", correct: true }
      - { text: "Adding a new optional field to a response", correct: false }
      - { text: "Adding a new endpoint next to the existing ones", correct: false }
  - type: single
    prompt: "An API stores an idempotency key for each `POST /payments`. Why should it keep the original response with the key, and not only a flag saying the key was already seen?"
    explanation: "The client usually retries because it never saw the first response (a timeout or a dropped connection). Replaying the stored result gives it the outcome, such as the payment id, exactly as if the first call had arrived. A bare 409 only says that something happened, rerunning the payment would charge twice, and HTTP has no rule that servers must cache `POST` responses."
    theoryUrl: https://datatracker.ietf.org/doc/draft-ietf-httpapi-idempotency-key-header/
    options:
      - {
          text: "It need not: a 409 Conflict on the retry is enough, since the payment was already made",
          correct: false,
        }
      - {
          text: "So a retry gets the same result, as the client may never have received the first one",
          correct: true,
        }
      - {
          text: "So the server can rerun the payment when the stored response is older than the key's expiry",
          correct: false,
        }
      - {
          text: "Because HTTP requires servers to cache every `POST` response for later replays",
          correct: false,
        }
  - type: single
    prompt: "A mobile client calls `POST /payments`, the network drops before it receives the response, and the client retries. You must guarantee the customer is charged once, even if the two requests arrive at the same time on different instances. What do you implement?"
    explanation: "Require an `Idempotency-Key` header and store the key with the outcome in a shared database, protected by a unique constraint so that concurrent duplicates cannot both proceed. A retry that arrives after the first request finished receives the stored result; a truly concurrent duplicate gets a conflict (409, retry later), since there is no stored result yet. A per-instance in-memory check fails across instances, and disabling retries leaves the client unable to recover from timeouts."
    theoryUrl: https://datatracker.ietf.org/doc/draft-ietf-httpapi-idempotency-key-header/
    options:
      - { text: "An in-memory `Map` of recent request bodies in each instance", correct: false }
      - { text: "A rule that clients must never retry a `POST` request", correct: false }
      - {
          text: "A short delay before processing the payment, so that a duplicate request has time to arrive and be merged",
          correct: false,
        }
      - {
          text: "An `Idempotency-Key` stored in the shared DB under a unique constraint, with the result kept",
          correct: true,
        }
  - type: single
    prompt: "Your payments API stores idempotency keys. A client sends `POST /payments` with key `abc` and amount 10, then later sends key `abc` again with amount 500. How should the API respond?"
    explanation: "Reusing a key with a different payload is a client bug that could silently cause the wrong money movement, so the API should reject it with an error (the IETF idempotency-key draft uses 422; 409 is for a request with that key still in progress) rather than replaying the old response or processing the new one. Replaying the first result would hide the mistake, and processing it would break the guarantee."
    theoryUrl: https://datatracker.ietf.org/doc/draft-ietf-httpapi-idempotency-key-header/
    options:
      - {
          text: "Process the 500 payment, since the newest request reflects the client's intent, and overwrite the stored key and result",
          correct: false,
        }
      - { text: "Return the stored response for amount 10 and ignore the new body", correct: false }
      - {
          text: "Reject it with an error, as the same key must not be used for a different request",
          correct: true,
        }
      - { text: "Delete the stored key and handle the request as a brand new one", correct: false }
  - type: single
    prompt: "A cursor-paginated `/orders` endpoint also returns `total`, computed with `SELECT COUNT(*)` using the same filters over 50 million rows in PostgreSQL. Profiling shows the count takes most of each page's time. What is the usual fix?"
    explanation: "An exact `COUNT(*)` in PostgreSQL has to visit every matching row (or index entry) and check its visibility under MVCC, so its cost grows with the table and is paid on every page. Most lists only need to know whether a next page exists, and an approximate count (from planner statistics or a periodically refreshed counter) is enough when a number is shown. OFFSET does not provide a count, and a worker thread does not reduce the database's work."
    theoryUrl: https://wiki.postgresql.org/wiki/Slow_Counting
    options:
      - {
          text: "Add an index on the primary key, so that PostgreSQL can read the row count without scanning",
          correct: false,
        }
      - {
          text: "Switch to OFFSET pagination, since it gives the database the total number of rows for free",
          correct: false,
        }
      - {
          text: "Run the count in a worker thread so that it no longer slows down the page query",
          correct: false,
        }
      - {
          text: "Drop the exact total: return a next cursor or `hasMore`, plus an estimate if needed",
          correct: true,
        }
  - type: single
    prompt: "Orders are listed newest first, `ORDER BY created_at DESC, id DESC`. The last row of the previous page had `created_at = $1` and `id = $2`. Which query fetches the next page correctly with keyset pagination?"
    code: |
      -- A
      SELECT * FROM orders WHERE created_at < $1
      ORDER BY created_at DESC, id DESC LIMIT 20;
      -- B
      SELECT * FROM orders WHERE (created_at, id) < ($1, $2)
      ORDER BY created_at DESC, id DESC LIMIT 20;
      -- C
      SELECT * FROM orders WHERE id < $2
      ORDER BY created_at DESC, id DESC LIMIT 20;
      -- D
      SELECT * FROM orders WHERE (created_at, id) > ($1, $2)
      ORDER BY created_at DESC, id DESC LIMIT 20;
    codeLanguage: sql
    explanation: "B compares the sort key as a row value, so ties on `created_at` are broken by `id` and no row is skipped or repeated. A skips every other order with the same timestamp as the last one. C ignores the primary sort column, and D uses the wrong direction for a descending sort."
    theoryUrl: https://www.postgresql.org/docs/current/functions-comparisons.html#ROW-WISE-COMPARISON
    options:
      - { text: "A", correct: false }
      - { text: "B", correct: true }
      - { text: "C", correct: false }
      - { text: "D", correct: false }
  - type: single
    prompt: "Why do most public APIs return pagination cursors as opaque strings (for example a base64 token) rather than documenting the raw `(created_at, id)` values?"
    explanation: "An opaque cursor lets the server change the sort keys, add filters or switch implementation without breaking clients, and discourages clients from building or editing cursors. It is not about security: base64 is trivially decoded, so a cursor that carries sensitive data should be signed or encrypted."
    theoryUrl: https://docs.github.com/en/graphql/guides/using-pagination-in-the-graphql-api
    options:
      - {
          text: "Base64 encoding makes the cursor tamper-proof, so clients cannot forge pages",
          correct: false,
        }
      - {
          text: "It lets the server change its pagination internals without breaking clients",
          correct: true,
        }
      - {
          text: "Opaque cursors are required by the HTTP specification for paginated lists",
          correct: false,
        }
      - {
          text: "Raw values cannot be put in a URL, so they must always be encoded",
          correct: false,
        }
  - type: single
    prompt: "A Node API serves three kinds of data from a slow upstream: exchange rates that a feed refreshes every minute, product descriptions edited a few times a month (each edit publishes an event), and the user's current balance, used to approve payments. Which caching plan fits best?"
    explanation: "A TTL should match how fast the data changes and how much staleness hurts. Rates change on a known schedule, so a TTL near the refresh interval is enough; descriptions rarely change and edits are signalled, so a long TTL plus invalidation on the event gives high hit rates; a stale balance can approve a payment that should fail, so it is read from the source of truth. One uniform TTL is either too stale for the balance or too short for descriptions."
    theoryUrl: https://learn.microsoft.com/en-us/azure/architecture/best-practices/caching
    options:
      - {
          text: "Rates with a TTL near one minute, descriptions long-lived and invalidated on edit, balance not cached",
          correct: true,
        }
      - {
          text: "One five-minute TTL for all three, so that the caching behaviour is uniform and easy to reason about for everyone",
          correct: false,
        }
      - {
          text: "Cache all three with no TTL and invalidate each on change, since any TTL serves stale data",
          correct: false,
        }
      - {
          text: "Rates not cached since they change often, descriptions and balance with a one-hour TTL",
          correct: false,
        }
  - type: single
    prompt: "An Express handler creates a new Redis client, connects it, runs one `GET` and closes it on every request. Under load, latency rises and Redis reports thousands of connections opened and closed each second. What should change?"
    explanation: "Each new connection costs a TCP (and often TLS) handshake per request, and the churn loads both Node and Redis. One client created at startup keeps a connection open and sends concurrent commands over it, which is the normal pattern for Node Redis clients. Leaving per-request clients open leaks connections, and raising server limits or adding nodes absorbs the waste instead of removing it."
    theoryUrl: https://redis.io/docs/latest/develop/clients/nodejs/
    options:
      - {
          text: "Keep a client per request but stop closing it, so that its connection can be reused later",
          correct: false,
        }
      - {
          text: "Create one long-lived client at startup and share it across all requests",
          correct: true,
        }
      - {
          text: "Raise Redis `maxclients` and the server's file descriptor limit to absorb the churn",
          correct: false,
        }
      - {
          text: "Move to a Redis cluster with more nodes so that it can accept the extra connections",
          correct: false,
        }
  - type: single
    prompt: "A Node API caches the whole 4 MB product catalogue as one JSON string under a single Redis key and runs `JSON.parse` on it for every request. The cache hit rate is 99%, yet CPU is saturated and p99 latency is high. What is the best fix?"
    explanation: "Every request transfers 4 MB and parses it synchronously on the event loop, CPU work that no cache hit can avoid. Caching values at the granularity requests use (one key per product or per page) removes most of that cost. `await` does not make `JSON.parse` asynchronous, and a longer TTL or a different cache server changes nothing about the per-request parsing."
    theoryUrl: https://nodejs.org/en/learn/asynchronous-work/dont-block-the-event-loop
    options:
      - {
          text: "Raise the TTL so that the catalogue is loaded from the database less often",
          correct: false,
        }
      - {
          text: "Use `await JSON.parse(...)` so that parsing no longer blocks the event loop",
          correct: false,
        }
      - {
          text: "Cache smaller values shaped like each response, so a request parses only what it needs",
          correct: true,
        }
      - {
          text: "Switch the cache from Redis to Memcached, which returns large values faster",
          correct: false,
        }
  - type: single
    prompt: "A middleware caches `GET` responses in Redis using `req.path` as the key. After it is enabled, some users see another user's cart on `/api/me/cart`. What is the fix?"
    explanation: "The key is the cache's definition of 'the same response'. `/api/me/cart` returns different data per user, so a key without the user serves one user's cart to everyone. `Cache-Control: private` instructs browsers and CDNs, not your own Redis code, and a short TTL or encryption only shrinks or hides the leak."
    theoryUrl: https://learn.microsoft.com/en-us/azure/architecture/best-practices/caching
    options:
      - {
          text: "Add a short TTL so that a wrong cart is only visible for a few seconds before it expires",
          correct: false,
        }
      - {
          text: "Set `Cache-Control: private` on the response, so Redis stores a separate copy per user",
          correct: false,
        }
      - {
          text: "Put every input that changes the response, such as the user, in the key, or skip caching it",
          correct: true,
        }
      - {
          text: "Encrypt the cached values so that a user cannot read the cart of another user",
          correct: false,
        }
  - type: single
    prompt: "Postgres allows 100 connections. You run 20 Node.js instances, each with a pool configured with `max: 10`. Under load you see `too many clients already` errors. What is the best fix?"
    explanation: "Twenty instances times 10 connections can open 200 connections, twice what Postgres allows. Size the pools so that the total (instances times max, plus admin headroom) stays within the limit, or put a pooler such as PgBouncer in front so many app connections share few server connections. Raising `max` makes it worse."
    theoryUrl: https://node-postgres.com/features/pooling
    options:
      - {
          text: "Raise `max` to 50 so each instance rarely has to wait for a connection",
          correct: false,
        }
      - {
          text: "Create a new connection per query so that the pool never runs out",
          correct: false,
        }
      - {
          text: "Budget the pool size per instance against the DB limit, or add PgBouncer",
          correct: true,
        }
      - {
          text: "Restart the instances every hour so that idle connections are cleaned up",
          correct: false,
        }
  - type: single
    prompt: "An API runs as serverless functions that scale to hundreds of concurrent invocations, each opening its own database connection. The database is overwhelmed by connections although the query load is small. What is the appropriate fix?"
    explanation: "Each function instance holds its own connection, so concurrency multiplies connections. A connection pooler between the functions and the database (PgBouncer, RDS Proxy, a serverless driver or an HTTP data API) multiplexes many clients onto few server connections. A bigger database instance only raises the limit a little, and a cache does not reduce the number of connections opened."
    theoryUrl: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/rds-proxy.html
    options:
      - {
          text: "Upgrade to a larger database instance class to get more memory for connections",
          correct: false,
        }
      - {
          text: "Place a connection pooler or proxy between the functions and the database",
          correct: true,
        }
      - {
          text: "Increase the idle timeout so each function holds its connection for longer",
          correct: false,
        }
      - {
          text: "Add a Redis cache for all queries so the database sees no connections",
          correct: false,
        }
  - type: single
    prompt: "A handler uses a `pg` pool. Under errors, the service gradually stops responding: new requests hang waiting for a connection. Which version of the handler avoids the problem?"
    code: |
      // A
      const client = await pool.connect()
      const res = await client.query(sql, params)
      client.release()
      return res.rows

      // B
      const client = await pool.connect()
      try {
        const res = await client.query(sql, params)
        return res.rows
      } finally {
        client.release()
      }

      // C
      const client = await pool.connect()
      const res = await client.query(sql, params).catch(() => null)
      return res?.rows

      // D
      const client = new Client()
      await client.connect()
      return (await client.query(sql, params)).rows
    codeLanguage: javascript
    explanation: "In A, if `query` throws, `release()` never runs and the connection is leaked until the pool is exhausted. B releases it in `finally` in every case. C never releases at all, and D opens a new connection per call and never closes it, bypassing the pool. For a single query, `pool.query()` does the acquire and release for you."
    theoryUrl: https://node-postgres.com/features/pooling#checkout-use-and-return
    options:
      - { text: "A", correct: false }
      - { text: "B", correct: true }
      - { text: "C", correct: false }
      - { text: "D", correct: false }
  - type: single
    prompt: "An order handler opens a database transaction, inserts the order, calls the payment provider over HTTP (which can take up to 10 seconds), and then commits. Under load the pool runs out of connections and other requests wait on row locks. What should change?"
    explanation: "A transaction holds its connection and its locks until it ends, so a slow network call inside it multiplies pool and lock contention. Saving the order as pending, calling the provider, then updating the status (with an idempotency key for retries) keeps each transaction to milliseconds. A database rollback cannot undo an external charge, and a bigger pool or stricter isolation only adds more blocked work."
    theoryUrl: https://node-postgres.com/features/transactions
    options:
      - {
          text: "Increase the pool size so that the waiting requests can always get a connection",
          correct: false,
        }
      - {
          text: "Use SERIALIZABLE isolation so that the transaction is protected during the HTTP call",
          correct: false,
        }
      - {
          text: "Keep the transaction short: call the provider outside it and record the outcome after",
          correct: true,
        }
      - {
          text: "Keep the call inside the transaction, since a rollback also undoes the charge if the commit fails",
          correct: false,
        }
  - type: single
    prompt: "A public API returns errors in several shapes: some handlers send `{ error: 'Not found' }`, others `{ message, code }`, and validation failures return 200 with `{ ok: false }`. Integrators match on English message strings to decide whether to retry. What should the error contract look like?"
    explanation: "Clients need to branch on errors reliably, so every error should use the HTTP status that matches its class and one documented body with a stable machine-readable code; RFC 9457 problem details is a standard shape for that. Human messages can then change freely. A 200 for failures hides errors from proxies, monitoring and retry logic, and stack traces leak internals without giving clients anything stable."
    theoryUrl: https://www.rfc-editor.org/rfc/rfc9457.html
    options:
      - {
          text: "Always return 200 and put success or failure in the body, so clients have a single code path",
          correct: false,
        }
      - {
          text: "A matching HTTP status and one documented body with a stable error code",
          correct: true,
        }
      - {
          text: "Return the exception message and stack trace, so integrators can diagnose failures themselves",
          correct: false,
        }
      - {
          text: "Keep the messages as the contract, but freeze their wording so string matching keeps working",
          correct: false,
        }
  - type: single
    prompt: "Two concurrent requests withdraw 80 from an account with a balance of 100. Your code does `SELECT balance`, checks `balance >= 80` in Node, then `UPDATE accounts SET balance = balance - 80`. Occasionally the balance goes negative. What is the most robust fix?"
    explanation: "This is a lost-update or check-then-act race: both transactions read 100 before either writes. Lock the row with `SELECT ... FOR UPDATE`, or do the check and update atomically with `UPDATE ... SET balance = balance - 80 WHERE balance >= 80`, or use SERIALIZABLE isolation with retries. An in-process mutex fails across instances, and re-reading in JavaScript leaves the window open."
    theoryUrl: https://www.postgresql.org/docs/current/transaction-iso.html
    options:
      - { text: "Add a JavaScript mutex around the withdrawal function", correct: false }
      - { text: "Check the balance a second time in Node just before the update", correct: false }
      - {
          text: "Make the check part of the SQL, with a row lock or `WHERE balance >= 80` on the update",
          correct: true,
        }
      - {
          text: "Use `READ UNCOMMITTED` so each transaction sees the other's change",
          correct: false,
        }
  - type: boolean
    prompt: "A two-phase commit (distributed XA transaction) across all your microservices' databases is the recommended default for keeping them consistent."
    answer: false
    explanation: "Two-phase commit couples the availability of all participants, holds locks while waiting for the coordinator, and is unsupported by many modern datastores and brokers. Most microservice systems prefer sagas, outbox and idempotent consumers, accepting eventual consistency."
    theoryUrl: https://microservices.io/patterns/data/saga.html
  - type: single
    prompt: "Product wants the `price` field of `GET /products/:id`, a decimal in dollars, to become an integer in cents. Hundreds of third-party integrations read `price`. What is the least disruptive way to evolve the API?"
    explanation: "Additive change first: a new `priceCents` field breaks nobody, the old field is marked deprecated and announced, and it is removed only when usage has dropped or in the next major version. Changing the meaning of `price` in place silently corrupts every integration, since the JSON still parses. A brand-new API version with a one-week cutoff forces all clients to migrate at once for a change that did not need it."
    theoryUrl: https://google.aip.dev/180
    options:
      - {
          text: "Change `price` to cents in place and announce it in the changelog, since the field name stays the same",
          correct: false,
        }
      - {
          text: "Add a `priceCents` field, deprecate `price`, and remove it once usage has dropped",
          correct: true,
        }
      - {
          text: "Publish a `/v2` of the whole API with the new format and switch `/v1` off next week",
          correct: false,
        }
      - {
          text: "Return cents by default, and dollars only to clients that send an `Accept-Version: 1` header",
          correct: false,
        }
  - type: single
    prompt: "Two admins open the same product in an editor, and both save changes. The second save silently overwrites the first admin's edits. The API is REST over HTTP. Which mechanism prevents this lost update?"
    explanation: "Optimistic concurrency with a version: the `GET` returns an `ETag` (or a version field), and the client sends it back in `If-Match` on `PUT`. If the resource changed, the server responds `412 Precondition Failed` and the client must merge. Locks held across a human editing session are fragile, and last-write-wins is the problem itself."
    theoryUrl: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/If-Match
    options:
      - {
          text: "Use `ETag` on reads and `If-Match` on writes, answering 412 when stale",
          correct: true,
        }
      - {
          text: "Switch the update from `PUT` to `PATCH`, because patches never overwrite data",
          correct: false,
        }
      - {
          text: "Hold a database row lock for as long as an admin has the editor open",
