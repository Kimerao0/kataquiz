version: 1
title: "Architect Roadmap 24: Event-driven architecture fundamentals"
description: Events vs commands vs messages, event notification vs event-carried state transfer, choreography vs orchestration, temporal coupling, and event schemas and versioning.
language: en
tags: [architect-roadmap, event-driven, events, choreography, schema-evolution]
run:
  questionsPerRun: 10
  maxErrors: 3
  timePerQuestionSec: 60
questions:
  - type: single
    prompt: "What is the key difference between a command and an event in a messaging system?"
    explanation: "A command expresses an intent to make something happen (`PlaceOrder`), is addressed to one handler and can be rejected. An event records something that already happened (`OrderPlaced`), is named in the past tense, and can have zero, one or many subscribers that cannot veto it. Both are messages, and both can be sent through a broker."
    theoryUrl: https://learn.microsoft.com/en-us/azure/architecture/guide/architecture-styles/event-driven
    options:
      - {
          text: "A command is a request to do something, which can fail, while an event is a fact about the past",
          correct: true,
        }
      - {
          text: "Commands are synchronous and events are asynchronous, in every system",
          correct: false,
        }
      - {
          text: "Commands carry data and events never do, because events are only signals that tell consumers to look elsewhere",
          correct: false,
        }
      - {
          text: "A command goes to many consumers, while an event always goes to exactly one",
          correct: false,
        }
  - type: multi
    prompt: "Which of these names are well-formed domain events? Select all that apply."
    explanation: "Events are facts, named in the past tense with business meaning: `OrderPlaced`, `PaymentFailed` and `EmailAddressChanged`. `PlaceOrder` and `SendInvoice` are imperative: they are commands. Such names matter because they tell consumers what they may assume, and a command disguised as an event invites the publisher to depend on a specific reaction."
    theoryUrl: https://martinfowler.com/articles/201701-event-driven.html
    options:
      - { text: "`OrderPlaced`", correct: true }
      - { text: "`SendInvoice`", correct: false }
      - { text: "`PaymentFailed`", correct: true }
      - { text: "`PlaceOrder`", correct: false }
      - { text: "`EmailAddressChanged`", correct: true }
  - type: boolean
    prompt: "Every message that travels through a broker is an event."
    answer: false
    explanation: "'Message' is the generic envelope: it can be a command, an event or a reply to a query. They differ in intent and in who is responsible: a command targets a handler, an event announces a fact, and a document message just transfers data."
    theoryUrl: https://www.enterpriseintegrationpatterns.com/patterns/messaging/Message.html
  - type: single
    prompt: "A `CustomerAddressChanged` event only contains `{ customerId, changedAt }`. Each of the 12 subscribers immediately calls the Customer service API to fetch the new address. What is the main downside of this event notification style?"
    explanation: "With pure notification the event says that something changed, and consumers call back to get the data. The publisher is then synchronously coupled to every consumer's reads, load multiplies (12 callbacks per change), and consumers fail when the source is down. The upside is a small event and a single source of truth."
    theoryUrl: https://martinfowler.com/articles/201701-event-driven.html
    options:
      - {
          text: "The event is too large, so it will exceed the broker's message size limit",
          correct: false,
        }
      - {
          text: "The callbacks reintroduce runtime coupling and load on the source service",
          correct: true,
        }
      - {
          text: "Subscribers can no longer tell which customer changed, so they must poll",
          correct: false,
        }
      - {
          text: "The broker cannot deliver an event that has no business data in it",
          correct: false,
        }
  - type: single
    prompt: "The Shipping service needs the customer's delivery address for every order, but the Customer service has outages several times a month, which blocks shipping. Which event design removes that dependency at runtime?"
    explanation: "Event-carried state transfer includes the data consumers need (the address) in the event, and Shipping keeps its own local copy. It can then work while Customer is down, at the price of duplicated data and eventual consistency. Retrying the callback or caching responses for a short time only reduces the pain."
    theoryUrl: https://martinfowler.com/articles/201701-event-driven.html
    options:
      - { text: "Events that carry only ids, and a callback with 5 retries", correct: false }
      - {
          text: "Events that carry the address, kept by Shipping in a local replica",
          correct: true,
        }
      - {
          text: "A shared database table that both services read from and write to",
          correct: false,
        }
      - {
          text: "A synchronous call with a 60 second timeout, so outages are tolerated",
          correct: false,
        }
  - type: multi
    prompt: "Which are real costs of event-carried state transfer? Select all that apply."
    explanation: "Every consumer keeps a copy, so data is duplicated and only eventually consistent, larger events cost more bandwidth and storage, and sensitive fields travel to every subscriber. It does not require synchronous calls between services: the point is to avoid them."
    theoryUrl: https://martinfowler.com/articles/201701-event-driven.html
    options:
      - { text: "Consumers hold copies of the data that can be stale for a while", correct: true }
      - {
          text: "The publisher must call each subscriber synchronously to confirm receipt",
          correct: false,
        }
      - { text: "Events get larger and may spread personal data to more systems", correct: true }
      - {
          text: "Consumers must handle events arriving late, duplicated or out of order",
          correct: true,
        }
      - { text: "The data can no longer be queried from the owning service at all", correct: false }
  - type: single
    prompt: "The Customer service publishes one generic `CustomerUpdated` event, carrying the full record, whenever any field changes. Shipping only cares about relocations and Marketing only about consent withdrawals, so each keeps the previous record and diffs it to guess what happened. What is the better event design?"
    explanation: "Generic CRUD-style events expose the data model and force every consumer to reverse-engineer intent, for example a typo fix versus a real move. Events named after business facts carry that meaning and let each consumer subscribe only to what it cares about. Thin events that make consumers call back reintroduce runtime coupling, a shared database couples everyone to one schema, and direct calls make the publisher know its consumers."
    theoryUrl: https://martinfowler.com/eaaDev/DomainEvent.html
    options:
      - {
          text: "Publish events named after business changes, such as `CustomerRelocated` and `MarketingConsentWithdrawn`",
          correct: true,
        }
      - {
          text: "Keep `CustomerUpdated` but send only the customer id, so each consumer fetches what changed from the Customer API",
          correct: false,
        }
      - {
          text: "Give each consumer read access to the Customer database, so it can query the change history directly",
          correct: false,
        }
      - {
          text: "Have the Customer service call Shipping and Marketing directly when the fields they care about change",
          correct: false,
        }
  - type: single
    prompt: "An `OrderPlaced` event is consumed by Billing, Shipping, Analytics and a Marketing tool, and it carries the customer's full profile, including date of birth and national id. Only Shipping needs the address. What is the best response?"
    explanation: "Events reach every subscriber, so including data they do not need breaks data minimisation and spreads sensitive data. Keep the event to what the business fact needs, and let consumers with a legitimate need fetch more through an authorised API (or use separate events or topics with restricted access). More subscribers makes it worse, not better."
    theoryUrl: https://martinfowler.com/articles/201701-event-driven.html
    options:
      - {
          text: "Keep it, since an event should always be a complete snapshot of the customer, so no consumer ever calls back for more",
          correct: false,
        }
      - { text: "Encrypt the whole event with a key that every consumer has", correct: false }
      - {
          text: "Trim the event to what the fact needs, and let authorised consumers fetch extra data",
          correct: true,
        }
      - {
          text: "Remove Analytics and Marketing from the subscribers, and keep the data as it is",
          correct: false,
        }
  - type: single
    prompt: "A simple flow has three services: Orders publishes `OrderPlaced`, Payments reacts and publishes `PaymentTaken`, and Shipping reacts to that. Which style is this, and what is its main weakness as the flow grows?"
    explanation: "This is choreography: each service reacts to events and no one owns the whole process. It keeps services decoupled, but the end-to-end flow is implicit and spread across subscriptions, so it gets hard to understand, monitor and change, and risks cyclic dependencies. Orchestration puts the flow in one place instead."
    theoryUrl: https://microservices.io/patterns/data/saga.html
    options:
      - {
          text: "Orchestration, whose weakness is that services must call each other synchronously",
          correct: false,
        }
      - {
          text: "Choreography, whose weakness is that the overall flow is implicit and hard to follow",
          correct: true,
        }
      - {
          text: "Choreography, whose weakness is that the events cannot be delivered in parallel",
          correct: false,
        }
      - {
          text: "Orchestration, whose weakness is that the events need to be sent in the past tense",
          correct: false,
        }
  - type: single
    prompt: "In a choreographed order flow, Shipping reacts to `PaymentTaken`. The business now wants a fraud check between payment and shipping. Which services have to change?"
    explanation: "In choreography the sequence lives in who subscribes to what, so inserting a step in the middle means rewiring the next participant: Shipping now listens for `FraudCleared`. Adding a pure side reaction, such as analytics, would touch nobody, but reordering steps is not free. With orchestration, the same change would land mainly in the orchestrator."
    theoryUrl: https://microservices.io/patterns/data/saga.html
    options:
      - {
          text: "The new Fraud service, plus Shipping, which must now react to `FraudCleared` instead of `PaymentTaken`",
          correct: true,
        }
      - {
          text: "Only the new Fraud service, because in choreography adding a step never requires changes to the existing services",
          correct: false,
        }
      - {
          text: "Only Payments, which must now call Fraud directly before it publishes `PaymentTaken`",
          correct: false,
        }
      - {
          text: "Every service in the flow, because choreography requires all participants to share one workflow definition",
          correct: false,
        }
  - type: single
    prompt: "In an orchestrated checkout saga, how does the orchestrator usually interact with the Payments and Inventory services?"
    explanation: "An orchestrator tells each participant what to do through commands addressed to it, and uses the replies to decide the next step or trigger compensations. Letting participants decide the next step themselves is choreography, and a distributed transaction across their databases is exactly what sagas avoid."
    theoryUrl: https://microservices.io/patterns/data/saga.html
    options:
      - {
          text: "It sends each one a command, such as `ReserveStock`, and waits for a reply reporting the outcome",
          correct: true,
        }
      - {
          text: "It subscribes to their internal domain events and lets each service decide by itself what the next step is",
          correct: false,
        }
      - {
          text: "It writes directly into their databases inside one distributed transaction, so that every step commits together",
          correct: false,
        }
      - {
          text: "It publishes one `CheckoutStarted` event and then steps aside while the participants coordinate",
          correct: false,
        }
  - type: single
    prompt: "What is the usual risk of orchestration compared with choreography?"
    explanation: "The orchestrator centralises knowledge of the process, and when it grows to include business rules of the participants it becomes a 'god service' and a coupling point (and potentially a bottleneck or single point of failure if not built to be resilient). Participants stay simple, which is the benefit, but the central component needs care."
    theoryUrl: https://microservices.io/patterns/data/saga.html
    options:
      - { text: "The participants cannot use asynchronous messaging at all", correct: false }
      - {
          text: "The process state is distributed across the participants, so nobody knows how far an order has got without tracing events",
          correct: false,
        }
      - {
          text: "The orchestrator can become a central point that knows too much about every participant",
          correct: true,
        }
      - {
          text: "Compensations cannot be implemented without a distributed transaction",
          correct: false,
        }
  - type: single
    prompt: "Shipping keeps a local copy of customer addresses, built from Customer events that carry the full address. To save a round trip, Shipping's UI lets agents fix typos by editing that local copy directly. Some corrected addresses later revert to the old typo. Why, and what is the fix?"
    explanation: "The Customer service owns the address, and the next event for that customer carries the address as Customer still has it, which overwrites the local edit. A replicated copy is read-only: changes go to the owner, for example as a command, and come back through its events. Rejecting the owner's later events makes the copies diverge for good, and publishing the owner's events from Shipping creates two writers for one fact."
    theoryUrl: https://martinfowler.com/articles/201701-event-driven.html
    options:
      - {
          text: "Customer owns the address, so its next event overwrites the edit; send the change to Customer instead",
          correct: true,
        }
      - {
          text: "The broker redelivered old events after a rebalance, so Shipping must deduplicate them by event id",
          correct: false,
        }
      - {
          text: "Shipping should mark edited addresses and ignore later Customer events for them, so local fixes win",
          correct: false,
        }
      - {
          text: "Shipping should publish its edits as Customer events too, so that the Customer service picks them up",
          correct: false,
        }
  - type: single
    prompt: "Billing used to call Orders over HTTP. It now consumes `OrderPlaced` events from a durable broker, so it no longer needs Orders to be up. Which coupling between the two remains?"
    explanation: "A durable broker removes temporal coupling (the two need not be up at the same time) and location coupling (Billing only knows the broker). What remains is the contract itself: if Orders renames a field or changes what an event means, Billing breaks. That is why event schemas need versioning and compatibility rules."
    theoryUrl: https://learn.microsoft.com/en-us/azure/architecture/guide/architecture-styles/event-driven
    options:
      - {
          text: "Coupling to the event contract: its name, its fields and what they mean",
          correct: true,
        }
      - {
          text: "Temporal coupling, since Billing still fails whenever Orders is down",
          correct: false,
        }
      - {
          text: "Deployment coupling, since both services must now be released together for every change",
          correct: false,
        }
      - {
          text: "Location coupling, since Billing still needs the network address of every Orders instance",
          correct: false,
        }
  - type: single
    prompt: "To answer each request, service A synchronously calls B, C and D. Each dependency is reliable on its own, yet A's error rate keeps rising as more dependencies are added. What is the underlying cause?"
    explanation: "With synchronous calls, A works only when all of its dependencies answer in time, so their failure rates compound into A's. Publishing events lets A complete the work that does not need an immediate answer, while the others catch up later. Changing the protocol does not help, because a gRPC call is still a synchronous dependency."
    theoryUrl: https://learn.microsoft.com/en-us/azure/architecture/guide/architecture-styles/event-driven
    options:
      - {
          text: "A succeeds only if every dependency is up and fast at the same moment, so their failures add up",
          correct: true,
        }
      - {
          text: "Synchronous calls are unreliable over HTTP specifically, and switching them to gRPC would remove the problem",
          correct: false,
        }
      - {
          text: "Dependencies only add failure modes when they share a database, so B, C and D must be sharing one",
          correct: false,
        }
      - {
          text: "B, C and D are throttling A, because many calls from one client look like an attack to them",
          correct: false,
        }
  - type: single
    prompt: "The Shipping consumer below reads `OrderPlaced` events. The producer has started adding a `coupon` field, and very old events, from before multi-currency support, have no `currency`. Which statement about this consumer's design is accurate?"
    code: |
      function onOrderPlaced(event) {
        const { orderId, total, currency = 'EUR' } = event.data
        if (typeof total !== 'number') throw new Error('invalid OrderPlaced')
        ship(orderId, total, currency)
      }
    codeLanguage: javascript
    explanation: "A tolerant reader takes only what it needs, so additive changes like `coupon` do not break it, and it defaults or validates the fields it depends on. Rejecting unknown fields would turn every compatible change into an outage. Destructuring simply ignores extra properties, and calling back to Orders brings back runtime coupling."
    theoryUrl: https://martinfowler.com/bliki/TolerantReader.html
    options:
      - {
          text: "It is a tolerant reader: it ignores fields it does not use, defaults an optional one and checks the one it needs",
          correct: true,
        }
      - {
          text: "It is fragile, because a consumer should validate the whole event against the full schema and reject unknown fields such as `coupon`",
          correct: false,
        }
      - {
          text: "It should stop reading `total` and fetch the order from the Orders API, so schema changes never affect it",
          correct: false,
        }
      - {
          text: "It is unsafe, because destructuring throws as soon as the event has a field the code does not name",
          correct: false,
        }
  - type: multi
    prompt: "Which changes to a published event schema are breaking for existing consumers? Select all that apply."
    explanation: "Removing or renaming a field they read, or changing its type, breaks consumers that have not been updated. Adding a new optional field is compatible with tolerant readers. This is why event contracts are evolved with expand-and-contract and versions."
    theoryUrl: https://docs.confluent.io/platform/current/schema-registry/fundamentals/schema-evolution.html
    options:
      - { text: "Renaming `total` to `amount`", correct: true }
      - { text: "Adding an optional `couponCode` field", correct: false }
      - { text: "Changing `total` from a number to a string", correct: true }
      - { text: "Removing `currency`, which some consumers read", correct: true }
      - {
          text: "Adding a new event type that existing consumers do not subscribe to",
          correct: false,
        }
  - type: single
    prompt: "The team that publishes `InvoiceIssued` will deploy a new schema before any of its consumers is updated. What must hold for this change to be safe?"
    explanation: "When the producer upgrades first, old consumers receive new-format events, so the new schema must be readable by the old reader (forward compatibility), for example by only adding optional fields. The mirror case, new consumers reading old events, matters when consumers upgrade first. Event size is irrelevant, and rewriting history is neither needed nor usually possible."
    theoryUrl: https://docs.confluent.io/platform/current/schema-registry/fundamentals/schema-evolution.html
    options:
      - {
          text: "Consumers still on the old schema must be able to read events written with the new one",
          correct: true,
        }
      - {
          text: "Consumers on the new schema must be able to read events written with the old one",
          correct: false,
        }
      - {
          text: "The new schema must produce events of the same size, so that the broker keeps accepting them",
          correct: false,
        }
      - {
          text: "The producer must first republish every historical event in the new format, then switch over",
          correct: false,
        }
  - type: single
    prompt: "A producer changes `total` in `OrderPlaced` from 'including VAT' to 'excluding VAT'. The field name and type stay the same, and the schema registry's compatibility check passes. What is the right assessment?"
    explanation: "Compatibility checks look at structure (names, types, optionality), not meaning. Consumers will parse the value without complaint and compute wrong invoices or reports. A change of meaning needs a new field, such as `netTotal`, or a new event version, rolled out with expand and contract."
    theoryUrl: https://docs.confluent.io/platform/current/schema-registry/fundamentals/schema-evolution.html
    options:
      - {
          text: "It is a breaking change the registry cannot see, so it needs a new field or a new event version",
          correct: true,
        }
      - {
          text: "It is safe, since the registry has confirmed that every consumer can still deserialise the events",
          correct: false,
        }
      - {
          text: "It is safe as long as the producer announces it in the release notes before deploying",
          correct: false,
        }
      - {
          text: "It breaks only consumers written in strongly typed languages, which will fail to parse the value",
          correct: false,
        }
  - type: single
    prompt: "What is the purpose of a schema registry combined with a compatibility rule such as BACKWARD or FULL in an event platform?"
    explanation: "The registry stores versioned schemas and rejects a new schema that violates the configured compatibility rule at publish or CI time, so a breaking change is caught before it reaches consumers. It does not transform the data and does not deliver events by itself."
    theoryUrl: https://docs.confluent.io/platform/current/schema-registry/index.html
    options:
      - {
          text: "It rewrites old events into the new format when consumers start reading them",
          correct: false,
        }
      - {
          text: "It routes each event to the consumers that understand its schema version",
          correct: false,
        }
      - {
          text: "It encrypts events so that only consumers holding the right schema can read them",
          correct: false,
        }
      - {
          text: "It validates new schemas against old ones and blocks breaking changes before release",
          correct: true,
        }
  - type: single
    prompt: "Consumers of an event stream must ignore duplicates caused by at-least-once delivery. Which field in the event envelope makes this possible in the simplest way?"
    explanation: "A unique, stable event id lets a consumer record the ids it has already processed (ideally in the same transaction as its side effects) and skip repeats. A timestamp can be equal for different events, the event type is shared by all events of that kind, and the schema version says nothing about identity."
    theoryUrl: https://www.enterpriseintegrationpatterns.com/patterns/messaging/IdempotentReceiver.html
    options:
      - {
          text: "A unique `eventId`, recorded by the consumer once it has processed it",
          correct: true,
        }
      - {
          text: "The `occurredAt` timestamp, as no two events can occur at the same millisecond",
          correct: false,
        }
      - { text: "The event `type`, because the same type is never published twice", correct: false }
      - {
          text: "The schema `version`, which increases with every delivery attempt",
          correct: false,
        }
  - type: single
    prompt: "Twelve teams consume `CustomerRegistered`. Every few months the producer makes a change that its own tests and the schema check accept, yet a consumer breaks because it relied on a detail nobody wrote down. Which practice targets this?"
    explanation: "With consumer-driven contracts, each consumer publishes the expectations it actually depends on, and the producer runs them in its pipeline, so it learns before release which change would break whom. The producer's own tests only check what the producer thinks matters. A shared library couples release cycles, and freezing every event makes evolution needlessly expensive."
    theoryUrl: https://martinfowler.com/articles/consumerDrivenContracts.html
    options:
      - {
          text: "Consumer-driven contract tests: each consumer states what it relies on, and the producer's build runs them",
          correct: true,
        }
      - {
          text: "A shared client library that every consumer must upgrade on the producer's release schedule",
          correct: false,
        }
      - {
          text: "Freezing the event forever and creating a brand-new event type for every change, however small, so that existing consumers never see a modification",
          correct: false,
        }
      - {
          text: "More thorough unit tests in the producer, covering every field it publishes",
          correct: false,
        }
  - type: single
    prompt: "Inside the Orders service, aggregates raise domain events using internal class names and entity ids. Another team wants to subscribe to them directly from the broker. Why is publishing these internal events as-is usually a bad idea?"
    explanation: "Domain events are part of a service's internal model and change with it. Subscribers outside the boundary would depend on private details. Publish a separate, deliberately designed integration event as the public contract, mapped from the internal ones, and version it. Internal events are still fine inside the service."
    theoryUrl: https://learn.microsoft.com/en-us/dotnet/architecture/microservices/microservice-ddd-cqrs-patterns/domain-events-design-implementation
    options:
      - {
          text: "Brokers reject events whose class names contain internal identifiers",
          correct: false,
        }
      - {
          text: "It leaks the service's internal model and makes every refactoring a breaking change",
          correct: true,
        }
      - {
          text: "Domain events cannot be serialised, so they never reach the broker intact",
          correct: false,
        }
      - {
          text: "Domain events are always larger than integration events and slow down delivery",
          correct: false,
        }
  - type: boolean
    prompt: "In event-driven communication, the publisher normally knows exactly which services consume its events."
    answer: false
    explanation: "Decoupling of the publisher from its consumers is a defining property: it publishes a fact and does not know who, if anyone, listens, so consumers can be added without changing it. The flip side is that you need good documentation, tracing and a schema registry to know who depends on what."
    theoryUrl: https://martinfowler.com/articles/201701-event-driven.html
  - type: single
    prompt: "A user submits a form and the page must immediately show whether the username is available. A teammate wants to model it as `CheckUsername` command, event reply and websocket push, 'because we are event-driven'. What is the best judgement?"
    explanation: "A query whose answer the caller needs immediately is naturally a synchronous request/response. Events fit when a producer announces something and does not wait. Forcing everything through events adds latency, complexity and eventual consistency without any benefit in this case."
    theoryUrl: https://martinfowler.com/articles/201701-event-driven.html
    options:
      - {
          text: "Good idea, since all service interactions should be events for consistency",
          correct: false,
        }
      - {
          text: "Keep the events, and add a polling loop in the browser to read the answer",
          correct: false,
        }
      - {
          text: "Use a normal synchronous request/response, as the caller needs the answer now",
          correct: true,
        }
      - {
          text: "Use pub/sub so every service can see which usernames are being checked",
          correct: false,
        }
