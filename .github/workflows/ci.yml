name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    # The suite runs against a real Postgres, never a mock, so CI provides one.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kataquiz
          POSTGRES_PASSWORD: kataquiz
          POSTGRES_DB: kataquiz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kataquiz -d kataquiz_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://kataquiz:kataquiz@localhost:5432/kataquiz_test

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # Deliberately not inside `pnpm check`, which is lint, types, tests and
      # portability: a break that only shows at build time would otherwise
      # reach main unseen. It needs DATABASE_URL set, because src/db/client.ts
      # throws without one, but it never connects — verified 2026-10-29 by
      # building against a database that does not exist.
      - run: pnpm build
