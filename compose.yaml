# Local development database.
# This is NOT deployment packaging — Kataquiz itself is not containerised yet.
# It exists so `pnpm test` and `pnpm dev` have a Postgres to talk to, matching CI.
# Pinned so the project name does not follow the directory: renaming the
# checkout would otherwise orphan the running container and its volume.
name: kataquiz

services:
  postgres:
    image: postgres:17-alpine
    container_name: kataquiz-db
    environment:
      POSTGRES_USER: kataquiz
      POSTGRES_PASSWORD: kataquiz
      POSTGRES_DB: kataquiz
    # Published on 55432, not the default 5432: the mono checkout's own
    # dev stack binds 5432 for a container called `postgres`, and whichever
    # came second lost. Inside the container it is still 5432.
    ports:
      - "55432:5432"
    volumes:
      - kataquiz-pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kataquiz -d kataquiz"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kataquiz-pgdata:
